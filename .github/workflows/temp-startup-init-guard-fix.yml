name: Temp Startup Init Guard Fix

on:
  push:
    branches: [feat/combat-vocalizations]
    paths: [.github/workflows/temp-startup-init-guard-fix.yml]

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/combat-vocalizations

      - name: Sync current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Apply startup initialization guards
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f'{path}: expected exactly one match, found {count}'
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'docs/js/calendar-system.js',
              """  function getHour(time01 = deps.calendar.time01) {\n    return deps.MORNING_HOUR + time01 * (deps.NIGHT_HOUR - deps.MORNING_HOUR);\n  }""",
              """  function getHour(time01 = deps?.calendar?.time01 ?? 0) {\n    const morningHour = Number.isFinite(Number(deps?.MORNING_HOUR)) ? Number(deps.MORNING_HOUR) : 6; // Parser-time callers use the authored opening-hour fallback until game.js injects live calendar deps.\n    const nightHour = Number.isFinite(Number(deps?.NIGHT_HOUR)) ? Number(deps.NIGHT_HOUR) : 22; // Paired fallback keeps pre-init clock reads deterministic without pretending runtime state exists.\n    const normalizedTime = Number.isFinite(Number(time01)) ? Number(time01) : 0; // Invalid/pre-init time reads resolve to the start of the represented day.\n    return morningHour + normalizedTime * (nightHour - morningHour);\n  }""",
          )

          replace_once(
              'docs/js/calendar-system.js',
              """  function currentSeason() {\n    return seasonForDay(deps.calendar.day);\n  }""",
              """  function currentSeason() {\n    return seasonForDay(deps?.calendar?.day ?? 1); // Startup audio/visual callers may ask before game.js injects the live calendar; opening day is a harmless deterministic placeholder.\n  }""",
          )

          replace_once(
              'docs/js/calendar-system.js',
              """  function timeDebugSnapshot() {\n    const nextShiftDay = nextTothalShiftDay(); // Raw day used by the next-Tothal-Shift debug fields below.\n    const target = previewAfterHours(_selectedPassageHours); // Current modal selection used by the preview debug field below.""",
              """  function timeDebugSnapshot() {\n    if (!isInitialized()) {\n      return {\n        rawDay: null, time01: null, shortDate: null, fullDateTime: null, aotYear: null, tothalCycle: null, civilDayOfYear: null,\n        monthNumber: null, monthName: null, dayOfMonth: null, regionalSeason: null, regionalSeasonWeek: null, isFirstriseNewYear: null,\n        nextTothalShiftRawDay: null, nextTothalShiftDate: null, nextTothalSeedCycle: null,\n        naturalClockTargetSecondsPerRepresentedDay: TARGET_DAY_LENGTH_SECONDS, naturalClockScale: NATURAL_TIME_WRITE_SCALE,\n        modalKind: _timePassageKind, selectedHours: _selectedPassageHours, preview: null, seatedWaitReady: false, sleepTargetReady: false,\n        playerRuntimeReady: !!window.PlayerSocialPoses?.getPlayerEntity?.(), worldId: window.__hobunjiPlayerProfile?.worldId || null, initialized: false,\n      }; // Diagnostics are polled during parser/startup time; expose "not ready" state instead of dereferencing null deps.\n    }\n    const nextShiftDay = nextTothalShiftDay(); // Raw day used by the next-Tothal-Shift debug fields below.\n    const target = previewAfterHours(_selectedPassageHours); // Current modal selection used by the preview debug field below.""",
          )

          replace_once(
              'docs/js/calendar-system.js',
              """      worldId: window.__hobunjiPlayerProfile?.worldId || null,\n    };\n  }\n\n  async function copyTimeDebug()""",
              """      worldId: window.__hobunjiPlayerProfile?.worldId || null,\n      initialized: true,\n    };\n  }\n\n  async function copyTimeDebug()""",
          )

          replace_once(
              'docs/js/wilderness-map.js',
              """  function getCompassWaypoint() {\n    const waypoint = _resolvedWaypoint();\n    return waypoint ? { ...waypoint } : null;\n  }""",
              """  function getCompassWaypoint() {\n    if (!deps) return null; // NavigationCompass starts polling before game.js injects WildernessMap deps; no world means no valid waypoint yet.\n    const waypoint = _resolvedWaypoint();\n    return waypoint ? { ...waypoint } : null;\n  }""",
          )

          replace_once(
              'docs/js/hud-update.js',
              """  function contextualActionLabel(action, tile) {\n    if (action === 'dig')   return tile.type === deps.TileType.TRENCH ? 'Redig' : 'Dig';\n    if (action === 'fill')  return 'Fill';\n    if (action === 'raise') return tile.type === deps.TileType.RAISED ? 'Lower' : 'Raise';\n    if (action === 'till')  return tile.type === deps.TileType.TILLED ? 'Untill' : 'Till';""",
              """  function contextualActionLabel(action, tile) {\n    const tileTypes = deps?.TileType; // Input can ask for a label during parser/startup time before HudUpdate.init() supplies the authoritative tile enum.\n    if (action === 'dig')   return tileTypes && tile?.type === tileTypes.TRENCH ? 'Redig' : 'Dig';\n    if (action === 'fill')  return 'Fill';\n    if (action === 'raise') return tileTypes && tile?.type === tileTypes.RAISED ? 'Lower' : 'Raise';\n    if (action === 'till')  return tileTypes && tile?.type === tileTypes.TILLED ? 'Untill' : 'Till';""",
          )

          test = Path('scripts/test-startup-init-guards.js')
          test.write_text(r'''#!/usr/bin/env node
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');

          function runModule(path, extra = {}) {
            const sandbox = {
              window: {}, console, setTimeout, clearTimeout, setInterval, clearInterval,
              performance, Math, Number, Object, Array, Map, Set, WeakSet, Uint8Array,
              ...extra,
            };
            sandbox.globalThis = sandbox;
            vm.createContext(sandbox);
            vm.runInContext(fs.readFileSync(path, 'utf8'), sandbox, { filename: path });
            return sandbox;
          }

          const calendar = runModule('docs/js/calendar-system.js', {
            THREE: { Color: class Color { setHSL(){ return this; } } },
          });
          assert.equal(calendar.window.CalendarSystem.isInitialized(), false, 'calendar should begin uninitialized');
          assert.equal(calendar.window.CalendarSystem.getHour(), 6, 'pre-init clock read should safely resolve to opening hour');
          assert.equal(calendar.window.CalendarSystem.currentSeason().name, 'Stormtide', 'pre-init season read should use deterministic opening-day placeholder');
          const timeDebug = calendar.window.CalendarSystem.timeDebugSnapshot();
          assert.equal(timeDebug.initialized, false, 'pre-init time debug should explicitly report not-ready state');
          assert.equal(timeDebug.rawDay, null, 'pre-init time debug should not invent live save state');
          assert.equal(timeDebug.nextTothalShiftRawDay, null, 'pre-init time debug must not call shift math through null deps');

          const wilderness = runModule('docs/js/wilderness-map.js');
          assert.equal(wilderness.window.WildernessMap.getCompassWaypoint(), null, 'pre-init wilderness map should expose no waypoint instead of dereferencing null deps');

          const hud = runModule('docs/js/hud-update.js');
          assert.equal(hud.window.HudUpdate.contextualActionLabel('dig', { type: 'grass' }), 'Dig', 'pre-init dig label should fall back safely');
          assert.equal(hud.window.HudUpdate.contextualActionLabel('raise', { type: 'grass' }), 'Raise', 'pre-init raise label should fall back safely');
          assert.equal(hud.window.HudUpdate.contextualActionLabel('till', { type: 'grass' }), 'Till', 'pre-init till label should fall back safely');

          console.log('startup init guards: ok');
          ''')
          PY

      - name: Refresh cache tokens
        run: |
          node scripts/check-cache-busts.js --fix
          node scripts/check-cache-busts.js origin/main

      - name: Validate startup guards and regressions
        run: |
          node --check docs/js/calendar-system.js
          node --check docs/js/wilderness-map.js
          node --check docs/js/hud-update.js
          node scripts/test-startup-init-guards.js
          node scripts/test-calendar-system-passage-hour-timer.js
          node scripts/test-navigation-compass.js
          node scripts/test-no-cache-token-pins.js
          node scripts/run-tests.js

      - name: Commit validated fix and remove temporary workflow
        run: |
          git rm .github/workflows/temp-startup-init-guard-fix.yml
          git add docs scripts
          git commit -m "Guard startup reads before runtime initialization"
          git push origin HEAD:feat/combat-vocalizations
