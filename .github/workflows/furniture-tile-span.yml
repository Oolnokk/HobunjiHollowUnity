name: Furniture tile-span regression
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    name: Select furniture tile-span changes
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.select.outputs.furniture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select affected specialist tests
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-select-tests.js --suite=feature
  tile-span:
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.relevant == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runtime, author and test syntax
        run: |
          node --check docs/js/furniture-tile-span.js
          node --check docs/js/authored-furniture-runtime.js
          node --check docs/tools/furniture-avatar-author/tile-span-author.js
          node --check scripts/test-furniture-tile-span.js
      - name: Check surface-rooted bridge length and authoring integration
        run: node scripts/test-furniture-tile-span.js
      - name: Check existing author gizmo behavior
        run: node scripts/test-furniture-gizmo-orientation.js
