name: Apply shoulder-pet head rotation default

on:
  push:
    branches:
      - fix/default-shoulder-pet-head-neck
    paths:
      - .github/workflows/apply-shoulder-pet-head-default.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply guarded default change and regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-shoulder-pet-head-default.py
          node scripts/test-shoulder-pet-attack-rotation.js
          git diff --check
          git add docs/game.js docs/index.html docs/js/portrait-plane-outline-parity.js scripts/test-shoulder-pet-attack-rotation.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Default shoulder-pet rotation to head/neck"
          git push origin HEAD:fix/default-shoulder-pet-head-neck
