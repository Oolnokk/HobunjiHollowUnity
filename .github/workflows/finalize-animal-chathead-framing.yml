name: Finalize animal chathead framing integration

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/finalize-animal-chathead-framing.yml

permissions:
  contents: write

jobs:
  finalize-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
          fetch-depth: 0

      - name: Wire animal ambient chatheads and V15.45
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # Ordinary voiced animals now hand AmbientDialogue the species/genotype
          # metadata already understood by animal-chathead-frame.js. This keeps
          # AmbientDialogue's existing render queue and lets the shared NpcAvatarPreview
          # bridge replace only the portrait source, rather than adding a second bubble path.
          vocal_path = Path('docs/js/animal-vocalizations.js')
          vocal = vocal_path.read_text()
          old_call = '''    window.AmbientDialogue.show(c.avatarRef.group, line, {
              speakerId: c.id,
              mode: 'overhead',
              durationMs: Math.max(500, finite(cfg.textDurationMs, 1600)),
              tone: 'animal',
            });'''
          new_call = '''    const chatheadCreatureKind = speciesProfileKey(c); // Used by AnimalChatheadFrame to select the species-authored crop for this speaker.
            window.AmbientDialogue.show(c.avatarRef.group, line, {
              speakerId: c.id,
              profile: chatheadCreatureKind ? {
                chatheadCreatureKind,
                creatureGenotype: c.genotype || null,
              } : null, // Gives the shared portrait renderer the animal species/genetics without pretending the creature is an NPC fighter profile.
              mode: chatheadCreatureKind ? 'chathead' : 'overhead',
              durationMs: Math.max(500, finite(cfg.textDurationMs, 1600)),
              tone: 'animal',
            });'''
          vocal = replace_once(vocal, old_call, new_call, 'animal ambient dialogue call')
          vocal_path.write_text(vocal)

          # The chathead feature landed after the already-published V15.44 ground-offset
          # persistence patch, so its public version is V15.45. Restrict replacements to
          # this feature's own trailing patch block; V15.43 remains a valid historical
          # ground-reference revision earlier in the same large author file.
          author_path = Path('docs/tools/animation-author/index.html')
          author = author_path.read_text()
          author = replace_once(author, '<title>Hobunji Animation Author V15.43</title>', '<title>Hobunji Animation Author V15.45</title>', 'author HTML title')
          block_marker = '// V15.43 animal chathead framing.'
          block_start = author.rfind(block_marker)
          if block_start < 0:
              raise SystemExit('animal chathead framing patch block not found')
          block = author[block_start:]
          block = replace_once(block, '// V15.43 animal chathead framing.', '// V15.45 animal chathead framing.', 'chathead patch comment version')
          block = replace_once(block, "document.title = 'Hobunji Animation Author V15.43';", "document.title = 'Hobunji Animation Author V15.45';", 'chathead prepare title')
          block = replace_once(block, "if (window.MultiAvatarAnimationAuthor) window.MultiAvatarAnimationAuthor.version = '15.43';", "if (window.MultiAvatarAnimationAuthor) window.MultiAvatarAnimationAuthor.version = '15.45';", 'chathead API version')
          block = replace_once(block, "animationAuthor.recentChange = 'V15.43 adds species-authored animal dialogue chathead framing to Rig Coordinates; ambient dialogue plus Banubu/Grehlr and Hiki-hiki/Drenkirra full dialogue consume the same crop.';", "document.title = 'Hobunji Animation Author V15.45';\nif (window.MultiAvatarAnimationAuthor) window.MultiAvatarAnimationAuthor.version = '15.45';\nanimationAuthor.recentChange = 'V15.45 adds species-authored animal dialogue chathead framing to Rig Coordinates; animal ambient dialogue plus Banubu/Grehlr and Hiki-hiki/Drenkirra full dialogue consume the same crop.';", 'chathead installed version state')
          block = replace_once(block, "log('V15.43 patch installed: creature Rig Coordinates now author normalized dialogue chathead frames with touch preview and mobile diagnostics.');", "log('V15.45 patch installed: creature Rig Coordinates now author normalized dialogue chathead frames with touch preview; animal ambient speech and animal-looking NPC dialogue share the same crop runtime.');", 'chathead patch log version')
          author = author[:block_start] + block
          author_path.write_text(author)

          framing_test_path = Path('scripts/test-animal-chathead-framing.js')
          framing_test = framing_test_path.read_text()
          framing_test = replace_once(framing_test, "/document\\.title = 'Hobunji Animation Author V15\\.43'/,", "/document\\.title = 'Hobunji Animation Author V15\\.45'/,", 'framing test visible version')
          framing_test = replace_once(
              framing_test,
              "  'published author title must identify the animal-chathead framing build');",
              "  'published author title must identify the animal-chathead framing build after V15.44');\nassert.match(authorSource, /MultiAvatarAnimationAuthor\\.version = '15\\.45'/,\n  'public Animation Author API version must match the V15.45 chathead build');",
              'framing test API version assertion',
          )
          framing_test_path.write_text(framing_test)

          vocal_test_path = Path('scripts/test-animal-vocalizations.js')
          vocal_test = vocal_test_path.read_text()
          anchor = "assert.equal(overheadText.at(-1)?.text, 'Den!', 'reason-specific discovery text remains synchronized to audible call');"
          replacement = anchor + "\nassert.equal(overheadText.at(-1)?.opts?.mode, 'chathead', 'animal ambient text now includes the authored animal chathead instead of text-only overhead mode');\nassert.equal(overheadText.at(-1)?.opts?.profile?.chatheadCreatureKind, 'gar-wolf', 'animal ambient chathead carries the normalized species key into the shared crop renderer');\nassert.equal(overheadText.at(-1)?.opts?.profile?.creatureGenotype?.sizeClass, 'large', 'animal ambient chathead preserves genotype data for composed portrait coloration and variants');"
          vocal_test = replace_once(vocal_test, anchor, replacement, 'animal vocalization chathead assertions')
          vocal_test_path.write_text(vocal_test)
          PY

      - name: Run focused regression tests
        run: |
          node scripts/test-animal-chathead-framing.js
          node scripts/test-animal-vocalizations.js
          node scripts/test-animal-head-rig-runtime.js

      - name: Remove temporary patch workflows and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-animal-chathead-framing.yml
          git rm .github/workflows/run-animal-chathead-framing-patch.yml
          git rm .github/workflows/finalize-animal-chathead-framing.yml
          git add docs/js/animal-vocalizations.js docs/tools/animation-author/index.html scripts/test-animal-chathead-framing.js scripts/test-animal-vocalizations.js
          git diff --cached --check
          git commit -m "Finish animal ambient chathead framing"
          git push origin HEAD:codex/animal-chathead-framing
