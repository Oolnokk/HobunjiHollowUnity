name: Verify clothing fit mobile startup (one shot)

on:
  push:
    branches: [feature/bake-tletingan-furhood-pngs]
    paths: [.github/workflows/verify-clothing-fit-load-once.yml]

permissions:
  contents: read

jobs:
  check-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run boot, timeout and existing garment integration tests
        run: |
          node scripts/test-clothing-fit-loader.js
          node scripts/test-clothing-fit-editor-layers.js
          node scripts/test-fur-hood-leatherworking.js
          node scripts/test-fur-hood-exclusion-editor.js
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Prove mobile 2D fitting works when Three.js CDN hangs
        run: |
          node <<'NODE'
          'use strict';
          const assert=require('node:assert/strict');
          const http=require('node:http');
          const fs=require('node:fs');
          const path=require('node:path');
          const {chromium}=require('playwright');
          const root=path.resolve('docs');
          const types={'.js':'application/javascript','.json':'application/json','.css':'text/css',
            '.txt':'text/plain','.html':'text/html','.png':'image/png','.webp':'image/webp'};
          const server=http.createServer((req,res)=>{
            let urlPath;
            try{urlPath=decodeURIComponent(new URL(req.url,'http://localhost').pathname)}catch{res.writeHead(400).end();return}
            const file=path.resolve(root,'.'+urlPath);
            if(!file.startsWith(root+path.sep)||!fs.existsSync(file)||!fs.statSync(file).isFile()){
              res.writeHead(404).end('File not found: '+urlPath);return
            }
            res.writeHead(200,{'Content-Type':types[path.extname(file)]||'application/octet-stream'});
            fs.createReadStream(file).pipe(res);
          });
          (async()=>{
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const url='http://127.0.0.1:'+server.address().port+'/';
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await context.addInitScript(({repo})=>{
                localStorage.setItem('hobunji_clothing_species_fit_6x6_v2',JSON.stringify({
                  version:4,gridSize:6,baseTransforms:{},localOffsets:{},maskPreviewTransforms:{},
                  settings:{mode:'transform',region:'headwear',species:'tletingan',gender:'male',
                    sourceSpecies:'tletingan',sourceGender:'male',headGarment:'fur_hood',repo}
                }));
              },{repo:url});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              // Let the CDN fetch hang forever: the 2D app must not wait on this optional dependency.
              await page.route('https://cdn.jsdelivr.net/**',()=>new Promise(()=>{}));
              await page.goto(url+'tools/clothing-species-fit/index.html',
                {waitUntil:'domcontentloaded',timeout:20000});
              await page.waitForFunction(()=>{
                const message=document.getElementById('status')?.textContent||'';
                return message.includes('2D editor ready');
              },{timeout:55000});
              const result=await page.evaluate(()=>{
                const stage=document.getElementById('stage');
                const data=stage.getContext('2d').getImageData(0,0,stage.width,stage.height).data;
                let opaque=0;
                for(let i=3;i<data.length;i+=4)if(data[i])opaque++;
                return {
                  status:document.getElementById('status').textContent,
                  assetStatus:document.getElementById('sourceLayerStatus').textContent,
                  region:document.getElementById('fitRegion').value,
                  garment:document.getElementById('garment').value,
                  source:document.getElementById('sourceSpecies').value,
                  canvas:[stage.width,stage.height],
                  opaque
                };
              });
              console.log(JSON.stringify({result,errors},null,2));
              assert.equal(result.region,'headwear');
              assert.equal(result.garment,'fur_hood');
              assert.equal(result.source,'tletingan');
              assert.deepEqual(result.canvas,[234,173]);
              assert(result.opaque>0,'The fitting stage must contain visible hood pixels');
              assert(result.assetStatus.includes('authored source layer'),'Fur hood layered art must have loaded');
              assert.deepEqual(errors,[],'No unhandled errors during optional Three.js stall');
              await context.close();
            }finally{await browser.close()}
          })().then(()=>server.close()).catch(error=>{console.error(error);server.close();process.exitCode=1});
          NODE
