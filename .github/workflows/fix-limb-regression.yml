name: Fix limb regression
on:
  push:
    branches: [fix/wavy-limbs-medium-gray-stone]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wavy-limbs-medium-gray-stone
          fetch-depth: 0
      - name: Patch hand fallback and limb outline upload
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          hand = 'docs/js/procedural-hand-attachments.js'
          replace_once(
              hand,
              "    const bodyTexture = handBodySurfaceTexture(THREE, speciesId, bodyColors); // Keeps generated fallback hands visually consistent with GLB body-hand surfaces.\n",
              "    const bodyTexture = handSurfaceTexture(THREE, 'body', speciesId, bodyColors); // Generated fallback hands use the same canvas.png body surface as GLB hands.\n"
          )
          replace_once(
              hand,
              "    material.userData.hobunjiHandSurfaceTexture = 'wavy_surface.png';",
              "    material.userData.hobunjiHandSurfaceTexture = 'canvas.png';"
          )

          for path in [
              'docs/js/procedural-hand-outline-parity.js',
              'docs/js/procedural-feet-outline-parity.js',
          ]:
              replace_once(
                  path,
                  "        thicknessUniform.value = previousThickness * OUTLINE_THICKNESS_MULTIPLIER;",
                  "        thicknessUniform.value = previousThickness * OUTLINE_THICKNESS_MULTIPLIER;\n        material.uniformsNeedUpdate = true; // Shared ShaderMaterial is reused across meshes; force this per-limb value onto the GPU for this draw."
              )
              replace_once(
                  path,
                  "      if (thicknessRestore) thicknessRestore.uniform.value = thicknessRestore.value;",
                  "      if (thicknessRestore) {\n        thicknessRestore.uniform.value = thicknessRestore.value;\n        const scene = args[1];\n        const material = args[4];\n        if (material?.isShaderMaterial) material.uniformsNeedUpdate = true; // Ensure the restored global thickness is uploaded before the next non-limb shell draw.\n      }"
              )

          print('patched stale hand fallback call and forced limb shell uniform uploads')
      - name: Validate
        run: |
          node --check docs/js/procedural-hand-attachments.js
          node --check docs/js/procedural-hand-outline-parity.js
          node --check docs/js/procedural-feet-outline-parity.js
          git diff --check
          ! grep -q "handBodySurfaceTexture" docs/js/procedural-hand-attachments.js
          grep -q "handSurfaceTexture(THREE, 'body'" docs/js/procedural-hand-attachments.js
          grep -q "hobunjiHandSurfaceTexture = 'canvas.png'" docs/js/procedural-hand-attachments.js
          test "$(grep -c "material.uniformsNeedUpdate = true" docs/js/procedural-hand-outline-parity.js)" -ge 2
          test "$(grep -c "material.uniformsNeedUpdate = true" docs/js/procedural-feet-outline-parity.js)" -ge 2
          grep -q "OUTLINE_THICKNESS_MULTIPLIER = 2" docs/js/procedural-hand-outline-parity.js
          grep -q "OUTLINE_THICKNESS_MULTIPLIER = 2" docs/js/procedural-feet-outline-parity.js
      - name: Commit and clean temporary workflow
        run: |
          rm -f .github/workflows/fix-limb-regression.yml
          rm -f .github/limb-regression-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix vanished hands and force thicker limb outlines'
          git push origin HEAD:fix/wavy-limbs-medium-gray-stone
