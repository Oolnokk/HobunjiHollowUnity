name: Temporary Voorg cache-bust fixer

on:
  push:
    branches:
      - fix/voorg-ass-hex-target-recolor-20261014

permissions:
  contents: write

jobs:
  fix-cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voorg-ass-hex-target-recolor-20261014
          fetch-depth: 0
      - name: Bump changed module tokens
        run: |
          git fetch origin main
          node scripts/check-cache-busts.js --fix origin/main
      - name: Commit generated loader token
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git commit -m "Bump Voorg-Ass registration cache token"
          git push origin HEAD:fix/voorg-ass-hex-target-recolor-20261014
