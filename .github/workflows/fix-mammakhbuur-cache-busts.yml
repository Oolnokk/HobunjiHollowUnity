name: Fix Mammakhbuur cache busts

on:
  push:
    branches:
      - mammakhbuur-head-placeholders

permissions:
  contents: write

jobs:
  fix-cache-busts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mammakhbuur-head-placeholders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repository cache-bust fixes
        run: node scripts/check-cache-busts.js --fix
      - name: Commit cache-bust chain
        run: |
          if git diff --quiet; then
            echo "Cache-bust chain already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump cache tokens for Mammakhbuur comparison"
          git push origin HEAD:mammakhbuur-head-placeholders
