name: Remove legacy hosting references once

on:
  push:
    branches: [agent/replace-netlify-cloud-save-with-drive]
    paths:
      - '.github/workflows/remove-legacy-netlify-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/replace-netlify-cloud-save-with-drive
          fetch-depth: 0

      - name: Remove legacy provider references
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('docs/onboarding-core.js'): [
                  ('window.NetlifyCloudSave?.openPanel', 'window.HobunjiCloudSave?.openPanel'),
                  ('window.NetlifyCloudSave.openPanel()', 'window.HobunjiCloudSave.openPanel()'),
                  ('Reload the Netlify deployment and try again.', 'Reload the game and try again.'),
              ],
              Path('docs/js/save-startup-gate.js'): [
                  ('Browser saves and Netlify Cloud Save still work.', 'Browser saves and Google Drive Cloud Save still work.'),
                  ('window.NetlifyCloudSave?.openPanel', 'window.HobunjiCloudSave?.openPanel'),
                  ('window.NetlifyCloudSave.openPanel()', 'window.HobunjiCloudSave.openPanel()'),
                  ('Reload the Netlify deployment and try again.', 'Reload the game and try again.'),
                  ('cloud: window.NetlifyCloudSave?.getStatus?.() || null,', 'cloud: window.HobunjiCloudSave?.getStatus?.() || null,'),
              ],
              Path('docs/js/google-drive-cloud-save.js'): [
                  ('  // Compatibility alias for older onboarding code; this no longer uses Netlify in any way.\n  window.NetlifyCloudSave = api;\n', ''),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected legacy text missing in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          docs = Path('GOOGLE_DRIVE_CLOUD_SAVES.md')
          text = docs.read_text(encoding='utf-8')
          text = text.replace('\nNo Netlify Identity, Functions, or Blobs backend is required for cloud saves.\n', '\n')
          marker = '\n## Migration from the retired Netlify save backend\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          docs.write_text(text, encoding='utf-8')

          # Remove this one-time workflow before the cleanup commit.
          Path('.github/workflows/remove-legacy-netlify-once.yml').unlink()

      - name: Verify no legacy provider text remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=.git --exclude='*.map' 'netlify' .; then
            echo 'Legacy provider reference remains.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove remaining legacy hosting references'
          git push origin HEAD:agent/replace-netlify-cloud-save-with-drive
