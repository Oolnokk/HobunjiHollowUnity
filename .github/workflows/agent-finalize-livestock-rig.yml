name: Agent finalize livestock rig

on:
  push:
    branches:
      - agent/rig-coordinates-puktuk-voorg-ass
    paths:
      - '.github/workflows/agent-finalize-livestock-rig.yml'
      - 'scripts/agent-finalize-livestock-rig.js'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run livestock rig finalizer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/rig-coordinates-puktuk-voorg-ass
          fetch-depth: 0
      - name: Merge current main
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply audited rig and eye integration
        run: node scripts/agent-finalize-livestock-rig.js
      - name: Commit final integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize canonical livestock rigs and Puktuk eyes'
          git push origin HEAD:agent/rig-coordinates-puktuk-voorg-ass
