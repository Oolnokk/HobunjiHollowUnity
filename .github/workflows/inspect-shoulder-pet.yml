name: Inspect shoulder pet integration

on:
  push:
    branches:
      - fix/shoulder-pet-follow-authored-pixel

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate shoulder pet code
        shell: bash
        run: |
          set -euo pipefail
          rg -n -C 80 "shoulderPetFaceRelativeTransform|shoulderPerchRule|shoulderPetMeshPin|_shoulderPet" docs/game.js docs/js docs/config scripts | head -240
