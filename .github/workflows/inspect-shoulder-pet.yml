name: Apply shoulder pet skinned-pixel fix

on:
  push:
    branches:
      - fix/shoulder-pet-follow-authored-pixel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-shoulder-pet-skinned-pixel-fix.py
          node scripts/test-shoulder-pet-attack-rotation.js
          git diff --check
          git add docs/js/png-plane-avatar.js docs/game.js scripts/test-shoulder-pet-attack-rotation.js
          git commit -m "Pin shoulder pets to live authored shoulder pixels"
          git push origin HEAD:fix/shoulder-pet-follow-authored-pixel
