name: Temp Combat Vocal Config

on:
  push:
    branches:
      - feat/combat-vocalizations

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-vocalizations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tighten helper target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/temp_apply_combat_vocal_config.py')
          text = p.read_text()
          old = """playback = replace_once(playback,\n    '    const pitchSemitones = clampPitch(opts.pitchSemitones ?? 0);',\n    '    const pitchSemitones = clampPitchFor(opts.pitchSemitones ?? 0, GENERIC_MAX_SHIFT_SEMITONES);'\n)"""
          new = """playback = playback.replace(\n    '    const pitchSemitones = clampPitch(opts.pitchSemitones ?? 0);',\n    '    const pitchSemitones = clampPitchFor(opts.pitchSemitones ?? 0, GENERIC_MAX_SHIFT_SEMITONES);',\n    1\n)"""
          if old not in text:
              raise SystemExit('Could not find generic decoded-buffer pitch clamp patch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply authored config and runtime support
        run: python3 .github/scripts/temp_apply_combat_vocal_config.py
      - name: Refresh cache busts
        run: node scripts/check-cache-busts.js --fix
      - name: Validate focused vocal regressions
        run: |
          node scripts/test-combat-vocalizations.js
          node scripts/test-animal-vocalizations.js
          node scripts/test-animal-authored-voice-routing.js
          node scripts/check-cache-busts.js origin/main
      - name: Run full regression suite
        run: node scripts/run-tests.js
      - name: Commit validated config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-combat-vocal-config.yml .github/scripts/temp_apply_combat_vocal_config.py
          git add -A
          git commit -m "Apply authored combat vocalization tuning"
          git push origin HEAD:feat/combat-vocalizations
