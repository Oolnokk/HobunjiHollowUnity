name: Temporary unstarred clothing quality guard

on:
  push:
    branches:
      - feature/woven-clothing-quality-gifts
    paths:
      - scripts/patch-woven-clothing-quality-null-temp.js

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply null-quality guard
        run: node scripts/patch-woven-clothing-quality-null-temp.js
      - name: Fix cache-bust tokens
        run: node scripts/check-cache-busts.js --fix origin/main
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Run regression tests
        run: node scripts/run-tests.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/js/equipment-panel.js docs/js/favor-heart-balance.js scripts/test-favor-heart-balance.js docs/index.html docs/js/combat/combat-config-loader.js docs/tools/character-studio/index.html docs/tools/cutscene-director/index.html docs/tools/furniture-avatar-author/foliage-furniture-mode.js docs/tools/furniture-avatar-author/index.html docs/tools/pattern-editor/index.html
          git commit -m "Keep unstarred clothing out of quality scaling"
          git push
