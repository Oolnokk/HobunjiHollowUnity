name: Named animal NPC regression

on:
  push:
    paths:
      - 'docs/config/npcs/species-overrides.json'
      - 'docs/config/creatures/hobunji-creature-bestiary.json'
      - 'docs/js/local-db-overrides.js'
      - 'docs/js/named-animal-npc.js'
      - 'docs/js/animal-chathead-frame.js'
      - 'docs/js/animal-npc-headwear.js'
      - 'docs/js/character-studio-animal-appearance.js'
      - 'docs/js/repo-pattern-library.js'
      - 'docs/js/pattern-authoring.js'
      - 'docs/js/clothing-weaving-system.js'
      - 'docs/js/creature-genetics-render.js'
      - 'docs/config/patterns/**'
      - 'docs/js/character-studio-animal-fey-extras.js'
      - 'docs/js/repo-picker.js'
      - 'docs/js/npc-avatar-preview-utils.js'
      - 'docs/js/png-plane-avatar.js'
      - 'docs/tools/character-studio/index.html'
      - 'docs/tools/pattern-editor/**'
      - 'docs/tools/index.html'
      - 'docs/index.html'
      - 'scripts/test-named-animal-npc-species.js'
      - 'scripts/test-repo-pattern-authoring.js'
      - '.github/workflows/named-animal-npc-regression.yml'
  pull_request:
    paths:
      - 'docs/config/npcs/species-overrides.json'
      - 'docs/config/creatures/hobunji-creature-bestiary.json'
      - 'docs/js/local-db-overrides.js'
      - 'docs/js/named-animal-npc.js'
      - 'docs/js/animal-chathead-frame.js'
      - 'docs/js/animal-npc-headwear.js'
      - 'docs/js/character-studio-animal-appearance.js'
      - 'docs/js/repo-pattern-library.js'
      - 'docs/js/pattern-authoring.js'
      - 'docs/js/clothing-weaving-system.js'
      - 'docs/js/creature-genetics-render.js'
      - 'docs/config/patterns/**'
      - 'docs/js/character-studio-animal-fey-extras.js'
      - 'docs/js/repo-picker.js'
      - 'docs/js/npc-avatar-preview-utils.js'
      - 'docs/js/png-plane-avatar.js'
      - 'docs/tools/character-studio/index.html'
      - 'docs/tools/pattern-editor/**'
      - 'docs/tools/index.html'
      - 'docs/index.html'
      - 'scripts/test-named-animal-npc-species.js'
      - 'scripts/test-repo-pattern-authoring.js'
      - '.github/workflows/named-animal-npc-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check named animal NPC modules
        run: |
          node --check docs/js/local-db-overrides.js
          node --check docs/js/named-animal-npc.js
          node --check docs/js/animal-npc-headwear.js
          node --check docs/js/character-studio-animal-appearance.js
          node --check docs/js/repo-pattern-library.js
          node --check docs/js/pattern-authoring.js
          node --check docs/js/clothing-weaving-system.js
          node --check docs/js/creature-genetics-render.js
          node --check docs/js/character-studio-animal-fey-extras.js
          node --check docs/js/repo-picker.js
          node --check scripts/test-named-animal-npc-species.js
          node --check scripts/test-repo-pattern-authoring.js
      - name: Test named animal NPC species integration
        run: node scripts/test-named-animal-npc-species.js
      - name: Test repo Pattern Editor and animal surface patterns
        run: node scripts/test-repo-pattern-authoring.js
