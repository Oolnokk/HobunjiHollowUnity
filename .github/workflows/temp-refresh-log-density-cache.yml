name: Temporary log density cache refresh
on:
  push:
    branches:
      - feature/log-cabin-wall-generator
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message != 'Refresh log density cache busts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/log-cabin-wall-generator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh cache tokens
        run: |
          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
      - name: Commit refreshed references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh log density cache busts"
            git push origin HEAD:feature/log-cabin-wall-generator
          fi
