name: Temp unify authored building lighting

on:
  push:
    branches:
      - fix/life-temple-overlay-darkness-20261014

permissions:
  contents: write

jobs:
  unify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/life-temple-overlay-darkness-20261014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unify authored-building lighting policy
        run: node scripts/temp-unify-building-lighting-policy.js
      - name: Fix cache-bust chain
        run: |
          git fetch origin main
          node scripts/check-cache-busts.js --fix origin/main
      - name: Run focused lighting regression
        run: node scripts/test-overlay-only-lighting.js
      - name: Commit generated production changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git commit -m "Unify authored building fake-light policy"
          git push origin HEAD:fix/life-temple-overlay-darkness-20261014
