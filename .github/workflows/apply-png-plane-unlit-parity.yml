name: Apply PNG-plane unlit parity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/wavy-limbs-medium-gray-stone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wavy-limbs-medium-gray-stone
          fetch-depth: 0

      - name: Apply full PNG-plane unlit parity
        run: python .github/apply-png-plane-unlit-parity.py

      - name: Validate source
        shell: bash
        run: |
          python -m py_compile .github/apply-png-plane-unlit-parity.py
          node --check docs/js/png-plane-avatar.js
          node --check docs/js/procedural-hand-attachments.js
          node --check docs/js/procedural-leg-animation.js
          node --check docs/js/natural-surface-materials.js
          grep -q "window.HobunjiPngPlaneUnlit" docs/js/png-plane-avatar.js
          grep -q "HobunjiPngPlaneUnlit.*makeMaterial" docs/js/procedural-hand-attachments.js
          grep -q "HobunjiPngPlaneUnlit.*makeMaterial" docs/js/procedural-leg-animation.js
          grep -q "HobunjiPngPlaneUnlit.*makeMaterial" docs/js/natural-surface-materials.js
          git diff --check

      - name: Commit runtime changes and remove patch machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply-png-plane-unlit-parity.py .github/workflows/apply-png-plane-unlit-parity.yml
          rm -rf .github/__pycache__
          git add docs/js/png-plane-avatar.js docs/js/procedural-hand-attachments.js docs/js/procedural-leg-animation.js docs/js/natural-surface-materials.js
          git commit -m "Match surface rendering to PNG-plane unlit path"
          git push origin HEAD:fix/wavy-limbs-medium-gray-stone
