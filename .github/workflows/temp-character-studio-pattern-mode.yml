name: Temp Character Studio Pattern Mode

on:
  push:
    branches: [appearance-pattern-editor-pauldron-layer]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: appearance-pattern-editor-pauldron-layer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch selector behavior
        run: python scripts/patch-character-studio-pattern-mode.py
      - name: Run focused regression
        run: node scripts/test-character-studio-pattern-integration.js
      - name: Run fast regression suite
        run: node scripts/run-tests.js
      - name: Commit tested fix
        run: |
          rm -f .github/workflows/temp-character-studio-pattern-mode.yml scripts/patch-character-studio-pattern-mode.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Character Studio pattern mode selection"
          git push origin HEAD:appearance-pattern-editor-pauldron-layer
