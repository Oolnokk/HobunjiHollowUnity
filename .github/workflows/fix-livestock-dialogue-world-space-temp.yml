name: Fix livestock dialogue world space

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/fix-livestock-dialogue-world-space-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
          fetch-depth: 0
      - name: Apply world-space dialogue fix
        run: python3 .github/scripts/fix-livestock-dialogue-world-space-temp.py
      - name: Run focused regressions
        run: |
          node --check docs/config/attachment-rig-profiles.js
          node --check docs/js/animal-vocalizations.js
          node --check docs/js/farm-animals.js
          node --check docs/js/animal-chathead-frame.js
          node --check docs/js/dialogue-content.js
          node --check docs/game.js
          node scripts/test-animal-chathead-framing.js
          node scripts/test-animal-chathead-ambient.js
          node scripts/test-animal-head-rig-runtime.js
          node scripts/test-livestock-dialogue-chatheads.js
          node scripts/test-npc-facing-deadzone.js
      - name: Commit tested fix and clean temporary diagnostics
        run: |
          rm -f .github/scripts/fix-livestock-dialogue-world-space-temp.py
          rm -f .github/workflows/fix-livestock-dialogue-world-space-temp.yml
          rm -f .github/scripts/inspect-dialogue-camera-temp.py
          rm -f .github/workflows/inspect-dialogue-camera-temp.yml
          rm -f .github/dialogue-camera-inspection.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/game.js docs/index.html scripts/test-livestock-dialogue-chatheads.js .github
          git commit -m 'Keep livestock dialogue camera in head world space'
          git push
