name: RAF ownership Stage 6 regression (social rhythm clock)

on:
  pull_request:
    paths:
      - 'docs/js/social-rhythm-runtime.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-social-rhythm-scheduler.js'
      - '.github/workflows/raf-ownership-stage6f-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/social-rhythm-runtime.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-social-rhythm-scheduler.js'
      - '.github/workflows/raf-ownership-stage6f-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/social-rhythm-runtime.js
      - name: Rhythm-clock scheduler migration
        run: node scripts/test-social-rhythm-scheduler.js
