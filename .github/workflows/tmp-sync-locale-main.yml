name: Sync locale branch with main

on:
  push:
    branches:
      - chatgpt/locale-terrain-anchors
    paths:
      - .github/workflows/tmp-sync-locale-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/locale-terrain-anchors
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-ff origin/main -m 'Merge current main into locale terrain branch'; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            echo "Conflicted files: $conflicted"
            if [ "$conflicted" != "docs/tools/wilderness-generation-lab/lab-markers.js" ]; then
              echo 'Unexpected merge conflict(s); refusing automatic resolution.'
              git diff --cc
              exit 1
            fi
            git checkout --theirs docs/tools/wilderness-generation-lab/lab-markers.js
            python - <<'PY'
          from pathlib import Path
          path = Path('docs/tools/wilderness-generation-lab/lab-markers.js')
          text = path.read_text(encoding='utf-8')
          needle = "      await loadScript('lab-pixel-probe.js', 'wilderness-lab-pixel-probe'); // Exact post-generation tile inspector plus debug export containing both workspace and merged preview grid.\n"
          addition = (
              needle
              + "      await loadScript('lab-locale-terrain.js', 'wilderness-lab-locale-terrain'); // Locale Editor autosave/import source plus selected/rejected terrain-probe and embedded-carve overlays.\n"
              + "      await loadScript('lab-banubu-cave.js', 'wilderness-lab-banubu-cave'); // Repo-backed Banubu Cave injection plus exact game cave renderer and actual Grehlr live visual.\n"
          )
          if needle not in text:
              raise SystemExit('Could not find Wilderness Lab pixel-probe loader while resolving merge')
          text = text.replace(needle, addition, 1)
          old_log = "      console.log('[WildernessLab] shared causeway repair + terrain experiments + basin ramp field + finalizer + recipe guard + settings export + exported-object index + cube markers + terrain skin + environment refresh + real environment surface + scale reference + entry repair + pixel probe loaded');"
          new_log = "      console.log('[WildernessLab] shared causeway repair + terrain experiments + basin ramp field + finalizer + recipe guard + settings export + exported-object index + cube markers + terrain skin + environment refresh + real environment surface + scale reference + entry repair + pixel probe + locale terrain diagnostics + Banubu Cave live preview loaded');"
          if old_log not in text:
              raise SystemExit('Could not find current-main Wilderness Lab load log while resolving merge')
          text = text.replace(old_log, new_log, 1)
          path.write_text(text, encoding='utf-8')
          PY
            git add docs/tools/wilderness-generation-lab/lab-markers.js
            git commit --no-edit
          fi
      - name: Regression checks
        run: |
          node --check docs/js/zone-den-totem-features.js
          node --check docs/tools/locale-editor/terrain-placement.js
          node --check docs/tools/wilderness-generation-lab/lab-markers.js
          node scripts/test-locale-terrain-placement.js
          node scripts/test-banubu-cave-locale.js
          node scripts/test-banubu-wilderness-lab-generation.js
      - name: Push synced branch
        run: git push origin HEAD:chatgpt/locale-terrain-anchors
