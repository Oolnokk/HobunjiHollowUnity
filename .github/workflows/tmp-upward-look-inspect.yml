name: Temporary upward-look clamp inspection

on:
  push:
    branches:
      - codex/increase-upward-look-clamp

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inspect camera clamp call sites
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('docs/game.js').read_text(encoding='utf-8').splitlines()
          needles = ('cameraAngleOffsetDeg', 'cameraRotateClampDeg')
          hits = sorted({i for i, line in enumerate(source) if any(n in line for n in needles)})
          print(f'camera clamp-related hits: {len(hits)}')
          for i in hits:
              print(f'\n--- around line {i + 1} ---')
              for j in range(max(0, i - 7), min(len(source), i + 8)):
                  print(f'{j + 1:6}: {source[j]}')
          PY
      - name: Remove temporary inspection workflow
        run: |
          rm .github/workflows/tmp-upward-look-inspect.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tmp-upward-look-inspect.yml
          git commit -m "Remove temporary camera clamp inspection workflow"
          git push
