name: RAF ownership Stage 11e regression (livestock nursery swarm)

on:
  pull_request:
    paths:
      - 'docs/js/livestock-nursery.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-livestock-nursery-swarm-scheduler.js'
      - '.github/workflows/raf-ownership-stage11e-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/livestock-nursery.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-livestock-nursery-swarm-scheduler.js'
      - '.github/workflows/raf-ownership-stage11e-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/livestock-nursery.js
      - name: Livestock nursery swarm scheduler migration
        run: node scripts/test-livestock-nursery-swarm-scheduler.js
