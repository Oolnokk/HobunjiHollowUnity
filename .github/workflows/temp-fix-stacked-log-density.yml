name: Temporary stacked log density fix
on:
  push:
    branches:
      - feature/log-cabin-wall-generator
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Improve stacked log gable fill and default color' && github.event.head_commit.message != 'Remove temporary stacked log density workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/log-cabin-wall-generator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply log color and gable density fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # User-provided swatch dominant fill: RGB 55,47,24 = #372f18.
          for path in ['docs/js/log-wall-extension.js', 'docs/js/stacked-log-walls.js']:
              replace_once(path, "barkColor: '#6d472d',", "barkColor: '#372f18',")
          replace_once('docs/js/foliage-generator.js', "const barkColor = new T.Color(options.barkColor ?? '#6d472d');", "const barkColor = new T.Color(options.barkColor ?? '#372f18');")
          replace_once('docs/js/log-wall-extension.js', "Number.isFinite(color) ? color : 0x6d472d", "Number.isFinite(color) ? color : 0x372f18")

          stacked = Path('docs/js/stacked-log-walls.js')
          text = stacked.read_text()
          text = text.replace(
              "  const EPS = 1e-6; // Geometry tolerance shared by horizontal polygon intersection and point dedupe.\n",
              "  const EPS = 1e-6; // Geometry tolerance shared by horizontal polygon intersection and point dedupe.\n"
              "  const EDGE_SPAN_RECLAIM = 0.8; // Reclaims most of the old full-diameter gable inset so round courses visually reach sloped edges while retaining a small clipping guard.\n"
          , 1)
          text = text.replace(
              "    const pitch = Math.max(meta.logDiameter * 0.35, meta.logDiameter + meta.courseGap); // Vertical center-to-center course spacing; negative gap means intentional overlap.\n",
              "    const nominalPitch = Math.max(meta.logDiameter * 0.35, meta.logDiameter + meta.courseGap); // Maximum requested center-to-center spacing; each panel may tighten it slightly so short gables do not lose a whole course.\n"
          , 1)
          old = """      const firstCenter = minY + meta.logDiameter * 0.5; // Lowest course center keeps the full log radius inside the wall's vertical span.\n      const lastCenter = maxY - meta.logDiameter * 0.5; // Highest course center similarly avoids poking above the authored polygon.\n      let courseIndex = 0; // Per-panel course index used for deterministic seed variants.\n\n      for (let centerY = firstCenter; centerY <= lastCenter + EPS; centerY += pitch, courseIndex++) {\n"""
          new = """      const panelHeight = Math.max(EPS, maxY - minY); // Full vertical extent used to choose a dense course count before any radius inset can discard a row.\n      const rowCount = Math.max(1, Math.ceil(panelHeight / nominalPitch)); // Guarantees actual spacing is never looser than the authored pitch, especially on short gables.\n      const pitch = panelHeight / rowCount; // Even per-panel spacing centers the first/last round logs symmetrically inside the full wall/gable height.\n\n      for (let courseIndex = 0; courseIndex < rowCount; courseIndex++) {\n        const centerY = minY + pitch * (courseIndex + 0.5); // Dense center distribution prevents small triangular planes from losing an entire top/bottom course.\n"""
          if old not in text:
              raise SystemExit('stacked course-loop anchor missing')
          text = text.replace(old, new, 1)
          old = """        const safeSpan = Math.min(centerSpan.length, lowerSpan?.length ?? centerSpan.length, upperSpan?.length ?? centerSpan.length); // Shortest sampled width prevents a fat course from clipping through a narrowing gable edge.\n        if (safeSpan < Math.max(0.04, meta.logDiameter * 0.35)) continue;\n"""
          new = """        const strictSpan = Math.min(centerSpan.length, lowerSpan?.length ?? centerSpan.length, upperSpan?.length ?? centerSpan.length); // Old full-diameter containment width retained as the conservative reference.\n        const safeSpan = strictSpan + (centerSpan.length - strictSpan) * EDGE_SPAN_RECLAIM; // Keep only a small portion of that inset; end overhang can now visually meet the roof slope instead of leaving large triangular gaps.\n        if (safeSpan < Math.max(0.04, meta.logDiameter * 0.2)) continue; // Allow short ridge courses instead of dropping them solely because the gable is narrow.\n"""
          if old not in text:
              raise SystemExit('stacked safe-span anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              "            safeWallSpan: safeSpan,\n",
              "            safeWallSpan: safeSpan,\n            strictWallSpan: strictSpan,\n            edgeSpanReclaim: EDGE_SPAN_RECLAIM,\n            panelCoursePitch: pitch,\n"
          , 1)
          text = text.replace(
              "      latestChange: 'Each course is foliage-generated at its actual horizontal span and physically split around openings; tapered walls and gables shorten the source geometry itself.',\n",
              "      latestChange: 'Short gables now keep dense evenly distributed courses and reclaim conservative slope inset so logs fill near roof edges; every visible piece is still foliage-generated at its final source length.',\n"
          , 1)
          text = text.replace(
              "    latestChange: 'Stacked logs regenerate at exact per-course spans through FoliageGenerator and split into shorter generated pieces around openings instead of scaling/clipping a GLB.',\n",
              "    latestChange: 'Stacked logs regenerate at exact per-course spans; short gables use dense row packing and fuller slope coverage while openings still split source geometry.',\n"
          , 1)
          stacked.write_text(text)

          test = Path('scripts/test-stacked-log-walls.js')
          text = test.read_text()
          anchor = "assert(api, 'StackedLogWalls publishes its shared runtime API');\n"
          if anchor not in text:
              raise SystemExit('stacked test API anchor missing')
          text = text.replace(anchor, anchor + "assert.equal(api.DEFAULTS.barkColor, '#372f18', 'stacked architecture default bark color matches the approved dark-olive swatch');\n", 1)
          anchor = "assert.match(stackedSource, /visibleSegmentsAroundOpenings/, 'stacked logs split real source geometry around wall openings');\n"
          addition = "assert.match(stackedSource, /Math\\.ceil\\(panelHeight \\/ nominalPitch\\)/, 'short gables choose enough rows that course spacing never becomes looser than the authored pitch');\nassert.match(stackedSource, /EDGE_SPAN_RECLAIM = 0\\.8/, 'gable edge fill reclaims most of the overly conservative full-diameter slope inset');\nassert.match(stackedSource, /meta\\.logDiameter \\* 0\\.2/, 'narrow ridge courses are retained instead of being dropped at the old wide-span threshold');\n"
          if anchor not in text:
              raise SystemExit('stacked test opening anchor missing')
          text = text.replace(anchor, anchor + addition, 1)
          test.write_text(text)

          ext_test = Path('scripts/test-log-wall-extension.js')
          text = ext_test.read_text()
          anchor = "const api = require(path.join(repoRoot, 'docs/js/log-wall-extension.js')); // Pure recipe/runtime extension API under test.\n"
          if anchor not in text:
              raise SystemExit('log extension test API anchor missing')
          text = text.replace(anchor, anchor + "assert.equal(api.DEFAULTS.barkColor, '#372f18', 'default cabin-log bark uses the approved dark-olive swatch');\n", 1)
          ext_test.write_text(text)
          PY
      - name: Refresh cache busts
        run: |
          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
      - name: Validate focused changes
        run: |
          node --check docs/js/stacked-log-walls.js
          node --check docs/js/log-wall-extension.js
          node --check docs/js/foliage-generator.js
          node scripts/test-stacked-log-walls.js
          node scripts/test-log-wall-extension.js
          node scripts/test-log-wall-materials.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/test-stacked-log-walls.js scripts/test-log-wall-extension.js
          if ! git diff --cached --quiet; then
            git commit -m "Improve stacked log gable fill and default color"
            git push origin HEAD:feature/log-cabin-wall-generator
          fi
