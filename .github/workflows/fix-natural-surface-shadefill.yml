name: Fix natural stone shade-fill

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/wavy-limbs-medium-gray-stone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wavy-limbs-medium-gray-stone
          fetch-depth: 0

      - name: Apply natural stone shade-fill correction
        shell: bash
        run: python .github/fix-natural-surface-shadefill.py

      - name: Validate corrected natural surfaces
        shell: bash
        run: |
          python -m py_compile .github/fix-natural-surface-shadefill.py
          node --check docs/js/natural-surface-materials.js
          node --check docs/config/natural-surface-materials.js
          git diff --check
          test "$(grep -c "^        tintTreatment: 'ground-shade-fill'" docs/config/natural-surface-materials.js)" -eq 2
          test "$(grep -c "tint: '#808080', tintTreatment: 'ground-shade-fill', mapping" docs/js/natural-surface-materials.js)" -eq 2
          grep -Fq "naturalSurfaceShadeFillTarget" docs/js/natural-surface-materials.js
          grep -Fq "textureForSurface(surface, 'repeat', tint)" docs/js/natural-surface-materials.js
          ! grep -Fq "sourceMaterial.map || textureForSurface" docs/js/natural-surface-materials.js
          grep -Fq "knownCliffTints" docs/js/natural-surface-materials.js
          grep -Fq "texture: 'assets/textures/carved_smooth.png'" docs/config/natural-surface-materials.js
          grep -Fq "texture: 'assets/textures/carved_smooth.png'" docs/js/natural-surface-materials.js

      - name: Commit corrected stone rendering and remove patch machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/fix-natural-surface-shadefill.py .github/workflows/fix-natural-surface-shadefill.yml
          rm -rf .github/__pycache__
          git add docs/config/natural-surface-materials.js docs/js/natural-surface-materials.js
          git commit -m "Shade-fill carved stone to medium gray"
          git push origin HEAD:fix/wavy-limbs-medium-gray-stone
