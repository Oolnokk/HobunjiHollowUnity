name: Finalize animal chathead framing v3

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/finalize-animal-chathead-framing-v3.yml

permissions:
  contents: write

jobs:
  finalize-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
          fetch-depth: 0

      - name: Apply reviewed v2 integration structurally
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/finalize-animal-chathead-framing-v2.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run focused regression tests"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('v2 integration payload start not found')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit('v2 integration payload end not found')
          payload = workflow[start:end]
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines())
          exec(compile(payload, 'animal-chathead-v2-integration.py', 'exec'))

          # Existing test treated JS -0 as different from 0 even though the runtime
          # correctly means "no head nod" in both cases. Test numeric zero instead
          # of the floating-point sign bit so the full suite is stable across Node.
          test_path = Path('scripts/test-animal-vocalizations.js')
          test = test_path.read_text()
          old = "assert.equal(window.AnimalVocalizations.headNodOffsetDeg(delayed), 0, 'nod waits for actual audio start');"
          new = "assert.ok(Math.abs(window.AnimalVocalizations.headNodOffsetDeg(delayed)) < 1e-12, 'nod waits for actual audio start');"
          if test.count(old) != 1:
              raise SystemExit(f'zero-safe nod assertion: expected one match, found {test.count(old)}')
          test_path.write_text(test.replace(old, new, 1))
          PY

      - name: Run focused regression tests
        run: |
          node scripts/test-animal-chathead-framing.js
          node scripts/test-animal-vocalizations.js
          node scripts/test-animal-head-rig-runtime.js

      - name: Clean temporary workflows and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-animal-chathead-framing.yml
          git rm .github/workflows/run-animal-chathead-framing-patch.yml
          git rm .github/workflows/finalize-animal-chathead-framing.yml
          git rm .github/workflows/finalize-animal-chathead-framing-v2.yml
          git rm .github/workflows/finalize-animal-chathead-framing-v3.yml
          git add docs/js/animal-vocalizations.js docs/tools/animation-author/index.html scripts/test-animal-chathead-framing.js scripts/test-animal-vocalizations.js
          git diff --cached --check
          git commit -m "Finish animal ambient chathead framing"
          git push origin HEAD:codex/animal-chathead-framing
