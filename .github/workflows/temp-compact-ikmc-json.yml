name: temp-compact-ikmc-json
on:
  push:
    branches:
      - feature/ikmc-outpost-harkhanash-v2
permissions:
  contents: write
jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore compact serialization for shared map indexes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('docs/config/maps/hobunji_hollow_town.map.json', 'docs/config/maps/index.json'):
              path = Path(name)
              data = json.loads(path.read_text())
              path.write_text(json.dumps(data, separators=(',', ':'), ensure_ascii=False) + '\n')
          PY
      - name: Recheck IKMC regression
        run: node scripts/test-ikmc-outpost.js
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-compact-ikmc-json.yml
      - name: Commit compact diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep IKMC town map diff compact"
          git push origin HEAD:feature/ikmc-outpost-harkhanash-v2
