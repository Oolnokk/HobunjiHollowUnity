name: Refresh Grehlr/Nelk script cache tokens
on:
  push:
    branches:
      - feature/grehlr-mint-shading-20261120
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Update stale module tokens using repository checker
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/check-cache-busts.js --fix FETCH_HEAD
          node scripts/check-cache-busts.js FETCH_HEAD
      - name: Commit generated cache tokens
        run: |
          git add docs scripts
          if git diff --cached --quiet; then
            echo 'All cache tokens already up to date'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh cache-bust tokens for Grehlr/Nelk genetics and dependent loaders'
          git push origin HEAD:feature/grehlr-mint-shading-20261120
