name: Apply persistent mine campfires

on:
  push:
    branches:
      - codex/persistent-mine-campfires-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/persistent-mine-campfires-20260902
          fetch-depth: 0
      - name: Apply source edits
        run: python3 scripts/codex-apply-persistent-mine-campfires.py
      - name: Validate syntax and focused behavior
        run: |
          node --check docs/js/wilderness-campfire.js
          node --check docs/js/town-mine.js
          node --check docs/game.js
          node --check scripts/test-persistent-mine-campfires.js
          node scripts/test-persistent-mine-campfires.js
      - name: Remove temporary patch machinery
        run: |
          rm scripts/codex-apply-persistent-mine-campfires.py
          rm .github/workflows/codex-apply-persistent-mine-campfires.yml
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist campfires and support mine floors"
          git push origin HEAD:codex/persistent-mine-campfires-20260902
