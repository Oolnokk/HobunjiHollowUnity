name: Smoke Random Test Ruin Full Runtime

on:
  push:
    branches:
      - agent/tool-hub-debrisifier-active
    paths:
      - '.github/workflows/smoke-dev-random-ruin-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static integration audit
        run: node scripts/test-dev-random-ruin-integration.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Diagnose generation failure
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage();
            const messages = [];
            page.on('console', msg => messages.push(`[${msg.type()}] ${msg.text()}`));
            page.on('pageerror', error => messages.push(`[pageerror] ${String(error)}`));
            await page.addInitScript(() => localStorage.setItem('hobunjiDevMode', '1'));
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil:'domcontentloaded', timeout:30000 });
            await page.waitForFunction(() => !!window.DevRandomRuin && !!window.DevRandomRuinRuntimeCoverage, null, { timeout:30000 });
            await page.evaluate(() => window.HobunjiTitleScreen?.start?.());
            await page.waitForFunction(() => !window.HobunjiTitleScreen?.isActive?.(), null, { timeout:5000 });
            const result = await page.evaluate(async () => {
              const ok = await window.DevRandomRuin.generate(0x5eed1234);
              return {
                ok,
                area:window.GridTileAccessors?.getCurrentArea?.(),
                badge:document.getElementById('devRandomRuinBadge')?.textContent || null,
                generatorDebug:document.getElementById('devRandomRuinGeneratorFrame')?.contentDocument?.getElementById('debug')?.textContent || null,
              };
            });
            console.log('RESULT', JSON.stringify(result, null, 2));
            console.log('CONSOLE\n' + messages.join('\n'));
            assert.equal(result.ok, true, 'first fixed seed must generate');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
