name: Smoke Random Test Ruin Full Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-dev-random-ruin-full.yml'
      - 'docs/js/dev-random-ruin-*.js'
      - 'docs/js/ruin-*.js'
      - 'docs/js/shaft-*.js'
      - 'docs/js/root-snare-*.js'
      - 'docs/js/puzzle-cave-*.js'
      - 'docs/js/dungeon-fire-*.js'
      - 'docs/js/cell-grid-3d.js'
      - 'docs/js/dev-hachutu-ruin.js'
      - 'docs/js/hachutu-relics.js'
      - 'scripts/test-hachutu-rooted-ruins.js'
      - 'scripts/test-hachutu-root-tear.js'
      - 'scripts/test-hachutu-root-tear-browser.js'
      - 'scripts/test-hachutu-root-ruin-browser.js'
      - 'scripts/test-grapple-dodge-payment.js'
      - 'docs/js/root-snare-player-tear.js'
      - 'docs/js/dynamic-surfaces.js'
      - 'docs/js/ruin-composer*.js'
      - 'docs/config/furniture-authored/ruinPillarBridge.json'
      - 'scripts/test-ruin-construction-browser.js'
      - 'scripts/v50-native-playthrough-browser.js'
      - 'docs/js/ruin-v50-native-*.js'
      - 'docs/js/ruin-layer-*.js'
      - 'docs/tools/debris-ifier/debrisifier-v50-api.js'
      - 'scripts/test-ruin-composer-playable.js'
      - 'scripts/test-dev-random-ruin-*.js'
      - 'scripts/ci-select-tests.js'
      - 'scripts/test-ci-select-tests.js'
  pull_request:
    paths:
      - '.github/workflows/smoke-dev-random-ruin-full.yml'
      - 'docs/js/dev-random-ruin-*.js'
      - 'docs/js/ruin-*.js'
      - 'docs/js/shaft-*.js'
      - 'docs/js/root-snare-*.js'
      - 'docs/js/puzzle-cave-*.js'
      - 'docs/js/dungeon-fire-*.js'
      - 'docs/js/cell-grid-3d.js'
      - 'docs/js/dev-hachutu-ruin.js'
      - 'docs/js/hachutu-relics.js'
      - 'scripts/test-hachutu-rooted-ruins.js'
      - 'scripts/test-hachutu-root-tear.js'
      - 'scripts/test-hachutu-root-tear-browser.js'
      - 'scripts/test-hachutu-root-ruin-browser.js'
      - 'scripts/test-grapple-dodge-payment.js'
      - 'docs/js/root-snare-player-tear.js'
      - 'docs/js/dynamic-surfaces.js'
      - 'docs/js/ruin-composer*.js'
      - 'docs/config/furniture-authored/ruinPillarBridge.json'
      - 'scripts/test-ruin-construction-browser.js'
      - 'scripts/v50-native-playthrough-browser.js'
      - 'docs/js/ruin-v50-native-*.js'
      - 'docs/js/ruin-layer-*.js'
      - 'docs/tools/debris-ifier/debrisifier-v50-api.js'
      - 'scripts/test-ruin-composer-playable.js'
      - 'scripts/test-dev-random-ruin-*.js'
      - 'scripts/ci-select-tests.js'
      - 'scripts/test-ci-select-tests.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # Fast smoke owns static, Hachutu, collision and single-room checks only.
    outputs:
      construction: ${{ steps.select.outputs.construction }}
      seed: ${{ steps.select.outputs.seed }}
      audit: ${{ steps.select.outputs.audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select affected ruin browser checks
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-select-tests.js --suite=ruin
      - name: Static integration audit
        run: |
          node scripts/test-dev-random-ruin-integration.js
          node scripts/test-hachutu-rooted-ruins.js
          node scripts/test-hachutu-root-tear.js
          node scripts/test-grapple-dodge-payment.js
          node scripts/test-ruin-composer.js
          node scripts/test-ruin-composer-playable.js
          node --check docs/js/ruin-composer-playable.js
          node --check scripts/test-ruin-construction-browser.js
          node --check scripts/v50-native-playthrough-browser.js
          node --check docs/js/ruin-v50-native-floors.js
          node --check docs/js/ruin-v50-native-mechanisms.js
          node --check docs/js/root-snare-player-tear.js
          node --check docs/js/dev-hachutu-ruin.js
          node --check docs/js/hachutu-relics.js
          node --check docs/js/dynamic-surfaces.js
          node --check docs/js/dev-random-ruin-tile-occupancy.js
          node --check docs/js/dev-random-ruin-wall-render-proxy.js
          node --check docs/js/dev-random-ruin-collision-precision.js
          node --check scripts/test-dev-random-ruin-collision-browser.js
      - name: Install browser
        if: steps.select.outputs.needs_browser == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Exercise real skinned Hachutu player tearing and cinematic cleanup
        if: steps.select.outputs.root_tear == 'true'
        run: node scripts/test-hachutu-root-tear-browser.js
      - name: Verify Hachutu game generation, authentic root hands and paid escape
        if: steps.select.outputs.hachutu == 'true'
        run: node scripts/test-hachutu-root-ruin-browser.js
      - name: Verify shared occupancy and puzzle visibility
        if: steps.select.outputs.collision == 'true'
        run: node scripts/test-dev-random-ruin-collision-browser.js
      - name: Verify single-room no-loot puzzle lab in real Chromium
        if: steps.select.outputs.lab == 'true'
        run: node scripts/smoke-dev-ruin-single-room-browser.js

  construction:
    needs: smoke
    if: needs.smoke.outputs.construction == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # Native V50 full playthrough can exceed twenty minutes on software WebGL.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Verify playable composed trial and shaft wing in the real game
        run: node scripts/test-ruin-construction-browser.js

  seed:
    needs: smoke
    if: needs.smoke.outputs.seed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # Isolated seed no longer waits behind the slow native construction smoke.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Isolate previously failing seed
        env:
          HOBUNJI_RUIN_FIXED_SEEDS: '0x2468ace0'
          HOBUNJI_RUIN_AUDIT_SEEDS: '0'
        run: node scripts/test-dev-random-ruin-browser.js

  audit:
    needs: smoke
    if: needs.smoke.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75 # The full optional multi-seed audit runs separately instead of canceling mandatory checks.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Exercise sequential rerolls, hallway clearance, optional wall planes, and multi-seed audit
        continue-on-error: true
        run: node scripts/test-dev-random-ruin-browser.js
