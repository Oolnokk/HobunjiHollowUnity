# Temporary verification workflow; remove after hallway-clearance + wall-plane smoke passes.
name: Smoke Random Test Ruin Full Runtime

on:
  push:
    branches:
      - agent/tool-hub-debrisifier-active
    paths:
      - '.github/workflows/smoke-dev-random-ruin-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static integration audit
        run: node scripts/test-dev-random-ruin-integration.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Isolate previously failing seed
        env:
          HOBUNJI_RUIN_FIXED_SEEDS: '0x2468ace0'
          HOBUNJI_RUIN_AUDIT_SEEDS: '0'
        run: node scripts/test-dev-random-ruin-browser.js
      - name: Exercise sequential rerolls, hallway clearance, wall planes, and multi-seed audit
        run: node scripts/test-dev-random-ruin-browser.js
