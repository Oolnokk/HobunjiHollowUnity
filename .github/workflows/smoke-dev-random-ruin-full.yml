name: Smoke Random Test Ruin Full Runtime

on:
  push:
    branches:
      - agent/tool-hub-debrisifier-active
    paths:
      - '.github/workflows/smoke-dev-random-ruin-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static integration audit
        run: node scripts/test-dev-random-ruin-integration.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Diagnose V50 runtime-tag coverage
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage();
            await page.addInitScript(() => localStorage.setItem('hobunjiDevMode', '1'));
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil:'domcontentloaded', timeout:30000 });
            await page.waitForFunction(() => !!window.DevRandomRuin && !!window.DevRandomRuinPrototypeHooks && !!window.DevRandomRuinHitPuzzles && !!window.DevRandomRuinMotionRuntime, null, { timeout:30000 });
            await page.evaluate(() => window.HobunjiTitleScreen?.start?.());
            await page.waitForFunction(() => !window.HobunjiTitleScreen?.isActive?.(), null, { timeout:5000 });
            assert.equal(await page.evaluate(async () => window.DevRandomRuin.generate(0x5eed1234)), true);
            await page.waitForFunction(() => window.DevRandomRuinPrototypeHooks.snapshot().active && window.DevRandomRuinHitPuzzles.snapshot().active && window.DevRandomRuinMotionRuntime.snapshot().active, null, { timeout:30000 });
            const report = await page.evaluate(() => {
              const hooks = window.DevRandomRuinPrototypeHooks.snapshot();
              const hit = window.DevRandomRuinHitPuzzles.snapshot();
              const scene = window.GridTileAccessors.getActiveScene();
              const expanded = hooks.audit.unhandled.map(entry => {
                let match = null;
                scene?.traverse?.(object => {
                  if (match) return;
                  const auditName = object.name || `object-${object.id}`;
                  if (auditName === entry.objectName) match = object;
                });
                const d = match?.userData || {};
                return {
                  entry,
                  objectId:match?.id || null,
                  parentName:match?.parent?.name || (match?.parent ? `object-${match.parent.id}` : null),
                  userDataKeys:Object.keys(d).sort(),
                  flags:{
                    pushable:!!d.pushable,
                    solutionBlock:!!d.solutionBlock,
                    carriesActorsAndPushBlocks:!!d.carriesActorsAndPushBlocks,
                    groundedToMovingPlatform:!!d.groundedToMovingPlatform,
                    ridesMovingDais:!!d.ridesMovingDais,
                    torchFuelStation:!!d.torchFuelStation,
                    alwaysLit:!!d.alwaysLit,
                    fuelSupply:!!d.fuelSupply,
                  },
                };
              });
              return { expanded, hit };
            });
            console.log(JSON.stringify(report, null, 2));
            assert.ok(report.expanded.length > 0, 'diagnostic seed should expose audit gaps');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
