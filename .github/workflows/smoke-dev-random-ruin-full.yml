name: Smoke Random Test Ruin Full Runtime

on:
  push:
    branches:
      - agent/tool-hub-debrisifier-active
    paths:
      - '.github/workflows/smoke-dev-random-ruin-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static integration audit
        run: node scripts/test-dev-random-ruin-integration.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Exercise V50 runtime hooks and multi-seed audit
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            await page.addInitScript(() => localStorage.setItem('hobunjiDevMode', '1'));
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil:'domcontentloaded', timeout:30000 });
            await page.waitForFunction(() => !!window.DevRandomRuin && !!window.DevRandomRuinPrototypeHooks && !!window.DevRandomRuinHitPuzzles && !!window.DevRandomRuinMotionRuntime && !!window.DevRandomRuinRuntimeCoverage, null, { timeout:30000 });
            await page.evaluate(() => window.HobunjiTitleScreen?.start?.());
            await page.waitForFunction(() => !window.HobunjiTitleScreen?.isActive?.(), null, { timeout:5000 });

            const seeds = [0x5eed1234, 0x13579bdf, 0x2468ace0, 0x0badc0de];
            let active = null;
            for (const seed of seeds) {
              assert.equal(await page.evaluate(async seed => window.DevRandomRuin.generate(seed), seed), true, `generate(${seed}) should succeed`);
              await page.waitForFunction(() => window.GridTileAccessors.getCurrentArea() === 'map_i_dev_random_ruin', null, { timeout:30000 });
              await page.waitForFunction(() => window.DevRandomRuinPrototypeHooks.snapshot().active && window.DevRandomRuinHitPuzzles.snapshot().active && window.DevRandomRuinMotionRuntime.snapshot().active && window.DevRandomRuinRuntimeCoverage.snapshot().active, null, { timeout:10000 });
              active = await page.evaluate(() => {
                const scene = window.GridTileAccessors.getActiveScene();
                const base = window.DevRandomRuin.getState();
                const hooks = window.DevRandomRuinPrototypeHooks.snapshot();
                const hit = window.DevRandomRuinHitPuzzles.snapshot();
                const motion = window.DevRandomRuinMotionRuntime.snapshot();
                const coverage = window.DevRandomRuinRuntimeCoverage.snapshot();
                const generator = document.getElementById('devRandomRuinGeneratorFrame')?.contentWindow?.DebrisifierV50;
                const generatorState = generator?.getState?.();
                const levels = Object.values(generatorState?.locale?.meta?.interiorShell?.plateauModel?.levelByCell || {}).map(Number);
                let ladders = 0;
                scene?.traverse?.(object => { if (object.userData?.generatedAccessType === 'stoneLadder') ladders++; });
                return {
                  area:window.GridTileAccessors.getCurrentArea(),
                  building:window.GridTileAccessors.isBuildingArea(),
                  sceneName:scene?.name || null,
                  hasRoot:!!scene?.children?.find?.(object => /^dev_v50_ruin_/.test(object?.name || '')),
                  base, hooks, hit, motion, coverage, ladders,
                  negativeLevels:levels.filter(level => level < 0).length,
                };
              });
              assert.equal(active.area, 'map_i_dev_random_ruin', JSON.stringify(active));
              assert.equal(active.building, true, JSON.stringify(active));
              assert.equal(active.sceneName, 'map_i_dev_random_ruin', JSON.stringify(active));
              assert.equal(active.hasRoot, true, JSON.stringify(active));
              assert.equal(active.hit.active, true, JSON.stringify(active.hit));
              assert.equal(active.motion.active, true, JSON.stringify(active.motion));
              assert.equal(active.coverage.effectiveUnhandled.length, 0, JSON.stringify(active.coverage));
              assert.ok(active.coverage.torchSourceCoverage.complete, JSON.stringify(active.coverage.torchSourceCoverage));
              if (active.negativeLevels > 0) assert.ok(active.ladders > 0, `negative floor tiers require ladder access: ${JSON.stringify(active)}`);
            }

            const audit = await page.evaluate(async () => window.DevRandomRuinRuntimeCoverage.auditSeeds(8));
            assert.equal(audit.count, 8, JSON.stringify(audit));
            assert.equal(audit.aggregate.unknown.length, 0, JSON.stringify(audit.aggregate.unknown));
            assert.ok(audit.aggregate.motions.length > 0, JSON.stringify(audit.aggregate));
            assert.ok(audit.aggregate.activators.length > 0, JSON.stringify(audit.aggregate));
            assert.ok(audit.aggregate.access.includes('stoneLadder'), JSON.stringify(audit.aggregate));

            if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
            console.log(JSON.stringify({ active, aggregate:audit.aggregate }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
