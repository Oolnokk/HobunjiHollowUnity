name: Smoke Random Test Ruin Full Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-dev-random-ruin-full.yml'
      - 'docs/js/dev-random-ruin-*.js'
      - 'docs/js/dev-hachutu-ruin.js'
      - 'docs/js/hachutu-relics.js'
      - 'scripts/test-hachutu-rooted-ruins.js'
      - 'scripts/test-hachutu-root-tear.js'
      - 'scripts/test-grapple-dodge-payment.js'
      - 'docs/js/root-snare-player-tear.js'
      - 'docs/js/dynamic-surfaces.js'
      - 'scripts/test-dev-random-ruin-*.js'
  pull_request:
    paths:
      - '.github/workflows/smoke-dev-random-ruin-full.yml'
      - 'docs/js/dev-random-ruin-*.js'
      - 'docs/js/dev-hachutu-ruin.js'
      - 'docs/js/hachutu-relics.js'
      - 'scripts/test-hachutu-rooted-ruins.js'
      - 'scripts/test-hachutu-root-tear.js'
      - 'scripts/test-grapple-dodge-payment.js'
      - 'docs/js/root-snare-player-tear.js'
      - 'docs/js/dynamic-surfaces.js'
      - 'scripts/test-dev-random-ruin-*.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # Established-player WebGL fixtures run both an isolated seed and the complete multi-seed audit.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static integration audit
        run: |
          node scripts/test-dev-random-ruin-integration.js
          node scripts/test-hachutu-rooted-ruins.js
          node scripts/test-hachutu-root-tear.js
          node scripts/test-grapple-dodge-payment.js
          node --check docs/js/root-snare-player-tear.js
          node --check docs/js/dev-hachutu-ruin.js
          node --check docs/js/hachutu-relics.js
          node --check docs/js/dynamic-surfaces.js
          node --check docs/js/dev-random-ruin-tile-occupancy.js
          node --check docs/js/dev-random-ruin-wall-render-proxy.js
          node --check docs/js/dev-random-ruin-collision-precision.js
          node --check scripts/test-dev-random-ruin-collision-browser.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Verify shared occupancy and puzzle visibility
        run: node scripts/test-dev-random-ruin-collision-browser.js
      - name: Isolate previously failing seed
        env:
          HOBUNJI_RUIN_FIXED_SEEDS: '0x2468ace0'
          HOBUNJI_RUIN_AUDIT_SEEDS: '0'
        run: node scripts/test-dev-random-ruin-browser.js
      - name: Exercise sequential rerolls, hallway clearance, optional wall planes, and multi-seed audit
        continue-on-error: true
        run: node scripts/test-dev-random-ruin-browser.js
