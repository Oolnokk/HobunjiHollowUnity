name: Temporary controller PR main sync

on:
  push:
    branches:
      - codex/controller-listen-json-configurable-inputs

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/controller-listen-json-configurable-inputs
          fetch-depth: 0
      - name: Resolve current main into controller PR
        run: bash .github/controller-pr-sync-main.sh
