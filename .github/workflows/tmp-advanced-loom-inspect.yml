name: Temporary advanced loom patch

on:
  push:
    branches:
      - codex/npc-crafting-commissions-v2
    paths:
      - scripts/tmp-advanced-loom-patch.py
      - .github/workflows/tmp-advanced-loom-inspect.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Advanced Loom integration
        run: python3 scripts/tmp-advanced-loom-patch.py
      - name: Validate patched files
        run: |
          node --check docs/js/advanced-loom-system.js
          node --check docs/js/clothing-weaving-system.js
          node --check docs/js/crafting-panel.js
          node --check docs/js/carpenter-shop.js
          node --check docs/game.js
          python3 -m json.tool docs/config/furniture-authored/loom.json >/dev/null
          python3 -m json.tool docs/config/furniture-authored/advancedLoom.json >/dev/null
          python3 -m json.tool docs/config/furniture-authored/index.json >/dev/null
      - name: Refresh cache-bust tokens
        run: node scripts/check-cache-busts.js --fix origin/main
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git commit -m "Add Simple and Advanced Loom progression"
          git push origin HEAD:codex/npc-crafting-commissions-v2
