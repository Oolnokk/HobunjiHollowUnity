name: Temporary loom/cooking finalizer

on:
  push:
    branches:
      - codex/npc-crafting-commissions-v2
    paths:
      - scripts/tmp-loom-cooking-finalize.py
      - scripts/tmp-loom-finalizer-extra.py
      - scripts/tmp-update-loom-regression.py
      - .github/workflows/tmp-advanced-loom-inspect.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure branch committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bring branch up to current main
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - name: Finalize Advanced Loom and Cooking Yield
        run: |
          python3 scripts/tmp-loom-cooking-finalize.py
          python3 scripts/tmp-loom-finalizer-extra.py
          python3 scripts/tmp-update-loom-regression.py
      - name: Validate changed runtime files
        run: |
          node --check docs/js/advanced-loom-system.js
          node --check docs/js/clothing-weaving-system.js
          node --check docs/js/perk-system.js
          node --check docs/js/cooking-system.js
          node --check docs/js/crafting-panel.js
          node --check docs/js/npc-crafting-commission-generator.js
          node --check docs/game.js
          python3 -m json.tool docs/config/furniture-authored/loom.json >/dev/null
          python3 -m json.tool docs/config/furniture-authored/advancedLoom.json >/dev/null
          python3 -m json.tool docs/config/furniture-authored/index.json >/dev/null
          node scripts/test-advanced-loom-cooking-yield.js
          node scripts/test-clothing-weaving-system.js
          node scripts/test-npc-crafting-commissions.js
      - name: Refresh cache-bust tokens
        run: node scripts/check-cache-busts.js --fix origin/main
      - name: Commit finished feature
        run: |
          git add -A
          git commit -m "Add Advanced Loom and Cooking Yield perk"
          git push origin HEAD:codex/npc-crafting-commissions-v2
