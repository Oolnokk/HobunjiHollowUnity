name: Temporary complete opening cache-bust fix

on:
  push:
    branches:
      - codex/fix-opening-rescue-mobile-startup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh every opening story loader
        run: |
          git fetch --no-tags origin main
          sed -i 's/opening-story-cutscene\.js?v=20261005openingtext1/opening-story-cutscene.js?v=20261003repo-selector3/' docs/js/cutscene-director-repo-scenes.js
          node scripts/check-cache-busts.js --fix origin/main
      - name: Commit generated cache tokens
        run: |
          if git diff --quiet; then
            echo "No cache-bust updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git commit -m "Refresh all opening story cache tokens"
          git push origin HEAD:codex/fix-opening-rescue-mobile-startup
