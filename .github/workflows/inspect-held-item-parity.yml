name: Apply held item parity patch
on:
  push:
    branches:
      - chatgpt/dew-rock-item-icons-two-hand
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply dew rocks and held item parity') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dew-rock-item-icons-two-hand
      - name: Patch current game seams
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # 1) Dew: remove the recolored cheese billboard pipeline entirely and
          # replace it with a small low-poly translucent blue rock cluster.
          dew_path = Path('docs/js/dew-vats.js')
          dew = dew_path.read_text()
          start = dew.index('  // Tinted-and-faded cheese.png')
          end = dew.index('  function removeMesh', start)
          rock_block = r'''  const DEW_ROCK_BLUE = 0x3F8FE0; // Used by every dropped dew pile so the collectible reads as blue crystalline dew-rock rather than an item billboard.
  const DEW_ROCK_OPACITY = 0.48; // Used by the faceted rock material to keep the former dew translucency without a sprite texture.
  const DEW_ROCK_PARTS = Object.freeze([ // Used to form one readable low-poly pile while keeping geometry tiny and deterministic per tile.
    Object.freeze({ x: -0.18, z: 0.04, r: 0.25, sx: 1.00, sy: 0.72, sz: 0.88, yaw: 0.22 }),
    Object.freeze({ x:  0.16, z: 0.08, r: 0.22, sx: 0.88, sy: 0.92, sz: 1.00, yaw: 1.03 }),
    Object.freeze({ x:  0.02, z: -0.16, r: 0.18, sx: 1.08, sy: 0.68, sz: 0.82, yaw: 2.11 }),
  ]);

  function spawnMesh(col, row, colorKey) {
    const grid = deps.getGrid();
    const key = col + ',' + row;
    removeMesh(col, row);
    const group = new THREE.Group();
    group.position.set(col + 0.5, deps.tileSurfaceY(grid[row][col].type), row + 0.5);
    deps.getScene().add(group);
    dewPileMeshes.set(key, group);

    for (const part of DEW_ROCK_PARTS) {
      const geometry = new THREE.DodecahedronGeometry(part.r, 0); // Low-poly faceting is the visual rock silhouette and replaces PlaneGeometry outright.
      const material = new THREE.MeshLambertMaterial({
        color: DEW_ROCK_BLUE,
        transparent: true,
        opacity: DEW_ROCK_OPACITY,
        depthWrite: false,
        flatShading: true,
      });
      const rock = new THREE.Mesh(geometry, material);
      rock.position.set(part.x, part.r * part.sy * 0.72, part.z);
      rock.scale.set(part.sx, part.sy, part.sz);
      rock.rotation.set(0.14 * (part.x < 0 ? -1 : 1), part.yaw, 0.11 * (part.z < 0 ? -1 : 1));
      rock.castShadow = false;
      rock.receiveShadow = false;
      group.add(rock);
    }
  }

  // Kept as an API-compatible no-op because game.js already calls this farm-only
  // hook each frame. Three-dimensional rocks have no camera-facing state to update.
  function updateMeshRotations() {}

'''
          dew = dew[:start] + rock_block + dew[end:]
          dew = dew.replace('  // billboard per tile in parallel, the same "tile data now, mesh\n', '  // rock group per tile in parallel, the same "tile data now, mesh\n')
          dew_path.write_text(dew)

          # 2) Expose only the narrow held-item grip seam needed by the hand driver.
          game_path = Path('docs/game.js')
          game = game_path.read_text()
          held_decl = '      let _heldItemPlane = null, _heldItemKey = null;\n'
          held_bridge = held_decl + r'''      // Narrow presentation bridge for procedural hands. Ordinary chest-held item sprites
      // use their rendered plane edges as grip sockets; drink/throw poses and the
      // Kurraya keep their existing specialized handling.
      window.HobunjiHeldItemGripBridge = {
        holder: heldItemHolder,
        isActive() {
          const item = getActiveInventoryItem();
          return heldMode === 'item'
            && heldItemHolder.visible
            && !!_heldItemPlane
            && item?.key === _heldItemKey
            && item.key !== 'kurraya'
            && !usesThrustHeldPose(item);
        },
        getItemKey: () => _heldItemKey,
        getPlane: () => _heldItemPlane,
      };
'''
          game = replace_once(game, held_decl, held_bridge, 'held-item grip bridge')

          # Inventory and item-wheel icons already share applyItemSpriteIcon. Extend
          # its source resolver to the one current held-sprite exception (Kurraya),
          # while all recolored/composited sprite modes keep using SpriteRecolor.
          apply_marker = '      function applyItemSpriteIcon(el, def, key) {\n'
          icon_helper = r'''      function heldItemIconVisual(def, key) {
        if (!def) return null;
        if (key === 'kurraya') {
          return { spritePath: 'assets/toolsprites/kurraya_front.png', targetColor: 0xFFFFFF, spriteMode: 'raw', raw: true };
        }
        if (!def.spriteIcon) return null;
        return {
          spritePath: 'assets/objectsprites/' + def.spriteIcon,
          targetColor: def.spriteColor ?? 0xFFFFFF,
          spriteMode: def.spriteMode || 'direct', // fish:* modes return the fully composited base + pattern overlays from FishCatalog.
          raw: false,
        };
      }

'''
          game = replace_once(game, apply_marker, icon_helper + apply_marker, 'held item icon resolver')
          old_icon_setup = r'''        if (!def.spriteIcon) { clearItemSpriteIcon(el, true); return; }
        // The source PNG replaces the emoji immediately; the recolored canvas
        // upgrades it below without leaving alcohol as an emoji while loading.
        const spritePath = 'assets/objectsprites/' + def.spriteIcon;
        const targetColor = def.spriteColor ?? 0xFFFFFF;
        const spriteMode = def.spriteMode || 'direct';
        const requestKey = `${def.spriteIcon}|${targetColor}|${spriteMode}`;'''
          new_icon_setup = r'''        const heldVisual = heldItemIconVisual(def, key);
        if (!heldVisual) { clearItemSpriteIcon(el, true); return; }
        // The same source/composited PNG used for the held item replaces the emoji
        // immediately; recolorable modes upgrade it to their final canvas below.
        const { spritePath, targetColor, spriteMode } = heldVisual;
        const requestKey = `${spritePath}|${targetColor}|${spriteMode}`;'''
          game = replace_once(game, old_icon_setup, new_icon_setup, 'item icon visual setup')
          old_recolor_guard = "        if (!window.SpriteRecolor) { el.dataset.itemSpriteState = 'fallback'; return; }\n        window.SpriteRecolor.getRecoloredCanvas(spritePath, targetColor, spriteMode)"
          new_recolor_guard = "        if (heldVisual.raw) { el.dataset.itemSpriteState = 'ready'; return; }\n        if (!window.SpriteRecolor) { el.dataset.itemSpriteState = 'fallback'; return; }\n        window.SpriteRecolor.getRecoloredCanvas(spritePath, targetColor, spriteMode)"
          game = replace_once(game, old_recolor_guard, new_recolor_guard, 'raw held icon guard')
          game_path.write_text(game)

          # 3) Hand frame driver: follow the chest-held item holder when active,
          # and resolve left/right edge sockets from the actual visible plane bounds.
          driver_path = Path('docs/js/procedural-hand-frame-driver.js')
          driver = driver_path.read_text()
          old_key = r'''  function currentToolKey() {
    if (inAttackEditor()) {
      return toolGrips.toolKeyFor(document.getElementById('toolSpriteSelect')?.value || '');
    }
    const snapshot = global.WeaponToolStances?.debugSnapshot?.() || null;
    return toolGrips.toolKeyFor(snapshot?.itemKey || snapshot?.shape || '');
  }

  function currentToolHolder(record) {
    if (inAttackEditor()) return findEditorToolHolder(record);
    if (gameDeps?.playerMesh && record.rig?.parent === gameDeps.playerMesh) return gameDeps.toolHolder || null;
    return null;
  }'''
          new_key = r'''  function currentToolKey() {
    if (inAttackEditor()) {
      return toolGrips.toolKeyFor(document.getElementById('toolSpriteSelect')?.value || '');
    }
    if (global.HobunjiHeldItemGripBridge?.isActive?.()) return 'held-item';
    const snapshot = global.WeaponToolStances?.debugSnapshot?.() || null;
    return toolGrips.toolKeyFor(snapshot?.itemKey || snapshot?.shape || '');
  }

  function currentToolHolder(record) {
    if (inAttackEditor()) return findEditorToolHolder(record);
    const heldBridge = global.HobunjiHeldItemGripBridge;
    if (heldBridge?.isActive?.() && heldBridge.holder?.parent) return heldBridge.holder;
    if (gameDeps?.playerMesh && record.rig?.parent === gameDeps.playerMesh) return gameDeps.toolHolder || null;
    return null;
  }'''
          driver = replace_once(driver, old_key, new_key, 'held item holder selection')

          helper_marker = '  function toolSocketWorld(record, toolHolder, secondaryGrip = null) {\n'
          edge_helper = r'''  function visibleGripPlane(toolHolder) {
    const heldBridge = global.HobunjiHeldItemGripBridge;
    if (!inAttackEditor() && heldBridge?.isActive?.() && heldBridge.holder === toolHolder) return heldBridge.getPlane?.() || null;
    return findToolVisualPlane(toolHolder);
  }

  function resolveEdgeGrip(record, toolHolder, rawGrip) {
    if (!rawGrip?.edge) return rawGrip;
    let plane = visibleGripPlane(toolHolder); // Used to derive the socket from the exact visible PNG plane instead of a guessed item width.
    if (plane && !plane.isMesh) {
      let mesh = null;
      plane.traverse?.(node => { if (!mesh && node?.isMesh && node.geometry) mesh = node; });
      plane = mesh;
    }
    const geometry = plane?.geometry;
    if (!plane?.isMesh || !geometry) return rawGrip;
    geometry.computeBoundingBox?.();
    const box = geometry.boundingBox;
    if (!box) return rawGrip;
    const point = new record.THREE.Vector3(
      rawGrip.edge === 'left' ? box.min.x : box.max.x,
      (box.min.y + box.max.y) * 0.5,
      (box.min.z + box.max.z) * 0.5,
    );
    // Convert plane-local geometry edge into toolHolder local space using only
    // local matrices. This avoids recomputing the weapon holder's baked runtime
    // matrixWorld while still honoring plane scale/rotation and wrapper groups.
    let cursor = plane;
    while (cursor && cursor !== toolHolder) {
      cursor.updateMatrix?.();
      point.applyMatrix4(cursor.matrix);
      cursor = cursor.parent;
    }
    if (cursor !== toolHolder) return rawGrip;
    const p = rawGrip.position || {};
    return {
      ...rawGrip,
      position: {
        x: point.x + (Number(p.x) || 0),
        y: point.y + (Number(p.y) || 0),
        z: point.z + (Number(p.z) || 0),
      },
    };
  }

  function heldItemEdgeGrip(edge) {
    return { enabled: true, edge, position: { x: 0, y: 0, z: 0 }, rotationDeg: { pitch: 0, yaw: 0, roll: 0 } };
  }

'''
          driver = replace_once(driver, helper_marker, edge_helper + helper_marker, 'edge grip helpers')
          driver = replace_once(
              driver,
              "    const bakedWorldMatrix = !inAttackEditor() ? global.WeaponToolStances?.lastHolderMatrixWorld?.() : null;",
              "    const bakedWorldMatrix = !inAttackEditor() && toolHolder === gameDeps?.toolHolder ? global.WeaponToolStances?.lastHolderMatrixWorld?.() : null;",
              'held holder baked matrix guard')
          old_sync = r'''      const toolKey = currentToolKey();
      const primary = handWorldFromSocket(record, toolSocketWorld(record, toolHolder));
      record.rig.placeHandWorld?.('right', primary.position, primary.quaternion);
      ensureFallbackState(record).owners.right = 'primary-grip';

      const secondaryGrip = toolGrips.secondaryGripForTool(toolKey);
      if (secondaryGrip) {
        const secondary = handWorldFromSocket(record, toolSocketWorld(record, toolHolder, secondaryGrip));'''
          new_sync = r'''      const toolKey = currentToolKey();
      const chestHeldItem = toolKey === 'held-item';
      const primaryGrip = resolveEdgeGrip(record, toolHolder,
        chestHeldItem ? heldItemEdgeGrip('right') : toolGrips.primaryGripForTool?.(toolKey));
      const primary = handWorldFromSocket(record, toolSocketWorld(record, toolHolder, primaryGrip));
      record.rig.placeHandWorld?.('right', primary.position, primary.quaternion);
      ensureFallbackState(record).owners.right = 'primary-grip';

      const secondaryGrip = resolveEdgeGrip(record, toolHolder,
        chestHeldItem ? heldItemEdgeGrip('left') : toolGrips.secondaryGripForTool(toolKey));
      if (secondaryGrip) {
        const secondary = handWorldFromSocket(record, toolSocketWorld(record, toolHolder, secondaryGrip));'''
          driver = replace_once(driver, old_sync, new_sync, 'primary and secondary edge sync')
          driver = replace_once(
              driver,
              "        secondaryActive: record.secondaryActive,\n        secondaryGrip: secondaryGrip ? JSON.parse(JSON.stringify(secondaryGrip)) : null,",
              "        secondaryActive: record.secondaryActive,\n        primaryGrip: primaryGrip ? JSON.parse(JSON.stringify(primaryGrip)) : null,\n        secondaryGrip: secondaryGrip ? JSON.parse(JSON.stringify(secondaryGrip)) : null,",
              'primary grip debug')
          driver_path.write_text(driver)

          # Regression checks are source-level on purpose: these integration seams
          # live in the giant browser game closure, while the helper modules remain
          # independently syntax-checkable in Node.
          test_path = Path('scripts/test-dew-item-icon-two-hand.js')
          test_path.write_text(r'''#!/usr/bin/env node
'use strict';
const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');
const root = path.resolve(__dirname, '..');
const read = p => fs.readFileSync(path.join(root, p), 'utf8');
const dew = read('docs/js/dew-vats.js');
const game = read('docs/game.js');
const grips = read('docs/js/hand-tool-grips.js');
const driver = read('docs/js/procedural-hand-frame-driver.js');
const editor = read('docs/js/attack-editor-hand-direct-attachments.js');
const fish = read('docs/js/fish-catalog.js');

assert.doesNotMatch(dew, /cheese\.png|PlaneGeometry|cameraRelativePerps|perpClamp/, 'dew piles no longer use billboards or camera-facing work');
assert.match(dew, /DodecahedronGeometry[\s\S]*?MeshLambertMaterial[\s\S]*?transparent:\s*true[\s\S]*?opacity:\s*DEW_ROCK_OPACITY/, 'dew piles are translucent low-poly rocks');
assert.match(game, /function heldItemIconVisual[\s\S]*?kurraya_front\.png[\s\S]*?spriteMode:\s*def\.spriteMode/, 'held-sprite icon resolver covers Kurraya and normal item sprite modes');
assert.match(game, /applyItemSpriteIcon\(iconEl, ITEM_DEFS\[s\.key\], s\.key\)/, 'item wheel still uses the shared held-sprite icon resolver');
assert.match(game, /function buildInventoryGrid[\s\S]*?applyItemSpriteIcon/, 'inventory grid still uses the shared held-sprite icon resolver');
assert.match(fish, /fish_patterns\/base\.png[\s\S]*?fish_patterns\/stripes\.png/, 'fish sprite mode keeps both authored overlay layers in the resolved canvas');
assert.match(game, /HobunjiHeldItemGripBridge[\s\S]*?!usesThrustHeldPose\(item\)/, 'only ordinary chest-held items opt into two-hand edge gripping');
assert.match(grips, /primaryGripForTool[\s\S]*?secondaryGripForTool/, 'grip schema supports independently authored right and left sockets');
assert.match(driver, /resolveEdgeGrip[\s\S]*?box\.min\.x[\s\S]*?box\.max\.x/, 'driver derives far-left/right sockets from visible geometry bounds');
assert.match(driver, /chestHeldItem \? heldItemEdgeGrip\('right'\)[\s\S]*?chestHeldItem \? heldItemEdgeGrip\('left'\)/, 'ordinary held items use both opposite sprite edges');
assert.match(editor, /handGripSpriteEdges[\s\S]*?edge:\s*'right'[\s\S]*?edge:\s*'left'/, 'Attack Editor exposes a two-hand sprite-edge preset');
console.log('Dew rock, held-item icon parity, and two-hand edge-grip checks passed.');
''')
          PY
          node --check docs/game.js
          node --check docs/js/dew-vats.js
          node --check docs/js/hand-tool-grips.js
          node --check docs/js/procedural-hand-frame-driver.js
          node --check docs/js/attack-editor-hand-direct-attachments.js
          node scripts/test-dew-item-icon-two-hand.js
          node scripts/test-alcohol-bottle-held-pose.js
          git diff --check
          rm -f debug-held-item-seams.txt .github/workflows/inspect-held-item-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply dew rocks and held item parity"
          git push origin HEAD:chatgpt/dew-rock-item-icons-two-hand