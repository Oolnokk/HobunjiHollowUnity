name: Apply Locale Sandbox Polish

on:
  push:
    branches:
      - chatgpt/locale-terrain-anchors
    paths:
      - '.github/workflows/apply-locale-sandbox-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/locale-terrain-anchors
      - name: Apply and validate sandbox polish
        run: |
          python scripts/tmp-apply-locale-sandbox-polish.py
          node --check docs/tools/locale-editor/locale-preview3d.js
          node -e "const fs=require('fs');const s=fs.readFileSync('docs/tools/locale-editor/locale-preview3d.js','utf8');for(const n of ['getShadeFillCanvas','findFailureCandidate','grehlr_idle.png','station_smoking_hut.glb','buildPlateauMesaGeometry','generateZoneWorkspace','evaluateCandidateForTest'])if(!s.includes(n))throw new Error('missing '+n);if(s.includes('scanFailureCandidates'))throw new Error('old failure array scan remains');"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tools/locale-editor/locale-preview3d.js
          git commit -m 'Polish Locale Editor in-game sandbox preview'
          git push origin HEAD:chatgpt/locale-terrain-anchors
