name: Audit IKMC outpost fix

on:
  push:
    branches:
      - feature/ikmc-outpost-harkhanash-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ikmc-outpost-harkhanash-v2
          fetch-depth: 0
      - name: Repair audited placement and runtime door anchoring
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/ikmc_audit_fix.py
          python /tmp/ikmc_audit_fix.py
      - name: Run targeted audited regressions
        run: |
          node scripts/test-ikmc-outpost.js
          node scripts/test-stacked-log-walls.js
          node --check docs/js/building-door.js
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-ikmc-outpost-fix.yml
          git add docs/config/pieces/ikmc-outpost.json docs/js/building-door.js docs/index.html scripts/test-ikmc-outpost.js
          git commit -m "Fix audited IKMC outpost placement and door anchoring"
          git push origin HEAD:feature/ikmc-outpost-harkhanash-v2
