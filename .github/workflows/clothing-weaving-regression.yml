name: Clothing Weaving Regression

on:
  push:
    paths:
      - 'docs/js/clothing-weaving-system.js'
      - 'docs/js/pattern-authoring.js'
      - 'docs/js/pattern-library.js'
      - 'docs/js/motif-store.js'
      - 'docs/js/tool-metal-recolor.js'
      - 'docs/js/equipment-panel.js'
      - 'docs/js/clothing-weight-dodge-policy.js'
      - 'docs/js/clothing-weaving-npc-compat.js'
      - 'docs/js/inventory-character-effects.js'
      - 'docs/js/inventory-gear-compact-effects.js'
      - 'docs/js/hud-x-control-polish.js'
      - 'docs/js/combat/combat-enemy-dodge.js'
      - 'docs/js/combat/combat-core.js'
      - 'docs/js/combat/combat-combo.js'
      - 'docs/js/combat/combat-quickattacks.js'
      - 'docs/js/combat/combat-charged-breaker.js'
      - 'docs/js/combat/combat-counter-shield.js'
      - 'docs/js/combat/combat-flurry.js'
      - 'docs/js/bandit-combat-log.js'
      - 'docs/game.js'
      - 'docs/config/combat/attack-values.json'
      - 'docs/index.html'
      - 'docs/js/combat/combat-config-loader.js'
      - 'scripts/test-clothing-weaving-system.js'
      - 'scripts/test-clothing-weight-dodge-policy.js'
      - 'scripts/test-clothing-weaving-npc-compat.js'
      - 'scripts/test-enemy-dodge-outfit-weight.js'
      - 'scripts/test-inventory-character-effects.js'
      - '.github/workflows/clothing-weaving-regression.yml'
  pull_request:
    paths:
      - 'docs/js/clothing-weaving-system.js'
      - 'docs/js/pattern-authoring.js'
      - 'docs/js/pattern-library.js'
      - 'docs/js/motif-store.js'
      - 'docs/js/tool-metal-recolor.js'
      - 'docs/js/equipment-panel.js'
      - 'docs/js/clothing-weight-dodge-policy.js'
      - 'docs/js/clothing-weaving-npc-compat.js'
      - 'docs/js/inventory-character-effects.js'
      - 'docs/js/inventory-gear-compact-effects.js'
      - 'docs/js/hud-x-control-polish.js'
      - 'docs/js/combat/combat-enemy-dodge.js'
      - 'docs/js/combat/combat-core.js'
      - 'docs/js/combat/combat-combo.js'
      - 'docs/js/combat/combat-quickattacks.js'
      - 'docs/js/combat/combat-charged-breaker.js'
      - 'docs/js/combat/combat-counter-shield.js'
      - 'docs/js/combat/combat-flurry.js'
      - 'docs/js/bandit-combat-log.js'
      - 'docs/game.js'
      - 'docs/config/combat/attack-values.json'
      - 'docs/index.html'
      - 'docs/js/combat/combat-config-loader.js'
      - 'scripts/test-clothing-weaving-system.js'
      - 'scripts/test-clothing-weight-dodge-policy.js'
      - 'scripts/test-clothing-weaving-npc-compat.js'
      - 'scripts/test-enemy-dodge-outfit-weight.js'
      - 'scripts/test-inventory-character-effects.js'
      - '.github/workflows/clothing-weaving-regression.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check docs/js/clothing-weaving-system.js
          node --check docs/js/pattern-authoring.js
          node --check docs/js/pattern-library.js
          node --check docs/js/motif-store.js
          node --check docs/js/tool-metal-recolor.js
          node --check docs/js/equipment-panel.js
          node --check docs/js/clothing-weight-dodge-policy.js
          node --check docs/js/clothing-weaving-npc-compat.js
          node --check docs/js/inventory-character-effects.js
          node --check docs/js/inventory-gear-compact-effects.js
          node --check docs/js/hud-x-control-polish.js
          node --check docs/js/combat/combat-config-loader.js
          node --check docs/js/combat/combat-core.js
          node --check docs/js/combat/combat-enemy-dodge.js
          node --check docs/js/combat/combat-combo.js
          node --check docs/js/combat/combat-quickattacks.js
          node --check docs/js/combat/combat-charged-breaker.js
          node --check docs/js/combat/combat-counter-shield.js
          node --check docs/js/combat/combat-flurry.js
          node --check docs/js/bandit-combat-log.js
          node -e "JSON.parse(require('fs').readFileSync('docs/config/combat/attack-values.json', 'utf8'))"
      - name: Clothing weaving regression
        run: node scripts/test-clothing-weaving-system.js
      - name: Clothing dodge policy regression
        run: node scripts/test-clothing-weight-dodge-policy.js
      - name: NPC wardrobe compatibility regression
        run: node scripts/test-clothing-weaving-npc-compat.js
      - name: Enemy dodge and shared outfit weight regression
        run: node scripts/test-enemy-dodge-outfit-weight.js
      - name: Inventory character effects regression
        run: node scripts/test-inventory-character-effects.js