name: Temp NPC Collision Audit

on:
  push:
    branches: [fix/npc-collision-aware-pathing]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npc-collision-aware-pathing
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused NPC collision regression
        run: node scripts/test-npc-collision-aware-pathing.js
      - uses: actions/upload-artifact@v4
        with:
          name: npc-collision-audit-sources
          path: |
            docs/game.js
            docs/js/npc-pathfinding.js
            docs/js/npc-route-graph.js
            scripts/test-npc-collision-aware-pathing.js
            scripts/test-farm-tour-playback.js
          retention-days: 1
