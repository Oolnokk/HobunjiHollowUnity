name: Temp NPC Collision Audit Apply

on:
  push:
    branches: [fix/npc-collision-aware-pathing]

permissions:
  contents: write

jobs:
  apply-audit-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npc-collision-aware-pathing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed collision fixes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/npc-collision-audit.patch
          git apply --check /tmp/npc-collision-audit.patch
          git apply /tmp/npc-collision-audit.patch
          node --check docs/js/npc-pathfinding.js
          node --check docs/game.js
          node --check scripts/test-npc-collision-aware-pathing.js
          node scripts/test-npc-collision-aware-pathing.js
      - name: Refresh cache-bust chain and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git fetch origin main
          node scripts/check-cache-busts.js --fix origin/main
          git rm .github/workflows/temp-npc-collision-audit.yml
          git add docs scripts
          git commit -m "Harden NPC collision-aware pathing after audit"
          git push origin HEAD:fix/npc-collision-aware-pathing
