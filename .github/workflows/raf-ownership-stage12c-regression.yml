name: RAF ownership Stage 12c regression (arch button labels input watcher)

on:
  pull_request:
    paths:
      - 'docs/js/arch-button-labels.js'
      - 'scripts/test-arch-button-labels-input-watcher-timer.js'
      - '.github/workflows/raf-ownership-stage12c-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/arch-button-labels.js'
      - 'scripts/test-arch-button-labels-input-watcher-timer.js'
      - '.github/workflows/raf-ownership-stage12c-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/arch-button-labels.js
      - name: Arch button labels input watcher timer conversion
        run: node scripts/test-arch-button-labels-input-watcher-timer.js
