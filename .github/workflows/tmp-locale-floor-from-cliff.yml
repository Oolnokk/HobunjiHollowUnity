name: Locale floor from cliff patch

on:
  push:
    branches:
      - chatgpt/locale-terrain-anchors
    paths:
      - '.github/workflows/tmp-locale-floor-from-cliff.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/locale-terrain-anchors
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: |
          python scripts/tmp-apply-cliff-derived-floor.py
          python scripts/tmp-fix-cliff-floor-test.py
      - name: Syntax checks
        run: |
          node --check docs/js/locale-terrain-placement.js
          node --check docs/tools/locale-editor/locale-preview3d.js
          node --check scripts/test-banubu-wilderness-lab-generation.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html = Path('docs/tools/locale-editor/index.html').read_text()
          match = re.search(r'<script>\s*\(\(\) => \{[\s\S]*?</script>', html)
          if not match:
              raise SystemExit('inline Locale Editor script missing')
          script = match.group(0).removeprefix('<script>').removesuffix('</script>')
          Path('/tmp/locale-editor-inline.js').write_text(script)
          subprocess.run(['node', '--check', '/tmp/locale-editor-inline.js'], check=True)
          for needle in ('locFloorMode', 'nextLowerCliffTier', 'Preserve authored renderer/scale/facing metadata'):
              if needle not in html:
                  raise SystemExit(f'missing {needle}')
          PY
      - name: Run locale regressions
        run: |
          node scripts/test-locale-terrain-placement.js
          node scripts/test-banubu-cave-locale.js
          node scripts/test-banubu-wilderness-lab-generation.js
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/js/locale-terrain-placement.js docs/config/locales/locale_banubu_shrine.json docs/tools/locale-editor/index.html scripts/test-banubu-cave-locale.js scripts/test-banubu-wilderness-lab-generation.js
          git commit -m 'Derive locale floor from adjacent cliff tier'
          git push origin HEAD:chatgpt/locale-terrain-anchors

# Rerun after fixing the regression assertion quoting.
