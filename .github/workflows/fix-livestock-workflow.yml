name: Fix livestock implementation workflow guard

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/fix-livestock-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
      - name: Correct guarded replacement and retrigger implementation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sync-animal-chathead-main.yml')
          s = p.read_text()
          old = '''          s = replace_once(s, """    headNodOffsetDeg,\n                debugSnapshot,\n          """, """    headNodOffsetDeg,\n                dialogueLinesFor,\n                debugSnapshot,\n          """, 'vocalization export')'''
          new = '''          s = replace_once(s, """    headNodOffsetDeg,\n              debugSnapshot,\n          """, """    headNodOffsetDeg,\n              dialogueLinesFor,\n              debugSnapshot,\n          """, 'vocalization export')'''
          if old not in s:
              raise SystemExit('expected vocalization export guard not found')
          s = s.replace(old, new, 1)
          s = s.replace('git rm .github/workflows/sync-animal-chathead-main.yml', 'git rm .github/workflows/sync-animal-chathead-main.yml .github/workflows/fix-livestock-workflow.yml', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sync-animal-chathead-main.yml
          git commit -m "Fix livestock workflow source guard"
          git push origin HEAD:codex/animal-chathead-framing
