name: Inspect dialogue camera path

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/inspect-dialogue-camera-temp.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
          fetch-depth: 0
      - name: Capture dialogue camera path
        run: python3 .github/scripts/inspect-dialogue-camera-temp.py > .github/dialogue-camera-inspection.txt
      - name: Commit inspection excerpt
        run: |
          # narrowed camera-path inspection
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/dialogue-camera-inspection.txt
          git commit -m 'Capture dialogue camera inspection excerpt'
          git push
