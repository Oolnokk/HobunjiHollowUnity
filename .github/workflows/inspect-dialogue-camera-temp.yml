name: Fix livestock triggered dialogue framing

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/inspect-dialogue-camera-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
          fetch-depth: 0
      - name: Apply 3D-only livestock dialogue fix
        run: |
          printf '%s' ' nPHNjcmlwdCBzcmM9ImdhbWV  a2luZCcpLCAncG9ydHJhaXQgbXVzdCB1c2UgYW5pbWFsIGNoYXRoZWFkIHJlbmRlcmVyJyk7CmFzc2VydChnYW1lLmluY2x1ZGVzKCdjcmVhdHVyZUdlbm90eXBlOiBsaXZlc3RvY2tS ' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Run focused regressions
        run: |
          node --check docs/game.js
          node --check docs/js/dialogue-content.js
          node scripts/test-livestock-dialogue-chatheads.js
          node scripts/test-animal-chathead-framing.js
          node scripts/test-animal-chathead-ambient.js
          node scripts/test-animal-head-rig-runtime.js
          node scripts/test-npc-facing-deadzone.js
      - name: Commit tested fix and remove helper
        run: |
          rm .github/workflows/inspect-dialogue-camera-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/game.js docs/index.html scripts/test-livestock-dialogue-chatheads.js .github/workflows/inspect-dialogue-camera-temp.yml
          git commit -m 'Use animal frame center in NPC dialogue camera'
          git push origin HEAD:codex/animal-chathead-framing
