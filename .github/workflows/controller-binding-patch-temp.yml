name: Temporary controller binding patch

on:
  push:
    branches:
      - codex/controller-listen-json-configurable-inputs

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[controller-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/controller-listen-json-configurable-inputs
          fetch-depth: 0
      - name: Route controller actions through bindings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          # Register every previously hardcoded discrete controller action as a configurable binding.
          config_path = 'docs/config/scratchbones-config.js'
          config_anchor = '''        { "id": "tool6", "label": "Tool 6: Harpoon", "desktop": "Digit6", "controller": null }\n      ],'''
          config_replacement = '''        { "id": "tool6", "label": "Tool 6: Harpoon", "desktop": "Digit6", "controller": null },
        { "id": "uiOpenMenu", "label": "Menu: Open / Close", "desktop": null, "controller": "Button8", "devices": ["controller"], "context": "menu" },
        { "id": "uiConfirm", "label": "Menu: Confirm", "desktop": null, "controller": "Button0", "devices": ["controller"], "context": "menu" },
        { "id": "uiCancel", "label": "Menu: Cancel / Back", "desktop": null, "controller": "Button1", "devices": ["controller"], "context": "menu" },
        { "id": "uiTabPrev", "label": "Menu: Previous Tab", "desktop": null, "controller": "Button4", "devices": ["controller"], "context": "menu" },
        { "id": "uiTabNext", "label": "Menu: Next Tab", "desktop": null, "controller": "Button5", "devices": ["controller"], "context": "menu" },
        { "id": "uiUp", "label": "Menu: Navigate Up", "desktop": null, "controller": "Button12", "devices": ["controller"], "context": "menu" },
        { "id": "uiDown", "label": "Menu: Navigate Down", "desktop": null, "controller": "Button13", "devices": ["controller"], "context": "menu" },
        { "id": "uiLeft", "label": "Menu: Navigate Left", "desktop": null, "controller": "Button14", "devices": ["controller"], "context": "menu" },
        { "id": "uiRight", "label": "Menu: Navigate Right", "desktop": null, "controller": "Button15", "devices": ["controller"], "context": "menu" },
        { "id": "musicNote1", "label": "Music: Note 1", "desktop": null, "controller": "Button2", "devices": ["controller"], "context": "music" },
        { "id": "musicNote2", "label": "Music: Note 2", "desktop": null, "controller": "Button0", "devices": ["controller"], "context": "music" },
        { "id": "musicNote3", "label": "Music: Note 3", "desktop": null, "controller": "Button1", "devices": ["controller"], "context": "music" },
        { "id": "musicNote4", "label": "Music: Note 4", "desktop": null, "controller": "Button3", "devices": ["controller"], "context": "music" },
        { "id": "musicBank1", "label": "Music: Bank 1", "desktop": null, "controller": "LeftTrigger", "devices": ["controller"], "context": "music" },
        { "id": "musicBank2", "label": "Music: Bank 2", "desktop": null, "controller": "RightTrigger", "devices": ["controller"], "context": "music" },
        { "id": "musicBank3", "label": "Music: Bank 3", "desktop": null, "controller": "Button4", "devices": ["controller"], "context": "music" },
        { "id": "musicBank4", "label": "Music: Bank 4", "desktop": null, "controller": "Button5", "devices": ["controller"], "context": "music" },
        { "id": "musicPause", "label": "Music: Pause", "desktop": null, "controller": "Button9", "devices": ["controller"], "context": "music" },
        { "id": "musicScalePrev", "label": "Music: Previous Scale", "desktop": null, "controller": "Button14", "devices": ["controller"], "context": "music" },
        { "id": "musicScaleNext", "label": "Music: Next Scale", "desktop": null, "controller": "Button15", "devices": ["controller"], "context": "music" },
        { "id": "meleeAutoTargetToggle", "label": "Melee: Toggle Auto-Target", "desktop": null, "controller": "Button11", "devices": ["controller"], "context": "melee" }
      ],'''
          replace_once(config_path, config_anchor, config_replacement)

          # Gameplay dispatch only consumes gameplay-context bindings; contextual bindings are owned by their subsystem.
          game_path = 'docs/game.js'
          old_get_action = '''      function getActionForButton(device, button, heldShift = null) {
        if (heldShift?.bindings?.[button]) return heldShift.bindings[button];
        const bindings = inputBindings[device] || {};
        return Object.keys(bindings).find(actionId => bindings[actionId] === button) || null;
      }'''
          new_get_action = '''      function getActionForButton(device, button, heldShift = null) {
        if (heldShift?.bindings?.[button]) return heldShift.bindings[button];
        const bindings = inputBindings[device] || {};
        return Object.keys(bindings).find(actionId => {
          if (bindings[actionId] !== button) return false;
          const action = INPUT_DEFAULTS.actions.find(entry => entry.id === actionId); // Used to keep menu/music/melee-context bindings out of generic gameplay dispatch.
          return (action?.context || 'gameplay') === 'gameplay';
        }) || null;
      }'''
          replace_once(game_path, old_get_action, new_get_action)

          old_melee = '''        // Right-stick click (Button11 — R3) toggles melee auto-target
        // while a melee weapon is out, taking over from its default
        // weaponSwitch binding for exactly that window (weaponSwitch still
        // works normally the rest of the time, and via its other bindings/
        // the action-bar button even then).
        if (down.has('Button11') && meleeWeaponOut()) {
          if (!gamepadState.previous.has('Button11')) {
            meleeAutoTargetOn = !meleeAutoTargetOn;
            manualAutoTarget = null;
            meleeAutoTargetFreeAim = false;
            showToast(meleeAutoTargetOn ? 'Auto-Target: On' : 'Auto-Target: Off', meleeAutoTargetOn);
          }
          down.delete('Button11');
        }'''
          new_melee = '''        const meleeAutoTargetBinding = inputBindings.controller?.meleeAutoTargetToggle || null; // Used so the melee-only auto-target toggle follows the player's controller configuration instead of a physical R3 constant.
        if (meleeAutoTargetBinding && down.has(meleeAutoTargetBinding) && meleeWeaponOut()) {
          if (!gamepadState.previous.has(meleeAutoTargetBinding)) {
            meleeAutoTargetOn = !meleeAutoTargetOn;
            manualAutoTarget = null;
            meleeAutoTargetFreeAim = false;
            showToast(meleeAutoTargetOn ? 'Auto-Target: On' : 'Auto-Target: Off', meleeAutoTargetOn);
          }
          down.delete(meleeAutoTargetBinding);
        }'''
          replace_once(game_path, old_melee, new_melee)

          # Universal menu navigation now resolves semantic actions through InputBindings.
          nav_path = 'docs/js/controller-ui-nav.js'
          old_nav_constants = '''  const REPEAT_INITIAL_MS = 380;
  const REPEAT_RATE_MS = 140;
  const BTN_CONFIRM = 0;   // A
  const BTN_CANCEL = 1;    // B
  const BTN_TAB_PREV = 4;  // LB
  const BTN_TAB_NEXT = 5;  // RB
  const BTN_OPEN_MENU = 8; // Back/Select — unbound in gameplay, free for this
  const BTN_DPAD_UP = 12, BTN_DPAD_DOWN = 13, BTN_DPAD_LEFT = 14, BTN_DPAD_RIGHT = 15;'''
          new_nav_constants = '''  const REPEAT_INITIAL_MS = 380;
  const REPEAT_RATE_MS = 140;
  const UI_ACTIONS = Object.freeze({
    open: 'uiOpenMenu', confirm: 'uiConfirm', cancel: 'uiCancel', tabPrev: 'uiTabPrev', tabNext: 'uiTabNext',
    up: 'uiUp', down: 'uiDown', left: 'uiLeft', right: 'uiRight',
  }); // Used to keep every discrete menu action routed through the configurable controller binding layer.

  function configuredControllerBinding(actionId) {
    const current = window.InputBindings?.getCurrentBindings?.()?.controller; // Used to prefer the player's saved binding, including an explicit Unbound value.
    if (current && Object.prototype.hasOwnProperty.call(current, actionId)) return current[actionId];
    return window.SCRATCHBONES_CONFIG?.game?.input?.actions?.find(action => action.id === actionId)?.controller || null;
  }

  function controllerActionDown(gamepad, actionId) {
    return window.ControllerInput?.isBindingPressed?.(gamepad, configuredControllerBinding(actionId), { stickThreshold: NAV_PRESS }) || false;
  }'''
          replace_once(nav_path, old_nav_constants, new_nav_constants)

          old_menu_open = '''      const openDown = !!pad.buttons[BTN_OPEN_MENU]?.pressed;
      if (openDown && !menuOpenEdge) {
        document.getElementById('menuBtn')?.click();
        prevButtons = new Set([BTN_OPEN_MENU]); // Prevents the same held View press from immediately closing the menu on its next active frame.
      } else if (!openDown) prevButtons.clear();'''
          new_menu_open = '''      const openDown = controllerActionDown(pad, UI_ACTIONS.open); // Used to let the configured Menu Open/Close action own this edge instead of a fixed View/Share button.
      if (openDown && !menuOpenEdge) {
        document.getElementById('menuBtn')?.click();
        prevButtons = new Set([UI_ACTIONS.open]); // Prevents the same held configured open press from immediately closing the menu on its next active frame.
      } else if (!openDown) prevButtons.clear();'''
          replace_once(nav_path, old_menu_open, new_menu_open)

          old_nav_directions = '''    pollDirection('left', rawAx <= -NAV_PRESS || !!pad.buttons[BTN_DPAD_LEFT]?.pressed, now, () => moveOrAdjust('left'));
    pollDirection('right', rawAx >= NAV_PRESS || !!pad.buttons[BTN_DPAD_RIGHT]?.pressed, now, () => moveOrAdjust('right'));
    pollDirection('up', rawAy <= -NAV_PRESS || !!pad.buttons[BTN_DPAD_UP]?.pressed, now, () => move('up'));
    pollDirection('down', rawAy >= NAV_PRESS || !!pad.buttons[BTN_DPAD_DOWN]?.pressed, now, () => move('down'));'''
          new_nav_directions = '''    pollDirection('left', rawAx <= -NAV_PRESS || controllerActionDown(pad, UI_ACTIONS.left), now, () => moveOrAdjust('left'));
    pollDirection('right', rawAx >= NAV_PRESS || controllerActionDown(pad, UI_ACTIONS.right), now, () => moveOrAdjust('right'));
    pollDirection('up', rawAy <= -NAV_PRESS || controllerActionDown(pad, UI_ACTIONS.up), now, () => move('up'));
    pollDirection('down', rawAy >= NAV_PRESS || controllerActionDown(pad, UI_ACTIONS.down), now, () => move('down'));'''
          replace_once(nav_path, old_nav_directions, new_nav_directions)

          old_nav_buttons = '''    const down = new Set();
    pad.buttons.forEach((b, i) => { if (b?.pressed) down.add(i); });
    const pressed = i => down.has(i) && !prevButtons.has(i);
    if (pressed(BTN_CONFIRM)) activate();
    if (pressed(BTN_CANCEL)) cancel();
    if (pressed(BTN_TAB_PREV)) cycleTabs(-1);
    if (pressed(BTN_TAB_NEXT)) cycleTabs(1);
    if (pressed(BTN_OPEN_MENU)) cancel();
    prevButtons = down;'''
          new_nav_buttons = '''    const down = new Set(Object.values(UI_ACTIONS).filter(actionId => controllerActionDown(pad, actionId))); // Used as semantic edge state so remapping never depends on physical Gamepad indices.
    const pressed = actionId => down.has(actionId) && !prevButtons.has(actionId);
    if (pressed(UI_ACTIONS.confirm)) activate();
    if (pressed(UI_ACTIONS.cancel)) cancel();
    if (pressed(UI_ACTIONS.tabPrev)) cycleTabs(-1);
    if (pressed(UI_ACTIONS.tabNext)) cycleTabs(1);
    if (pressed(UI_ACTIONS.open)) cancel();
    prevButtons = down;'''
          replace_once(nav_path, old_nav_buttons, new_nav_buttons)

          # Music button/tap/bank controls use named configurable actions; analog stick performance channels remain analog.
          music_path = 'docs/js/music-minigame.js'
          old_music_helper = '''    let controllerPrevButtons = [];
    let controllerAutoPickSector = -1;
    let controllerRightStickActive = false;
    const controllerButton = (gamepad, index, key, kind, value) => {
      const pressed = (gamepad.buttons[index]?.value || 0) > (kind === 'bank' ? 0.28 : 0.55);
      const wasPressed = Boolean(controllerPrevButtons[index]);
      if (pressed === wasPressed) return;
      controllerPrevButtons[index] = pressed;'''
          new_music_helper = '''    let controllerPrevButtons = new Map(); // Used to edge-track semantic music actions after controller remapping.
    let controllerAutoPickSector = -1;
    let controllerRightStickActive = false;
    const controllerBinding = actionId => {
      const current = window.InputBindings?.getCurrentBindings?.()?.controller; // Used to preserve explicit Unbound values while still supporting shipped defaults before saved settings exist.
      if (current && Object.prototype.hasOwnProperty.call(current, actionId)) return current[actionId];
      return window.SCRATCHBONES_CONFIG?.game?.input?.actions?.find(action => action.id === actionId)?.controller || null;
    };
    const controllerButton = (gamepad, actionId, key, kind, value) => {
      const bindingCode = controllerBinding(actionId); // Used to route this musical action through the same controller mapping shown in Settings.
      const pressed = window.ControllerInput?.isBindingPressed?.(gamepad, bindingCode, { triggerThreshold: kind === 'bank' ? 0.28 : 0.55, buttonThreshold: 0.55, stickThreshold: 0.55 }) || false;
      const wasPressed = Boolean(controllerPrevButtons.get(actionId));
      if (pressed === wasPressed) return;
      controllerPrevButtons.set(actionId, pressed);'''
          replace_once(music_path, old_music_helper, new_music_helper)
          music_text = Path(music_path).read_text()
          music_text = music_text.replace('controllerPrevButtons = [];', 'controllerPrevButtons = new Map();')
          old_music_calls = '''      controllerButton(gamepad, 2, 'x', 'note', 0);
      controllerButton(gamepad, 0, 'a', 'note', 1);
      controllerButton(gamepad, 1, 'b', 'note', 2);
      controllerButton(gamepad, 3, 'y', 'note', 3);
      controllerButton(gamepad, 6, 'lt', 'bank', 'lt');
      controllerButton(gamepad, 7, 'rt', 'bank', 'rt');
      controllerButton(gamepad, 4, 'lb', 'bank', 'lb');
      controllerButton(gamepad, 5, 'rb', 'bank', 'rb');
      controllerButton(gamepad, 9, 'start', 'tap', 'pause');
      controllerButton(gamepad, 14, 'dpad-left', 'tap', 'scale-prev');
      controllerButton(gamepad, 15, 'dpad-right', 'tap', 'scale-next');'''
          new_music_calls = '''      controllerButton(gamepad, 'musicNote1', 'note-1', 'note', 0);
      controllerButton(gamepad, 'musicNote2', 'note-2', 'note', 1);
      controllerButton(gamepad, 'musicNote3', 'note-3', 'note', 2);
      controllerButton(gamepad, 'musicNote4', 'note-4', 'note', 3);
      controllerButton(gamepad, 'musicBank1', 'bank-1', 'bank', 'lt');
      controllerButton(gamepad, 'musicBank2', 'bank-2', 'bank', 'rt');
      controllerButton(gamepad, 'musicBank3', 'bank-3', 'bank', 'lb');
      controllerButton(gamepad, 'musicBank4', 'bank-4', 'bank', 'rb');
      controllerButton(gamepad, 'musicPause', 'pause', 'tap', 'pause');
      controllerButton(gamepad, 'musicScalePrev', 'scale-prev', 'tap', 'scale-prev');
      controllerButton(gamepad, 'musicScaleNext', 'scale-next', 'tap', 'scale-next');'''
          if old_music_calls not in music_text:
              raise SystemExit('Expected music controller calls not found')
          Path(music_path).write_text(music_text.replace(old_music_calls, new_music_calls, 1))

          # Social wheel/dodge already have actions; make their runtime support every symbolic controller binding rather than ButtonN only.
          social_path = 'docs/js/social-action-wheel.js'
          old_social = '''  function buttonIndex(code) {
    const match = /^Button(\\d+)$/.exec(String(code || ''));
    return match ? Number(match[1]) : -1;
  }

  function pollGamepads() {
    installRigHooks();
    installRenderHook();

    const pads = navigator.getGamepads?.() || [];
    for (const pad of pads) {
      if (!pad) continue;
      const previous = state.priorGamepad.get(pad.index) || [];
      const current = pad.buttons.map(button => !!button?.pressed);
      const openCode = binding('controller', 'socialWheel', cfg.controllerOpen || DEFAULTS.controllerOpen);
      const dodgeCode = binding('controller', 'dodge', 'Button1');
      const openIndex = buttonIndex(openCode);
      const dodgeIndex = buttonIndex(dodgeCode);

      const openNow = openIndex >= 0 && current[openIndex];
      const openBefore = openIndex >= 0 && previous[openIndex];
      if (openNow && !openBefore) openWheel('controller', false);

      if (state.open && state.openSource === 'controller') {
        const x = Number(pad.axes?.[0]) || 0;
        const y = Number(pad.axes?.[1]) || 0;
        selectFromVector(x, y);
        if (!openNow && openBefore) commitSelection();
      }

      if ((state.open || state.dance) && dodgeIndex >= 0 && current[dodgeIndex] && !previous[dodgeIndex]) {
        cancelWheelOrDance('dodge');
      }

      state.priorGamepad.set(pad.index, current);
    }

    requestAnimationFrame(pollGamepads);
  }'''
          new_social = '''  function pollGamepads() {
    installRigHooks();
    installRenderHook();

    const pads = navigator.getGamepads?.() || [];
    for (const pad of pads) {
      if (!pad) continue;
      const previous = state.priorGamepad.get(pad.index) || { open: false, dodge: false }; // Used to edge-track semantic actions instead of physical button indices.
      const openCode = binding('controller', 'socialWheel', cfg.controllerOpen || DEFAULTS.controllerOpen);
      const dodgeCode = binding('controller', 'dodge', null);
      const openNow = window.ControllerInput?.isBindingPressed?.(pad, openCode) || false;
      const dodgeNow = window.ControllerInput?.isBindingPressed?.(pad, dodgeCode) || false;

      if (openNow && !previous.open) openWheel('controller', false);

      if (state.open && state.openSource === 'controller') {
        const x = Number(pad.axes?.[0]) || 0;
        const y = Number(pad.axes?.[1]) || 0;
        selectFromVector(x, y);
        if (!openNow && previous.open) commitSelection();
      }

      if ((state.open || state.dance) && dodgeNow && !previous.dodge) cancelWheelOrDance('dodge');

      state.priorGamepad.set(pad.index, { open: openNow, dodge: dodgeNow });
    }

    requestAnimationFrame(pollGamepads);
  }'''
          replace_once(social_path, old_social, new_social)

          # Settings gains JSON copy controls, device filtering, and true controller input listening.
          settings_path = 'docs/js/input-settings-panel.js'
          settings_text = Path(settings_path).read_text()
          settings_text = settings_text.replace("  let deps = null;\n", "  let deps = null;\n  let controllerListenCancel = null; // Used to stop the active controller-capture RAF/key listener when Settings rerenders or another row starts listening.\n  let inputBindingStatus = ''; // Used as an on-screen mobile-friendly result/debug message for listen and JSON copy operations.\n  let inputBindingStatusError = false; // Used to style the same visible status surface when capture/copy fails.\n", 1)

          helper_anchor = '''  function saveBindingChange(device, actionId) {
    deps.saveInputBindings();
    notifyBindingChanged(device, actionId);
  }

'''
          helper_insert = '''  function saveBindingChange(device, actionId) {
    deps.saveInputBindings();
    notifyBindingChanged(device, actionId);
  }

  function actionsForDevice(device) {
    return window.InputBindings?.getActionsForDevice?.(device) || deps.INPUT_DEFAULTS.actions.filter(action => !Array.isArray(action.devices) || action.devices.includes(device));
  }

  function setInputBindingStatus(message, isError = false) {
    inputBindingStatus = message || '';
    inputBindingStatusError = !!isError;
    document.querySelectorAll('[data-input-binding-status]').forEach(status => {
      status.textContent = inputBindingStatus;
      status.hidden = !inputBindingStatus;
      status.style.color = inputBindingStatusError ? '#ff9f9f' : '';
    });
  }

  function stopControllerListening() {
    const cancel = controllerListenCancel; // Used to clear the currently armed capture without coupling callers to its RAF/keyboard cleanup details.
    controllerListenCancel = null;
    cancel?.();
  }

  async function copyText(text) {
    if (navigator.clipboard?.writeText) {
      try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
    }
    const textarea = document.createElement('textarea'); // Used as the mobile/browser fallback when Clipboard API permissions are unavailable.
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    let copied = false; // Used to report fallback success on the visible Settings status line.
    try { copied = document.execCommand('copy'); } catch (_) {}
    textarea.remove();
    return copied;
  }

  async function copyDeviceBindingsJson(device) {
    const actions = actionsForDevice(device); // Used to export only controls that actually belong to the requested Keyboard or Controller section.
    const bindings = Object.fromEntries(actions.map(action => [action.id, deps.inputBindings?.[device]?.[action.id] ?? null])); // Used as the portable action-to-input payload copied to the clipboard.
    const payload = { version: 1, device: device === 'desktop' ? 'keyboard' : 'controller', bindings }; // Used as a self-describing JSON envelope for pasting into bug reports or configuration work.
    const copied = await copyText(JSON.stringify(payload, null, 2));
    setInputBindingStatus(copied ? `Copied ${payload.device} controls JSON.` : `Could not copy ${payload.device} controls JSON.`, !copied);
  }

  function beginControllerListening(action, select, listenButton, warn) {
    stopControllerListening();
    if (!window.ControllerInput?.getPressedBindingCodes || !window.ControllerInput?.pickActiveGamepad) {
      setInputBindingStatus('Controller listening is unavailable because the controller input helper did not load.', true);
      return;
    }

    let cancelled = false; // Used to stop this row's requestAnimationFrame loop after assignment/cancel/rerender.
    let preferredIndex = null; // Used to keep listening to the same active controller once one is identified.
    let releasedFrames = 0; // Used to require a clean release before capture so the button used to click Listen cannot bind itself accidentally.
    let armed = false; // Used to distinguish the release-gate phase from the actual next-input capture phase.
    const originalLabel = listenButton.textContent; // Used to restore the row button after cancellation or a binding conflict.

    const cleanup = () => {
      if (cancelled) return;
      cancelled = true;
      window.removeEventListener('keydown', onEscape, true);
      listenButton.classList.remove('is-listening');
      listenButton.textContent = originalLabel;
      if (controllerListenCancel === cleanup) controllerListenCancel = null;
    };
    const onEscape = event => {
      if (event.code !== 'Escape') return;
      event.preventDefault();
      event.stopImmediatePropagation();
      cleanup();
      setInputBindingStatus('Controller input listening cancelled.');
    };

    controllerListenCancel = cleanup;
    listenButton.classList.add('is-listening');
    listenButton.textContent = 'Cancel Listening';
    listenButton.onclick = event => {
      event.preventDefault();
      cleanup();
      setInputBindingStatus('Controller input listening cancelled.');
    };
    window.addEventListener('keydown', onEscape, true);
    setInputBindingStatus('Release controller inputs, then press the new input…');

    const poll = () => {
      if (cancelled) return;
      const pad = window.ControllerInput.pickActiveGamepad(navigator.getGamepads?.() || [], preferredIndex); // Used to support multiple connected controllers without capturing drift from an idle pad.
      if (!pad) {
        setInputBindingStatus('Connect or wake a controller; listening is still active…');
        requestAnimationFrame(poll);
        return;
      }
      preferredIndex = pad.index;
      const pressed = window.ControllerInput.getPressedBindingCodes(pad, { stickThreshold: deps.INPUT_DEFAULTS.axisPressThreshold || 0.55 }); // Used to capture the same symbolic codes accepted by the controller dropdown.
      if (!armed) {
        releasedFrames = pressed.length ? 0 : releasedFrames + 1;
        if (releasedFrames >= 2) {
          armed = true;
          setInputBindingStatus(`Listening to ${pad.id || 'controller'} — press the new input…`);
        }
        requestAnimationFrame(poll);
        return;
      }
      const code = pressed[0]; // Used as the single intentional next controller input once the release gate has armed.
      if (!code) {
        requestAnimationFrame(poll);
        return;
      }
      const conflict = deps.bindingConflict('controller', code, action.id);
      if (conflict) {
        warn.textContent = conflict;
        cleanup();
        setInputBindingStatus(`${deps.buttonLabel(code)} was not assigned: ${conflict}`, true);
        return;
      }
      deps.inputBindings.controller[action.id] = code;
      select.value = code;
      warn.textContent = '';
      saveBindingChange('controller', action.id);
      cleanup();
      setInputBindingStatus(`Assigned ${actionDisplayLabel(action)} to ${deps.buttonLabel(code)}.`);
      renderInputSettings();
    };
    requestAnimationFrame(poll);
  }

'''
          if helper_anchor not in settings_text:
              raise SystemExit('Settings helper anchor not found')
          settings_text = settings_text.replace(helper_anchor, helper_insert, 1)

          new_render = r'''  function renderInputSettings() {
    stopControllerListening();
    const desktopEl = document.getElementById('desktopInputBindings');
    const controllerEl = document.getElementById('controllerInputBindings');
    const shiftsEl = document.getElementById('modeShiftList');
    function renderDevice(el, device) {
      if (!el) return;
      el.innerHTML = '';

      const toolbar = document.createElement('div'); // Used to keep JSON export and its visible status directly inside the matching Keyboard/Controller section.
      toolbar.style.display = 'flex';
      toolbar.style.gap = '8px';
      toolbar.style.alignItems = 'center';
      toolbar.style.flexWrap = 'wrap';
      toolbar.style.marginBottom = '8px';
      const copyButton = document.createElement('button'); // Used to copy this section's complete configured bindings as portable JSON.
      copyButton.type = 'button';
      copyButton.className = 'settings-small-btn';
      copyButton.textContent = device === 'controller' ? 'Copy Controller Controls JSON' : 'Copy Keyboard Controls JSON';
      copyButton.addEventListener('click', () => copyDeviceBindingsJson(device));
      const status = document.createElement('span'); // Used as an in-game/mobile confirmation surface without requiring the browser console.
      status.className = 'settings-desc';
      status.dataset.inputBindingStatus = '1';
      status.setAttribute('role', 'status');
      status.setAttribute('aria-live', 'polite');
      status.textContent = inputBindingStatus;
      status.hidden = !inputBindingStatus;
      status.style.color = inputBindingStatusError ? '#ff9f9f' : '';
      toolbar.append(copyButton, status);
      el.appendChild(toolbar);

      for (const action of actionsForDevice(device)) {
        const row = document.createElement('div'); row.className = 'input-binding-row';
        if (ACTION_BUTTON_IDS.has(action.id)) {
          row.classList.add('action-button-binding');
          row.dataset.actionSlot = action.id.slice('action'.length); // Used for inspection/debugging and future Settings styling without inferring from label text.
          row.title = 'Controls the matching visible gameplay action button.';
        }
        if (device === 'controller') {
          row.innerHTML = `<span class="settings-name">${actionDisplayLabel(action)}</span><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><select class="settings-select"></select><button type="button" class="settings-small-btn controller-listen-btn">Listen for Input</button></div><div class="input-binding-warning"></div>`;
        } else {
          row.innerHTML = `<span class="settings-name">${actionDisplayLabel(action)}</span><button type="button" class="input-bind-btn">${deps.buttonLabel(deps.inputBindings[device]?.[action.id])}</button><div class="input-binding-warning"></div>`;
        }
        const warn = row.querySelector('.input-binding-warning');
        if (device === 'controller') {
          const control = row.querySelector('select'); // Used as the existing manual controller-binding picker alongside the new listen button.
          const listenButton = row.querySelector('.controller-listen-btn'); // Used to arm direct Gamepad input capture for this action.
          control.add(new Option('Unbound', ''));
          deps.CONTROLLER_INPUT_OPTIONS.forEach(code => control.add(new Option(deps.buttonLabel(code), code)));
          control.value = deps.inputBindings.controller?.[action.id] || '';
          control.addEventListener('change', () => {
            stopControllerListening();
            const conflict = deps.bindingConflict(device, control.value, action.id);
            if (conflict) {
              warn.textContent = conflict;
              control.value = deps.inputBindings.controller?.[action.id] || '';
              setInputBindingStatus(conflict, true);
            } else {
              deps.inputBindings.controller[action.id] = control.value || null;
              warn.textContent = '';
              saveBindingChange(device, action.id);
              setInputBindingStatus(`${actionDisplayLabel(action)} is now ${deps.buttonLabel(control.value || null)}.`);
            }
          });
          listenButton.addEventListener('click', () => beginControllerListening(action, control, listenButton, warn));
        } else {
          const control = row.children[1]; // Used as the existing click-to-listen keyboard/mouse binding control.
          control.addEventListener('click', () => {
            stopControllerListening();
            control.classList.add('is-listening');
            control.textContent = 'Press input… (key or mouse button)';
            const finish = code => {
              const conflict = deps.bindingConflict(device, code, action.id);
              if (conflict) warn.textContent = conflict;
              else {
                deps.inputBindings[device][action.id] = code;
                warn.textContent = '';
                saveBindingChange(device, action.id);
                setInputBindingStatus(`Assigned ${actionDisplayLabel(action)} to ${deps.buttonLabel(code)}.`);
                renderInputSettings();
              }
              window.removeEventListener('keydown', onKey, true);
              window.removeEventListener('mousedown', onMouse, true);
              window.removeEventListener('contextmenu', onContextMenu, true);
            };
            const onKey = ev => { ev.preventDefault(); finish(ev.code); };
            const onMouse = ev => { ev.preventDefault(); finish('Mouse' + ev.button); };
            const onContextMenu = ev => ev.preventDefault(); // Swallows the right-click's context menu while capturing a mouse-button bind.
            window.addEventListener('keydown', onKey, true);
            setTimeout(() => {
              window.addEventListener('mousedown', onMouse, true);
              window.addEventListener('contextmenu', onContextMenu, true);
            }, 0);
          });
        }
        el.appendChild(row);
      }
    }
    renderDevice(desktopEl, 'desktop'); renderDevice(controllerEl, 'controller');
    if (shiftsEl) {
      shiftsEl.innerHTML = '';
      deps.inputBindings.modeShifts.forEach((shift, idx) => {
        const row = document.createElement('div'); row.className = 'mode-shift-row';
        row.innerHTML = `<input class="settings-select" value="${shift.label || ''}"><select class="settings-select"><option value="desktop">Desktop</option><option value="controller">Controller</option></select><input class="settings-select" value="${shift.button || ''}"><button type="button" class="settings-small-btn">Remove</button>`;
        row.children[1].value = shift.device || 'desktop';
        row.children[0].addEventListener('change', e => { shift.label = e.target.value; deps.saveInputBindings(); });
        row.children[1].addEventListener('change', e => { shift.device = e.target.value; deps.saveInputBindings(); renderInputSettings(); });
        row.children[2].addEventListener('change', e => { shift.button = e.target.value; deps.saveInputBindings(); });
        row.children[3].addEventListener('click', () => { deps.inputBindings.modeShifts.splice(idx, 1); deps.saveInputBindings(); renderInputSettings(); });
        shiftsEl.appendChild(row);
        const bindings = document.createElement('div'); bindings.className = 'input-bindings-grid';
        Object.entries(shift.bindings || {}).forEach(([button, actionId]) => {
          const bRow = document.createElement('div'); bRow.className = 'mode-shift-row';
          bRow.innerHTML = `<span class="settings-name">${deps.buttonLabel(button)}</span><select class="settings-select"></select><span class="input-binding-warning"></span><button type="button" class="settings-small-btn">Remove</button>`;
          const select = bRow.children[1];
          actionsForDevice(shift.device || 'desktop').filter(action => (action.context || 'gameplay') === 'gameplay').forEach(action => select.add(new Option(actionDisplayLabel(action), action.id)));
          select.value = actionId;
          select.addEventListener('change', e => { shift.bindings[button] = e.target.value; deps.saveInputBindings(); renderInputSettings(); });
          bRow.children[3].addEventListener('click', () => { delete shift.bindings[button]; deps.saveInputBindings(); renderInputSettings(); });
          bindings.appendChild(bRow);
        });
        const add = document.createElement('button'); add.type = 'button'; add.className = 'settings-small-btn'; add.textContent = 'Add Shifted Binding';
        add.addEventListener('click', () => {
          add.classList.add('is-listening'); add.textContent = 'Press shifted input…';
          const once = ev => {
            ev.preventDefault();
            const manual = window.prompt?.('Input code (examples: RightStickLeft, RightTrigger, Button0)') || '';
            const button = manual.trim() || ev.code;
            const actionId = actionsForDevice(shift.device || 'desktop').find(action => (action.context || 'gameplay') === 'gameplay')?.id || 'interact';
            const conflict = deps.bindingConflict(shift.device || 'desktop', button, actionId, shift);
            if (!conflict) { shift.bindings = shift.bindings || {}; shift.bindings[button] = actionId; deps.saveInputBindings(); }
            window.removeEventListener('keydown', once, true); renderInputSettings();
          };
          window.addEventListener('keydown', once, true);
        });
        bindings.appendChild(add);
        shiftsEl.appendChild(bindings);
      });
    }
  }
'''
          pattern = re.compile(r"  function renderInputSettings\(\) \{.*?\n  \}\n\n  window\.InputSettingsPanel", re.S)
          match = pattern.search(settings_text)
          if not match:
              raise SystemExit('renderInputSettings function block not found')
          settings_text = settings_text[:match.start()] + new_render + '\n  window.InputSettingsPanel' + settings_text[match.end():]
          Path(settings_path).write_text(settings_text)

          # Cache-bust the modified scripts so GitHack/mobile browsers cannot retain the pre-remap implementation.
          index_path = 'docs/index.html'
          index_text = Path(index_path).read_text()
          scripts = ['input-bindings.js', 'controller-input.js', 'input-settings-panel.js', 'controller-ui-nav.js', 'music-minigame.js', 'social-action-wheel.js']
          for script in scripts:
              index_text = re.sub(rf'(js/{re.escape(script)})(?:\?v=[^"\']+)?', rf'\1?v=20260909-controller-bindings-1', index_text)
          Path(index_path).write_text(index_text)
          PY
      - name: Commit patched runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/config/scratchbones-config.js docs/game.js docs/index.html docs/js/controller-ui-nav.js docs/js/input-settings-panel.js docs/js/music-minigame.js docs/js/social-action-wheel.js
          git diff --cached --check
          git commit -m "[controller-patch] Make controller actions fully configurable"
          git push origin HEAD:codex/controller-listen-json-configurable-inputs
