name: Controller binding patch

on:
  push:
    branches:
      - codex/controller-listen-json-configurable-inputs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/controller-listen-json-configurable-inputs
          fetch-depth: 0

      - name: Apply and validate controller binding patch
        run: python3 .github/scripts/controller_binding_patch.py

      - name: Remove temporary patch runner
        run: |
          rm -f .github/scripts/controller_binding_patch.py
          rm -f .github/workflows/controller-binding-patch-temp.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finish configurable controller input audit"
          git push origin HEAD:codex/controller-listen-json-configurable-inputs
