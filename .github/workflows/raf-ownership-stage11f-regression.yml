name: RAF ownership Stage 11f regression (fishing events feature loop)

on:
  pull_request:
    paths:
      - 'docs/js/fishing-events.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-fishing-events-feature-loop-scheduler.js'
      - '.github/workflows/raf-ownership-stage11f-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/fishing-events.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-fishing-events-feature-loop-scheduler.js'
      - '.github/workflows/raf-ownership-stage11f-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/fishing-events.js
      - name: Fishing events feature loop scheduler migration
        run: node scripts/test-fishing-events-feature-loop-scheduler.js
