name: Character presentation regressions

on:
  pull_request:
    paths:
      - 'docs/config/character-rig-scale-defaults.js'
      - 'docs/config/harlyao-night-march.json'
      - 'docs/config/porakaneki-camp.json'
      - 'docs/config/locales/index.json'
      - 'docs/config/locales/locale_porakaneki_camp_small.json'
      - 'docs/config/locales/locale_porakaneki_camp_chief.json'
      - 'docs/config/npcs/species-overrides.json'
      - 'docs/config/species/harlyao.json'
      - 'docs/config/species/porakaneki.json'
      - 'docs/config/species/index.json'
      - 'docs/assets/fightersprites/kenkari-m/head_porakaneki_m.png'
      - 'docs/assets/fightersprites/kenkari-m/untinted_regions/ur-head_porakaneki.png'
      - 'docs/assets/fightersprites/kenkari-m/untinted_regions/ur-head_porakaneki_blink.png'
      - 'docs/assets/portraitsprites/torso_porakaneki_m.png'
      - 'docs/js/combat/combat-config-loader.js'
      - 'docs/js/combat/porakaneki-dagger-ranged.js'
      - 'docs/js/ghostify.js'
      - 'docs/js/harlyao-night-march-atmosphere.js'
      - 'docs/js/harlyao-night-march-beacon.js'
      - 'docs/js/harlyao-night-march-calendar.js'
      - 'docs/js/harlyao-night-march-music.js'
      - 'docs/js/harlyao-night-march-pixel-probe.js'
      - 'docs/js/harlyao-night-march-runtime.js'
      - 'docs/js/harlyao-species-runtime.js'
      - 'docs/js/porakaneki-camps-runtime.js'
      - 'docs/js/porakaneki-species-runtime.js'
      - 'docs/js/harlyao-terror.js'
      - 'docs/js/house-pieces.js'
      - 'docs/js/maoao-arm-tint-runtime.js'
      - 'docs/js/npc-social-relationship-bridge-v2.js'
      - 'docs/js/perp-rotation.js'
      - 'docs/js/shoulder-camera-character-framing.js'
      - 'docs/js/shoulder-camera-reset-button.js'
      - 'docs/js/attachment-rig-latest-authored-snapshot.js'
      - 'scripts/test-harlyao-calendar-markers.js'
      - 'scripts/test-harlyao-night-march.js'
      - 'scripts/test-harlyao-night-march-beacon.js'
      - 'scripts/test-harlyao-night-march-spawn-placement.js'
      - 'scripts/test-harlyao-species.js'
      - 'scripts/test-harlyao-terror.js'
      - 'scripts/test-maoao-arm-tint-runtime.js'
      - 'scripts/test-npc-facing-deadzone.js'
      - 'scripts/test-porakaneki-camp.js'
      - 'scripts/test-porakaneki-species.js'
      - 'scripts/test-shoulder-camera-character-framing.js'
      - 'scripts/test-shoulder-camera-reset-button.js'
      - '.github/workflows/character-presentation-regression.yml'

jobs:
  character-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harlyao species regression
        run: node scripts/test-harlyao-species.js
      - name: Porakaneki species regression
        run: node scripts/test-porakaneki-species.js
      - name: Porakaneki camp regression
        run: node scripts/test-porakaneki-camp.js
      - name: Harlyao night march regression
        run: node scripts/test-harlyao-night-march.js
      - name: Harlyao night march beacon regression
        run: node scripts/test-harlyao-night-march-beacon.js
      - name: Harlyao spawn and elevation regression
        run: node scripts/test-harlyao-night-march-spawn-placement.js
      - name: Harlyao Terror regression
        run: node scripts/test-harlyao-terror.js
      - name: Harlyao calendar marker regression
        run: node scripts/test-harlyao-calendar-markers.js
      - name: Mao-ao arm tint regression
        run: node scripts/test-maoao-arm-tint-runtime.js
      - name: NPC perspective-facing deadzone regression
        run: node scripts/test-npc-facing-deadzone.js
      - name: Shoulder camera character framing regression
        run: node scripts/test-shoulder-camera-character-framing.js
      - name: Shoulder camera reset button regression
        run: node scripts/test-shoulder-camera-reset-button.js
