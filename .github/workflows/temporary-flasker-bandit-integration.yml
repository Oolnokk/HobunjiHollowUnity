name: Temporary Flasker bandit integration

on:
  push:
    branches:
      - benjam/afflict-flask-dual-colors

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benjam/afflict-flask-dual-colors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Flasker integration
        run: |
          python3 scripts/fix-flasker-helper-regex.py
          python3 scripts/apply-flasker-bandit-integration.py
      - name: Syntax and focused tests
        run: |
          node --check docs/js/held-action-animations.js
          node --check docs/js/hand-tool-grips.js
          node --check docs/js/alchemy-system.js
          node --check docs/js/alchemy-flasks.js
          node --check docs/js/combat/combat-bandit.js
          node --check docs/js/bandit-camps.js
          node --check docs/js/dev-spawner.js
          node --check docs/js/combat/combat-enemy-dodge.js
          node --check scripts/test-bandit-flasker.js
          node scripts/run-tests.js bandit-flasker trait-alchemy-refactor enemy-weapon-stances weapon-trust-bandit-loadouts
      - name: Fix cache-bust chain
        run: |
          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
          node scripts/check-cache-busts.js origin/main
      - name: Run full regression suite
        run: node scripts/run-tests.js
      - name: Commit integrated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-flasker-bandit-integration.yml scripts/apply-flasker-bandit-integration.py scripts/fix-flasker-helper-regex.py
          git add -A
          git commit -m "Add Flasker bandits and throwing flask attack grip"
          git push origin HEAD:benjam/afflict-flask-dual-colors
