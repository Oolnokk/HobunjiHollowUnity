name: Implement livestock dialogue v8

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/implement-livestock-dialogue-v3.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
          fetch-depth: 0
      - name: Apply feature
        run: python3 scripts/run-livestock-dialogue-temp-v3.py
      - name: Run scoped regressions
        run: |
          node --check docs/config/attachment-rig-profiles.js
          node --check docs/js/animal-vocalizations.js
          node --check docs/js/farm-animals.js
          node --check docs/js/animal-chathead-frame.js
          node --check docs/game.js
          node scripts/test-animal-chathead-framing.js
          node scripts/test-animal-chathead-ambient.js
          node scripts/test-animal-head-rig-runtime.js
          node scripts/test-livestock-dialogue-chatheads.js
      - name: Commit feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/config/attachment-rig-profiles.js docs/config/dialogue/ambient-dialogue.json docs/js/animal-vocalizations.js docs/js/farm-animals.js docs/game.js docs/index.html scripts/test-livestock-dialogue-chatheads.js
          git commit -m "Add full livestock dialogue using authored head frames"
          git push origin HEAD:codex/animal-chathead-framing
