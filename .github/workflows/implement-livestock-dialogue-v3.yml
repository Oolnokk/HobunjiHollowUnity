name: Finalize livestock dialogue cleanup

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/implement-livestock-dialogue-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
          fetch-depth: 0
      - name: Remove patch-only noise
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          old = 'js/fishing-minigame.js?v=20260902livestock1'
          new = 'js/fishing-minigame.js?v=20260825interactions1'
          if old not in s:
              raise SystemExit('unexpected fishing-minigame cache tag state')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/game.js')
          s = p.read_text()
          s = s.replace('\n      openLivestockDialogue,\n        COLS,', '\n        openLivestockDialogue,\n        COLS,', 1)
          p.write_text(s)
          PY
      - name: Run final regressions
        run: |
          node --check docs/config/attachment-rig-profiles.js
          node --check docs/js/animal-vocalizations.js
          node --check docs/js/farm-animals.js
          node --check docs/js/animal-chathead-frame.js
          node --check docs/game.js
          node scripts/test-animal-chathead-framing.js
          node scripts/test-animal-chathead-ambient.js
          node scripts/test-animal-head-rig-runtime.js
          node scripts/test-livestock-dialogue-chatheads.js
      - name: Clean temporary implementation files and commit
        run: |
          rm -f \
            .github/workflows/fix-livestock-workflow.yml \
            .github/workflows/implement-livestock-dialogue-v2.yml \
            .github/workflows/implement-livestock-dialogue-v3.yml \
            .github/workflows/sync-animal-chathead-main.yml \
            scripts/apply-livestock-dialogue-temp.py \
            scripts/run-livestock-dialogue-temp-v2.py \
            scripts/run-livestock-dialogue-temp-v3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean livestock dialogue implementation scaffolding"
          git push origin HEAD:codex/animal-chathead-framing
