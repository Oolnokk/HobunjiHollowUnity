name: Temp Jubmir Cache Fix

on:
  push:
    branches: [feature/jubmir-dabinggi-hounds]

permissions:
  contents: write

jobs:
  fix-cache-chain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jubmir-dabinggi-hounds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair cache-bust chain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git fetch origin main
          node scripts/check-cache-busts.js --fix origin/main
          git add docs scripts
          if git diff --cached --quiet; then
            echo "Cache-bust chain already clean."
          else
            git commit -m "Repair Jubmir hound cache-bust chain"
            git push origin HEAD:feature/jubmir-dabinggi-hounds
          fi
      - name: Validate repaired chain
        run: node scripts/check-cache-busts.js origin/main
      - name: Run Jubmir regression
        run: node scripts/run-tests.js jubmir
