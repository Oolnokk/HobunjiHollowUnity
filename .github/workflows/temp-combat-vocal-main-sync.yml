name: Temp Combat Vocal Main Sync

on:
  push:
    branches:
      - feat/combat-vocalizations

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-vocalizations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Git and fetch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git fetch origin main
      - name: Merge main and resolve only known cache-chain conflicts
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -z "$unresolved" ]; then
              echo "Merge failed without file conflicts."
              exit 1
            fi
            for file in $unresolved; do
              case "$file" in
                docs/index.html|docs/js/combat/combat-config-loader.js) ;;
                *) echo "Unexpected merge conflict: $file"; exit 1 ;;
              esac
            done
            git checkout --ours -- docs/index.html docs/js/combat/combat-config-loader.js
            git add docs/index.html docs/js/combat/combat-config-loader.js
          fi
      - name: Preserve main cache token and activate vocal runtime v2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/js/combat/combat-config-loader.js')
          text = path.read_text()

          old_vocal = "['js/combat/combat-vocalizations.js?v=20261013vocal1', () => Number(window.CombatVocalizations?.version) >= 1]"
          new_vocal = "['js/combat/combat-vocalizations.js?v=20261013vocal2', () => Number(window.CombatVocalizations?.version) >= 2]"
          if old_vocal in text:
              text = text.replace(old_vocal, new_vocal, 1)
          elif new_vocal not in text:
              raise SystemExit('combat vocal runtime loader entry not found')

          old_gifting = "['js/npc-gifting.js?v=20261009h1fb0698', () => !!window.NpcGifting]"
          new_gifting = "['js/npc-gifting.js?v=20261013h6ff1fb2', () => !!window.NpcGifting]"
          if old_gifting in text:
              text = text.replace(old_gifting, new_gifting, 1)
          elif new_gifting not in text:
              raise SystemExit('npc gifting loader entry not found')

          path.write_text(text)
          PY
      - name: Syntax checks
        run: |
          node --check docs/js/combat/combat-vocalizations.js
          node --check docs/js/combat/combat-config-loader.js
          node --check docs/js/tool-hub-combat-vocalization-tab.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path('docs/tools/combat-vocalization-editor/index.html').read_text()
          start = page.rfind('<script>') + len('<script>')
          end = page.find('</script>', start)
          if start < len('<script>') or end < 0:
              raise SystemExit('editor script block not found')
          Path('/tmp/combat-vocal-editor.js').write_text(page[start:end])
          PY
          node --check /tmp/combat-vocal-editor.js
      - name: Refresh cache busts
        run: node scripts/check-cache-busts.js --fix
      - name: Remove temporary workflow
        run: git rm .github/workflows/temp-combat-vocal-main-sync.yml
      - name: Validate cache busts
        run: node scripts/check-cache-busts.js origin/main
      - name: Run focused combat vocalization regression
        run: node scripts/test-combat-vocalizations.js
      - name: Run full regression suite
        run: node scripts/run-tests.js
      - name: Commit validated main sync
        run: |
          git add -A
          git commit -m "Sync combat vocalizations with main"
          git push origin HEAD:feat/combat-vocalizations
