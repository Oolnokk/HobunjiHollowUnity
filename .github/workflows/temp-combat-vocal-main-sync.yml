name: Temp Combat Vocal Main Sync

on:
  push:
    branches:
      - feat/combat-vocalizations

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-vocalizations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch main
        run: git fetch origin main
      - name: Merge main and resolve expected cache conflicts
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            for file in $unresolved; do
              case "$file" in
                docs/index.html|docs/js/combat/combat-config-loader.js) ;;
                *) echo "Unexpected merge conflict: $file"; exit 1 ;;
              esac
            done
            git checkout --ours -- docs/index.html docs/js/combat/combat-config-loader.js
            git add docs/index.html docs/js/combat/combat-config-loader.js
          fi
      - name: Apply combined loader and source polish
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/combat-vocal-sync.py
          python3 /tmp/combat-vocal-sync.py
      - name: Syntax checks
        run: |
          node --check docs/js/combat/combat-vocalizations.js
          node --check docs/js/combat/combat-config-loader.js
          node --check docs/js/tool-hub-combat-vocalization-tab.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path('docs/tools/combat-vocalization-editor/index.html').read_text()
          start = page.rfind('<script>') + len('<script>')
          end = page.find('</script>', start)
          Path('/tmp/combat-vocal-editor.js').write_text(page[start:end])
          PY
          node --check /tmp/combat-vocal-editor.js
      - name: Refresh cache busts
        run: node scripts/check-cache-busts.js --fix
      - name: Remove temporary workflow
        run: git rm .github/workflows/temp-combat-vocal-main-sync.yml
      - name: Validate cache busts
        run: node scripts/check-cache-busts.js origin/main
      - name: Run focused test
        run: node scripts/test-combat-vocalizations.js
      - name: Run full suite
        run: node scripts/run-tests.js
      - name: Commit merge and validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git add -A
          git commit -m "Sync combat vocalizations with main"
          git push origin HEAD:feat/combat-vocalizations
