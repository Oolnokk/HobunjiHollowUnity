name: Temporary gift cache-bust fix

on:
  push:
    branches:
      - fix/uncap-daily-gift-favor

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uncap-daily-gift-favor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update cache-bust chain
        run: node scripts/check-cache-busts.js --fix
      - name: Remove temporary workflow and commit generated tokens
        run: |
          rm .github/workflows/tmp-fix-gift-cache-busts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update gift Favor cache-bust chain"
          git push origin HEAD:fix/uncap-daily-gift-favor
