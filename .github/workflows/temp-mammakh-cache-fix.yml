name: Temp Mammakh Cache Fix

on:
  push:
    branches: [mammakhbuur-head-placeholders]

permissions:
  contents: write

jobs:
  reconcile-fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mammakhbuur-head-placeholders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final Mammakhbuur reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # Preserve the user's Character Studio export and explicitly clear front hair,
          # since an omitted key can leave the randomly seeded front layer alive.
          overrides_path = Path('docs/config/npcs/species-overrides.json')
          overrides = json.loads(overrides_path.read_text())
          overrides.setdefault('npcs', {})['khannibarri_agent'] = {
            'species': 'mammakhbuur',
            'displayName': 'Surveyor Harkhanash',
            'avatarExport': {
              'schema': 'npc_avatar_editor_export.v1',
              'source': 'character-studio',
              'name': 'Surveyor Harkhanash',
              'appearance': {
                'speciesId': 'mammakhbuur',
                'gender': 'male',
                'cosmetics': {
                  'hairFront': None,
                  'hairBack': 'appearance::Mao-ao_M::mao-ao_long_ponytail',
                  'hairSide': 'appearance::Mao-ao_M::mao-ao_braidcluster-R',
                  'hairSideL': 'appearance::Mao-ao_M::mao-ao_braid-L',
                  'facialHair': None
                },
                'bodyColors': {
                  'A': {'h': -70, 's': -0.8, 'v': -0.55},
                  'B': {'h': -70, 's': -0.8, 'v': -0.55},
                  'C': {'h': -70, 's': -0.75, 'v': -0.37000000000000005}
                },
                'chatColor': {'h': 210, 's': 75, 'l': 68}
              },
              'equippedCosmetics': ['rounded_pauldron', 'fine_poncho', 'bandolier1'],
              'appliedDyes': {
                'CLOTH': 'dye:CLOTH:shadow_blue',
                'CLOTH_B': 'dye:CLOTH:pure_yellow',
                'CLOTH_C': 'dye:CLOTH:pure_yellow'
              }
            }
          }
          overrides_path.write_text(json.dumps(overrides, indent=2) + '\n')

          runtime_path = Path('docs/js/mammakhbuur-species-runtime.js')
          runtime = runtime_path.read_text()
          old_runtime = 'delete data.defaultCosmetics.hairFront;'
          if old_runtime in runtime:
              runtime = runtime.replace(old_runtime, 'data.defaultCosmetics.hairFront = null; // Explicitly clears seeded random front hair for every Mammakhbuur appearance.', 1)
              runtime_path.write_text(runtime)

          onboarding_path = Path('docs/onboarding-core.js')
          onboarding = onboarding_path.read_text()
          old_onboarding = """    if (authored?.slots) SPECIES_DATA.mammakhbuur[gender].slots = JSON.parse(JSON.stringify(authored.slots));
    SPECIES_DATA.mammakhbuur[gender].colorOptions = bodyPalette('mashtzarr', gender);
"""
          new_onboarding = """    if (authored?.slots) SPECIES_DATA.mammakhbuur[gender].slots = JSON.parse(JSON.stringify(authored.slots));
    const mammakhGender = SPECIES_DATA.mammakhbuur[gender]; // Mammakhbuur use the Mashtzarr donor set except front hair, which is intentionally unavailable for both genders.
    if (Array.isArray(mammakhGender.slots)) mammakhGender.slots = mammakhGender.slots.filter(slot => slot?.slot !== 'hairFront');
    mammakhGender.defaultCosmetics = { ...(mammakhGender.defaultCosmetics || {}), hairFront: null };
    mammakhGender.forcedCosmetics = { ...(mammakhGender.forcedCosmetics || {}), hairFront: null };
    mammakhGender.colorOptions = bodyPalette('mashtzarr', gender);
"""
          if old_onboarding in onboarding:
              onboarding_path.write_text(onboarding.replace(old_onboarding, new_onboarding, 1))

          replacements = {
            'scripts/test-character-rig-scale.js': [
              ("'tletingan::male': { x: 0.85, y: 0.85, head: 0.8823529411764706, offsetY: 0 }", "'tletingan::male': { x: 0.85, y: 0.85, head: 0.8, offsetY: 0 }"),
              ("'mao-ao::female': { x: 1.045, y: 1.30625, head: 0.9375, offsetY: 0 }", "'mao-ao::female': { x: 0.895, y: 0.94, head: 0.7813, offsetY: 0 }"),
            ],
            'scripts/test-full-character-scale-authoring-20260905.js': [
              ("'tletingan::male': { x: 0.85, y: 0.85, head: 0.8823529411764706, offsetY: 0 }", "'tletingan::male': { x: 0.85, y: 0.85, head: 0.8, offsetY: 0 }"),
              ("'mao-ao::female': { x: 1.045, y: 1.30625, head: 0.9375, offsetY: 0 }", "'mao-ao::female': { x: 0.895, y: 0.94, head: 0.7813, offsetY: 0 }"),
            ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old_value, new_value in pairs:
                  if old_value in text:
                      text = text.replace(old_value, new_value, 1)
              path.write_text(text)

          full_scale_test = Path('scripts/test-full-character-scale-authoring-20260905.js')
          text = full_scale_test.read_text()
          old_pct = "const expectedRawHeadPercent = key === 'mao-ao::male' ? 72.6 : 75;"
          if old_pct in text:
              text = text.replace(old_pct, "const expectedRawHeadPercent = key === 'mao-ao::male' ? 72.6 : (key === 'tletingan::male' ? 68 : 75);", 1)
              full_scale_test.write_text(text)

          studio_test = Path('scripts/test-character-studio-mammakhbuur-config.js')
          text = studio_test.read_text()
          marker = "console.log('Character Studio Mammakhbuur no-front-hair config checks passed.');"
          if marker in text and 'onboarding must also remove Mammakhbuur front hair' not in text:
              extra = """const onboardingSource = fs.readFileSync('docs/onboarding-core.js', 'utf8');
assert.match(onboardingSource, /mammakhGender\\.slots\\.filter\\(slot => slot\\?\\.slot !== 'hairFront'\\)/,
  'onboarding must also remove Mammakhbuur front hair for both genders');
""" + marker
              studio_test.write_text(text.replace(marker, extra, 1))

          hark_test = Path('scripts/test-harkhanash-avatar-export.js')
          hark_test.write_text("""'use strict';
const assert = require('node:assert/strict');
const fs = require('node:fs');
const overrides = JSON.parse(fs.readFileSync('docs/config/npcs/species-overrides.json', 'utf8'));
const hark = overrides.npcs?.khannibarri_agent;
assert(hark, 'Surveyor Harkhanash must have a reviewed NPC appearance override');
assert.equal(hark.species, 'mammakhbuur');
assert.equal(hark.displayName, 'Surveyor Harkhanash');
const avatar = hark.avatarExport;
assert.equal(avatar?.appearance?.speciesId, 'mammakhbuur');
assert.equal(avatar?.appearance?.gender, 'male');
assert.equal(avatar?.appearance?.cosmetics?.hairFront, null);
assert.equal(avatar?.appearance?.cosmetics?.hairBack, 'appearance::Mao-ao_M::mao-ao_long_ponytail');
assert.equal(avatar?.appearance?.cosmetics?.hairSide, 'appearance::Mao-ao_M::mao-ao_braidcluster-R');
assert.equal(avatar?.appearance?.cosmetics?.hairSideL, 'appearance::Mao-ao_M::mao-ao_braid-L');
assert.deepEqual(avatar?.equippedCosmetics, ['rounded_pauldron', 'fine_poncho', 'bandolier1']);
assert.deepEqual(avatar?.appliedDyes, { CLOTH: 'dye:CLOTH:shadow_blue', CLOTH_B: 'dye:CLOTH:pure_yellow', CLOTH_C: 'dye:CLOTH:pure_yellow' });
console.log('Surveyor Harkhanash Character Studio export passed.');
""")
          PY
      - name: Advance static cache chain
        run: node scripts/check-cache-busts.js --fix 1eb64c001e7fe642ba9a406dd201090c905ffa51
      - name: Validate static cache chain
        run: node scripts/check-cache-busts.js 1eb64c001e7fe642ba9a406dd201090c905ffa51
      - name: Run regression suite
        run: node scripts/run-tests.js
      - name: Commit reconciliation output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git add docs scripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply Harkhanash appearance and finish Mammakhbuur main sync"
          git push origin HEAD:mammakhbuur-head-placeholders
