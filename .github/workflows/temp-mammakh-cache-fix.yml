name: Temp Combat Vocal Stretch Validation

on:
  push:
    branches: [feat/combat-vocalizations]

permissions:
  contents: write

jobs:
  update-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-vocalizations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch current main
        run: git fetch origin main
      - name: Replace sustain sampler with full-clip stretch playback
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: expected text not found')
              return text.replace(old, new, 1)

          runtime_path = Path('docs/js/combat/combat-vocalizations.js')
          runtime = runtime_path.read_text()
          runtime = replace_once(runtime, '  const VERSION = 1;', '  const VERSION = 2;', 'runtime version')
          runtime = replace_once(runtime, "    schema: 'hobunji_combat_vocalizations.v1',", "    schema: 'hobunji_combat_vocalizations.v2',", 'runtime schema')
          cfg_start = runtime.index('    chargeSampler: {')
          cfg_end = runtime.index('    breath: {', cfg_start)
          runtime = runtime[:cfg_start] + '''    chargePlayback: {
              earlyReleaseNormalSpeedMul: 2,
              fullChargeDurationByAbility: { chargedBreaker: 4 },
            },
          ''' + runtime[cfg_end:]
          runtime = replace_once(runtime, "      liveSustainAbilities: ['chargedBreaker'],", "      liveStretchAbilities: ['chargedBreaker'],", 'runtime live ability config')
          runtime = runtime.replace('const liveChargesByAbility = new Map(); // Used by hold-release abilities to sustain one charge vocal across handler callbacks.', 'const liveChargesByAbility = new Map(); // Used by hold-release abilities to stretch one charge vocal across the full charge window.')

          start = runtime.index('  function startBufferSlice(')
          end = runtime.index('  function playStrikeGrunt(', start)
          new_charge_block = '''  function startChargeSource(ctx, buffer, output, when, offset, rate) {
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.playbackRate.value = rate;
            source.connect(output);
            source.start(when, clamp(offset, 0, Math.max(0, buffer.duration - 0.0001)));
            return source;
          }

          function stopSource(source, when = 0) {
            try { source?.stop?.(when || undefined); } catch (_) {}
            try { source?.disconnect?.(); } catch (_) {}
          }

          function liveChargeTargetDurationS(abilityId) {
            if (abilityId === 'chargedBreaker') {
              const authoritative = Number(window.Combat?.chargedBreakerData?.MAX_CHARGE_S);
              if (authoritative > 0) return authoritative;
            }
            const fallback = Number(config.chargePlayback?.fullChargeDurationByAbility?.[abilityId]);
            return fallback > 0 ? fallback : null;
          }

          function chargeRatePlan(bufferDurationS, targetDurationS, normalRate) {
            const clipDurationS = Math.max(0.001, Number(bufferDurationS) || 0.001);
            const targetS = Number(targetDurationS) > 0 ? Number(targetDurationS) : clipDurationS;
            const baseNormalRate = Math.max(0.02, Number(normalRate) || 1);
            const stretchedRate = clamp(baseNormalRate * (clipDurationS / targetS), 0.02, 32);
            const earlyReleaseNormalSpeedMul = Math.max(
              0.1,
              Number(config.chargePlayback?.earlyReleaseNormalSpeedMul) || 2,
            );
            const catchUpRate = clamp(baseNormalRate * earlyReleaseNormalSpeedMul, 0.02, 32);
            return {
              clipDurationS,
              targetDurationS: targetS,
              normalRate: baseNormalRate,
              stretchedRate,
              earlyReleaseNormalSpeedMul,
              catchUpRate,
            };
          }

          function finishChargeToken(token) {
            if (!token || token.done) return;
            token.done = true;
            activeChargeTokens.delete(token);
            try { token.output?.disconnect?.(); } catch (_) {}
          }

          function cancelCharge(token) {
            if (!token || token.cancelled || token.done) return;
            token.cancelled = true;
            const stopAt = token.ctx ? token.ctx.currentTime + 0.002 : 0;
            stopSource(token.source, stopAt);
            finishChargeToken(token);
            debug.lastCharge = {
              id: token.id,
              action: 'cancel',
              abilityId: token.abilityId,
              atMs: Math.round(nowMs()),
            };
          }

          function releaseCharge(token) {
            if (!token || token.cancelled || token.released || token.done) return;
            token.released = true;
            if (!token.catchUpOnRelease) {
              debug.lastCharge = {
                id: token.id,
                action: 'planned-release',
                abilityId: token.abilityId,
                targetDurationS: token.targetDurationS,
                stretchedRate: token.stretchedRate ?? null,
                atMs: Math.round(nowMs()),
              };
              return;
            }
            if (!token.ready || !token.ctx || !token.source) {
              finishChargeToken(token);
              return;
            }

            const now = token.ctx.currentTime;
            const param = token.source.playbackRate;
            try {
              param.cancelScheduledValues(now);
              param.setValueAtTime(token.catchUpRate, now);
            } catch (_) {
              param.value = token.catchUpRate;
            }
            debug.lastCharge = {
              id: token.id,
              action: 'early-release-catch-up',
              abilityId: token.abilityId,
              targetDurationS: token.targetDurationS,
              normalRate: token.normalRate,
              stretchedRate: token.stretchedRate,
              catchUpRate: token.catchUpRate,
              earlyReleaseNormalSpeedMul: token.earlyReleaseNormalSpeedMul,
              atMs: Math.round(nowMs()),
            };
          }

          function beginCharge(options = {}) {
            const requestedTarget = options.targetDurationS ?? options.durationS;
            const token = {
              id: ++chargeTokenSerial,
              abilityId: options.abilityId || null,
              category: options.category || null,
              targetDurationS: Number.isFinite(Number(requestedTarget)) && Number(requestedTarget) > 0
                ? Number(requestedTarget)
                : null,
              catchUpOnRelease: options.catchUpOnRelease === true,
              createdAtMs: nowMs(),
              ready: false,
              released: false,
              cancelled: false,
              done: false,
            };
            activeChargeTokens.add(token);

            preloadChargeBuffer().then(buffer => {
              if (!buffer || token.cancelled || token.released || token.done) {
                activeChargeTokens.delete(token);
                return;
              }

              const ctx = ensureAudioContext();
              if (!ctx) {
                finishChargeToken(token);
                return;
              }
              const normalRate = playbackRateFor(randomPitchSemitones(config.grunts?.pitchRandomSemitones ?? 0));
              const plan = chargeRatePlan(buffer.duration, token.targetDurationS, normalRate);
              const elapsedS = Math.max(0, (nowMs() - token.createdAtMs) / 1000);
              const sourceOffsetS = elapsedS * plan.stretchedRate;
              if (sourceOffsetS >= buffer.duration) {
                finishChargeToken(token); // Do not start stale audio if first-use decoding outlives the authored windup.
                return;
              }

              const output = chargeOutputGain(ctx);
              const when = ctx.currentTime + 0.003;
              token.ctx = ctx;
              token.buffer = buffer;
              token.output = output;
              token.normalRate = plan.normalRate;
              token.stretchedRate = plan.stretchedRate;
              token.catchUpRate = plan.catchUpRate;
              token.earlyReleaseNormalSpeedMul = plan.earlyReleaseNormalSpeedMul;
              token.ready = true;
              token.source = startChargeSource(ctx, buffer, output, when, sourceOffsetS, plan.stretchedRate);
              token.source.onended = () => finishChargeToken(token);

              debug.lastCharge = {
                id: token.id,
                action: token.catchUpOnRelease ? 'begin-live-stretch' : 'begin-predetermined-stretch',
                abilityId: token.abilityId,
                targetDurationS: token.targetDurationS,
                bufferDurationS: buffer.duration,
                normalRate: plan.normalRate,
                stretchedRate: plan.stretchedRate,
                catchUpRate: plan.catchUpRate,
                earlyReleaseNormalSpeedMul: plan.earlyReleaseNormalSpeedMul,
                atMs: Math.round(nowMs()),
              };
            }).catch(error => {
              finishChargeToken(token);
              recordPlaybackFailure('charge-start', error, config.assets?.chargeGrunt);
            });
            return token;
          }

          '''
          runtime = runtime[:start] + new_charge_block + runtime[end:]

          helper_start = runtime.index('  function isLiveSustainAbility(')
          helper_end = runtime.index('  function wrapBeginStagedAction(', helper_start)
          runtime = runtime[:helper_start] + '''  function isLiveStretchAbility(id) {
            const ids = config.grunts?.liveStretchAbilities || config.grunts?.liveSustainAbilities || [];
            return ids.includes(id);
          }

          ''' + runtime[helper_end:]
          runtime = replace_once(runtime, '          charge = beginCharge({ durationS: preImpactS, abilityId: context.id, category: context.category });', '          charge = beginCharge({ targetDurationS: preImpactS, abilityId: context.id, category: context.category });', 'predetermined charge start')
          runtime = replace_once(runtime, "          if (name === 'onHoldStart' && category === 'offensiveHold' && isLiveSustainAbility(id)) {", "          if (name === 'onHoldStart' && category === 'offensiveHold' && isLiveStretchAbility(id)) {", 'live helper call')
          runtime = replace_once(runtime, "            liveChargesByAbility.set(id, beginCharge({ abilityId: id, category }));", "            liveChargesByAbility.set(id, beginCharge({\n              abilityId: id,\n              category,\n              targetDurationS: liveChargeTargetDurationS(id),\n              catchUpOnRelease: true,\n            }));", 'live charge start')
          runtime = replace_once(runtime, '    playStrikeGrunt,\n    getConfig:', '    playStrikeGrunt,\n    chargeRatePlan,\n    liveChargeTargetDurationS,\n    getConfig:', 'runtime test/debug helper exports')
          runtime = replace_once(runtime, '''        durationS: token.durationS,
                ready: token.ready,
                released: token.released,
                cancelled: token.cancelled,'''.replace('                ', '        '), '''        targetDurationS: token.targetDurationS,
                catchUpOnRelease: token.catchUpOnRelease,
                normalRate: token.normalRate ?? null,
                stretchedRate: token.stretchedRate ?? null,
                catchUpRate: token.catchUpRate ?? null,
                ready: token.ready,
                released: token.released,
                cancelled: token.cancelled,'''.replace('                ', '        '), 'runtime debug token fields')
          runtime = runtime.replace('?v=20261013vocal1', '?v=20261013vocal2')
          runtime_path.write_text(runtime)

          config_path = Path('docs/config/combat/combat-vocalizations.json')
          config = json.loads(config_path.read_text())
          config['schema'] = 'hobunji_combat_vocalizations.v2'
          config.pop('chargeSampler', None)
          config['chargePlayback'] = {
              'earlyReleaseNormalSpeedMul': 2,
              'fullChargeDurationByAbility': {'chargedBreaker': 4}
          }
          grunts = config.setdefault('grunts', {})
          grunts.pop('liveSustainAbilities', None)
          grunts['liveStretchAbilities'] = ['chargedBreaker']
          config_path.write_text(json.dumps(config, indent=2) + '\n')

          tool_hub_path = Path('docs/js/tool-hub-combat-vocalization-tab.js')
          tool_hub = tool_hub_path.read_text()
          tool_hub = replace_once(
              tool_hub,
              "latestChange: 'Combat Vocalizations is a lazy Tool Hub tab with charge-sampler slicing and global utterance modulation authoring.',",
              "latestChange: 'Combat Vocalizations is a lazy Tool Hub tab with full-clip charge stretching, 2× normal-speed early-release catch-up, and global utterance modulation authoring.',",
              'tool hub latest change',
          )
          tool_hub_path.write_text(tool_hub)

          editor_path = Path('docs/tools/combat-vocalization-editor/index.html')
          editor = editor_path.read_text()
          editor = replace_once(
              editor,
              'Charge-grunt sustain slicing · breath/pain cadence · species + gender utterance modulation',
              'Full-clip charge stretching · early-release catch-up · breath/pain cadence · species + gender utterance modulation',
              'editor subtitle',
          )
          charge_start = editor.index('    <section class="card">\n      <h2>Charge Grunt Sustain Sampler</h2>')
          charge_end = editor.index('    <section class="card">\n      <h2>Heavy Breathing</h2>', charge_start)
          charge_markup = '''    <section class="card">
              <h2>Charge Grunt Stretch Playback</h2>
              <div class="muted">The entire charge grunt plays once and is stretched across the attack's 0→100% charge duration. Releasing a live hold early keeps the same playhead and plays the remainder at a multiple of <b>normal</b> voice speed—not a multiple of the stretched speed.</div>
              <div id="waveWrap"><canvas id="wave"></canvas></div>
              <div id="samplerStatus">Loading charge grunt…</div>
              <div class="row"><label>Early-release remainder × normal speed</label><input id="chargeCatchup" type="number" min=".1" max="8" step=".1"></div>
              <h3>Charged Breaker preview</h3>
              <div class="audition">
                <button id="fullPreview">Full 0→100%</button>
                <button data-release=".25">Release at 25%</button>
                <button data-release=".5">Release at 50%</button>
                <button data-release=".75">Release at 75%</button>
                <button id="stopPreview">Stop</button>
              </div>
            </section>

          '''
          editor = editor[:charge_start] + charge_markup + editor[charge_end:]

          script_start = editor.index('\n<script>\n(() => {')
          script_end = editor.index('\n</script>', script_start) + len('\n</script>')
          editor_script = r'''
          <script>
          (() => {
            'use strict';
            const CONFIG_URL='../../config/combat/combat-vocalizations.json';
            const SPECIES_URL='../../config/species/index.json';
            const ATTACK_VALUES_URL='../../config/combat/attack-values.json';
            const LOCAL_OVERRIDE_KEY='hobunji_combat_vocalizations_override_v1';
            const ASSET_PREFIX='../../';
            const $=id=>document.getElementById(id);
            let cfg=null,chargeBuffer=null,ctx=null,currentPreview=null,waveformPeaks=null,speciesEntries=[],fullChargeDurationS=4;
            const controls={
              chargeCatchup:['chargePlayback','earlyReleaseNormalSpeedMul'],
              breathHigh:['breath','intervalHighStaminaS'],breathLow:['breath','intervalLowStaminaS'],breathExhausted:['breath','exhaustedIntervalS'],
              breathPitch:['breath','pitchRandomSemitones'],breathVolume:['breath','volume'],
              painDot:['pain','dotRepeatS'],painPitch:['pain','pitchRandomSemitones'],painVolume:['pain','volume'],
              gruntPitch:['grunts','pitchRandomSemitones'],gruntVolume:['grunts','volume'],
            };
            function log(message,kind=''){const line=document.createElement('div');line.textContent=`[${new Date().toLocaleTimeString()}] ${message}`;if(kind)line.className=kind;$('log').appendChild(line);$('log').scrollTop=$('log').scrollHeight}
            function latest(message){$('latest').textContent=`Latest change: ${message}`;log(message)}
            function clamp(v,min,max){return Math.max(min,Math.min(max,Number(v)||0))}
            function valueAt(path){return path.reduce((v,k)=>v?.[k],cfg)}
            function setAt(path,value){let node=cfg;for(let i=0;i<path.length-1;i++)node=node[path[i]]||(node[path[i]]={});node[path[path.length-1]]=value}
            function audioContext(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw new Error('Web Audio is unavailable');ctx=new C()}ctx.resume?.();return ctx}
            function assetUrl(path){return new URL(ASSET_PREFIX+String(path||'').replace(/^\/+/,''),location.href).href}
            function selectedIdentity(){return{speciesId:$('species').value,gender:$('gender').value}}
            function profileFor(identity=selectedIdentity()){const root=cfg.utteranceModulation||(cfg.utteranceModulation={default:{},species:{}}),fallback=root.default?.[identity.gender]||root.default?.male||{pitchSemitones:0,tempo:1,gain:1},authored=identity.speciesId==='default'?root.default?.[identity.gender]:root.species?.[identity.speciesId]?.[identity.gender];return{pitchSemitones:Number(authored?.pitchSemitones??fallback.pitchSemitones??0),tempo:Number(authored?.tempo??fallback.tempo??1),gain:Number(authored?.gain??fallback.gain??1)}}
            function playbackRate(randomSpan=0){const p=profileFor(),random=(Math.random()*2-1)*Math.max(0,Number(randomSpan)||0);return clamp(p.tempo*Math.pow(2,(p.pitchSemitones+random)/12),.3,3)}
            function chargeRatePlan(bufferDurationS,targetDurationS,normalRate){const clip=Math.max(.001,Number(bufferDurationS)||.001),target=Number(targetDurationS)>0?Number(targetDurationS):clip,normal=Math.max(.02,Number(normalRate)||1),mul=Math.max(.1,Number(cfg.chargePlayback?.earlyReleaseNormalSpeedMul)||2);return{normalRate:normal,stretchedRate:clamp(normal*(clip/target),.02,32),catchUpRate:clamp(normal*mul,.02,32),mul}}
            async function decodeUrl(url){const res=await fetch(url);if(!res.ok)throw new Error(`HTTP ${res.status} for ${url}`);return new Promise((resolve,reject)=>{const c=audioContext();res.arrayBuffer().then(bytes=>{let settled=false;const ok=b=>{if(!settled){settled=true;resolve(b)}},bad=e=>{if(!settled){settled=true;reject(e)}};try{const r=c.decodeAudioData(bytes.slice(0),ok,bad);r?.then?.(ok,bad)}catch(e){bad(e)}}).catch(reject)})}
            function buildPeaks(){if(!chargeBuffer)return;const data=chargeBuffer.getChannelData(0),bins=1200,step=Math.max(1,Math.floor(data.length/bins));waveformPeaks=[];for(let x=0;x<bins;x++){let min=1,max=-1;const start=x*step,end=Math.min(data.length,start+step);for(let i=start;i<end;i++){const v=data[i];if(v<min)min=v;if(v>max)max=v}waveformPeaks.push([min,max])}}
            function drawWaveform(){const canvas=$('wave'),rect=$('waveWrap').getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(parseFloat(getComputedStyle(canvas).height)*dpr));const g=canvas.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);const w=rect.width,h=canvas.height/dpr;g.clearRect(0,0,w,h);g.strokeStyle='rgba(159,180,207,.72)';g.beginPath();if(waveformPeaks?.length){for(let x=0;x<w;x++){const idx=Math.floor(x/w*waveformPeaks.length),p=waveformPeaks[idx]||[0,0];g.moveTo(x,h/2+p[0]*h*.43);g.lineTo(x,h/2+p[1]*h*.43)}}g.stroke();g.fillStyle='rgba(106,167,255,.9)';g.font='11px system-ui';g.fillText('0% charge',8,h-9);const label='100% charge';g.fillText(label,Math.max(8,w-g.measureText(label).width-8),h-9)}
            function renderChargeStatus(){if(!chargeBuffer)return;const p=chargeRatePlan(chargeBuffer.duration,fullChargeDurationS,1);$('samplerStatus').textContent=`Source ${chargeBuffer.duration.toFixed(3)}s · 0→100% ${fullChargeDurationS.toFixed(3)}s · default stretch ${p.stretchedRate.toFixed(3)}× · early release ${p.mul.toFixed(2)}× normal`}
            async function loadCharge(){try{$('samplerStatus').className='';$('samplerStatus').textContent='Loading charge grunt…';chargeBuffer=await decodeUrl(assetUrl(cfg.assets.chargeGrunt));buildPeaks();drawWaveform();renderChargeStatus();latest(`charge grunt decoded; full-charge duration ${fullChargeDurationS.toFixed(3)}s`)}catch(e){$('samplerStatus').textContent=`Charge decode failed: ${e.message}`;$('samplerStatus').className='bad';log(e.message,'bad')}}
            function stopPreview(){if(!currentPreview)return;clearTimeout(currentPreview.timer);try{currentPreview.source?.stop()}catch(_){}try{currentPreview.output?.disconnect()}catch(_){}currentPreview=null}
            function releaseChargePreview(){if(!currentPreview||currentPreview.released)return;currentPreview.released=true;clearTimeout(currentPreview.timer);const now=audioContext().currentTime,p=currentPreview.source.playbackRate;try{p.cancelScheduledValues(now);p.setValueAtTime(currentPreview.plan.catchUpRate,now)}catch(_){p.value=currentPreview.plan.catchUpRate}log(`Early release: remainder ${currentPreview.plan.catchUpRate.toFixed(3)}× = ${currentPreview.plan.mul.toFixed(2)}× normal (${currentPreview.plan.normalRate.toFixed(3)}×), not 2× stretched.`)}
            function previewCharge(releaseFraction=null){if(!chargeBuffer){log('Charge grunt is not decoded yet.','bad');return}stopPreview();const c=audioContext(),profile=profileFor(),normalRate=playbackRate(cfg.grunts.pitchRandomSemitones),plan=chargeRatePlan(chargeBuffer.duration,fullChargeDurationS,normalRate),output=c.createGain();output.gain.value=clamp(cfg.grunts.volume*profile.gain,0,3);output.connect(c.destination);const source=c.createBufferSource();source.buffer=chargeBuffer;source.playbackRate.value=plan.stretchedRate;source.connect(output);source.start(c.currentTime+.005);currentPreview={source,output,plan,released:false,timer:0};source.onended=()=>{if(currentPreview?.source===source){log('Charge preview finished.');currentPreview=null;try{output.disconnect()}catch(_){}}};if(Number(releaseFraction)>0&&Number(releaseFraction)<1){currentPreview.timer=setTimeout(releaseChargePreview,fullChargeDurationS*Number(releaseFraction)*1000);log(`Preview: release at ${(Number(releaseFraction)*100).toFixed(0)}% (${(fullChargeDurationS*Number(releaseFraction)).toFixed(2)}s).`)}else log(`Preview: full 0→100% charge over ${fullChargeDurationS.toFixed(2)}s.`)}
            async function playOneShot(path,volume,pitchSpan){try{const a=new Audio(assetUrl(path)),p=profileFor();a.volume=clamp(Number(volume)*p.gain,0,1);a.playbackRate=playbackRate(pitchSpan);if('preservesPitch'in a)a.preservesPitch=false;if('webkitPreservesPitch'in a)a.webkitPreservesPitch=false;await a.play();log(`Audition: ${path.split('/').pop()} @ ${a.playbackRate.toFixed(3)}×`)}catch(e){log(`Audition failed: ${e.message}`,'bad')}}
            function renderAuditions(){$('breathAudition').innerHTML='';Object.entries(cfg.assets.breath||{}).forEach(([level,path])=>{const b=document.createElement('button');b.textContent=`Breath ${level}`;b.onclick=()=>playOneShot(path,cfg.breath.volume,cfg.breath.pitchRandomSemitones);$('breathAudition').appendChild(b)});$('painAudition').innerHTML='';Object.entries(cfg.assets.pain||{}).forEach(([level,path])=>{const b=document.createElement('button');b.textContent=`Pain ${level}`;b.onclick=()=>playOneShot(path,cfg.pain.volume,cfg.pain.pitchRandomSemitones);$('painAudition').appendChild(b)})}
            function renderControls(){for(const[id,path]of Object.entries(controls))$(id).value=valueAt(path);renderAuditions();renderProfile();updateJson();drawWaveform();renderChargeStatus()}
            function updateJson(){$('json').value=JSON.stringify(cfg,null,2)}
            function renderProfile(){const p=profileFor();$('profilePitch').value=p.pitchSemitones;$('profileTempo').value=p.tempo;$('profileGain').value=p.gain;$('removeProfile').disabled=$('species').value==='default'}
            function populateSpecies(){const options=[{speciesId:'default',label:'Default'}].concat(speciesEntries);$('species').innerHTML=options.map(e=>`<option value="${e.speciesId}">${e.label||e.speciesId}</option>`).join('')}
            async function loadAll(){stopPreview();try{const[configRes,speciesRes,attackRes]=await Promise.all([fetch(CONFIG_URL,{cache:'no-store'}),fetch(SPECIES_URL,{cache:'no-store'}),fetch(ATTACK_VALUES_URL,{cache:'no-store'})]);if(!configRes.ok)throw new Error(`config HTTP ${configRes.status}`);cfg=await configRes.json();speciesEntries=speciesRes.ok?(await speciesRes.json()).entries||[]:[];const attacks=attackRes.ok?await attackRes.json():{};fullChargeDurationS=Math.max(.05,Number(attacks?.chargedBreaker?.MAX_CHARGE_S)||Number(cfg.chargePlayback?.fullChargeDurationByAbility?.chargedBreaker)||4);populateSpecies();renderControls();await loadCharge();latest('repo configuration loaded')}catch(e){log(`Load failed: ${e.message}`,'bad');$('latest').textContent=`Load failed: ${e.message}`}}
            for(const[id,path]of Object.entries(controls)){$(id).addEventListener('input',()=>{setAt(path,Number($(id).value));updateJson();if(id==='chargeCatchup')renderChargeStatus()});$(id).addEventListener('change',()=>latest(`${id} = ${$(id).value}`))}
            $('species').addEventListener('change',()=>{renderProfile();renderChargeStatus()});$('gender').addEventListener('change',()=>{renderProfile();renderChargeStatus()});
            $('saveProfile').addEventListener('click',()=>{const id=selectedIdentity(),record={pitchSemitones:Number($('profilePitch').value)||0,tempo:clamp($('profileTempo').value,.35,3),gain:clamp($('profileGain').value,0,3)};cfg.utteranceModulation=cfg.utteranceModulation||{default:{},species:{}};if(id.speciesId==='default')cfg.utteranceModulation.default[id.gender]=record;else{cfg.utteranceModulation.species=cfg.utteranceModulation.species||{};const s=cfg.utteranceModulation.species[id.speciesId]||(cfg.utteranceModulation.species[id.speciesId]={});s[id.gender]=record}updateJson();renderChargeStatus();latest(`${id.speciesId}/${id.gender} modulation saved`)});
            $('removeProfile').addEventListener('click',()=>{const id=selectedIdentity();if(id.speciesId==='default')return;const s=cfg.utteranceModulation?.species?.[id.speciesId];if(s){delete s[id.gender];if(!Object.keys(s).length)delete cfg.utteranceModulation.species[id.speciesId]}renderProfile();updateJson();renderChargeStatus();latest(`${id.speciesId}/${id.gender} now inherits default`)});
            $('fullPreview').onclick=()=>previewCharge(null);document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>previewCharge(Number(b.dataset.release)));$('stopPreview').onclick=stopPreview;
            $('attackGrunt').onclick=()=>playOneShot(cfg.assets.comboAttackGrunts?.[0],cfg.grunts.volume,cfg.grunts.pitchRandomSemitones);$('releaseGrunt').onclick=()=>playOneShot(cfg.assets.releaseGrunt,cfg.grunts.volume,cfg.grunts.pitchRandomSemitones);
            $('reload').onclick=loadAll;$('applyLocal').onclick=()=>{try{localStorage.setItem(LOCAL_OVERRIDE_KEY,JSON.stringify(cfg));latest('local game preview override saved; reload/open game to use it')}catch(e){log(e.message,'bad')}};$('clearLocal').onclick=()=>{localStorage.removeItem(LOCAL_OVERRIDE_KEY);latest('local game preview override cleared')};
            $('copyJson').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(cfg,null,2));latest('JSON copied to clipboard')}catch(e){log(e.message,'bad')}};$('downloadJson').onclick=()=>{const blob=new Blob([JSON.stringify(cfg,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='combat-vocalizations.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);latest('combat-vocalizations.json downloaded')};
            $('json').addEventListener('change',()=>{try{cfg=JSON.parse($('json').value);renderControls();loadCharge();latest('JSON textarea parsed and applied')}catch(e){log(`JSON parse failed: ${e.message}`,'bad')}});
            new ResizeObserver(drawWaveform).observe($('waveWrap'));loadAll();
          })();
          </script>'''
          editor_script = '\n'.join(line[10:] if line.startswith('          ') else line for line in editor_script.splitlines())
          editor = editor[:script_start] + '\n' + editor_script + editor[script_end:]
          editor_path.write_text(editor)

          test_path = Path('scripts/test-combat-vocalizations.js')
          test = test_path.read_text()
          test = replace_once(test, "assert.equal(context.window.CombatVocalizations.version, 1);", "assert.equal(context.window.CombatVocalizations.version, 2);", 'test runtime version')
          test = replace_once(test, 'context.window.Combat = {\n  deps: { player },', 'context.window.Combat = {\n  deps: { player },\n  chargedBreakerData: { MAX_CHARGE_S: 4 },', 'test charged data')
          anchor = "assert.equal(typeof scheduledBreath, 'function', 'breath loop should use shared scheduler');\n"
          insertion = '''\nconst chargePlan = context.window.CombatVocalizations.chargeRatePlan(1.2, 4, 1.25);\nassert(Math.abs(chargePlan.stretchedRate - 0.375) < 1e-9, 'full clip should stretch across the authored charge duration');\nassert(Math.abs(chargePlan.catchUpRate - 2.5) < 1e-9, 'early release must switch to 2x NORMAL speed, not 2x stretched speed');\nassert(Math.abs(chargePlan.catchUpRate - chargePlan.stretchedRate * 2) > 1, 'catch-up rate must be independent of the stretched rate');\nassert.equal(chargePlan.earlyReleaseNormalSpeedMul, 2);\nassert.equal(context.window.CombatVocalizations.liveChargeTargetDurationS('chargedBreaker'), 4, 'live charge should reuse Charged Breaker MAX_CHARGE_S');\nassert.equal(context.window.CombatVocalizations.getConfig().chargeSampler, undefined, 'legacy start/middle/end sampler config should be gone');\n'''
          test = replace_once(test, anchor, anchor + insertion, 'test charge plan assertions')
          test_path.write_text(test)
          PY
