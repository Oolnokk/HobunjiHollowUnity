name: Temp Mammakh Cache Fix

on:
  push:
    branches: [mammakhbuur-head-placeholders]

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mammakhbuur-head-placeholders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Advance cache chain from branch merge base
        run: node scripts/check-cache-busts.js --fix 697cd479c091c2b5f8c7d216befa33646df36910
      - name: Run regression suite
        run: node scripts/run-tests.js
      - name: Commit cache fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git commit -m "Advance cache chain for Mammakhbuur appearance"
          git push origin HEAD:mammakhbuur-head-placeholders
