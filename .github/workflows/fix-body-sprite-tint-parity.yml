name: Fix body sprite tint parity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/wavy-limbs-medium-gray-stone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wavy-limbs-medium-gray-stone
          fetch-depth: 0

      - name: Scope config rename to rocks and cliffs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/fix-body-sprite-tint-parity.py')
          text = path.read_text(encoding='utf-8')
          old = "replace_exact(config, \"tintTreatment: 'ground-shade-fill'\", \"tintTreatment: 'body-sprite-tint'\", count=2)"
          new = r"""replace_exact(config, "    rocks: {\n        enabled: true,\n        tint: '#808080',\n        tintTreatment: 'ground-shade-fill',", "    rocks: {\n        enabled: true,\n        tint: '#808080',\n        tintTreatment: 'body-sprite-tint',")
          replace_exact(config, "    cliffs: {\n        enabled: true,\n        tint: '#808080',\n        tintTreatment: 'ground-shade-fill',", "    cliffs: {\n        enabled: true,\n        tint: '#808080',\n        tintTreatment: 'body-sprite-tint',")"""
          if text.count(old) != 1:
              raise SystemExit('Expected one config treatment patch marker')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply exact body sprite tint parity patch
        shell: bash
        run: python .github/fix-body-sprite-tint-parity.py

      - name: Validate tint parity patch
        shell: bash
        run: |
          python -m py_compile .github/fix-body-sprite-tint-parity.py
          node --check docs/js/portrait-utils.js
          node --check docs/js/procedural-hand-attachments.js
          node --check docs/js/natural-surface-materials.js
          node --check docs/config/natural-surface-materials.js
          git diff --check

      - name: Commit fix and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/fix-body-sprite-tint-parity.py .github/workflows/fix-body-sprite-tint-parity.yml
          rm -rf .github/__pycache__
          git add docs/js/portrait-utils.js docs/js/procedural-hand-attachments.js docs/js/natural-surface-materials.js docs/config/natural-surface-materials.js
          git commit -m "Match hand and stone tinting to body sprites"
          git push origin HEAD:fix/wavy-limbs-medium-gray-stone
