name: Verify shoulder pet X-ray isolation

on:
  push:
    branches:
      - fix/shoulder-pet-follow-authored-pixel

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game syntax
        run: node --check docs/game.js
      - name: Check avatar module syntax
        run: node --check docs/js/png-plane-avatar.js
      - name: Run shoulder pet regressions
        run: node scripts/test-shoulder-pet-attack-rotation.js
