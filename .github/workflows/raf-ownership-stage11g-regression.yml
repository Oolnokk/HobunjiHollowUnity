name: RAF ownership Stage 11g regression (performance debug loops)

on:
  pull_request:
    paths:
      - 'docs/js/performance-debug.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-performance-debug-scheduler.js'
      - '.github/workflows/raf-ownership-stage11g-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/performance-debug.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-performance-debug-scheduler.js'
      - '.github/workflows/raf-ownership-stage11g-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/performance-debug.js
      - name: Performance debug scheduler migration
        run: node scripts/test-performance-debug-scheduler.js
