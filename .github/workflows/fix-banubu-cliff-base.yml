name: Validate Banubu Cliff Base

on:
  push:
    branches:
      - chatgpt/locale-terrain-anchors
    paths:
      - '.github/workflows/fix-banubu-cliff-base.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/locale-terrain-anchors
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run locale regressions and publish diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== syntax locale cave runtime ==='
            node --check docs/js/locale-cave-runtime.js
            echo "exit=$?"
            echo '=== syntax zone renderer ==='
            node --check docs/js/zone-den-totem-features.js
            echo "exit=$?"
            echo '=== generic terrain placement ==='
            node scripts/test-locale-terrain-placement.js
            echo "exit=$?"
            echo '=== Banubu authored/runtime ==='
            node scripts/test-banubu-cave-locale.js
            echo "exit=$?"
            echo '=== Banubu real Northern Cliffs ==='
            node scripts/test-banubu-wilderness-lab-generation.js
            echo "exit=$?"
          } > scripts/tmp-banubu-validation.txt 2>&1
          cat scripts/tmp-banubu-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/tmp-banubu-validation.txt
          git commit -m 'Record Banubu cliff-base validation'
          git push origin HEAD:chatgpt/locale-terrain-anchors
