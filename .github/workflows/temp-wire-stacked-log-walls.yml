name: Temporary stacked log integration
on:
  push:
    branches:
      - feature/log-cabin-wall-generator
permissions:
  contents: write
jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/log-cabin-wall-generator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair patch-script anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/temp-wire-stacked-log-walls.py')
          text = path.read_text()
          text = text.replace("$('applyGridBtn').addEventListener", "$('applyGridBtn').onclick")
          old = "interior_controls + '      </div>\\n    </div>\\n\\n    <div class=\"section\">\\n      <h2>2. Grid canvas size</h2>')"
          if old in text:
              text = text.replace(old, "interior_controls)", 1)
          text = text.replace("Path('scripts/test-stacked-log-walls.js').write_text(r'''\\\n", "Path('scripts/test-stacked-log-walls.js').write_text(r'''\n")
          path.write_text(text)
          PY
      - name: Wire generated stacked logs
        run: python scripts/temp-wire-stacked-log-walls.py
      - name: Add opening-aware source-log cuts
        run: python scripts/temp-stacked-log-opening-cuts.py
      - name: Refresh cache busts
        run: |
          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/test-stacked-log-walls.js
          if ! git diff --cached --quiet; then
            git commit -m "Finish exact-span stacked log wall integration"
            git push origin HEAD:feature/log-cabin-wall-generator
          fi
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('scripts/runtime-frame-ownership-exceptions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/config/loot/loot-pools.json', 'utf8'))"
      - name: Validate cache busts
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/check-cache-busts.js FETCH_HEAD
      - name: Stacked log regression
        run: node scripts/test-stacked-log-walls.js
      - name: Full regression suite
        run: node scripts/run-tests.js
