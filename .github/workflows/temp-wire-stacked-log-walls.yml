name: Temporary stacked log integration
on:
  push:
    branches:
      - feature/log-cabin-wall-generator
permissions:
  contents: write
jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/log-cabin-wall-generator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire generated stacked logs
        run: python scripts/temp-wire-stacked-log-walls.py
      - name: Refresh cache busts
        run: |
          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/test-stacked-log-walls.js
          if ! git diff --cached --quiet; then
            git commit -m "Add foliage-generated stacked log walls to structure editors"
            git push origin HEAD:feature/log-cabin-wall-generator
          fi
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('scripts/runtime-frame-ownership-exceptions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/config/loot/loot-pools.json', 'utf8'))"
      - name: Validate cache busts
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/check-cache-busts.js FETCH_HEAD
      - name: Stacked log regression
        run: node scripts/test-stacked-log-walls.js
      - name: Full regression suite
        run: node scripts/run-tests.js
