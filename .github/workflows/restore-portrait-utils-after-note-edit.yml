name: Restore validated portrait utils
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.pull_request.head.ref == 'fix/wavy-limbs-medium-gray-stone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore validated source
        run: |
          git checkout 86109d3a94f0bec15a5ad91d6ce8d0d6e9a0bdf2 -- docs/js/portrait-utils.js
          node --check docs/js/portrait-utils.js
          git diff --check
      - name: Remove restore workflow and commit
        run: |
          rm -f .github/workflows/restore-portrait-utils-after-note-edit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore validated PNG contrast implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
