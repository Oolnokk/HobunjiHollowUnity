name: Inspect animal dialogue adapter seams

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/inspect-animal-dialogue-adapter-temp.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
      - name: Print livestock facing seams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path, markers in [
            ('docs/js/farm-animals.js', ['updateHeadYaw', 'updateHeadPitch', 'perpClamp', 'makePatternLivestockAnimal', 'makeUumkaoiiAnimal', '_dialogueFrozen']),
            ('docs/js/png-plane-avatar.js', ['avatarRef.updateHeadYaw', 'avatarRef.updateHeadPitch']),
          ]:
            s = Path(path).read_text()
            print('\n######## ' + path + ' ########')
            for marker in markers:
              pos = 0
              count = 0
              while True:
                i = s.find(marker, pos)
                if i < 0: break
                count += 1
                print(f'\n===== {marker} #{count} =====')
                print(s[max(0,i-1400):min(len(s),i+3600)])
                pos = i + len(marker)
                if count >= 6: break
          PY
