name: Inspect animal dialogue adapter seams

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/inspect-animal-dialogue-adapter-temp.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
      - name: Print dialogue staging seams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('docs/game.js').read_text()
          for marker in [
              'function beginNpcDialogueStaging',
              'function updateNpcDialogueStaging',
              'function faceNpcDialogueParticipants',
              'function _aimNeckAtEyeContact',
              'function createLivestockDialogueCameraTarget',
              'async function openLivestockDialogue',
          ]:
              i = s.find(marker)
              print('\n===== ' + marker + ' =====')
              if i < 0:
                  print('NOT FOUND')
                  continue
              a = max(0, i - 1200)
              b = min(len(s), i + 5200)
              print(s[a:b])
          PY
