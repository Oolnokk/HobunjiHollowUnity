name: Wire animals into NPC dialogue actor contract

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/inspect-animal-dialogue-adapter-temp.yml

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
          fetch-depth: 0
      - name: Restore pre-experiment version
        run: git checkout 02b268c3c6602c853f87cb8d95d2e889d71f331d -- docs/game.js scripts/test-livestock-dialogue-chatheads.js
      - name: Apply animal NPC adapter
        run: |
          printf '%s' '' | base64 -d > /tmp/animal-dialogue-adapter.py
          python3 /tmp/animal-dialogue-adapter.py
      - name: Run regressions
        run: |
          node --check docs/game.js
          node --check docs/js/farm-animals.js
          node --check docs/js/animal-vocalizations.js
          node scripts/test-animal-chathead-framing.js
          node scripts/test-animal-chathead-ambient.js
          node scripts/test-animal-head-rig-runtime.js
          node scripts/test-livestock-dialogue-chatheads.js
          node scripts/test-npc-facing-deadzone.js
      - name: Commit final adapter and remove helper
        run: |
          git rm .github/workflows/inspect-animal-dialogue-adapter-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/game.js docs/index.html scripts/test-livestock-dialogue-chatheads.js
          git commit -m "Wire livestock into NPC dialogue actor contract"
          git push origin HEAD:codex/animal-chathead-framing
