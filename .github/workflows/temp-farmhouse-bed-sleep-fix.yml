name: Temp Farmhouse Bed Sleep Fix

on:
  push:
    branches: [fix/starting-farmhouse-bed-sleep-20261015]

permissions:
  contents: write

jobs:
  fix-cache-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/starting-farmhouse-bed-sleep-20261015
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh branch-local regressions and cache-bust chain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git fetch origin main
          rm .github/workflows/temp-farmhouse-bed-sleep-fix.yml
          rm -f regression-failure.txt
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-devotion-rest-buffs.js')
          text = path.read_text()
          old = "assert.match(sleepBridge, /if \\(code === 'KeyE'\\) \\{ armOwnedBedSleep\\(\\); return; \\}/, 'legacy E-key bed Sleep arms the same token before CalendarSystem handles it');"
          new = "assert.match(sleepBridge, /function openSharedSleepPassage\\(\\)[\\s\\S]{0,300}armOwnedBedSleep\\(\\)[\\s\\S]{0,300}open\\.call\\(window\\.CalendarSystem, 'sleep'\\)/, 'all bed Sleep input paths arm the same token before opening the shared Sleep passage');\nassert.match(sleepBridge, /function onKeyDown\\(event\\)[\\s\\S]{0,1200}consumeEvent\\(event\\)[\\s\\S]{0,400}armedKeyCode = code/, 'parser-time Sleep bridge captures the displayed Sleep key before legacy game input');"
          if old not in text:
              raise SystemExit('expected stale devotion/rest Sleep assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/check-cache-busts.js --fix origin/main
      - name: Syntax check touched runtime bridges
        run: |
          node --check docs/js/sleep-passage-action-bridge.js
          node --check docs/js/controller-modern-flow-bridge.js
          node --check docs/js/combat/combat-config-loader.js
          node --check scripts/test-devotion-rest-buffs.js
      - name: Run farmhouse sleep regressions
        run: |
          node scripts/test-sleep-passage-action-bridge.js
          node scripts/test-controller-modern-flow-bridge.js
          node scripts/test-devotion-rest-buffs.js
      - name: Run full regression suite
        shell: bash
        run: |
          set +e
          node scripts/run-tests.js 2>&1 | tee /tmp/farmhouse-bed-regression.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 240 /tmp/farmhouse-bed-regression.log > regression-failure.txt
            exit "$status"
          fi
      - name: Publish regression failure diagnostics
        if: failure()
        run: |
          if [ -f regression-failure.txt ]; then
            git add regression-failure.txt
            git commit -m "Capture farmhouse sleep regression failure"
            git push origin HEAD:fix/starting-farmhouse-bed-sleep-20261015
          fi
      - name: Commit validated fix and remove temporary workflow
        if: success()
        run: |
          git add -A
          git commit -m "Refresh farmhouse sleep regressions and cache-bust chain"
          git push origin HEAD:fix/starting-farmhouse-bed-sleep-20261015
