name: RAF ownership Stage 12f regression (combat core exterior tracker)

on:
  pull_request:
    paths:
      - 'docs/js/combat/combat-core.js'
      - 'docs/js/performance-loop-optimizations.js'
      - 'scripts/test-combat-core-exterior-tracker-timer.js'
      - '.github/workflows/raf-ownership-stage12f-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/combat/combat-core.js'
      - 'docs/js/performance-loop-optimizations.js'
      - 'scripts/test-combat-core-exterior-tracker-timer.js'
      - '.github/workflows/raf-ownership-stage12f-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check docs/js/combat/combat-core.js
          node --check docs/js/performance-loop-optimizations.js
      - name: Combat core exterior tracker timer conversion
        run: node scripts/test-combat-core-exterior-tracker-timer.js
