name: RAF ownership Stage 5 regression

on:
  pull_request:
    paths:
      - 'docs/js/combat/quick-attack-bonus-indicator.js'
      - 'docs/index.html'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-quick-attack-bonus-indicator-scheduler.js'
      - 'scripts/test-transient-attack-alignment.js'
      - '.github/workflows/raf-ownership-stage5-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/combat/quick-attack-bonus-indicator.js'
      - 'docs/index.html'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-quick-attack-bonus-indicator-scheduler.js'
      - 'scripts/test-transient-attack-alignment.js'
      - '.github/workflows/raf-ownership-stage5-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/combat/quick-attack-bonus-indicator.js
      - name: Quick Attack pre-game scheduler migration
        run: node scripts/test-quick-attack-bonus-indicator-scheduler.js
