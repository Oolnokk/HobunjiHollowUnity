name: Temp NPC Regression Diagnose

on:
  push:
    branches: [fix/npc-collision-aware-pathing]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npc-collision-aware-pathing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture regression output
        shell: bash
        run: |
          set +e
          node scripts/run-tests.js > .tmp-npc-regression.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            rm -f .tmp-npc-regression.log
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git add -f .tmp-npc-regression.log
          git commit -m "Capture NPC regression failure output"
          git push origin HEAD:fix/npc-collision-aware-pathing
          exit "$status"
