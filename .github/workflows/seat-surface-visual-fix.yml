name: Temporary transformed seat visual fix

on:
  push:
    branches:
      - fix/interior-seat-surface-post-transform
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/interior-seat-surface-post-transform
          fetch-depth: 0
      - name: Patch authored visual handling
        run: python scripts/patch-seat-surface-visual-fix.py
      - name: Verify transformed seat visuals and integration
        run: |
          node --check docs/js/seat-surface-placement-transform.js
          node --check scripts/test-interior-seat-surface-visual-alias.js
          node scripts/test-interior-seat-surface-post-transform.js
          node scripts/test-interior-seat-surface-three-math.js
          node scripts/test-interior-seat-surface-visual-alias.js
          node scripts/test-outdoor-furniture-and-npc-seating.js
          node scripts/test-npc-social-seating.js
          node scripts/test-furniture-vessel-runtime.js
          node scripts/test-interior-fire-floor.js
      - name: Commit repair and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/js/seat-surface-placement-transform.js
          git rm .github/workflows/seat-surface-visual-fix.yml scripts/patch-seat-surface-visual-fix.py
          git commit -m "Keep transformed seats on authored furniture visuals"
          git push origin HEAD:fix/interior-seat-surface-post-transform
