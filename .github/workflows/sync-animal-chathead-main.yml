name: Inspect livestock dialogue integration points

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/sync-animal-chathead-main.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
      - name: Inspect dialogue and farm-animal hooks
        run: |
          echo '=== openNpcDialogue ==='
          grep -n -A120 -B20 'function openNpcDialogue' docs/game.js || true
          echo '=== FarmAnimals init ==='
          grep -n -A150 -B20 'FarmAnimals.*init\|window.FarmAnimals.init' docs/game.js || true
          echo '=== dialogue camera modes ==='
          grep -n -A80 -B20 "npcDialogue\|dialogue.*camera\|cameraMode.*dialog" docs/game.js | head -n 500 || true
          echo '=== interaction button routing ==='
          grep -n -A100 -B20 'getButtons' docs/game.js | head -n 400 || true
