name: Sync animal chathead branch with main

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/sync-animal-chathead-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/animal-chathead-framing
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
      - name: Run animal chathead regressions
        run: |
          node scripts/test-animal-chathead-framing.js
          node scripts/test-animal-chathead-ambient.js
          node scripts/test-animal-head-rig-runtime.js
      - name: Push merge
        run: git push origin HEAD:codex/animal-chathead-framing
