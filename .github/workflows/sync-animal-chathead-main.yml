name: Implement livestock dialogue with authored head framing

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/sync-animal-chathead-main.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
          fetch-depth: 0
      - name: Apply livestock dialogue integration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1) Bake the user's five authored head-frame rectangles into the canonical rig profile.
          p = Path('docs/config/attachment-rig-profiles.js')
          s = p.read_text()
          ground_block = """  const creatureGroundOffsets = Object.freeze({
              drenkirra: Object.freeze({ large: 0.79, medium: 0.40, small: 0.17 }),
              grehlr: Object.freeze({ large: 0.50, medium: 0.26, small: 0.10 }),
              'gar-wolf': Object.freeze({ large: 0.50, medium: 0.33, small: 0.11 }),
              'dabinggi-hound': Object.freeze({ large: 0.50, medium: 0.27, small: 0.09 }),
              uumkaoii: Object.freeze({ large: 0.69, medium: 0.48, small: 0.09 }),
            }); // Authored v10 Small/Medium/Large floor-to-creature-origin distances; 0 means use the automatic half-height terrain baseline.
          """
          frame_block = ground_block + """
            // Species-wide dialogue portrait crops exported from Animation Author V15.45.
            // Coordinates are normalized against the unscaled idle sprite, top-left origin;
            // runtime size-class/genotype scaling happens after this crop is identified.
            const creatureChatheadFrames = Object.freeze({
              grehlr: Object.freeze({ x: 0.12899040207823892, y: 0.38396704728631864, width: 0.24202339114154608, height: 0.3445860779359126, coordinateSpace: 'sprite-normalized-top-left', version: 1 }),
              'gar-wolf': Object.freeze({ x: 0, y: 0.2575, width: 0.25, height: 0.3575, coordinateSpace: 'sprite-normalized-top-left', version: 1 }),
              'dabinggi-hound': Object.freeze({ x: 0.05321196485715341, y: 0.2621006265961596, width: 0.17863723264419087, height: 0.350903183334192, coordinateSpace: 'sprite-normalized-top-left', version: 1 }),
              drenkirra: Object.freeze({ x: 0.1925, y: 0.3575, width: 0.2078, height: 0.305, coordinateSpace: 'sprite-normalized-top-left', version: 1 }),
              uumkaoii: Object.freeze({ x: 0.009564166583519832, y: 0.2923510947804583, width: 0.4656387672084861, height: 0.47038721094834346, coordinateSpace: 'sprite-normalized-top-left', version: 1 }),
            });
          """
          s = replace_once(s, ground_block, frame_block, 'attachment frame constants')
          s = replace_once(s, """    creatures[kind] = {
                kind,
          """, """    creatures[kind] = {
                kind,
                chatheadFrame: { ...creatureChatheadFrames[kind] }, // Canonical crop used by ambient chatheads, animal-looking NPCs, and livestock full dialogue.
          """, 'attachment creature chathead field')
          semantics_anchor = """    creatureGroundOffsetSemantics: {
                profileField: 'profiles.creatures.<kind>.groundOffsets.<small|medium|large>',
                coordinateSpace: 'absolute world/gameplay floor-to-creature-origin lift replacing automatic half-height terrain placement',
                runtimeUnit: 'world units',
              }, // Mirrors the Animation Author v10 export contract consumed by CreatureGenetics.creatureGroundOffset().
          """
          semantics_add = semantics_anchor + """    creatureChatheadFrameSemantics: {
                coordinateSpace: 'sprite-normalized-top-left',
                sourceFrame: 'idle creature sprite before size-class scaling',
                use: 'ambient dialogue chatheads, livestock full dialogue, and animal-looking full-dialogue portraits',
                specialNpcSpecies: { banubu: 'grehlr', hiki_hiki: 'drenkirra' },
              },
          """
          s = replace_once(s, semantics_anchor, semantics_add, 'attachment chathead semantics')
          p.write_text(s)

          # 2) Let the animal-vocalization profile also provide decoupled, authored livestock talk lines.
          p = Path('docs/js/animal-vocalizations.js')
          s = p.read_text()
          s = replace_once(s,
              "const raw = String(c?.creatureKey || c?.speciesKey || c?.species || c?.def?.key || '').toLowerCase();",
              "const raw = String(c?.creatureKey || c?.animalKey || c?.speciesKey || c?.species || c?.def?.key || '').toLowerCase();",
              'animalKey species resolver')
          s = replace_once(s, """      growl: mergeKind(PROFILE_DEFAULTS.growl, common.growl, species.growl),
                // Recording base tuning is deliberately global: the same indexed sound
          """, """      growl: mergeKind(PROFILE_DEFAULTS.growl, common.growl, species.growl),
                dialogueLines: Array.isArray(species.dialogueLines)
                  ? [...species.dialogueLines]
                  : Array.isArray(common.dialogueLines) ? [...common.dialogueLines] : [],
                // Recording base tuning is deliberately global: the same indexed sound
          """, 'vocalization dialogue lines profile')
          s = replace_once(s, """  function companionDiscovery(c, reason, opts = {}) { return request(c, 'warning', { ...opts, reason }); }
          """, """  function dialogueLinesFor(c) {
              return (profileFor(c).dialogueLines || []).filter(line => String(line || '').trim());
            }

            function companionDiscovery(c, reason, opts = {}) { return request(c, 'warning', { ...opts, reason }); }
          """, 'vocalization dialogue accessor')
          s = replace_once(s, """    headNodOffsetDeg,
                debugSnapshot,
          """, """    headNodOffsetDeg,
                dialogueLinesFor,
                debugSnapshot,
          """, 'vocalization export')
          p.write_text(s)

          # 3) Author short ordinary talk responses in the existing animal-vocalization config.
          p = Path('docs/config/dialogue/ambient-dialogue.json')
          s = p.read_text()
          talk_lines = {
              'drenkirra': ['Krrik-krrik!', 'Chrrup!', 'Tik-tik-tik!'],
              'grehlr': ['Hrrrmm!', 'Mrrup!', 'Hrru-hrru!'],
              'gar-wolf': ['Rrrrowf!', 'Awrf!', 'Snrrf…!'],
              'dabinggi-hound': ['Hreeeee!!!', 'Bzzzarf!!!', 'Bzee-bee-beee!!!'],
          }
          for kind, lines in talk_lines.items():
              old = f'    "{kind}": {{\n      "chatter": {{'
              lines_json = ',\n        '.join('"' + line + '"' for line in lines)
              new = f'    "{kind}": {{\n      "dialogueLines": [\n        {lines_json}\n      ],\n      "chatter": {{'
              s = replace_once(s, old, new, f'{kind} dialogue lines')
          animal_start = s.index('  "animalVocalizations": {')
          crowd_marker = '\n  },\n  "crowdLines": {'
          crowd_at = s.index(crowd_marker, animal_start)
          before = s[:crowd_at]
          if not before.endswith('    }'):
              raise SystemExit('uumkaoii insertion: unexpected animalVocalizations ending')
          before = before[:-5] + """    },
                "uumkaoii": {
                  "dialogueLines": [
                    "Uuummm.",
                    "Kao-kao!",
                    "Mrruu?"
                  ]
                }"""
          s = before + s[crowd_at:]
          p.write_text(s)

          # 4) Put Talk into the livestock interaction stack: collect first when ready, talk second;
          # otherwise Talk is first. Potion administration remains available after those core actions.
          p = Path('docs/js/farm-animals.js')
          s = p.read_text()
          start = s.index('  function _farmAnimalGetButtons(animal, label, icon) {')
          end = s.index('\n  function _farmAnimalOnAction', start)
          old = s[start:end]
          new = """  function _farmAnimalGetButtons(animal, label, icon) {
              if (animal._vatWorkPose) return []; // Used to prevent interacting with an animal while its rendered body is working at a vat.
              const rec = deps.loadWorldLivestock().find(l => l.id === animal.livestockId);
              const resDef = rec ? deps.LIVESTOCK_RESOURCE_DEFS[rec.kind] : null;
              const buttons = [];
              const resourceReady = !!(rec?.resourceReady && resDef);

              // Harvest is Action 1 while a good is ready. Talk follows as Action 2;
              // as soon as the good is collected, Talk naturally slides into Action 1.
              if (resourceReady) {
                const itemLabel = deps.ITEM_DEFS[resDef.itemKey]?.label || resDef.itemKey;
                const verb = deps.LIVESTOCK_RESOURCE_VERB[rec.kind] || 'Collect';
                buttons.push({ icon: deps.ITEM_DEFS[resDef.itemKey]?.icon || icon, label: `${verb} ${itemLabel}`, action: 'obj_collect_' + animal.id, style: 'primary', allowed: true });
              }
              const talkName = rec?.name || label;
              buttons.push({ icon: '💬', label: `Talk to ${talkName}`, action: 'obj_talk_' + animal.id, style: resourceReady ? 'secondary' : 'primary', allowed: true });

              const heldKey = deps.getHeldItemKey?.(); // Ordinary held-item selection is the only administration source.
              const heldPayload = heldKey && (window.AlchemySystem?.POTION_ITEMS?.[heldKey] || window.AlchemySystem?.parseBrewedItemKey?.(heldKey)); // Stored recipe/tier payload.
              const heldRecipe = heldPayload?.recipeId && window.AlchemySystem?.RECIPE_DEFS?.[heldPayload.recipeId]; // Explicit use-mode definition.
              if (heldRecipe?.useMode === 'livestock' && (deps.inventory[heldKey] || 0) > 0) {
                buttons.push({ icon: heldRecipe.icon, label: `Administer ${heldRecipe.label}`, action: `obj_alchemy_${animal.id}`, style: 'secondary', allowed: true });
              }
              return buttons;
            }
          """
          s = s[:start] + new + s[end:]

          action_anchor = """  function _farmAnimalOnAction(animal, action, fallbackMessage) {
              if (action === 'obj_alchemy_' + animal.id) return administerBreedingPotion(animal.livestockId, deps.getHeldItemKey?.());
          """
          action_new = """  function _farmAnimalOnAction(animal, action, fallbackMessage) {
              if (action === 'obj_talk_' + animal.id) {
                const rec = deps.loadWorldLivestock().find(l => l.id === animal.livestockId);
                if (!rec) return { ok: false, message: 'Livestock not found.' };
                const lines = window.AnimalVocalizations?.dialogueLinesFor?.(animal) || [];
                const line = lines.length ? lines[Math.floor(deps.rnd() * lines.length)] : '...';
                deps.openLivestockDialogue?.(animal, rec, [line]);
                return { ok: true };
              }
              if (action === 'obj_alchemy_' + animal.id) return administerBreedingPotion(animal.livestockId, deps.getHeldItemKey?.());
          """
          s = replace_once(s, action_anchor, action_new, 'farm talk action')

          count = s.count('halfHeight: halfH, groundLift, modelHeight: ANIMAL_H, avatarRef,')
          if count != 2:
              raise SystemExit(f'farm modelWidth insertion: expected 2 livestock factories, found {count}')
          s = s.replace('halfHeight: halfH, groundLift, modelHeight: ANIMAL_H, avatarRef,', 'halfHeight: halfH, groundLift, modelWidth: ANIMAL_W, modelHeight: ANIMAL_H, avatarRef,')
          s = s.replace('if (this._harvestFrozen) return;', 'if (this._harvestFrozen || this._dialogueFrozen) return;')
          update_pat = 'update(dt) {\n        if (_applyVatWorkPose(this)) return;'
          count = s.count(update_pat)
          if count != 2:
              raise SystemExit(f'farm dialogue update freeze: expected 2 update methods, found {count}')
          s = s.replace(update_pat, "update(dt) {\n        if (_applyVatWorkPose(this)) return;\n        if (this._dialogueFrozen) { _tickFarmAnimalBlink(this); return; }")
          p.write_text(s)

          # 5) Reuse the actual NPC dialogue shell/camera while explicitly skipping humanoid-only
          # staging and NPC quest/favor/shop metadata for livestock.
          p = Path('docs/game.js')
          s = p.read_text()
          s = replace_once(s, '      async function openNpcDialogue(walker) {', '      async function openNpcDialogue(walker, options = {}) {', 'openNpcDialogue options')
          s = replace_once(s,
              "        window.DialogueContent?.recordNpcMemory(rec?.id, 'talked');",
              "        if (options.recordMemory !== false) window.DialogueContent?.recordNpcMemory(rec?.id, 'talked');",
              'dialogue memory option')
          s = replace_once(s, '        activeCameraTarget = walker.root;', '        activeCameraTarget = options.cameraTarget || walker.root;', 'dialogue custom camera target')
          s = replace_once(s, '        beginNpcDialogueStaging(walker);', '        if (options.skipStaging !== true) beginNpcDialogueStaging(walker);', 'dialogue staging option')
          ui_open = """        _npcDialogueEl.classList.add('open');
                _npcDialogueEl.setAttribute('aria-hidden', 'false');
          """
          ui_open_new = ui_open + """
                // Livestock reuses this exact shell/camera/portrait renderer, but it is not
                // an NPC quest-giver/shopkeeper and should never enter those metadata paths.
                if (options.skipNpcMeta === true) {
                  window.DialogueContent?.beginNpcConversation(rec);
                  return;
                }
          """
          s = replace_once(s, ui_open, ui_open_new, 'livestock metadata fast path')

          insert_anchor = """        window.DialogueContent?.beginNpcConversation(rec);
              }

              // advanceNpcDialogue now lives in js/dialogue-content.js
          """
          helper_block = """        window.DialogueContent?.beginNpcConversation(rec);
              }

              function createLivestockDialogueCameraTarget(animal, kind) {
                const focus = new THREE.Object3D();
                focus.name = `livestock_dialogue_head_${animal?.id || kind || 'animal'}`;
                const frame = window.AnimalChatheadFrame?.frameForKind?.(kind);
                const plane = animal?.avatarRef?.frontPlane || animal?.avatarRef?.group?.children?.[0] || null;
                const modelWidth = Number(animal?.modelWidth);
                const modelHeight = Number(animal?.modelHeight);
                if (frame && plane?.localToWorld && Number.isFinite(modelWidth) && Number.isFinite(modelHeight)) {
                  const centerX = frame.x + frame.width * 0.5;
                  const centerY = frame.y + frame.height * 0.5;
                  const localHead = new THREE.Vector3(
                    (centerX - 0.5) * modelWidth,
                    (0.5 - centerY) * modelHeight,
                    0,
                  );
                  plane.updateWorldMatrix?.(true, false);
                  focus.position.copy(plane.localToWorld(localHead));
                } else if (animal?.avatarRef?.group?.getWorldPosition) {
                  animal.avatarRef.group.getWorldPosition(focus.position);
                  focus.position.y += (Number.isFinite(modelHeight) ? modelHeight : 1) * 0.25;
                }
                scene.add(focus);
                return focus;
              }

              async function openLivestockDialogue(animal, livestockRec, dialogueLines = []) {
                if (!animal || !livestockRec || dialogueOpen) return false;
                const kind = String(livestockRec.kind || animal.animalKey || '').trim().toLowerCase();
                const focus = createLivestockDialogueCameraTarget(animal, kind);
                const walker = {
                  rec: {
                    id: `livestock:${livestockRec.id}`,
                    name: livestockRec.name || window.CreatureGenetics?.defaultLivestockName?.(kind) || 'Livestock',
                    dialogueLines: Array.isArray(dialogueLines) && dialogueLines.length ? dialogueLines : ['...'],
                  },
                  profile: {
                    chatheadCreatureKind: kind,
                    creatureGenotype: livestockRec.genotype || animal.genotype || null,
                  },
                  root: animal.avatarRef?.group,
                  pause: 0,
                };
                animal._dialogueFrozen = true;
                let cleaned = false;
                walker._onDialogueClose = () => {
                  if (cleaned) return;
                  cleaned = true;
                  animal._dialogueFrozen = false;
                  focus.parent?.remove(focus);
                };
                try {
                  await openNpcDialogue(walker, {
                    cameraTarget: focus,
                    skipStaging: true,
                    skipNpcMeta: true,
                    recordMemory: false,
                  });
                  return true;
                } catch (err) {
                  walker._onDialogueClose();
                  console.warn('[livestock-dialogue] failed to open', err);
                  return false;
                }
              }

              // advanceNpcDialogue now lives in js/dialogue-content.js
          """
          s = replace_once(s, insert_anchor, helper_block, 'livestock dialogue helpers')

          close_anchor = """          _dialogueWalker.pause = 0;
                    // Resume at the normal schedule speed. Dialogue must not create a
          """
          close_new = """          _dialogueWalker.pause = 0;
                    try { _dialogueWalker._onDialogueClose?.(); }
                    catch (err) { console.warn('[dialogue] close hook failed', err); }
                    // Resume at the normal schedule speed. Dialogue must not create a
          """
          s = replace_once(s, close_anchor, close_new, 'dialogue close hook')

          init_anchor = """        showToast,
                tileSurfaceY,
          """
          init_new = """        showToast,
                openLivestockDialogue,
                tileSurfaceY,
          """
          s = replace_once(s, init_anchor, init_new, 'FarmAnimals dialogue dependency')
          p.write_text(s)

          # 6) Cache-bust modified runtime modules for GitHack/mobile testing.
          p = Path('docs/index.html')
          s = p.read_text()
          replacements = {
              r'js/animal-chathead-frame\.js\?v=[^"\']+': 'js/animal-chathead-frame.js?v=20260902livestock1',
              r'js/animal-vocalizations\.js\?v=[^"\']+': 'js/animal-vocalizations.js?v=20260902livestock1',
              r'js/farm-animals\.js\?v=[^"\']+': 'js/farm-animals.js?v=20260902livestock1',
              r'game\.js\?v=[^"\']+': 'game.js?v=20260902livestock1',
          }
          for pattern, repl in replacements.items():
              s, n = re.subn(pattern, repl, s, count=1)
              if n != 1:
                  raise SystemExit(f'index cache bust failed for {pattern}: {n}')
          p.write_text(s)

          # 7) Focused regression test for the user's exact interaction/camera requirements.
          Path('scripts/test-livestock-dialogue-chatheads.js').write_text(r"""const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          const rigSource = fs.readFileSync('docs/config/attachment-rig-profiles.js', 'utf8');
          const rigWindow = {};
          vm.runInNewContext(rigSource, { window: rigWindow, console });
          const frames = rigWindow.HOBUNJI_ATTACHMENT_RIG_PROFILES.creatures;
          const expected = {
            grehlr: [0.12899040207823892, 0.38396704728631864, 0.24202339114154608, 0.3445860779359126],
            'gar-wolf': [0, 0.2575, 0.25, 0.3575],
            'dabinggi-hound': [0.05321196485715341, 0.2621006265961596, 0.17863723264419087, 0.350903183334192],
            drenkirra: [0.1925, 0.3575, 0.2078, 0.305],
            uumkaoii: [0.009564166583519832, 0.2923510947804583, 0.4656387672084861, 0.47038721094834346],
          };
          for (const [kind, values] of Object.entries(expected)) {
            const frame = frames[kind]?.chatheadFrame;
            assert(frame, `${kind} must have an authored chathead frame`);
            assert.strictEqual(frame.coordinateSpace, 'sprite-normalized-top-left');
            assert.deepStrictEqual([frame.x, frame.y, frame.width, frame.height], values, `${kind} frame must match the supplied export exactly`);
          }

          const farm = fs.readFileSync('docs/js/farm-animals.js', 'utf8');
          const buttonsStart = farm.indexOf('function _farmAnimalGetButtons');
          const buttonsEnd = farm.indexOf('function _farmAnimalOnAction', buttonsStart);
          const buttons = farm.slice(buttonsStart, buttonsEnd);
          assert(buttons.includes("action: 'obj_talk_' + animal.id"), 'livestock must expose Talk');
          assert(buttons.indexOf("action: 'obj_collect_' + animal.id") < buttons.indexOf("action: 'obj_talk_' + animal.id"), 'ready resource must precede Talk so harvest is Action 1 and Talk is Action 2');
          assert(buttons.includes('buttons.push({ icon: \'💬\''), 'Talk must always be pushed, including when no resource is ready');
          assert(farm.includes("if (action === 'obj_talk_' + animal.id)"), 'Talk action must be routed');
          assert(farm.includes('deps.openLivestockDialogue?.(animal, rec, [line]);'), 'Talk must open full livestock dialogue');
          assert(farm.includes('window.AnimalVocalizations?.dialogueLinesFor?.(animal)'), 'Talk lines must come from the authored animal-vocalization config');
          assert(farm.includes('modelWidth: ANIMAL_W, modelHeight: ANIMAL_H'), 'livestock must expose rendered dimensions for frame-center camera targeting');
          assert(farm.includes('this._harvestFrozen || this._dialogueFrozen'), 'dialogue must freeze livestock wandering');

          const game = fs.readFileSync('docs/game.js', 'utf8');
          assert(game.includes('async function openNpcDialogue(walker, options = {})'), 'NPC dialogue shell must support restricted reuse options');
          assert(game.includes('activeCameraMode   = npcDialogueCameraMode();'), 'livestock must reuse the NPC dialogue camera mode');
          assert(game.includes('activeCameraTarget = options.cameraTarget || walker.root;'), 'dialogue must accept the livestock head focus target');
          assert(game.includes('if (options.skipStaging !== true) beginNpcDialogueStaging(walker);'), 'livestock must be able to skip humanoid staging');
          assert(game.includes('if (options.skipNpcMeta === true)'), 'livestock must skip NPC quests/favors/shops');
          assert(game.includes('function createLivestockDialogueCameraTarget(animal, kind)'), 'livestock head camera target helper must exist');
          assert(game.includes('window.AnimalChatheadFrame?.frameForKind?.(kind)'), 'camera target must use the authored species frame');
          assert(game.includes('(centerX - 0.5) * modelWidth'), 'head-frame X center must drive camera target');
          assert(game.includes('(0.5 - centerY) * modelHeight'), 'head-frame Y center must drive camera target');
          assert(game.includes('chatheadCreatureKind: kind'), 'full dialogue portrait must use animal chathead rendering');
          assert(game.includes('creatureGenotype: livestockRec.genotype || animal.genotype || null'), 'full dialogue portrait must preserve livestock genotype');
          assert(game.includes('openLivestockDialogue,'), 'FarmAnimals must receive the shared dialogue opener');
          assert(game.includes('_dialogueWalker._onDialogueClose?.()'), 'dialogue close must unfreeze/remove livestock focus');

          const vocal = fs.readFileSync('docs/js/animal-vocalizations.js', 'utf8');
          assert(vocal.includes('c?.animalKey'), 'livestock species must resolve through animalKey');
          assert(vocal.includes('dialogueLinesFor'), 'animal vocalization profiles must expose ordinary dialogue lines');
          const ambient = JSON.parse(fs.readFileSync('docs/config/dialogue/ambient-dialogue.json', 'utf8'));
          for (const kind of Object.keys(expected)) {
            const lines = ambient.animalVocalizations?.[kind]?.dialogueLines;
            assert(Array.isArray(lines) && lines.length > 0, `${kind} must have configurable livestock dialogue lines`);
          }

          console.log('livestock dialogue chathead regression: ok');
          """)
          PY
      - name: Run scoped regressions
        run: |
          node --check docs/config/attachment-rig-profiles.js
          node --check docs/js/animal-vocalizations.js
          node --check docs/js/farm-animals.js
          node --check docs/js/animal-chathead-frame.js
          node --check docs/game.js
          node scripts/test-animal-chathead-framing.js
          node scripts/test-animal-chathead-ambient.js
          node scripts/test-animal-head-rig-runtime.js
          node scripts/test-livestock-dialogue-chatheads.js
      - name: Commit feature and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-animal-chathead-main.yml
          git add docs/config/attachment-rig-profiles.js docs/config/dialogue/ambient-dialogue.json docs/js/animal-vocalizations.js docs/js/farm-animals.js docs/game.js docs/index.html scripts/test-livestock-dialogue-chatheads.js
          git commit -m "Add full livestock dialogue using authored head frames"
          git push origin HEAD:codex/animal-chathead-framing
