name: Inspect Town Mine save hooks
on:
  push:
    branches:
      - codex/persistent-mine-campfires-20260902
    paths:
      - .github/workflows/codex-inspect-town-mine-save.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/persistent-mine-campfires-20260902
      - name: Inspect save hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('docs/game.js').read_text()
          for needle in ['function saveMemberWorldData', 'WildernessCampfire?.serialize', 'WildernessCampfire?.restore', 'TownMine?.serialize', 'TownMine?.restore', 'recordFloorReached']:
              print('\n===', needle, '===')
              start=0
              found=False
              while True:
                  i=text.find(needle,start)
                  if i<0: break
                  found=True
                  print(text[max(0,i-1200):i+2600])
                  start=i+len(needle)
              if not found: print('NOT FOUND')
          PY