name: Apply Ghoul visual and audio fixes

on:
  push:
    branches:
      - codex/persistent-mine-campfires-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/persistent-mine-campfires-20260902
          fetch-depth: 0
      - name: Apply focused source edits
        run: python3 scripts/codex-apply-ghoul-visual-audio-fixes.py
      - name: Validate JavaScript, JSON, and focused regression coverage
        run: |
          node --check docs/js/town-mine.js
          node --check docs/js/music-system.js
          node --check docs/game.js
          node --check docs/js/npc-avatar-preview-utils.js
          node --check docs/js/combat/combat-bandit.js
          node --check docs/js/wilderness-campfire.js
          node --check scripts/test-ghoul-mine-visuals-audio.js
          node scripts/test-ghoul-mine-visuals-audio.js
          node scripts/test-persistent-mine-campfires.js
          python3 -m json.tool docs/config/species/ghoul.json >/dev/null
      - name: Remove temporary patch machinery
        run: |
          rm scripts/codex-apply-ghoul-visual-audio-fixes.py
          rm .github/workflows/codex-apply-ghoul-visual-audio-fixes.yml
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Ghoul mine audio colors and lighting"
          git push origin HEAD:codex/persistent-mine-campfires-20260902
