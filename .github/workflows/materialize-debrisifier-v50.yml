name: Materialize Debrisifier V50 source

on:
  push:
    branches:
      - agent/tool-hub-debrisifier-active
    paths:
      - '.github/workflows/materialize-debrisifier-v50.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct exact V50 source
        shell: bash
        run: |
          set -euo pipefail
          src='docs/tools/debris-ifier/debrisifier-v50-source.js'
          expected='038a5d54c66b0ae2a9ceeb66967b9e5c32b616040f40b503eec59d5331885f40'
          cat docs/tools/debris-ifier/runtime/debrisifier-v50.part*.b64 \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            | gzip --decompress --stdout > "$src"
          actual="$(sha256sum "$src" | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Debrisifier V50 source hash mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          node --check "$src"
          echo "Verified Debrisifier V50 source: $actual"

      - name: Commit readable source when needed
        shell: bash
        run: |
          set -euo pipefail
          src='docs/tools/debris-ifier/debrisifier-v50-source.js'
          if git diff --quiet -- "$src" && git ls-files --error-unmatch "$src" >/dev/null 2>&1; then
            echo 'Readable V50 source is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$src"
          git commit -m 'Materialize readable Debrisifier V50 source'
          git push origin "HEAD:${GITHUB_REF_NAME}"
