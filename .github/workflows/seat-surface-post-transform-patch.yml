name: Temporary seat surface bootstrap patch

on:
  push:
    branches:
      - fix/interior-seat-surface-post-transform
    paths:
      - '.github/workflows/seat-surface-post-transform-patch.yml'

permissions:
  contents: write

jobs:
  patch-index-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interior-seat-surface-post-transform
          fetch-depth: 0
      - name: Add seat surface adapter to game bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/index.html')
          text = path.read_text()
          needle = '  <script src="js/map-layout-system.js?v=20260905layouts1"></script>\n'
          insert = needle + '  <!-- Keeps authored seat anchors/surfaces on the same post-placement transform as interior-editor furniture visuals. -->\n  <script src="js/seat-surface-placement-transform.js?v=20260915seat1"></script>\n'
          if 'js/seat-surface-placement-transform.js' not in text:
              if needle not in text:
                  raise SystemExit('map-layout-system bootstrap tag not found')
              text = text.replace(needle, insert, 1)
              path.write_text(text)
          PY
      - name: Run focused regression
        run: |
          node --check docs/js/seat-surface-placement-transform.js
          node --check scripts/test-interior-seat-surface-post-transform.js
          node scripts/test-interior-seat-surface-post-transform.js
      - name: Commit bootstrap change
        run: |
          if git diff --quiet -- docs/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Load seat surface post-transform adapter"
          git push origin HEAD:fix/interior-seat-surface-post-transform
