name: Apply tool impact SFX patch

on:
  push:
    branches: ["ai/tool-impact-sfx"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/tool-impact-sfx
      - name: Apply targeted patch
        run: python scripts/apply-tool-sfx-patch.py
      - name: Validate JavaScript and wiring
        run: |
          node --check docs/game.js
          node --check docs/config/scratchbones-config.js
          node scripts/test-tool-action-sfx-wiring.js
      - name: Commit patched sources
        run: |
          rm .github/workflows/apply-tool-impact-sfx.yml scripts/apply-tool-sfx-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire tool impact and break SFX"
          git push
