name: RAF ownership Stage 12d regression (calendar passage-hour timer)

on:
  pull_request:
    paths:
      - 'docs/js/calendar-system.js'
      - 'scripts/test-calendar-system-passage-hour-timer.js'
      - '.github/workflows/raf-ownership-stage12d-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/calendar-system.js'
      - 'scripts/test-calendar-system-passage-hour-timer.js'
      - '.github/workflows/raf-ownership-stage12d-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/calendar-system.js
      - name: Calendar system passage-hour timer conversion
        run: node scripts/test-calendar-system-passage-hour-timer.js
