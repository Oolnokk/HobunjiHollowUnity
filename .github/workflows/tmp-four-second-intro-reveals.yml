name: Temporary four-second intro reveal update

on:
  push:
    branches:
      - codex/fix-opening-rescue-mobile-startup

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Change intra-slide reveals to four seconds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import json

          config_path = Path('docs/config/loading-screens.json')
          data = json.loads(config_path.read_text())
          data['version'] = max(9, int(data.get('version') or 0))
          intro = next(entry for entry in data['entries'] if entry.get('id') == 'world-introduction')
          reveals = 0
          for stage in intro['stages']:
              for page in stage.get('pages', [stage]):
                  for reveal in page.get('delayedReveals', []):
                      reveal['afterSeconds'] = 4
                      reveals += 1
          assert reveals == 4, f'expected 4 delayed reveals, found {reveals}'
          config_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          runtime_path = Path('docs/js/loading-screen-runtime.js')
          runtime = runtime_path.read_text()
          replacements = {
              'const MIN_INTRA_SLIDE_DELAY_SECONDS = 8; // Used only by delayed text within one opening slide; ordinary page holds keep their authored durations.':
              'const MIN_INTRA_SLIDE_DELAY_SECONDS = 4; // Used only by delayed text within one opening slide; ordinary page holds keep their authored durations.',
              '// Eight seconds applies only to text revealed inside the current slide.':
              '// Four seconds applies only to text revealed inside the current slide.',
              'eight seconds applies only to intra-slide reveals':
              'four seconds applies only to intra-slide reveals',
          }
          for old, new in replacements.items():
              assert old in runtime, f'missing runtime target: {old}'
              runtime = runtime.replace(old, new)
          runtime_path.write_text(runtime)

          test_path = Path('scripts/test-introduction-loading-and-framing.js')
          test = test_path.read_text()
          replacements = {
              "assert.equal(maximPage.delayedReveals?.[0]?.afterSeconds, 8);":
              "assert.equal(maximPage.delayedReveals?.[0]?.afterSeconds, 4);",
              "assert(storyPages.some(page => Number(page.minimumSeconds) < 8), 'eight seconds is not a blanket inter-slide/page minimum');":
              "assert(storyPages.some(page => Number(page.minimumSeconds) < 4), 'four seconds is not a blanket inter-slide/page minimum');",
              "assert(storyPages.flatMap(page => page.delayedReveals || []).every(reveal => Number(reveal.afterSeconds) >= 8), 'every intra-slide delayed reveal waits at least eight seconds');":
              "assert(storyPages.flatMap(page => page.delayedReveals || []).every(reveal => Number(reveal.afterSeconds) >= 4), 'every intra-slide delayed reveal waits at least four seconds');",
              "assert(loader.includes('const MIN_INTRA_SLIDE_DELAY_SECONDS = 8'), 'runtime enforces the eight-second floor only for intra-slide delayed text');":
              "assert(loader.includes('const MIN_INTRA_SLIDE_DELAY_SECONDS = 4'), 'runtime enforces the four-second floor only for intra-slide delayed text');",
          }
          for old, new in replacements.items():
              assert old in test, f'missing test target: {old}'
              test = test.replace(old, new)
          test_path.write_text(test)
          PY

          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
          node --check docs/js/loading-screen-runtime.js
          node scripts/test-introduction-loading-and-framing.js
          node scripts/run-tests.js

          rm .github/workflows/tmp-four-second-intro-reveals.yml
          git add -A
          git commit -m "Set opening intra-slide reveals to four seconds"
          git push origin HEAD:codex/fix-opening-rescue-mobile-startup
