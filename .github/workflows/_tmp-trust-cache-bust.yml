name: Apply Trust Favor Cache Bust

on:
  push:
    branches:
      - fix/trust-dialogue-favor-heart-scale

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trust-dialogue-favor-heart-scale
      - name: Patch Favor conversion cache chain
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/index.html'): (
                  'js/combat/combat-config-loader.js?v=20260915enemydodge1',
                  'js/combat/combat-config-loader.js?v=20260917trust1',
              ),
              Path('docs/js/combat/combat-config-loader.js'): (
                  'js/favor-heart-balance.js?v=20260914a',
                  'js/favor-heart-balance.js?v=20260917points3',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one stale cache key, found {count}')
              path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/_tmp-trust-cache-bust.yml
      - name: Commit cache chain update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/js/combat/combat-config-loader.js .github/workflows/_tmp-trust-cache-bust.yml
          git commit -m "Bust Favor heart conversion cache chain"
          git push origin HEAD:fix/trust-dialogue-favor-heart-scale
