name: Temp Khannibarr canon reconciliation
on:
  push:
    branches:
      - fix-khannibarr-canon
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply canonical spelling and pattern registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          replacements = {
              Path('docs/js/opening-story-cutscene.js'): [
                  ('Imperial Khanibarri Mining Company', 'Imperial Khannibarri Mining Company'),
              ],
              Path('docs/config/weapon-trust-visits.js'): [
                  ('Khanibarr-krassin', 'Khannibarr-krassin'),
                  ('Khanibarri Empire', 'Khannibarri Empire'),
              ],
              Path('scripts/test-opening-story-followup.js'): [
                  ('the Imperial Khanibarri Mining Company', 'the Imperial Khannibarri Mining Company'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)

          motif_path = Path('docs/assets/patterns/motif_mark_of_khannibarr.png')
          if not motif_path.exists():
              raise SystemExit(f'missing uploaded motif: {motif_path}')

          definition = {
              'schema': 'hobunji_pattern.v1',
              'id': 'mark_of_khannibarr',
              'name': 'Mark of Khannibarr',
              'motifPng': 'assets/patterns/motif_mark_of_khannibarr.png',
              'collectible': False,
              'settings': {
                  'motifScale': 1.14,
                  'motifRotationDeg': 75,
                  'tiling': True,
                  'invert': False,
                  'motifThinPx': 3,
                  'frameShape': 'triangle',
                  'frameX': -31.309844435307028,
                  'frameY': 8.688176740679822,
                  'frameRotationDeg': 37,
                  'frameScale': 0.83,
                  'meshScale': 1.92,
                  'meshRotationDeg': 2,
                  'overpassClearanceMultiplier': 3,
              },
          }
          def_path = Path('docs/config/patterns/pattern_mark_of_khannibarr.json')
          def_path.write_text(json.dumps(definition, indent=2) + '\n')

          index_path = Path('docs/config/patterns/index.json')
          index = json.loads(index_path.read_text())
          patterns = [p for p in index.get('patterns', []) if p.get('id') not in {'mark_of_khanibarr', 'mark_of_khannibarr'}]
          patterns.append({
              'id': 'mark_of_khannibarr',
              'name': 'Mark of Khannibarr',
              'file': 'config/patterns/pattern_mark_of_khannibarr.json',
          })
          index['patterns'] = patterns
          index_path.write_text(json.dumps(index, indent=2) + '\n')
          PY
      - name: Run focused regressions
        run: node scripts/run-tests.js opening-story-followup
      - name: Run full fast regression suite
        run: node scripts/run-tests.js
      - name: Commit tested changes
        shell: bash
        run: |
          rm .github/workflows/temp-khannibarr-canon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/js/opening-story-cutscene.js docs/config/weapon-trust-visits.js scripts/test-opening-story-followup.js docs/config/patterns/index.json docs/config/patterns/pattern_mark_of_khannibarr.json .github/workflows/temp-khannibarr-canon.yml
          git commit -m "Canonicalize Khannibarr spelling and register motif"
          git push
