name: Temp Startup Calendar Guard Follow-up

on:
  push:
    branches: [feat/combat-vocalizations]
    paths:
      - '.github/workflows/temp-startup-calendar-guard-followup.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/combat-vocalizations

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply remaining pre-init guards
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f"{path}: expected exactly one match, found {count}"
              p.write_text(text.replace(old, new, 1))

          calendar = Path('docs/js/calendar-system.js')
          text = calendar.read_text()
          day_default_count = text.count('day = deps.calendar.day')
          assert day_default_count >= 10, f'unexpected calendar default-day count: {day_default_count}'
          text = text.replace('day = deps.calendar.day', 'day = deps?.calendar?.day ?? 1')
          time_default_count = text.count('time01 = deps.calendar.time01')
          assert time_default_count >= 1, f'unexpected calendar default-time count: {time_default_count}'
          text = text.replace('time01 = deps.calendar.time01', 'time01 = deps?.calendar?.time01 ?? 0')
          text = text.replace('weekdayIndexForCalendarDay(deps.calendar.day)', 'weekdayIndexForCalendarDay(deps?.calendar?.day ?? 1)')
          text = text.replace('weekdayNameForDay(deps.calendar.day)', 'weekdayNameForDay(deps?.calendar?.day ?? 1)')
          assert 'day = deps.calendar.day' not in text
          assert 'time01 = deps.calendar.time01' not in text
          calendar.write_text(text)

          replace_once(
              'docs/js/map-layout-system.js',
              """    CS.timeDebugSnapshot = function (...args) {\n      const snapshot = originals.timeDebugSnapshot.apply(this, args) || {};\n      return {\n        ...snapshot,\n        civilMidnightRollover: true,\n        civilDay: civilDayFor(),\n        rawDayRolloverHour: RAW_DAY_ROLLOVER_HOUR,\n        civilDayRolloverHour: CIVIL_DAY_ROLLOVER_HOUR,\n        representedWeekday: CS.currentWeekdayName(),\n        representedDate: CS.formatCalendarDate(),\n      };\n    };""",
              """    CS.timeDebugSnapshot = function (...args) {\n      const snapshot = originals.timeDebugSnapshot.apply(this, args) || {};\n      if (snapshot.initialized === false || !calendar) {\n        return {\n          ...snapshot,\n          civilMidnightRollover: true,\n          civilDay: null,\n          rawDayRolloverHour: RAW_DAY_ROLLOVER_HOUR,\n          civilDayRolloverHour: CIVIL_DAY_ROLLOVER_HOUR,\n          representedWeekday: null,\n          representedDate: null,\n        }; // The bridge itself loads before CalendarSystem.init(); do not re-enter date helpers while the base snapshot is explicitly not ready.\n      }\n      return {\n        ...snapshot,\n        civilMidnightRollover: true,\n        civilDay: civilDayFor(),\n        rawDayRolloverHour: RAW_DAY_ROLLOVER_HOUR,\n        civilDayRolloverHour: CIVIL_DAY_ROLLOVER_HOUR,\n        representedWeekday: CS.currentWeekdayName(),\n        representedDate: CS.formatCalendarDate(),\n      };\n    };""",
          )

          replace_once(
              'docs/js/procedural-tasks.js',
              """  function _refreshCandidatesIfNeeded() {\n    const hourKey = `${deps.calendar.day}:${Math.floor((deps.calendar.time01 || 0) * 24)}`;\n    if (_candidateCache.hourKey === hourKey) return;""",
              """  function _refreshCandidatesIfNeeded() {\n    if (!deps?.calendar) return false; // NavigationCompass begins polling before ProceduralTasks.init(); there is no quest-hour cache to refresh until game.js injects the live calendar.\n    const hourKey = `${deps.calendar.day}:${Math.floor((deps.calendar.time01 || 0) * 24)}`;\n    if (_candidateCache.hourKey === hourKey) return true;""",
          )

          replace_once(
              'docs/js/procedural-tasks.js',
              """    _candidateCache = { hourKey, activeByNpc: [...activeByNpc.values()], pendingByNpc };\n  }\n  function _resolveLive(candidate, labelFn) {\n    const walker = deps.npcWalkers.find(w => w.rec?.id === candidate.npcId);""",
              """    _candidateCache = { hourKey, activeByNpc: [...activeByNpc.values()], pendingByNpc };\n    return true;\n  }\n  function _resolveLive(candidate, labelFn) {\n    const walker = (deps?.npcWalkers || []).find(w => w.rec?.id === candidate.npcId);""",
          )

          replace_once(
              'docs/js/procedural-tasks.js',
              """  function _scanCompassTargets() {\n    _refreshCandidatesIfNeeded();\n    const active = _candidateCache.activeByNpc""",
              """  function _scanCompassTargets() {\n    if (!_refreshCandidatesIfNeeded()) return { active: [], pending: [] }; // Parser/startup polling is expected; expose no quest markers until task deps are ready.\n    const active = _candidateCache.activeByNpc""",
          )

          test = Path('scripts/test-startup-init-guards.js')
          text = test.read_text()
          replace_once(
              'scripts/test-startup-init-guards.js',
              """assert.equal(timeDebug.nextTothalShiftRawDay, null, 'pre-init time debug must not call shift math through null deps');\n\nconst wilderness = runModule('docs/js/wilderness-map.js');""",
              """assert.equal(timeDebug.nextTothalShiftRawDay, null, 'pre-init time debug must not call shift math through null deps');\nassert.equal(calendar.window.CalendarSystem.currentWeekdayName(), 'Anan', 'pre-init public weekday helper should safely use the opening-day placeholder');\nassert.equal(calendar.window.CalendarSystem.formatCalendarDate().startsWith('Anan, 4/1, 1154 AoT'), true, 'pre-init date formatter should not dereference null calendar deps');\nvm.runInContext(fs.readFileSync('docs/js/map-layout-system.js', 'utf8'), calendar, { filename: 'docs/js/map-layout-system.js' });\nconst bridgedTimeDebug = calendar.window.CalendarSystem.timeDebugSnapshot();\nassert.equal(bridgedTimeDebug.initialized, false, 'civil-midnight bridge must preserve pre-init not-ready state');\nassert.equal(bridgedTimeDebug.representedWeekday, null, 'civil-midnight bridge must not re-enter weekday formatting before init');\nassert.equal(bridgedTimeDebug.representedDate, null, 'civil-midnight bridge must not invent a represented date before init');\n\nconst procedural = runModule('docs/js/procedural-tasks.js');\nassert.deepEqual(procedural.window.ProceduralTasks.allCompassTargets(), { active: [], pending: [] }, 'pre-init procedural task compass scan should expose no targets instead of dereferencing null calendar deps');\n\nconst wilderness = runModule('docs/js/wilderness-map.js');""",
          )
          PY

      - name: Refresh cache tokens
        run: |
          node scripts/check-cache-busts.js --fix
          node scripts/check-cache-busts.js origin/main

      - name: Validate follow-up guards
        run: |
          node --check docs/js/calendar-system.js
          node --check docs/js/map-layout-system.js
          node --check docs/js/procedural-tasks.js
          node scripts/test-startup-init-guards.js
          node scripts/test-calendar-system-passage-hour-timer.js
          node scripts/test-navigation-compass.js
          node scripts/test-procedural-task-compass-cache.js
          node scripts/test-no-cache-token-pins.js
          node scripts/run-tests.js

      - name: Commit validated fix and remove temporary workflow
        run: |
          git rm .github/workflows/temp-startup-calendar-guard-followup.yml
          git add docs scripts
          git commit -m "Finish guarding startup calendar reads"
          git push origin HEAD:feat/combat-vocalizations
