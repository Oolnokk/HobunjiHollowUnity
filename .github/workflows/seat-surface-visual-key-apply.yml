name: Apply seat surface visual-key separation

on:
  push:
    branches:
      - fix/interior-seat-surface-post-transform
    paths:
      - '.github/workflows/seat-surface-visual-key-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/interior-seat-surface-post-transform
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply visual/seat metadata separation
        run: node scripts/apply-seat-surface-visual-key-separation.js
      - name: Validate repaired seating path
        run: |
          node --check docs/game.js
          node --check docs/js/seat-surface-placement-transform.js
          node --check scripts/test-interior-seat-surface-post-transform.js
          node --check scripts/test-interior-seat-surface-three-math.js
          node --check scripts/test-interior-seat-surface-visual-alias.js
          node scripts/test-interior-seat-surface-post-transform.js
          node scripts/test-interior-seat-surface-three-math.js
          node scripts/test-interior-seat-surface-visual-alias.js
          node scripts/test-outdoor-furniture-and-npc-seating.js
          node scripts/test-npc-social-seating.js
          node scripts/test-furniture-vessel-runtime.js
          node scripts/test-interior-fire-floor.js
      - name: Commit repaired runtime and remove one-shot machinery
        run: |
          rm scripts/apply-seat-surface-visual-key-separation.js
          rm .github/workflows/seat-surface-visual-key-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate transformed seat metadata from furniture visuals"
          git push origin HEAD:fix/interior-seat-surface-post-transform
