name: Temporary Grehlr PNG normalization transfer

# Short-lived diagnostic; will be removed after normalized binary blobs are committed.
on:
  push:
    branches: ['fix/20261121-grehlr-resolution-color-test']

permissions:
  contents: read

jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'Transfer normalized Grehlr PNGs')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install image decoder
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Encode mismatched Grehlr source PNGs
        run: python3 scripts/normalize-grehlr-sprites.py --emit
