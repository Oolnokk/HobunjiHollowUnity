name: Town flood shelter regression

on:
  push:
    paths:
      - 'docs/js/water-system.js'
      - 'docs/js/npc-scheduling.js'
      - 'docs/js/npc-pathfinding.js'
      - 'scripts/test-town-flood-shelter.js'
      - '.github/workflows/town-flood-shelter-regression.yml'
  pull_request:
    paths:
      - 'docs/js/water-system.js'
      - 'docs/js/npc-scheduling.js'
      - 'docs/js/npc-pathfinding.js'
      - 'scripts/test-town-flood-shelter.js'
      - '.github/workflows/town-flood-shelter-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check changed runtime modules
        run: |
          node --check docs/js/water-system.js
          node --check docs/js/npc-scheduling.js
          node --check docs/js/npc-pathfinding.js
      - name: Test town flood drainage and NPC shelter override
        run: node scripts/test-town-flood-shelter.js
