name: Semantic surface foliage browser smoke

on:
  push:
    branches:
      - 'fix/house-plane-guides-for-corner-fill-wrap-20261027' # Tests the feature branch even while its PR cannot form a merge ref.
  pull_request:
    paths:
      - 'docs/js/foliage-generator.js'
      - 'docs/js/ice-stalagmite-coverage.js'
      - 'docs/js/dungeon-door-ice-coverage.js'
      - 'docs/js/dev-random-ruin-dungeon-fire.js'
      - 'scripts/test-dungeon-fire.js'
      - 'docs/js/HousePieceGen.js'
      - 'docs/js/authored-furniture-runtime.js'
      - 'docs/tools/house-piece-author/index.html'
      - 'docs/tools/building-interior-author/index.html'
      - 'docs/tools/furniture-avatar-author/index.html'
      - 'docs/tools/furniture-avatar-author/ice-stalagmites.js'
      - 'scripts/test-ice-stalagmite-coverage-browser.js'
      - 'scripts/test-surface-foliage-styles-browser.js'
      - 'scripts/test-temple-interior-material-growth-parity.js'
      - 'docs/config/pieces/temple.json'
      - 'docs/config/maps/map_i_temple.json'
      - 'docs/js/surface-foliage-authoring.js'
      - '.github/workflows/smoke-surface-foliage-semantic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-foliage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate foliage and house JavaScript
        run: |
          node --check docs/js/foliage-generator.js
          node --check docs/js/ice-stalagmite-coverage.js
          node --check docs/js/dungeon-door-ice-coverage.js
          node --check docs/js/dev-random-ruin-dungeon-fire.js
          node --check scripts/test-dungeon-fire.js
          node --check docs/tools/furniture-avatar-author/ice-stalagmites.js
          node --check scripts/test-ice-stalagmite-coverage-browser.js
          node --check docs/js/HousePieceGen.js
          node --check docs/js/authored-furniture-runtime.js
          node --check scripts/test-surface-foliage-styles-browser.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Source-level foliage regression
        run: node scripts/test-surface-foliage.js
      - name: Temple interior and exterior growth parity
        run: node scripts/test-temple-interior-material-growth-parity.js
      - name: House architectural planes, furniture named surfaces, and nested guide ownership
        run: node scripts/test-surface-foliage-styles-browser.js
      - name: Ground ice geometry, furniture editor tab and recipe persistence
        run: node scripts/test-ice-stalagmite-coverage-browser.js
      - name: Dungeon fire contact, Tothal ice doors and ceiling Burden contracts
        run: node scripts/test-dungeon-fire.js
