name: Temp Combat Vocal Stretch Polish

on:
  push:
    branches: [feat/combat-vocalizations]

permissions:
  contents: write

jobs:
  polish-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-vocalizations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch current main
        run: git fetch origin main
      - name: Polish runtime and editor source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          runtime_path = Path('docs/js/combat/combat-vocalizations.js')
          runtime = runtime_path.read_text()
          runtime = runtime.replace(
              "    chargePlayback: {\n    earlyReleaseNormalSpeedMul: 2,\n    fullChargeDurationByAbility: { chargedBreaker: 4 },\n  },",
              "    chargePlayback: {\n      earlyReleaseNormalSpeedMul: 2,\n      fullChargeDurationByAbility: { chargedBreaker: 4 },\n    },",
              1,
          )
          start = runtime.index('  function startChargeSource(')
          end = runtime.index('  function playStrikeGrunt(', start)
          block = runtime[start:end]
          lines = block.splitlines()
          if not lines[0].startswith('  function startChargeSource('):
              raise SystemExit('unexpected charge block indentation')
          lines[0] = lines[0][2:]
          block = '\n'.join(('  ' + line if line else line) for line in lines) + '\n\n'
          runtime = runtime[:start] + block + runtime[end:]
          runtime = runtime.replace(
              "  function isLiveStretchAbility(id) {\n  const ids = config.grunts?.liveStretchAbilities || config.grunts?.liveSustainAbilities || [];\n  return ids.includes(id);\n}",
              "  function isLiveStretchAbility(id) {\n    const ids = config.grunts?.liveStretchAbilities || config.grunts?.liveSustainAbilities || [];\n    return ids.includes(id);\n  }",
              1,
          )
          runtime = runtime.replace(
              'releaseCharge(charge); // Hold-release: stop sustaining the instant gameplay leaves the held windup.',
              'releaseCharge(charge); // Hold-release: keep the same playhead and switch the remainder to catch-up speed.',
              1,
          )
          runtime_path.write_text(runtime)

          editor_path = Path('docs/tools/combat-vocalization-editor/index.html')
          editor = editor_path.read_text()
          old = '''    <section class="card">
    <h2>Charge Grunt Stretch Playback</h2>
    <div class="muted">The entire charge grunt plays once and is stretched across the attack's 0→100% charge duration. Releasing a live hold early keeps the same playhead and plays the remainder at a multiple of <b>normal</b> voice speed—not a multiple of the stretched speed.</div>
    <div id="waveWrap"><canvas id="wave"></canvas></div>
    <div id="samplerStatus">Loading charge grunt…</div>
    <div class="row"><label>Early-release remainder × normal speed</label><input id="chargeCatchup" type="number" min=".1" max="8" step=".1"></div>
    <h3>Charged Breaker preview</h3>
    <div class="audition">
      <button id="fullPreview">Full 0→100%</button>
      <button data-release=".25">Release at 25%</button>
      <button data-release=".5">Release at 50%</button>
      <button data-release=".75">Release at 75%</button>
      <button id="stopPreview">Stop</button>
    </div>
  </section>'''
          new = '''    <section class="card">
      <h2>Charge Grunt Stretch Playback</h2>
      <div class="muted">The entire charge grunt plays once and is stretched across the attack's 0→100% charge duration. Releasing a live hold early keeps the same playhead and plays the remainder at a multiple of <b>normal</b> voice speed—not a multiple of the stretched speed.</div>
      <div id="waveWrap"><canvas id="wave"></canvas></div>
      <div id="samplerStatus">Loading charge grunt…</div>
      <div class="row"><label>Early-release remainder × normal speed</label><input id="chargeCatchup" type="number" min=".1" max="8" step=".1"></div>
      <h3>Charged Breaker preview</h3>
      <div class="audition">
        <button id="fullPreview">Full 0→100%</button>
        <button data-release=".25">Release at 25%</button>
        <button data-release=".5">Release at 50%</button>
        <button data-release=".75">Release at 75%</button>
        <button id="stopPreview">Stop</button>
      </div>
    </section>'''
          if old not in editor:
              raise SystemExit('charge editor markup block not found')
          editor = editor.replace(old, new, 1)
          editor = editor.replace(
              'Applied to breath, pain, charge, attack, and release vocals. Tempo and pitch combine into playback rate; this intentionally behaves like a sampler, with no formant correction.',
              'Applied to breath, pain, charge, attack, and release vocals. Charge stretching starts from this selected normal voice rate; an early release switches the remainder to the configured multiple of that normal rate, not the stretched rate.',
              1,
          )
          editor_path.write_text(editor)
          PY
      - name: Syntax checks
        run: |
          node --check docs/js/combat/combat-vocalizations.js
          node --check docs/js/tool-hub-combat-vocalization-tab.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path('docs/tools/combat-vocalization-editor/index.html').read_text()
          start = page.rfind('<script>') + len('<script>')
          end = page.find('</script>', start)
          Path('/tmp/combat-vocal-editor.js').write_text(page[start:end])
          PY
          node --check /tmp/combat-vocal-editor.js
      - name: Refresh cache-bust chain
        run: node scripts/check-cache-busts.js --fix
      - name: Remove temporary workflow
        run: git rm .github/workflows/temp-combat-vocal-polish.yml
      - name: Validate cache-bust chain
        run: node scripts/check-cache-busts.js origin/main
      - name: Run focused combat vocalization regression
        run: node scripts/test-combat-vocalizations.js
      - name: Run full regression suite
        run: node scripts/run-tests.js
      - name: Commit polished implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Polish charge grunt stretch implementation"
          git push origin HEAD:feat/combat-vocalizations
