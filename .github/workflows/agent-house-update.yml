name: Apply uploaded maps and house metadata

on:
  push:
    branches:
      - agent/house-repo-import-generation-split
    paths:
      - .github/workflows/agent-house-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Replace maps and update house metadata
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          town_b64 = Path('.agent/town-map.json.gz.b64').read_text(encoding='utf-8').strip()
          smithy_b64 = ''''''

          town_bytes = gzip.decompress(base64.b64decode(town_b64))
          smithy_bytes = gzip.decompress(base64.b64decode(smithy_b64))

          assert hashlib.sha256(town_bytes).hexdigest() == 'bc6ecd19618cfda8caa737bb806c34a18a9cbe7c60ee6025087e48d93ff0c259'
          assert hashlib.sha256(smithy_bytes).hexdigest() == 'ea370abfab7eae6564a854e6e02f04bcdaa6c1d61e628f8a9081726ad6b2082b'

          Path('docs/config/maps/hobunji_hollow_town.map.json').write_bytes(town_bytes)
          Path('docs/config/maps/map_i_smithy.json').write_bytes(smithy_bytes)

          town = json.loads(town_bytes)
          smithy = json.loads(smithy_bytes)
          assert town['schema'] == 'hobunji_map.v1'
          assert town['id'] == 'map_hobunji_town'
          assert town['cols'] == 60 and town['rows'] == 50
          assert smithy['schema'] == 'hobunji_building_interior.v1'
          assert smithy['id'] == 'map_i_smithy'

          temple_path = Path('docs/config/pieces/temple.json')
          temple = json.loads(temple_path.read_text(encoding='utf-8'))
          tunnels = temple['footprint']['extensions']['entryTunnels']
          assert tunnels
          temple['footprint']['door'] = {'x': tunnels[0]['x'], 'y': tunnels[0]['y']}
          temple_path.write_text(json.dumps(temple, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('docs/assets/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          house_pieces = index.setdefault('housePieces', [])
          temple_entry = {
              'name': 'Hobunji Hollow Temple',
              'path': 'config/pieces/temple.json',
              'category': 'temple'
          }
          if not any(entry.get('path') == temple_entry['path'] for entry in house_pieces):
              house_pieces.append(temple_entry)
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assert temple['footprint']['door'] == tunnels[0]
          assert any(entry.get('path') == 'config/pieces/temple.json' for entry in house_pieces)
          PY

      - name: Validate editor scripts
        run: |
          node --check docs/js/repo-picker.js
          node --check docs/js/house-piece-author-repo-enhancements.js

      - name: Commit generated source updates
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git add docs/config/maps/hobunji_hollow_town.map.json \
                  docs/config/maps/map_i_smithy.json \
                  docs/config/pieces/temple.json \
                  docs/assets/index.json
          git commit -m "Apply uploaded maps and align house metadata"
          git push origin HEAD:${{ github.ref_name }}
