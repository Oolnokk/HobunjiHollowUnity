name: Apply locale terrain rule sync patch

on:
  push:
    branches:
      - chatgpt/locale-terrain-anchors
    paths:
      - scripts/tmp-fix-locale-terrain-rule-sync.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/locale-terrain-anchors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply sync patch
        run: python scripts/tmp-fix-locale-terrain-rule-sync.py
      - name: Syntax checks
        run: |
          node --check docs/tools/locale-editor/terrain-placement.js
          node --check docs/tools/locale-editor/locale-preview3d.js
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/tools/locale-editor/index.html').read_text()
          a=s.index('<script>\n(() => {')+len('<script>\n')
          b=s.index('</script>',a)
          Path('/tmp/locale-editor-inline.js').write_text(s[a:b])
          PY
          node --check /tmp/locale-editor-inline.js
      - name: Locale regressions
        run: |
          node scripts/test-locale-terrain-placement.js
          node scripts/test-banubu-cave-locale.js
          node scripts/test-banubu-wilderness-lab-generation.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tools/locale-editor/index.html docs/tools/locale-editor/terrain-placement.js docs/tools/locale-editor/locale-preview3d.js scripts/test-banubu-cave-locale.js
          git commit -m 'Synchronize locale terrain rule state'
          git push origin HEAD:chatgpt/locale-terrain-anchors
