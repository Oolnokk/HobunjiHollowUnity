          combat_path.write_text(combat)

          # 3) Loader must require the new runtime API.
          loader_path = Path('docs/js/combat/combat-config-loader.js')
          loader = loader_path.read_text()
          loader = replace_once(
              loader,
              "['js/combat/combat-vocalizations.js?v=20261013vocal2', () => Number(window.CombatVocalizations?.version) >= 2]",
              "['js/combat/combat-vocalizations.js?v=20261013vocal3', () => Number(window.CombatVocalizations?.version) >= 3]",
              'combat loader vocal runtime version',
          )
          loader_path.write_text(loader)

          # 4) Editor previews must use the same renderer, so authoring matches runtime.
          editor_path = Path('docs/tools/combat-vocalization-editor/index.html')
          editor = editor_path.read_text()
          editor = replace_once(
              editor,
              '<script src="../../js/tap-reliability.js?v=20261010a"></script>',
              '<script src="../../js/tap-reliability.js?v=20261010a"></script>\n<script src="../../js/animal-voice-independent-playback.js?v=20261013combatvoice3"></script>',
              'combat editor shared renderer script',
          )
          editor = replace_once(
              editor,
              'Applied to breath, pain, charge, attack, and release vocals. Tempo and pitch combine into playback rate; this intentionally behaves like a sampler, with no formant correction.',
              'Applied to breath, pain, charge, attack, and release vocals. Tempo uses the same pitch-preserving WSOLA stretch as animal calls; authored pitch remains a separate axis.',
              'combat editor modulation copy',
          )
          editor = replace_once(
              editor,
              "  function playbackRate(randomSpan=0){const p=profileFor(),random=(Math.random()*2-1)*Math.max(0,Number(randomSpan)||0);return clamp(p.tempo*Math.pow(2,(p.pitchSemitones+random)/12),.3,3)}\n  function chargeRatePlan(bufferDurationS,targetDurationS,normalRate){const clip=Math.max(.001,Number(bufferDurationS)||.001),target=Number(targetDurationS)>0?Number(targetDurationS):clip,normal=Math.max(.02,Number(normalRate)||1),mul=Math.max(.1,Number(cfg.chargePlayback?.earlyReleaseNormalSpeedMul)||2);return{normalRate:normal,stretchedRate:clamp(normal*(clip/target),.02,32),catchUpRate:clamp(normal*mul,.02,32),mul}}",
              "  function voicePlan(randomSpan=0){const p=profileFor(),random=(Math.random()*2-1)*Math.max(0,Number(randomSpan)||0);return{profile:p,tempo:clamp(p.tempo,.35,3),pitchSemitones:clamp(p.pitchSemitones+random,-24,24)}}\n  function chargeTempoPlan(bufferDurationS,targetDurationS,normalTempo){const clip=Math.max(.001,Number(bufferDurationS)||.001),target=Number(targetDurationS)>0?Number(targetDurationS):clip,normal=Math.max(.02,Number(normalTempo)||1),mul=Math.max(.1,Number(cfg.chargePlayback?.earlyReleaseNormalSpeedMul)||2);return{normalTempo:normal,stretchedTempo:clamp(normal*(clip/target),1/9,4),catchUpTempo:clamp(normal*mul,1/9,4),mul}}",
              'combat editor independent voice plan',
          )
          editor = replace_once(
              editor,
              "  function renderChargeStatus(){if(!chargeBuffer)return;const p=chargeRatePlan(chargeBuffer.duration,fullChargeDurationS,1);$('samplerStatus').textContent=`Source ${chargeBuffer.duration.toFixed(3)}s · 0→100% ${fullChargeDurationS.toFixed(3)}s · default stretch ${p.stretchedRate.toFixed(3)}× · early release ${p.mul.toFixed(2)}× normal`}",
              "  function renderChargeStatus(){if(!chargeBuffer)return;const p=chargeTempoPlan(chargeBuffer.duration,fullChargeDurationS,1);$('samplerStatus').textContent=`Source ${chargeBuffer.duration.toFixed(3)}s · 0→100% ${fullChargeDurationS.toFixed(3)}s · WSOLA tempo ${p.stretchedTempo.toFixed(3)}× · early release ${p.mul.toFixed(2)}× normal · pitch preserved`}",
              'combat editor charge status',
          )
          editor = sub_once(
              editor,
              r"  function stopPreview\(\)\{.*?^  async function playOneShot\(path,volume,pitchSpan\)\{.*?^  \}",
              '''  function stopPreview(){previewSerial++;if(!currentPreview)return;clearTimeout(currentPreview.timer);try{currentPreview.source?.stop()}catch(_){}try{currentPreview.output?.disconnect()}catch(_){}currentPreview=null}
  function startRenderedPreview(c,rendered,output,progress=0){const source=c.createBufferSource();source.buffer=rendered.buffer;source.playbackRate.value=rendered.playbackRate;source.connect(output);source.start(c.currentTime+.005,clamp(progress,0,.999999)*Math.max(0,rendered.buffer.duration-.0001));return source}
  function releaseChargePreview(){if(!currentPreview||currentPreview.released||!currentPreview.catchUpRendered)return;currentPreview.released=true;clearTimeout(currentPreview.timer);const preview=currentPreview;try{preview.source.onended=null;preview.source.stop()}catch(_){}preview.source=startRenderedPreview(audioContext(),preview.catchUpRendered,preview.output,preview.releaseFraction);preview.source.onended=()=>{if(currentPreview===preview){log('Charge preview finished.');try{preview.output.disconnect()}catch(_){}currentPreview=null}};log(`Early release: remainder ${preview.plan.catchUpTempo.toFixed(3)}× tempo = ${preview.plan.mul.toFixed(2)}× normal (${preview.plan.normalTempo.toFixed(3)}×); pitch stays ${preview.pitchSemitones.toFixed(2)} st.`)}
  async function previewCharge(releaseFraction=null){if(!chargeBuffer){log('Charge grunt is not decoded yet.','bad');return}stopPreview();const serial=++previewSerial,c=audioContext(),voice=voicePlan(cfg.grunts.pitchRandomSemitones),plan=chargeTempoPlan(chargeBuffer.duration,fullChargeDurationS,voice.tempo),render=window.AnimalVoiceIndependentPlayback?.renderDecodedIndependentBuffer;if(!render){log('Animal-call pitch-preserving renderer is unavailable.','bad');return}try{const[fullRendered,catchUpRendered]=await Promise.all([render(chargeBuffer,c,{tempo:plan.stretchedTempo,pitchSemitones:voice.pitchSemitones}),Number(releaseFraction)>0&&Number(releaseFraction)<1?render(chargeBuffer,c,{tempo:plan.catchUpTempo,pitchSemitones:voice.pitchSemitones}):Promise.resolve(null)]);if(serial!==previewSerial)return;const output=c.createGain();output.gain.value=clamp(cfg.grunts.volume*voice.profile.gain,0,3);output.connect(c.destination);const source=startRenderedPreview(c,fullRendered,output,0);currentPreview={source,output,plan,pitchSemitones:voice.pitchSemitones,catchUpRendered,releaseFraction:Number(releaseFraction)||0,released:false,timer:0};source.onended=()=>{if(currentPreview?.source===source){log('Charge preview finished.');currentPreview=null;try{output.disconnect()}catch(_){}}};if(Number(releaseFraction)>0&&Number(releaseFraction)<1){currentPreview.timer=setTimeout(releaseChargePreview,fullRendered.durationS*Number(releaseFraction)*1000);log(`Preview: release at ${(Number(releaseFraction)*100).toFixed(0)}% (${(fullRendered.durationS*Number(releaseFraction)).toFixed(2)}s), pitch preserved.`)}else log(`Preview: full WSOLA-stretched charge over ${fullRendered.durationS.toFixed(2)}s, pitch preserved.`)}catch(e){log(`Charge preview failed: ${e.message}`,'bad')}}
  async function playOneShot(path,volume,pitchSpan){try{const p=voicePlan(pitchSpan),play=window.AnimalVoiceIndependentPlayback?.playIndependent||window.AnimalVoiceIndependentPlayback?.play;if(!play)throw new Error('Animal-call pitch-preserving renderer unavailable');play(assetUrl(path),{tempo:p.tempo,pitchSemitones:p.pitchSemitones,volume:clamp(Number(volume)*p.profile.gain,0,1)});log(`Audition: ${path.split('/').pop()} · tempo ${p.tempo.toFixed(3)}× · pitch ${p.pitchSemitones.toFixed(2)} st (independent)`) }catch(e){log(`Audition failed: ${e.message}`,'bad')}}''',
              'combat editor preview playback',
          )
          editor = replace_once(
              editor,
              '  let cfg=null,chargeBuffer=null,ctx=null,currentPreview=null,waveformPeaks=null,speciesEntries=[],fullChargeDurationS=4;',
              '  let cfg=null,chargeBuffer=null,ctx=null,currentPreview=null,waveformPeaks=null,speciesEntries=[],fullChargeDurationS=4,previewSerial=0;',
              'combat editor preview serial',
          )
          editor_path.write_text(editor)

          # 5) Focused regression now guards independent tempo/pitch semantics.
          test_path = Path('scripts/test-combat-vocalizations.js')
          test = test_path.read_text()
          test = replace_once(
              test,
              "const source = fs.readFileSync(path.join(__dirname, '..', 'docs', 'js', 'combat', 'combat-vocalizations.js'), 'utf8');",
              "const source = fs.readFileSync(path.join(__dirname, '..', 'docs', 'js', 'combat', 'combat-vocalizations.js'), 'utf8');\nconst animalPlaybackSource = fs.readFileSync(path.join(__dirname, '..', 'docs', 'js', 'animal-voice-independent-playback.js'), 'utf8');",
              'test animal playback source',
          )
          test = replace_once(
              test,
              "context.window.AudioSystem = {",
              "context.window.AnimalVoiceIndependentPlayback = {\n  playIndependent(url, opts = {}) {\n    played.push({ url, ...opts, pitchPreserved: true });\n    return { stop() {} };\n  },\n};\ncontext.window.AudioSystem = {",
              'test pitch-preserved renderer stub',
          )
          test = replace_once(test, 'assert.equal(context.window.CombatVocalizations.version, 2);', 'assert.equal(context.window.CombatVocalizations.version, 3);', 'test runtime version')
          test = replace_once(
              test,
              "const chargePlan = context.window.CombatVocalizations.chargeRatePlan(1.2, 4, 1.25);\nassert(Math.abs(chargePlan.stretchedRate - 0.375) < 1e-9, 'full clip should stretch across the authored charge duration');\nassert(Math.abs(chargePlan.catchUpRate - 2.5) < 1e-9, 'early release must switch to 2x NORMAL speed, not 2x stretched speed');\nassert(Math.abs(chargePlan.catchUpRate - chargePlan.stretchedRate * 2) > 1, 'catch-up rate must be independent of the stretched rate');",
              "const chargePlan = context.window.CombatVocalizations.chargeRatePlan(1.2, 4, 1.25);\nassert(Math.abs(chargePlan.stretchedTempo - 0.375) < 1e-9, 'full clip should stretch across the authored charge duration');\nassert(Math.abs(chargePlan.catchUpTempo - 2.5) < 1e-9, 'early release must switch to 2x NORMAL tempo, not 2x stretched tempo');\nassert(Math.abs(chargePlan.catchUpTempo - chargePlan.stretchedTempo * 2) > 1, 'catch-up tempo must be independent of the stretched tempo');",
              'test charge tempo plan',
          )
          test = replace_once(
              test,
              "assert.equal(chargePlan.earlyReleaseNormalSpeedMul, 2);",
              "assert.equal(chargePlan.earlyReleaseNormalSpeedMul, 2);\nassert.match(animalPlaybackSource, /renderDecodedIndependentBuffer/, 'combat should reuse the animal-call independent tempo/pitch renderer');\nassert.match(source, /AnimalVoiceIndependentPlayback\\?\\.playIndependent/, 'combat one-shots should route through the animal-call pitch-preserving player');",
              'test shared renderer guards',
          )
          test = replace_once(
              test,
              "assert(!played.at(-1).url.includes('intensity4') && !played.at(-1).url.includes('intensity5'));",
              "assert(!played.at(-1).url.includes('intensity4') && !played.at(-1).url.includes('intensity5'));\nassert.equal(played.at(-1).pitchPreserved, true, 'breath tempo changes must use independent pitch preservation');\nassert.equal(played.at(-1).tempo, 1, 'default vocal tempo remains 1x');\nassert(Number.isFinite(played.at(-1).pitchSemitones), 'explicit/random pitch is carried as a separate semitone axis');",
              'test one-shot independent axes',
          )
          test_path.write_text(test)
          PY
      - name: Syntax checks
        run: |
          node --check docs/js/animal-voice-independent-playback.js
          node --check docs/js/combat/combat-vocalizations.js
          node --check docs/js/combat/combat-config-loader.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path('docs/tools/combat-vocalization-editor/index.html').read_text()
          start = page.rfind('<script>') + len('<script>')
          end = page.find('</script>', start)
          if start < len('<script>') or end < 0:
              raise SystemExit('combat vocal editor script block not found')
          Path('/tmp/combat-vocal-editor.js').write_text(page[start:end])
          PY
          node --check /tmp/combat-vocal-editor.js
