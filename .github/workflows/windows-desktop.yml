name: Windows desktop installer

# Package builds live apart from the existing game test workflow.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/test-windows-desktop.js'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify desktop protocol and packaging
        run: node scripts/test-windows-desktop.js
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hobunji-Hollow-Windows-Installer
          path: desktop/dist/Hobunji-Hollow-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
