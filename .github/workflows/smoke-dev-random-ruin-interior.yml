name: Smoke random ruin interior map

on:
  push:
    branches:
      - agent/tool-hub-debrisifier-active
    paths:
      - '.github/workflows/smoke-dev-random-ruin-interior.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/dev-random-ruin-interior-map.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/hobunji-http.log 2>&1 &
      - name: Generate and enter proper interior
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            await page.addInitScript(() => localStorage.setItem('hobunjiDevMode', '1'));
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => !!window.DevRandomRuin && !!window.GridTileAccessors && !!document.getElementById('devRandomTestRuinBtn'), null, { timeout: 30000 });
            await page.evaluate(() => window.HobunjiTitleScreen?.start?.());
            await page.waitForFunction(() => !window.HobunjiTitleScreen?.isActive?.(), null, { timeout: 5000 });
            const ok = await page.evaluate(async () => window.DevRandomRuin.generate(0x5eed1234));
            assert.equal(ok, true, 'generate() should succeed');
            await page.waitForFunction(() => window.GridTileAccessors.getCurrentArea() === 'map_i_dev_random_ruin', null, { timeout: 30000 });
            const state = await page.evaluate(() => {
              const activeScene = window.GridTileAccessors.getActiveScene();
              const info = window.DevRandomRuin.getState();
              return {
                area: window.GridTileAccessors.getCurrentArea(),
                building: window.GridTileAccessors.isBuildingArea(),
                cols: window.GridTileAccessors.getActiveCols(),
                rows: window.GridTileAccessors.getActiveRows(),
                gridRows: window.GridTileAccessors.getActiveGrid()?.length || 0,
                sceneName: activeScene?.name || null,
                hasV50Root: !!activeScene?.children?.find?.(object => /^dev_v50_ruin_/.test(object?.name || '')),
                state: info,
              };
            });
            assert.equal(state.area, 'map_i_dev_random_ruin', JSON.stringify(state));
            assert.equal(state.building, true, JSON.stringify(state));
            assert.equal(state.sceneName, 'map_i_dev_random_ruin', JSON.stringify(state));
            assert.equal(state.hasV50Root, true, JSON.stringify(state));
            assert.ok(state.cols >= 6 && state.rows >= 6, JSON.stringify(state));
            assert.equal(state.gridRows, state.rows, JSON.stringify(state));
            assert.ok(state.state?.rooms >= 3, JSON.stringify(state));
            assert.ok(state.state?.mechanisms?.length > 0, JSON.stringify(state));
            if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
            console.log(JSON.stringify(state, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
