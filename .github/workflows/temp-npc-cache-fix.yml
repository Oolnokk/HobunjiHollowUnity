name: Temp NPC Cache-Bust Fix

on:
  push:
    branches: [fix/npc-collision-aware-pathing]

permissions:
  contents: write

jobs:
  fix-cache-busts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npc-collision-aware-pathing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix cache-bust chain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git fetch origin main
          node scripts/check-cache-busts.js --fix origin/main
          if git diff --quiet; then
            echo "No cache-bust updates needed."
            exit 0
          fi
          git add docs scripts
          git commit -m "Bump NPC pathing cache tokens"
          git push origin HEAD:fix/npc-collision-aware-pathing
