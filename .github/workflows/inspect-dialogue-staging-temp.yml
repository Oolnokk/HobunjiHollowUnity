name: Inspect dialogue staging temp

on:
  push:
    branches: [codex/animal-chathead-framing]
    paths:
      - .github/workflows/inspect-dialogue-staging-temp.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/animal-chathead-framing
      - name: Print focused dialogue transition context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('docs/game.js').read_text().splitlines()
          for lo, hi, title in [
            (10416, 10680, 'dialogue staging'),
          ]:
            print(f'===== {title} {lo}:{hi} =====')
            print('\n'.join(f'{i+1}: {lines[i]}' for i in range(lo-1, min(hi, len(lines)))))
          for needle in ['dialogueZoomFactor()', 'activeCameraTarget', 'cameraAzimuthOffsetDeg', 'faceNpcDialogueParticipants()', 'updateNpcDialogueStaging(dt)']:
            print(f'\n===== {needle} =====')
            hits = [i for i,l in enumerate(lines) if needle in l]
            print('hits', [i+1 for i in hits])
            for i in hits[:12]:
              lo=max(0,i-20); hi=min(len(lines),i+45)
              print(f'--- {lo+1}:{hi} ---')
              print('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
          PY
