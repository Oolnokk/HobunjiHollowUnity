name: One-shot halve base knockback

on:
  push:
    branches:
      - codex/halve-base-knockback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/halve-base-knockback
          fetch-depth: 0

      - name: Halve authored base knockback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/game.js': [
                  ('const PLAYER_KNOCKBACK_PX_S = 600;', 'const PLAYER_KNOCKBACK_PX_S = 300;'),
                  ('const COMPANION_BITE_KNOCKBACK_PX_S = 560;', 'const COMPANION_BITE_KNOCKBACK_PX_S = 280;'),
                  ('const HOSTILE_BITE_KNOCKBACK_PX_S = 480;', 'const HOSTILE_BITE_KNOCKBACK_PX_S = 240;'),
              ],
              'docs/config/scratchbones-config.js': [
                  ('"knockbackPxS": 720', '"knockbackPxS": 360'),
                  ('"knockbackPxS": 1040', '"knockbackPxS": 520'),
              ],
              'docs/config/combat/attack-values.json': [
                  ('"knockbackPxS": 720', '"knockbackPxS": 360'),
                  ('"knockbackPxS": 1040', '"knockbackPxS": 520'),
                  ('"KNOCKBACK_PX_S": 640', '"KNOCKBACK_PX_S": 320'),
                  ('"KNOCKBACK_PX_S": 900', '"KNOCKBACK_PX_S": 450'),
                  ('"KNOCKBACK_PX_S": 980', '"KNOCKBACK_PX_S": 490'),
                  ('"KNOCKBACK_PX_S": 160', '"KNOCKBACK_PX_S": 80'),
                  ('"knockbackPxS": 260', '"knockbackPxS": 130'),
                  ('"knockbackPxS": 110', '"knockbackPxS": 55'),
              ],
              'docs/js/combat/combat-animal-attacks.js': [
                  ('let POUNCE_KNOCKBACK_PX_S = 640;', 'let POUNCE_KNOCKBACK_PX_S = 320;'),
                  ('let GUARD_CHARGE_KNOCKBACK_PX_S = 900;', 'let GUARD_CHARGE_KNOCKBACK_PX_S = 450;'),
              ],
              'docs/js/combat/combat-drenkirra-pellet.js': [
                  ('KNOCKBACK_PX_S: 160,', 'KNOCKBACK_PX_S: 80,'),
              ],
              'docs/js/combat/ranged-weapons.js': [
                  ('knockbackPxS: 260,', 'knockbackPxS: 130,'),
                  ('knockbackPxS: 110,', 'knockbackPxS: 55,'),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              changed.append(filename)

          # These comments described the July 2 global 2x baseline pass. Keep
          # them accurate now that only the separate finisher multipliers remain.
          for filename in [
              'docs/js/combat/combat-combo.js',
              'docs/js/combat/combat-flurry.js',
              'docs/js/combat/combat-charged-breaker.js',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated = text.replace('global knockback-base\n    // doubling', 'shared knockback baseline')
              updated = updated.replace('global knockback-base doubling', 'shared knockback baseline')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(filename)

          print('Changed files:')
          for filename in changed:
              print(' -', filename)
          PY

      - name: Validate changed combat config and scripts
        shell: bash
        run: |
          python3 -m json.tool docs/config/combat/attack-values.json >/dev/null
          node --check docs/game.js
          node --check docs/config/scratchbones-config.js
          node --check docs/js/combat/combat-animal-attacks.js
          node --check docs/js/combat/combat-drenkirra-pellet.js
          node --check docs/js/combat/ranged-weapons.js
          node --check docs/js/combat/combat-combo.js
          node --check docs/js/combat/combat-flurry.js
          node --check docs/js/combat/combat-charged-breaker.js

          # Prone/Footing-break throws are deliberately NOT part of ordinary
          # base knockback; verify their dramatic minimums were left intact.
          grep -F 'const PRONE_THROW_PLAYER_MIN_PX_S = 600;' docs/game.js >/dev/null
          grep -F 'const PRONE_THROW_CREATURE_MIN_PX_S = 480;' docs/game.js >/dev/null

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-halve-knockback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Halve base knockback across combat'
          git push origin HEAD:codex/halve-base-knockback
