name: Temporary seat surface main sync

on:
  push:
    branches:
      - fix/interior-seat-surface-post-transform
    paths:
      - '.github/workflows/seat-surface-sync-main.yml'

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/interior-seat-surface-post-transform
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Run expanded seat and integration regressions
        run: |
          node --check docs/js/seat-surface-placement-transform.js
          node --check scripts/test-interior-seat-surface-post-transform.js
          node --check scripts/test-interior-seat-surface-three-math.js
          node scripts/test-interior-seat-surface-post-transform.js
          node scripts/test-interior-seat-surface-three-math.js
          node scripts/test-outdoor-furniture-and-npc-seating.js
          node scripts/test-npc-social-seating.js
          node scripts/test-furniture-vessel-runtime.js
          node scripts/test-interior-fire-floor.js
      - name: Push merge commit
        run: git push origin HEAD:fix/interior-seat-surface-post-transform
