name: Check Kanthic shaft lighting

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    name: Select Kanthic lighting changes
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.select.outputs.lighting }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select affected specialist tests
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-select-tests.js --suite=feature
  lighting:
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.relevant == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse changed production modules and new regression test
        run: |
          node --check docs/js/ruin-multifloor-v50-style.js
          node --check docs/js/ruin-shaft-connector.js
          node --check docs/js/ruin-layer-playable.js
          node --check docs/js/ruin-v50-native-floors.js
          node --check docs/js/cloud-forest-fog.js
          node --check scripts/test-kanthic-shaft-firelight.js
      - name: Check Kanthic fixture behavior, darkness exemptions and cleanup
        run: node scripts/test-kanthic-shaft-firelight.js
      - name: Exercise real stacked wing ignition and teardown
        run: node scripts/test-shaft-hub.js
      - name: Check established shared overlay behavior
        run: node scripts/test-overlay-only-lighting.js
      - name: Install Three.js and Chromium for pixel regression
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Verify actual depth-tested rune pixels and room clipping
        run: node scripts/check-kanthic-glyph-webgl.js
