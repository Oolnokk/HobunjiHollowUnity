name: RAF ownership Stage 11c regression (stable animal progression alerts)

on:
  pull_request:
    paths:
      - 'docs/js/stable-animal-progression.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-stable-animal-progression-scheduler.js'
      - '.github/workflows/raf-ownership-stage11c-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/stable-animal-progression.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-stable-animal-progression-scheduler.js'
      - '.github/workflows/raf-ownership-stage11c-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/stable-animal-progression.js
      - name: Stable animal progression scheduler migration
        run: node scripts/test-stable-animal-progression-scheduler.js
