name: Regression suite

# One workflow for every scripts/test-*.js check (replaces the ~75 per-feature
# workflows that each ran a handful of them). The whole fast suite takes ~10s,
# so it isn't path-filtered. Browser smoke tests stay in smoke-dev-random-ruin-*.yml.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/regression-suite.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recenter-long-haft-grips-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply child grip-frame fix
        run: |
          set -e
          node scripts/patch-dual-wield-child-grip-frame.js
          node scripts/check-cache-busts.js --fix
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
          node scripts/run-tests.js
          git fetch origin main
          git checkout origin/main -- .github/workflows/regression-suite.yml
          rm scripts/patch-dual-wield-child-grip-frame.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align dual-wield hands to mirrored child grip frames'
          git push origin HEAD:fix/recenter-long-haft-grips-20261004
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('scripts/runtime-frame-ownership-exceptions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/config/loot/loot-pools.json', 'utf8'))"
      - name: Cache-bust tokens moved with their files
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-cache-busts.js FETCH_HEAD
      - name: Regression tests
        run: node scripts/run-tests.js ${{ github.event_name != 'pull_request' && '--all' || '' }}