name: Regression suite

# One workflow for every scripts/test-*.js check (replaces the ~75 per-feature
# workflows that each ran a handful of them). The whole fast suite takes ~10s,
# so it isn't path-filtered. Browser smoke tests stay in smoke-dev-random-ruin-*.yml.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/regression-suite.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch stale spear grip regression and restore workflow
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/recenter-long-haft-grips-20261004'
        run: |
          set -e
          git fetch --no-tags origin "$GITHUB_HEAD_REF" "main:refs/remotes/origin/main"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/test-procedural-hands.js';
          const source = fs.readFileSync(path, 'utf8');
          const oldBlock = `assert.deepStrictEqual(
            JSON.parse(JSON.stringify(grips.authoredPrimaryGripForTool('fishingspear', 'melee').position)),
            { x: -0.04, y: -0.04, z: 0 },
            'Fishing spear melee grip must stay on its existing unflipped hand target.',
          );
          assert.deepStrictEqual(
            JSON.parse(JSON.stringify(grips.authoredPrimaryGripForTool('fishingspear', 'ranged').position)),
            { x: 0.04, y: -0.04, z: 0 },
            'Fishing spear ranged grip must mirror its nonzero X across the visible 180-degree Tool End Flip.',
          );`;
          const newBlock = `assert.deepStrictEqual(
            JSON.parse(JSON.stringify(grips.authoredPrimaryGripForTool('fishingspear', 'melee').position)),
            { x: -0.04, y: -0.04, z: -0.1522 },
            'Fishing spear melee grip must use the measured center of its long wood haft section.',
          );
          assert.deepStrictEqual(
            JSON.parse(JSON.stringify(grips.authoredPrimaryGripForTool('fishingspear', 'ranged').position)),
            { x: 0.04, y: -0.04, z: 0.1522 },
            'Fishing spear ranged grip must mirror both nonzero in-plane coordinates across the visible 180-degree Tool End Flip.',
          );`;
          if (!source.includes(oldBlock)) throw new Error('Expected stale fishing-spear grip assertion block was not found.');
          fs.writeFileSync(path, source.replace(oldBlock, newBlock));
          NODE
          git checkout origin/main -- .github/workflows/regression-suite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-procedural-hands.js .github/workflows/regression-suite.yml
          git commit -m "Update fishing spear grip regression"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('scripts/runtime-frame-ownership-exceptions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/config/loot/loot-pools.json', 'utf8'))"
      - name: Cache-bust tokens moved with their files
        # PR checkouts are the merge commit, so diffing against the base tip is
        # exactly this PR's change. Fix locally with: node scripts/check-cache-busts.js --fix
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-cache-busts.js FETCH_HEAD
      - name: Regression tests
        # Slow tests only run on main / manual dispatch, not on every PR push.
        run: node scripts/run-tests.js ${{ github.event_name != 'pull_request' && '--all' || '' }}