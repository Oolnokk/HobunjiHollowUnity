name: Regression suite

# One workflow for every scripts/test-*.js check (replaces the ~75 per-feature
# workflows that each ran a handful of them). The whole fast suite takes ~10s,
# so it isn't path-filtered. Browser smoke tests stay in smoke-dev-random-ruin-*.yml.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/regression-suite.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair legacy spear migration fixture and restore workflow
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/recenter-long-haft-grips-20261004'
        run: |
          set -e
          git fetch --no-tags origin "$GITHUB_HEAD_REF" "main:refs/remotes/origin/main"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/test-procedural-hands.js';
          const source = fs.readFileSync(path, 'utf8');
          const oldBlock = `const preSpearMirrorSnapshot = grips.clone();
          const preSpearMirrorDraft = grips.clone();
          preSpearMirrorDraft.rangedGripPreset = 'melee-ranged-split-20260920-v7-end-flip-mirrored';
          preSpearMirrorDraft.tools.fishingspear.rangedPrimaryGrip.position.x = -0.04;
          grips.replace(preSpearMirrorDraft);
          assert.strictEqual(grips.authoredPrimaryGripForTool('fishingspear', 'ranged').position.x, 0.04, 'Untouched v7 fishing-spear ranged X must migrate to the corrected end-flipped side.');
          const customPreSpearMirrorDraft = grips.clone();
          customPreSpearMirrorDraft.rangedGripPreset = 'melee-ranged-split-20260920-v7-end-flip-mirrored';
          customPreSpearMirrorDraft.tools.fishingspear.rangedPrimaryGrip.position.x = 0.11;
          grips.replace(customPreSpearMirrorDraft);
          assert.strictEqual(grips.authoredPrimaryGripForTool('fishingspear', 'ranged').position.x, 0.11, 'Artist-authored pre-v8 fishing-spear ranged X must not be overwritten by the default migration.');
          grips.replace(preSpearMirrorSnapshot);`;
          const newBlock = `const preSpearMirrorSnapshot = grips.clone();
          const preSpearMirrorDraft = grips.clone();
          preSpearMirrorDraft.rangedGripPreset = 'melee-ranged-split-20260920-v7-end-flip-mirrored';
          delete preSpearMirrorDraft.longHaftGripPreset;
          preSpearMirrorDraft.tools.fishingspear.rangedPrimaryGrip.position.x = -0.04;
          preSpearMirrorDraft.tools.fishingspear.rangedPrimaryGrip.position.z = 0;
          grips.replace(preSpearMirrorDraft);
          assert.strictEqual(grips.authoredPrimaryGripForTool('fishingspear', 'ranged').position.x, 0.04, 'Untouched v7 fishing-spear ranged X must migrate to the corrected end-flipped side.');
          assert.strictEqual(grips.authoredPrimaryGripForTool('fishingspear', 'ranged').position.z, 0.1522, 'Pre-long-haft fishing-spear ranged Z must migrate to the mirrored measured wood-section center.');
          const customPreSpearMirrorDraft = grips.clone();
          customPreSpearMirrorDraft.rangedGripPreset = 'melee-ranged-split-20260920-v7-end-flip-mirrored';
          delete customPreSpearMirrorDraft.longHaftGripPreset;
          customPreSpearMirrorDraft.tools.fishingspear.rangedPrimaryGrip.position.x = 0.11;
          customPreSpearMirrorDraft.tools.fishingspear.rangedPrimaryGrip.position.z = 0;
          grips.replace(customPreSpearMirrorDraft);
          assert.strictEqual(grips.authoredPrimaryGripForTool('fishingspear', 'ranged').position.x, 0.11, 'Artist-authored pre-v8 fishing-spear ranged X must not be overwritten by the default migration.');
          assert.strictEqual(grips.authoredPrimaryGripForTool('fishingspear', 'ranged').position.z, 0.1522, 'Artist-authored old ranged X still receives the independent measured long-haft Z migration.');
          grips.replace(preSpearMirrorSnapshot);`;
          if (!source.includes(oldBlock)) throw new Error('Expected pre-v8 fishing-spear migration fixture was not found.');
          fs.writeFileSync(path, source.replace(oldBlock, newBlock));
          NODE
          git checkout origin/main -- .github/workflows/regression-suite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-procedural-hands.js .github/workflows/regression-suite.yml
          git commit -m "Repair fishing spear legacy migration fixture"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('scripts/runtime-frame-ownership-exceptions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/config/loot/loot-pools.json', 'utf8'))"
      - name: Cache-bust tokens moved with their files
        # PR checkouts are the merge commit, so diffing against the base tip is
        # exactly this PR's change. Fix locally with: node scripts/check-cache-busts.js --fix
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-cache-busts.js FETCH_HEAD
      - name: Regression tests
        # Slow tests only run on main / manual dispatch, not on every PR push.
        run: node scripts/run-tests.js ${{ github.event_name != 'pull_request' && '--all' || '' }}