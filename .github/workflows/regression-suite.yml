name: Apply dual-wield idle follow-up

on:
  pull_request:
    paths:
      - 'scripts/apply-dual-wield-idle-followup.py'
      - '.github/workflows/regression-suite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recenter-long-haft-grips-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply follow-up, validate, and restore normal workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s/if count != 1:/if count != 1 and not (label == 'hand mode help' and count == 0):/" scripts/apply-dual-wield-idle-followup.py
          python3 scripts/apply-dual-wield-idle-followup.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/test-attack-animation-editor-history-grips.js')
          text = path.read_text()
          old = "assert.match(panelUi, /attack-idle-stance-editor\\.js\\?v=20260919history1/, 'idle stance cache key must ship the unified-panel/history update');"
          new = "assert.match(panelUi, /attack-idle-stance-editor\\.js\\?v=[^'\\\"\\s]+/, 'idle stance cache key must remain versioned after idle-authoring updates');"
          if text.count(old) != 1:
              raise SystemExit('stale idle stance cache assertion target missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('scripts/test-dual-wield-weapon-visuals.js')
          text = path.read_text()
          old = "assert.match(grips, /if \\(dual\\.checked\\) editorSecondaryPoses\\[phase\\]\\.enabled = false/, 'editor Dual Wield switches off 2H');"
          new = "assert.match(grips, /if \\(dual\\.checked\\) \\{[\\s\\S]*?editorSecondaryPoses\\[phase\\]\\.enabled = false/, 'editor Dual Wield switches off 2H');"
          if text.count(old) != 1:
              raise SystemExit('stale dual-wield exclusivity assertion target missing')
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/check-cache-busts.js --fix
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('docs/config/combat/weapon-idle-stances.json', 'utf8'))"
          node scripts/run-tests.js
          git checkout origin/main -- .github/workflows/regression-suite.yml
          rm -f scripts/apply-dual-wield-idle-followup.js scripts/apply-dual-wield-idle-followup.py
          git add -A
          git commit -m "Add authored dual-wield idle stance and fix duplicate spacing"
          git push origin HEAD:fix/recenter-long-haft-grips-20261004
