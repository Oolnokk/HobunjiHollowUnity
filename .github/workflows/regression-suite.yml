name: Regression suite

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/regression-suite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final rig test expectations, cache-busts, and restore normal CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/test-procedural-hands.js'): [
                  ("assert.strictEqual(authoredCharacterProfiles['mashtzarr::male'].posteriorRule.heightPercentFromFloor, 28.18802021075617, 'v9 posterior coordinates recover the calibrated floor height instead of preserving the corrupted zero');",
                   "assert.strictEqual(authoredCharacterProfiles['mashtzarr::male'].posteriorRule.heightPercentFromFloor, 5.5, 'current posterior coordinates use the portrait-bottom-minus-20-percent calibration instead of preserving the superseded floor height');"),
              ],
              Path('scripts/test-puktuk-voorg-canonical-rig.js'): [
                  ("saddle: { x: 0, y: 0.16937859550590686, z: -0.012420318741466083 },",
                   "saddle: { x: 0, y: 0.1830394938019193, z: -0.012420318741466083 },"),
                  ("saddle: { x: -0.0016655977917167481, y: 0.12286908956931555, z: 0.043832914384796626 },",
                   "saddle: { x: -0.0016655977917167481, y: 0.18328943170147868, z: 0.043832914384796626 },"),
                  ("kind + ' saddle matches September 15 authoring'",
                   "kind + ' saddle matches the latest Rig Coordinates authoring'"),
              ],
          }
          for path, changes in replacements.items():
              text = path.read_text()
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          cat > .github/workflows/regression-suite.yml <<'YAML'
          name: Regression suite

          # One workflow for every scripts/test-*.js check (replaces the ~75 per-feature
          # workflows that each ran a handful of them). The whole fast suite takes ~10s,
          # so it isn't path-filtered. Browser smoke tests stay in smoke-dev-random-ruin-*.yml.
          on:
            pull_request:
              paths:
                - 'docs/**'
                - 'scripts/**'
                - '.github/workflows/regression-suite.yml'
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            regression:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Syntax check shipped scripts
                  run: |
                    set -e
                    for f in docs/game.js docs/js/*.js; do node --check "$f"; done
                - name: Validate JSON manifests
                  run: |
                    node -e "JSON.parse(require('fs').readFileSync('scripts/runtime-frame-ownership-exceptions.json', 'utf8'))"
                    node -e "JSON.parse(require('fs').readFileSync('docs/config/loot/loot-pools.json', 'utf8'))"
                - name: Cache-bust tokens moved with their files
                  # PR checkouts are the merge commit, so diffing against the base tip is
                  # exactly this PR's change. Fix locally with: node scripts/check-cache-busts.js --fix
                  if: github.event_name == 'pull_request'
                  run: |
                    git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
                    node scripts/check-cache-busts.js FETCH_HEAD
                - name: Regression tests
                  # Slow tests only run on main / manual dispatch, not on every PR push.
                  run: node scripts/run-tests.js ${{ github.event_name != 'pull_request' && '--all' || '' }}
          YAML

          rm -f .github/workflows/temp-rig-gameplay-appearance-validate.yml
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node scripts/check-cache-busts.js --fix "origin/${{ github.base_ref }}"
          node scripts/check-cache-busts.js "origin/${{ github.base_ref }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize Rig Coordinates gameplay rendering parity"
          git push origin HEAD:"${{ github.head_ref }}"
      - name: Validate finalized tree
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/js/animation-author-rig-gameplay-appearance.js
          node --check docs/js/procedural-hand-scale-free-world.js
          node scripts/test-animation-author-rig-pants-preview.js
          node scripts/test-pants-garment-wiring.js
          node scripts/test-procedural-hand-character-anchor-scale.js
          node scripts/test-procedural-hands.js
          node scripts/test-puktuk-voorg-canonical-rig.js
          node scripts/test-attachment-rig-master.js
          node scripts/test-new-creature-rig-coordinates.js
          node scripts/run-tests.js
