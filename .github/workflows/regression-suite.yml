name: Apply dual-wield patch

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/regression-suite.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch and restore normal workflow
        run: |
          set -e
          node --check scripts/apply-dual-wield-patch.js
          node scripts/apply-dual-wield-patch.js
          node scripts/check-cache-busts.js --fix
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/regression-suite.yml
          git rm scripts/apply-dual-wield-patch.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts .github/workflows/regression-suite.yml
          git commit -m "Add dual-wield attack mode and default two-hand attacks"
          git push origin HEAD:${{ github.head_ref }}
