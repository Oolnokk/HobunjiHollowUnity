name: Regression suite

# One workflow for every scripts/test-*.js check (replaces the ~75 per-feature
# workflows that each ran a handful of them). The whole fast suite takes ~10s,
# so it isn't path-filtered. Browser smoke tests stay in smoke-dev-random-ruin-*.yml.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/regression-suite.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('scripts/runtime-frame-ownership-exceptions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/config/loot/loot-pools.json', 'utf8'))"
      - name: Fix and validate cache-bust chain
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
          node scripts/check-cache-busts.js --fix "$BASE"
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "Apply cache-bust fixes for Rig Coordinates parity"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
          node scripts/check-cache-busts.js "$BASE"
      - name: Regression tests
        # Slow tests only run on main / manual dispatch, not on every PR push.
        run: node scripts/run-tests.js ${{ github.event_name != 'pull_request' && '--all' || '' }}
