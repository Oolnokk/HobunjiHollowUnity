name: Rebase dual-wield follow-up onto main

on:
  push:
    branches:
      - fix/recenter-long-haft-grips-20261004
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recenter-long-haft-grips-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current main, resolve known overlaps, validate, and restore CI
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            printf 'Merge conflicts:\n%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(docs/index\.html|docs/tools/attack-animation-editor/index\.html|scripts/runtime-frame-ownership-exceptions\.json)$' || true)"
            if [ -n "$unexpected" ]; then
              printf 'Unexpected conflict(s):\n%s\n' "$unexpected"
              exit 1
            fi
          elif [ "$merge_status" -ne 0 ]; then
            echo "git merge failed without reported file conflicts"
            exit "$merge_status"
          fi

          git checkout --theirs -- docs/index.html
          git checkout --ours -- docs/tools/attack-animation-editor/index.html
          git checkout --theirs -- scripts/runtime-frame-ownership-exceptions.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('scripts/runtime-frame-ownership-exceptions.json')
          data = json.loads(path.read_text())
          hits = [entry for entry in data if entry.get('file') == 'docs/js/hand-tool-grips.js']
          if len(hits) != 1:
              raise SystemExit(f'Expected one hand-tool-grips frame exception, found {len(hits)}')
          hits[0]['line'] = 1243
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          git add docs/index.html docs/tools/attack-animation-editor/index.html scripts/runtime-frame-ownership-exceptions.json
          node scripts/check-cache-busts.js --fix

          git checkout origin/main -- .github/workflows/regression-suite.yml
          git add -A

          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('scripts/runtime-frame-ownership-exceptions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/config/combat/weapon-idle-stances.json', 'utf8'))"
          node scripts/run-tests.js

          git commit -m "Merge current main into dual-wield follow-up"
          git push origin HEAD:fix/recenter-long-haft-grips-20261004
