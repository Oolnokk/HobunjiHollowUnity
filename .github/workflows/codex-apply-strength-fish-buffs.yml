name: Apply Strength and fish buffs

on:
  push:
    branches:
      - codex/strength-work-speed-fish-buffs-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/strength-work-speed-fish-buffs-20260902
          fetch-depth: 0
      - name: Apply focused source edits
        run: python3 scripts/codex-apply-strength-fish-buffs.py
      - name: Validate JavaScript and focused integration tests
        run: |
          node --check docs/js/alchemy-system.js
          node --check docs/js/skill-system.js
          node --check docs/js/fish-catalog.js
          node --check scripts/test-strength-fish-buffs.js
          node scripts/test-strength-fish-buffs.js
      - name: Remove temporary patch machinery
        run: |
          rm scripts/codex-apply-strength-fish-buffs.py
          rm .github/workflows/codex-apply-strength-fish-buffs.yml
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Balance Strength and diversify fish food buffs"
          git push origin HEAD:codex/strength-work-speed-fish-buffs-20260902
