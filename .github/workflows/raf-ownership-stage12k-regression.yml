name: RAF ownership Stage 12k regression (title screen gamepad poll)

on:
  pull_request:
    paths:
      - 'docs/js/title-screen-runtime.js'
      - 'scripts/test-title-screen-runtime-gamepad-poll-timer.js'
      - '.github/workflows/raf-ownership-stage12k-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/title-screen-runtime.js'
      - 'scripts/test-title-screen-runtime-gamepad-poll-timer.js'
      - '.github/workflows/raf-ownership-stage12k-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/title-screen-runtime.js
      - name: Title screen runtime gamepad poll timer conversion
        run: node scripts/test-title-screen-runtime-gamepad-poll-timer.js
