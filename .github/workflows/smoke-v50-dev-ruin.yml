name: Smoke V50 dev ruin bridge

on:
  push:
    branches:
      - agent/tool-hub-debrisifier-active
    paths:
      - '.github/workflows/smoke-v50-dev-ruin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install headless browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repo
        run: |
          python3 -m http.server 8000 --directory . >/tmp/hobunji-http.log 2>&1 &
          echo $! >/tmp/hobunji-http.pid
      - name: Generate an exact V50 ruin in Chromium
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const browserErrors = [];
            page.on('pageerror', error => browserErrors.push(String(error)));
            await page.goto('http://127.0.0.1:8000/docs/tools/debris-ifier/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => !!window.DebrisifierV50, null, { timeout: 30000 });
            const result = await page.evaluate(async () => {
              const api = window.DebrisifierV50;
              const generated = await api.generateInteriorLocale({ seed: 'dev-smoke-v50', size: 'medium', density: 62, roomMin: 3, roomMax: 4 });
              api.snapMechanismState(0);
              api.pausePreviewLoop();
              const roots = api.takePreviewRoots();
              let meshCount = 0, furnitureRoleCount = 0, motionCount = 0, wallCount = 0, linkedCubeCount = 0;
              roots.localeRoot.traverse(object => {
                if (object.isMesh || object.isInstancedMesh) meshCount++;
                if (object.userData?.interiorRuinRole) furnitureRoleCount++;
                if (object.userData?.previewMotion) motionCount++;
                if (object.userData?.ruinInteriorWall) wallCount++;
                if (object.userData?.activatorType === 'linkedCubePillars') linkedCubeCount++;
              });
              return {
                hash: api.sourceSha256,
                generatedBy: generated.locale?.meta?.generatedBy,
                environment: generated.locale?.meta?.environment,
                rooms: generated.locale?.meta?.interiorShell?.rooms?.length || 0,
                movingParts: generated.locale?.meta?.interiorShell?.movingParts?.length || 0,
                meshCount, furnitureRoleCount, motionCount, wallCount, linkedCubeCount,
                detached: !roots.localeRoot.parent,
              };
            });
            assert.equal(result.hash, '038a5d54c66b0ae2a9ceeb66967b9e5c32b616040f40b503eec59d5331885f40');
            assert.equal(result.generatedBy, 'HobunjiDebrisifierV50');
            assert.equal(result.environment, 'interior');
            assert.ok(result.rooms >= 3, JSON.stringify(result));
            assert.ok(result.meshCount > 20, JSON.stringify(result));
            assert.ok(result.furnitureRoleCount > 0, JSON.stringify(result));
            assert.ok(result.wallCount > 0, JSON.stringify(result));
            assert.ok(result.movingParts > 0, JSON.stringify(result));
            assert.equal(result.detached, true, JSON.stringify(result));
            if (browserErrors.length) throw new Error(`Page errors: ${browserErrors.join(' | ')}`);
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
