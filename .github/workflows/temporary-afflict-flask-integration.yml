name: Temporary Afflict flask integration

on:
  push:
    branches:
      - benjam/afflict-flask-dual-colors

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benjam/afflict-flask-dual-colors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate flask colors into AlchemySystem
        run: python3 scripts/apply-afflict-flask-integration.py
      - name: Syntax and focused tests
        run: |
          node --check docs/js/alchemy-system.js
          node --check docs/js/sprite-recolor.js
          node --check scripts/test-alchemy-flask-colors.js
          node scripts/run-tests.js alchemy-flask-colors trait-alchemy-refactor alcohol-bottle-held-pose
      - name: Fix cache-bust chain
        run: |
          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
          node scripts/check-cache-busts.js origin/main
      - name: Run full regression suite
        run: node scripts/run-tests.js
      - name: Commit integrated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-afflict-flask-integration.yml scripts/apply-afflict-flask-integration.py
          git add -A
          git commit -m "Integrate dual-color Afflict throwing flasks"
          git push origin HEAD:benjam/afflict-flask-dual-colors
