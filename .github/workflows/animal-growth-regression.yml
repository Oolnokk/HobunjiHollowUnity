name: Animal growth regression

on:
  push:
    paths:
      - 'docs/config/animal-growth-config.js'
      - 'docs/config/barn-incubator-config.js'
      - 'docs/config/economy-progression.js'
      - 'docs/config/furniture-authored/incubator.json'
      - 'docs/config/pieces/barn-incubator.json'
      - 'docs/config/shops/shop-stock.json'
      - 'docs/js/animal-growth.js'
      - 'docs/js/barn-incubator.js'
      - 'docs/js/carpenter-shop.js'
      - 'docs/js/fish-catalog.js'
      - 'docs/js/fishing-minigame.js'
      - 'docs/js/general-store.js'
      - 'docs/js/livestock-nursery-install-bridge.js'
      - 'scripts/test-animal-growth-kunji-shop.js'
      - 'scripts/test-barn-incubator.js'
      - 'scripts/test-carpenter-barn-additions.js'
      - 'scripts/test-economy-progression.js'
      - '.github/workflows/animal-growth-regression.yml'
  pull_request:
    paths:
      - 'docs/config/animal-growth-config.js'
      - 'docs/config/barn-incubator-config.js'
      - 'docs/config/economy-progression.js'
      - 'docs/config/furniture-authored/incubator.json'
      - 'docs/config/pieces/barn-incubator.json'
      - 'docs/config/shops/shop-stock.json'
      - 'docs/js/animal-growth.js'
      - 'docs/js/barn-incubator.js'
      - 'docs/js/carpenter-shop.js'
      - 'docs/js/fish-catalog.js'
      - 'docs/js/fishing-minigame.js'
      - 'docs/js/general-store.js'
      - 'docs/js/livestock-nursery-install-bridge.js'
      - 'scripts/test-animal-growth-kunji-shop.js'
      - 'scripts/test-barn-incubator.js'
      - 'scripts/test-carpenter-barn-additions.js'
      - 'scripts/test-economy-progression.js'
      - '.github/workflows/animal-growth-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check growth modules
        run: |
          node --check docs/config/animal-growth-config.js
          node --check docs/config/barn-incubator-config.js
          node --check docs/config/economy-progression.js
          node --check docs/js/animal-growth.js
          node --check docs/js/barn-incubator.js
          node --check docs/js/carpenter-shop.js
          node --check docs/js/general-store.js
          node --check docs/js/livestock-nursery-install-bridge.js
      - name: Test Growth Tonic and Kunji shop
        run: node scripts/test-animal-growth-kunji-shop.js
      - name: Test barn incubator lifecycle
        run: node scripts/test-barn-incubator.js
      - name: Test carpenter barn additions
        run: node scripts/test-carpenter-barn-additions.js
      - name: Test fishing economy progression
        run: node scripts/test-economy-progression.js
