permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check growth modules
        run: |
          node --check docs/config/animal-growth-config.js
          node --check docs/config/barn-incubator-config.js
          node --check docs/config/economy-progression.js
          node --check docs/js/animal-growth.js
          node --check docs/js/stable-animal-progression.js
          node --check docs/js/stable-animal-perk-adjustments.js
          node --check docs/js/stable-animal-town-familiarity.js
          node --check docs/js/stable-animal-training-refinements.js
          node --check docs/js/stable-animal-xp-events.js
          node --check docs/js/stable-training-compendium-patch.js
          node --check docs/js/farm-panel.js
          node --check docs/js/farm-panel-core.js
          node --check docs/js/farm-menu-layout.js
          node --check docs/js/farm-glance-palette.js
          node --check docs/js/barn-incubator.js
          node --check docs/js/carpenter-shop.js
          node --check docs/js/farm-troughs.js
          node --check docs/js/format-utils.js
          node --check docs/js/fish-catalog.js
          node --check docs/js/fishing-minigame.js
          node --check docs/js/general-store.js
          node --check docs/js/livestock-nursery.js
          node --check docs/js/livestock-nursery-observer-scope.js
          node --check docs/js/livestock-nursery-outdoor-growth.js
          node --check docs/js/livestock-nursery-grid.js
          node --check docs/js/livestock-nursery-inventory-paging.js
          node --check docs/js/livestock-nursery-grid-ui-fix.js
          node --check docs/js/livestock-nursery-install-bridge.js
          node --check docs/js/outdoor-livestock-welfare.js
          node --check docs/js/outdoor-livestock-presence.js
          node --check docs/js/farm-animals.js
          node --check docs/js/livestock-harvest-staging.js
          node --check docs/js/character-action-locks.js
          node --check scripts/test-livestock-harvest-staging.js
      - name: Test Growth Tonic and Kunji shop
        run: node scripts/test-animal-growth-kunji-shop.js
      - name: Test stable animal progression
        run: node scripts/test-stable-animal-progression.js
      - name: Test stable animal ambient sequencing
        run: node scripts/test-stable-animal-ambient-sequencing.js
      - name: Test stable animal progression dependency bridge
        run: node scripts/test-stable-animal-progression-deps-bridge.js
      - name: Test stable animal Pet Rapport
        run: node scripts/test-stable-animal-town-familiarity.js
      - name: Test stable training refinements
        run: node scripts/test-stable-animal-training-refinements.js
      - name: Test stable animal XP events
        run: node scripts/test-stable-animal-xp-events.js
      - name: Test native stable panel UI
        run: node scripts/test-stable-panel-training-ui.js
      - name: Test Stable Compendium copy
        run: node scripts/test-stable-training-compendium-copy.js
      - name: Test barn incubator lifecycle
        run: node scripts/test-barn-incubator.js
      - name: Test carpenter barn additions
        run: node scripts/test-carpenter-barn-additions.js
      - name: Test fishing economy progression
        run: node scripts/test-economy-progression.js
      - name: Test fishing silhouette hitboxes
        run: node scripts/test-fishing-silhouette-hitbox.js
      - name: Test livestock menu row identity
        run: node scripts/test-livestock-menu-regressions.js
      - name: Test livestock Nursery integration
        run: node scripts/test-livestock-nursery.js
      - name: Test Nursery portrait grid and livestock sale economy
        run: node scripts/test-livestock-nursery-grid.js
      - name: Test Nursery observer scope
        run: node scripts/test-livestock-nursery-observer-scope.js
      - name: Test Nursery full-barn outdoor growth
        run: node scripts/test-livestock-nursery-outdoor-growth.js
      - name: Test outdoor livestock welfare
        run: node scripts/test-outdoor-livestock-welfare.js
      - name: Test outdoor livestock world presence
        run: node scripts/test-outdoor-livestock-presence.js
      - name: Test authored livestock harvest animation playback
        run: node scripts/test-livestock-harvest-staging.js
      - name: Test Farm menu layout and Nursery controller continuity
        run: node scripts/test-farm-menu-layout.js
