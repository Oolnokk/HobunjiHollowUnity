permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check NPC social modules
        run: |
          node --check docs/config/npcs/social-relations.js
          node --check docs/js/character-action-locks.js
          node --check docs/game.js
          node --check docs/js/npc-activity-planner.js
          node --check docs/js/npc-performance-reaction-lock-runtime.js
          node --check docs/js/map-layout-system.js
          node --check scripts/test-npc-activity-planner.js
          node --check docs/js/npc-gifting.js
          node --check docs/js/npc-social-relationship-bridge-v2.js
          node --check docs/js/npc-social-seating-bridge.js
          node --check docs/js/npc-furniture-wardrobe-bridge-v2.js
          node --check docs/js/npc-furniture-wardrobe-bridge-v3.js
          node --check docs/js/npc-furniture-wardrobe-bridge-v4.js
          node --check docs/js/local-db-overrides.js
          node --check docs/js/named-animal-npc.js
          node --check docs/js/cavern-generator.js
          node --check docs/js/interior-scene-builder.js
          node --check scripts/test-named-animal-npc-species.js
          node --check scripts/test-locale-cavern-interiors.js
          node --check docs/js/building-interior-npc-wardrobe-editor.js
          node --check docs/js/building-interior-runtime-furniture.js
          node --check docs/js/furniture-vessel-runtime.js
          node --check docs/js/interior-fire-floor-runtime.js
          node --check docs/js/interior-fire-floor-integration.js
          node --check docs/js/interior-environment-runtime.js
          node --check docs/js/interior-fire-void-runtime.js
          node --check docs/js/alcohol-gameplay-bridge.js
          node --check docs/js/dialogue-content.js
          node --check docs/js/ambient-dialogue.js
          node --check docs/js/relationships-panel.js
          node --check docs/js/generic-hud-icons.js
          node --check docs/js/menu-tab-icon-only.js
          node --check docs/js/panel-ui.js
          node --check docs/js/combat/combat-config-loader.js
          node --check docs/js/navigation-compass.js
          node --check docs/js/outline-render-performance.js
          node --check docs/js/world-popup-text.js
          node --check docs/tools/dialogue-editor/dialogue-editor-state.js
          node --check scripts/test-dance-rapport-rate.js
          node --check scripts/test-generic-hud-icons.js
          node --check scripts/test-interior-fire-floor.js
          node --check scripts/test-interior-fire-void.js
          node --check scripts/test-kurraya-performance-reaction-lock.js
          node --check scripts/test-npc-gifting-multitrait.js
          node --check scripts/seed-npc-gift-preferences.js
          node --check scripts/test-npc-gift-color-preferences.js
          node --check scripts/test-npc-social-seating.js
          node --check scripts/test-banubu-questline.js
          node --check docs/js/banubu-quest-content.js
          node --check docs/js/banubu-questline.js
          node --check scripts/test-npc-swig-offer-cooldown.js
          node --check scripts/test-npc-wardrobe-placeholders.js
          node --check scripts/test-npc-bedroom-storage.js
          node --check scripts/test-relationship-heart-greetings.js
          node --check scripts/test-target-outline-alpha-cutout.js
          node --check scripts/test-wilderness-map-load-recovery.js
          node --check scripts/test-world-text-outline-overlay.js
          node --check scripts/audit-npc-wardrobe-placeholders.js
          node --check scripts/generate-placeholder-wardrobes.js
      - name: Test NPC planner and startup area ordering
        run: node scripts/test-npc-activity-planner.js
      - name: Test continuous player-dance Rapport rate
        run: node scripts/test-dance-rapport-rate.js
      - name: Test Kurraya performer physical-reaction lock
        run: node scripts/test-kurraya-performance-reaction-lock.js
      - name: Test generic HUD icon replacement and rapport popup integration
        run: node scripts/test-generic-hud-icons.js
      - name: Test interior fire, floor, environment, updated church, and civil midnight integration
        run: node scripts/test-interior-fire-floor.js
      - name: Test interior fire aliases and pure-black unlit void
        run: node scripts/test-interior-fire-void.js
      - name: Test balanced multi-trait NPC gifting
        run: node scripts/test-npc-gifting-multitrait.js
      - name: Test NPC gift colors against worn outfits
        run: node scripts/test-npc-gift-color-preferences.js
      - name: Test event-driven Rapport, social gates, dialogue, and wardrobes
        run: node scripts/test-npc-social-rapport-wardrobes.js
      - name: Test Banubu staged wake-up and quest progression
        run: node scripts/test-banubu-questline.js
      - name: Test named-animal creature-first runtime
        run: node scripts/test-named-animal-npc-species.js
      - name: Test locale cavern floor and grounding parity
        run: node scripts/test-locale-cavern-interiors.js
      - name: Test NPC swig offer visibility and cooldown
        run: node scripts/test-npc-swig-offer-cooldown.js
      - name: Test relationship-aware reactive seating
        run: node scripts/test-npc-social-seating.js
      - name: Test placeholder wardrobes and old prompt suppression
        run: node scripts/test-npc-wardrobe-placeholders.js
      - name: Audit reachable NPC bedrooms and priority-correct storage
        run: node scripts/test-npc-bedroom-storage.js
      - name: Test relationship heart rendering and greeting gates
        run: node scripts/test-relationship-heart-greetings.js
      - name: Test target outline alpha-cutout parity
        run: node scripts/test-target-outline-alpha-cutout.js
      - name: Test wilderness map load recovery
        run: node scripts/test-wilderness-map-load-recovery.js
      - name: Test world popup final overlay handoff
        run: node scripts/test-world-text-outline-overlay.js
      - name: Generate complete placeholder wardrobe registry
        run: node scripts/generate-placeholder-wardrobes.js
      - name: Audit placeholder wardrobe coverage for every NPC
        run: node scripts/audit-npc-wardrobe-placeholders.js
