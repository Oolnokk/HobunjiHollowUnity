name: Temp Character Studio Patterns

on:
  push:
    branches: [appearance-pattern-editor-pauldron-layer]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: appearance-pattern-editor-pauldron-layer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch implementation
        run: python scripts/patch-character-studio-patterns.py
      - name: Advance cache-bust chain
        run: node scripts/check-cache-busts.js --fix 80067c7476c2a67a78beaa0f08a6ca377f11de9c
      - name: Run focused regression
        run: node scripts/test-character-studio-pattern-integration.js
      - name: Run fast regression suite
        run: node scripts/run-tests.js
      - name: Commit tested implementation
        run: |
          rm -f .github/workflows/temp-character-studio-patterns.yml scripts/patch-character-studio-patterns.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add appearance pattern authoring and pauldron layering"
          git push origin HEAD:appearance-pattern-editor-pauldron-layer
