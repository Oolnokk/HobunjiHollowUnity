name: Temp PR917 Main Resolve

on:
  push:
    branches: [mammakhbuur-head-placeholders]

permissions:
  contents: write

jobs:
  resolve-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mammakhbuur-head-placeholders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile intentional scale tests and runtime hair clear
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            "scripts/test-character-rig-scale.js": [
              ("'tletingan::male': { x: 0.85, y: 0.85, head: 0.8823529411764706, offsetY: 0 }", "'tletingan::male': { x: 0.85, y: 0.85, head: 0.8, offsetY: 0 }"),
              ("'mao-ao::female': { x: 1.045, y: 1.30625, head: 0.9375, offsetY: 0 }", "'mao-ao::female': { x: 0.895, y: 0.94, head: 0.7813, offsetY: 0 }"),
            ],
            "scripts/test-full-character-scale-authoring-20260905.js": [
              ("'tletingan::male': { x: 0.85, y: 0.85, head: 0.8823529411764706, offsetY: 0 }", "'tletingan::male': { x: 0.85, y: 0.85, head: 0.8, offsetY: 0 }"),
              ("'mao-ao::female': { x: 1.045, y: 1.30625, head: 0.9375, offsetY: 0 }", "'mao-ao::female': { x: 0.895, y: 0.94, head: 0.7813, offsetY: 0 }"),
              ("const expectedRawHeadPercent = key === 'mao-ao::male' ? 72.6 : 75;", "const expectedRawHeadPercent = key === 'mao-ao::male' ? 72.6 : (key === 'mao-ao::female' ? 62.504 : (key === 'tletingan::male' ? 68 : 75));"),
            ],
            "docs/js/mammakhbuur-species-runtime.js": [
              ("delete data.defaultCosmetics.hairFront;", "data.defaultCosmetics.hairFront = null; // Explicitly clears seeded random front hair for every Mammakhbuur appearance.")
            ],
          }
          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'missing expected text in {filename}: {old}')
              text = text.replace(old, new)
            path.write_text(text)
          PY
      - name: Advance cache-bust chain from current main
        run: node scripts/check-cache-busts.js --fix 1eb64c001e7fe642ba9a406dd201090c905ffa51
      - name: Run fast regression suite
        run: node scripts/run-tests.js
      - name: Commit resolved branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Resolve PR917 onto current main"
          git push origin HEAD:mammakhbuur-head-placeholders
