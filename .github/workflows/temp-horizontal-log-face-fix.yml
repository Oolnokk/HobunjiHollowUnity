name: Temporary horizontal log face fix
on:
  push:
    branches:
      - feature/log-cabin-wall-generator
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix horizontal stacked-log wall faces'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/log-cabin-wall-generator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch horizontal wall faces
        run: |
          python3 scripts/temp-fix-horizontal-log-faces.py
          node --check docs/js/stacked-log-walls.js
          node scripts/test-stacked-log-walls.js
      - name: Commit product fix
        run: |
          git config user.name 'Oolnokk'
          git config user.email '155416726+Oolnokk@users.noreply.github.com'
          git add docs scripts/test-stacked-log-walls.js
          git commit -m 'Fix horizontal stacked-log wall faces'
          git push origin HEAD:feature/log-cabin-wall-generator
