name: Trust Dialogue Heart Regression

on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/game.js'
      - 'docs/js/condition-registry.js'
      - 'docs/js/combat/combat-config-loader.js'
      - 'docs/js/favor-heart-balance.js'
      - 'docs/js/weapon-trust-visits.js'
      - 'docs/js/weapon-tool-stances.js'
      - 'docs/js/combat/combat-loadout.js'
      - 'scripts/test-favor-heart-balance.js'
      - 'scripts/test-trust-dialogue-heart-scale.js'
      - 'scripts/test-dialogue-presentation.js'
      - '.github/workflows/trust-dialogue-heart-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check condition registry
        run: node --check docs/js/condition-registry.js
      - name: Syntax check Favor heart balance
        run: node --check docs/js/favor-heart-balance.js
      - name: Syntax check trust visit runtime
        run: node --check docs/js/weapon-trust-visits.js
      - name: Syntax check dialogue presentation integration
        run: |
          node --check docs/game.js
          node --check docs/js/weapon-tool-stances.js
          node --check scripts/test-dialogue-presentation.js
      - name: Favor heart balance regression
        run: node scripts/test-favor-heart-balance.js
      - name: Trust dialogue heart regression
        run: node scripts/test-trust-dialogue-heart-scale.js
      - name: Dialogue presentation regression
        run: node scripts/test-dialogue-presentation.js
