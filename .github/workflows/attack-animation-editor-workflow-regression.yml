name: Attack animation editor workflow regression

on:
  pull_request:
    paths:
      - 'docs/tools/attack-animation-editor/index.html'
      - 'docs/js/held-action-animations.js'
      - 'scripts/test-attack-animation-editor-workflow.js'
      - '.github/workflows/attack-animation-editor-workflow-regression.yml'
  workflow_dispatch:

jobs:
  editor-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unified editor workflow
        run: node scripts/test-attack-animation-editor-workflow.js
      - name: Shared held action regression
        run: node scripts/test-interior-held-items-drink-animation.js
      - name: Procedural hand integration
        run: node scripts/test-procedural-hands.js
      - name: Ranged archetype integration
        run: node scripts/test-ranged-weapon-archetypes.js
