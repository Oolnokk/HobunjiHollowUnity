name: Animation Author URL scene browser smoke

on:
  push:
    branches:
      - feature/spouse-kiss-height-adaptive # Exercise branch head even when concurrent main updates make the PR merge ref temporarily conflicted.
  pull_request:
    paths:
      - 'docs/tools/animation-author/index.html'
      - 'docs/js/spouse-kiss-motion.js'
      - 'docs/js/weapon-stance-drop-runtime.js'
      - 'docs/js/weapon-idle-body-yaw-runtime.js'
      - 'docs/js/player-body-transform-composer.js'
      - 'scripts/test-spouse-kiss-player-pose-ownership.js'
      - 'scripts/test-spouse-kiss-live-player-rig.js'
      - 'docs/config/npcs/hobunji-starter-npc-database.json'
      - 'scripts/smoke-animation-author-scene-url.js'
      - 'scripts/test-bipedal-monster-preview-browser.js'
      - 'docs/assets/models/hands/hand_primate.glb'
      - 'docs/assets/models/feet/foot_primate.glb'
      - '.github/workflows/smoke-animation-author-scene-url.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  animation-url-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the browser smoke script
        run: node --check scripts/smoke-animation-author-scene-url.js
      - name: Assert the live player and spouse rigs both animate
        run: node scripts/test-spouse-kiss.js
      - name: Verify in-game player rig pose ownership over camera and tool yaw
        run: node scripts/test-spouse-kiss-player-pose-ownership.js
      - name: Install real Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Exercise real Three.js player and spouse rig under camera/tool interference
        run: node scripts/test-spouse-kiss-live-player-rig.js
      - name: Serve local editor and NPC assets
        run: python3 -m http.server 8000 --directory docs >/tmp/hobunji-anim-author-http.log 2>&1 &
      - name: Rebuild Pahu and Leaf from URL and exercise real Three.js author/exports
        run: node scripts/smoke-animation-author-scene-url.js
      - name: Verify Old Man Nohuknuk swaps the placeholder hands and feet for real primate GLBs
        run: node scripts/test-bipedal-monster-preview-browser.js
