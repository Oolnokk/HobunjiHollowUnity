name: Diagnose foot texture sample
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'fix/wavy-limbs-medium-gray-stone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - name: Sample authored wavy surface at reported UV
        shell: python
        run: |
          from PIL import Image
          img = Image.open('docs/assets/textures/wavy_surface.png').convert('RGBA')
          def lum(px):
              r,g,b,a=px; return (0.2126*r+0.7152*g+0.0722*b)/255.0
          data=list(img.getdata())
          outline=.08
          vals=sorted(lum(px) for px in data if px[3]>8 and lum(px)>outline)
          q=lambda p: vals[round((len(vals)-1)*p)]
          slo,shi=q(.10),q(.90)
          target_rgb=(100,125,90)
          def processed(px):
              r,g,b,a=px; L=lum(px)
              if a==0 or L<=outline: return px
              t=max(0,min(1,(L-slo)/max(.0001,shi-slo)))
              targetL=.22+(.88-.22)*t
              scale=targetL/max(.0001,L)
              nr=max(0,min(255,round(r*scale))); ng=max(0,min(255,round(g*scale))); nb=max(0,min(255,round(b*scale)))
              L2=(0.2126*nr+0.7152*ng+0.0722*nb)/255.0
              shade=max(.18,min(1.18,L2/.55))
              return tuple(max(0,min(255,round(c*shade))) for c in target_rgb)+(a,)
          def sample(u,v, flip=False):
              u=(u*1.25)%1.0; v=v%1.0
              if flip: v=1-v
              x=min(img.width-1,max(0,int(u*img.width)))
              y=min(img.height-1,max(0,int(v*img.height)))
              src=img.getpixel((x,y)); out=processed(src)
              return x,y,src,out
          print('source size', img.size, 'p10/p90 luminance', slo, shi)
          for flip in [False, True]:
              print('\nflipY=', flip)
              for du,dv in [(0,0),(-.08,0),(.08,0),(0,-.08),(0,.08),(-.04,-.04),(.04,.04)]:
                  u=.468+du; v=.790+dv
                  print((round(u,3),round(v,3)), sample(u,v,flip))
          outs=[processed(px) for px in data]
          uniq=len(set(outs))
          exact=sum(1 for p in outs if p[:3]==target_rgb)
          lums=[lum(p) for p in outs if p[3]>8]
          mean=sum(lums)/len(lums); std=(sum((v-mean)**2 for v in lums)/len(lums))**.5
          print('\nprocessed unique RGBA=',uniq,'exact base fraction=',exact/len(outs),'mean/std=',mean,std)
