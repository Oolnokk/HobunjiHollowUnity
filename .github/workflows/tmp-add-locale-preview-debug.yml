name: Apply locale preview debug patch

on:
  push:
    branches:
      - chatgpt/locale-terrain-anchors
    paths:
      - scripts/tmp-add-locale-preview-debug.py
      - .github/workflows/tmp-add-locale-preview-debug.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/locale-terrain-anchors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/tmp-add-locale-preview-debug.py
      - name: Validate syntax
        run: node --check docs/tools/locale-editor/locale-preview3d.js
      - name: Commit patched preview
        run: |
          if git diff --quiet -- docs/tools/locale-editor/locale-preview3d.js; then
            echo "No preview changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tools/locale-editor/locale-preview3d.js
          git commit -m "Add copyable locale preview debug snapshot"
          git push origin HEAD:chatgpt/locale-terrain-anchors
