name: Android APK

# PRs produce test APKs. Main produces a signed automatic-update release only
# after the owner supplies a persistent Android signing keystore via Secrets.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'docs/js/local-save-folder-core.js'
      - 'docs/js/local-save-folder.js'
      - 'docs/js/creature-genetics-render.js'
      - 'scripts/test-android-saves.js'
      - 'scripts/test-android-drive-bridge.js'
      - 'scripts/test-animal-genotype-atomic-retry.js'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'android/**'
      - 'scripts/test-android-saves.js'
      - 'scripts/test-android-drive-bridge.js'
      - 'scripts/test-animal-genotype-atomic-retry.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-main-${{ github.event_name == 'push' && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      signing_ready: ${{ steps.release_config.outputs.signing_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Android folder sync and Nelk compositor
        run: |
          node scripts/test-android-saves.js
          node scripts/test-android-drive-bridge.js
          node scripts/test-animal-genotype-atomic-retry.js
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install pinned Three.js r128
        working-directory: android
        run: npm install --no-audit --no-fund
      - name: Test Android updater policy and package debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check shipped game and save bridge inside APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path("android/app/build/outputs/apk/debug/app-debug.apk")
          required = {
              "assets/game/index.html",
              "assets/game/js/local-save-folder-core.js",
              "assets/game/android-bridge.js",
              "assets/vendor/three.min.js",
              "assets/vendor/TransformControls.js",
          }
          with zipfile.ZipFile(apk) as archive:
              missing = required.difference(archive.namelist())
              if missing:
                  raise SystemExit("Missing Android game assets: " + ", ".join(sorted(missing)))
              html = archive.read("assets/game/index.html").decode("utf-8")
              assert 'src="android-bridge.js"' in html, "Android save bridge is not loaded"
              assert "../vendor/three.min.js" in html, "Three.js was not localized"
          print("Android APK includes the full game, storage bridge and bundled Three.js")
          PY
      - name: Smoke-test signed Android release packaging (disposable CI key)
        working-directory: android
        shell: bash
        run: |
          keytool -genkeypair -noprompt -alias hobunji-ci -keystore "$RUNNER_TEMP/hobunji-ci-test.jks" \
            -storepass testonly-password -keypass testonly-password -dname 'CN=Hobunji CI Signing Smoke' \
            -keyalg RSA -keysize 2048 -validity 2
          HOBUNJI_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/hobunji-ci-test.jks" \
          HOBUNJI_ANDROID_KEY_ALIAS="hobunji-ci" \
          HOBUNJI_ANDROID_KEYSTORE_PASSWORD="testonly-password" \
          HOBUNJI_ANDROID_KEY_PASSWORD="testonly-password" \
          HOBUNJI_ANDROID_VERSION_CODE=1234 \
          HOBUNJI_ANDROID_VERSION_NAME="0.1.234" \
            gradle --no-daemon :app:assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          expected="$(keytool -exportcert -keystore "$RUNNER_TEMP/hobunji-ci-test.jks" \
            -alias hobunji-ci -storepass testonly-password | openssl dgst -sha256 | awk '{print $2}')"
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$expected" && test "$expected" = "$actual" || { echo 'CI APK signer fingerprint mismatch'; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "name='com.oolnokk.hobunjihollow' versionCode='1234' versionName='0.1.234'"
          # The disposable test signer is never uploaded. Main release signing uses repository secrets.

      - name: Upload debug APK for manual PR testing
        uses: actions/upload-artifact@v4
        with:
          name: Hobunji-Hollow-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure stable release signing (main only)
        id: release_config
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.HOBUNJI_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_ALIAS: ${{ secrets.HOBUNJI_ANDROID_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.HOBUNJI_ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.HOBUNJI_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_B64" || -z "$RELEASE_ALIAS" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo 'No persistent Android release signing key configured; debug APK succeeded but automatic update publication is disabled.'
            echo 'signing_ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hobunji-release.jks"
          chmod 600 "$RUNNER_TEMP/hobunji-release.jks"
          echo "HOBUNJI_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hobunji-release.jks" >> "$GITHUB_ENV"
          echo "HOBUNJI_ANDROID_KEY_ALIAS=$RELEASE_ALIAS" >> "$GITHUB_ENV"
          echo "HOBUNJI_ANDROID_KEYSTORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HOBUNJI_ANDROID_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "HOBUNJI_ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HOBUNJI_ANDROID_VERSION_NAME=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo 'signing_ready=true' >> "$GITHUB_OUTPUT"

      - name: Build and verify signed Android update APK
        if: steps.release_config.outputs.signing_ready == 'true'
        working-directory: android
        shell: bash
        run: |
          # Never reuse the disposable CI-signing build or its cached Gradle outputs.
          gradle --no-daemon :app:clean :app:assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          expected="$(keytool -exportcert -keystore "$HOBUNJI_ANDROID_KEYSTORE_PATH" \
            -alias "$HOBUNJI_ANDROID_KEY_ALIAS" -storepass "$HOBUNJI_ANDROID_KEYSTORE_PASSWORD" \
            | openssl dgst -sha256 | awk '{print $2}')"
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$expected" && test "$expected" = "$actual" || {
            echo 'Refusing to publish APK: signing certificate does not match the persistent release keystore.'
            exit 1
          }
          mkdir -p release
          name="Hobunji-Hollow-Android-$HOBUNJI_ANDROID_VERSION_NAME.apk"
          cp "$apk" "release/$name"
          (cd release && sha256sum "$name" > "$name.sha256")

      - name: Upload stable signed APK for release publication
        if: steps.release_config.outputs.signing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hobunji-Hollow-Android-Signed-Release
          path: android/release/*
          if-no-files-found: error
          retention-days: 14

  publish-android-release:
    if: github.event_name == 'push' && needs.android-apk.outputs.signing_ready == 'true'
    needs: android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write # Only a successful, signed main build can publish a release.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hobunji-Hollow-Android-Signed-Release
          path: release
      - name: Publish signed Android auto-update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.1.${{ github.run_number }}"
          tag="android-v$version"
          apk="release/Hobunji-Hollow-Android-$version.apk"
          test -s "$apk"
          (cd release && sha256sum -c "Hobunji-Hollow-Android-$version.apk.sha256")
          gh release create "$tag" "$apk" "$apk.sha256" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Hobunji Hollow Android $version" \
            --notes "Signed Android build of main at commit ${{ github.sha }}. Installs over earlier APKs signed by the same release key; requires Android's installation confirmation." \
            --latest=false
