name: Temporary rebase PR 999
on:
  push:
    branches: [benjam/afflict-flask-dual-colors]
    paths: ['.github/workflows/temporary-rebase-pr999.yml']
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benjam/afflict-flask-dual-colors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebase and resolve audited conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          set +e
          GIT_EDITOR=true git rebase origin/main
          status=$?
          set -e
          while [ "$status" -ne 0 ]; do
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            subject="$(git show -s --format='%s' REBASE_HEAD 2>/dev/null || true)"
            echo "Stopped at: $(git show -s --format='%h %s' REBASE_HEAD 2>/dev/null || true)"
            printf 'Conflict: %s\n' "${conflicts[@]}"

            if [ "$subject" = "Integrate dual-color Afflict throwing flasks" ]; then
              allowed=1
              for file in "${conflicts[@]}"; do
                case "$file" in
                  docs/index.html|docs/tools/character-studio/index.html|docs/tools/cutscene-director/index.html|docs/tools/foliage-generator/index.html) ;;
                  *) allowed=0 ;;
                esac
              done
              if [ "$allowed" -ne 1 ]; then
                echo 'Unexpected conflict in dual-color commit' >&2
                git diff --cc --no-ext-diff
                git rebase --abort
                exit 1
              fi
              # These hunks only disagree on stale vs current cache tokens. Keep current main's loader lines.
              for file in "${conflicts[@]}"; do
                git checkout --ours -- "$file"
                git add "$file"
              done

            elif [ "$subject" = "Add Flasker bandits and throwing flask attack grip" ]; then
              allowed=1
              for file in "${conflicts[@]}"; do
                case "$file" in
                  docs/index.html|docs/config/loot/loot-pools.json) ;;
                  *) allowed=0 ;;
                esac
              done
              if [ "$allowed" -ne 1 ]; then
                echo 'Unexpected conflict in Flasker commit' >&2
                git diff --cc --no-ext-diff
                git rebase --abort
                exit 1
              fi

              if printf '%s\n' "${conflicts[@]}" | grep -qx 'docs/index.html'; then
                # Preserve current main's Minion loader and newer surrounding loader tokens.
                git checkout --ours -- docs/index.html
                git add docs/index.html
              fi

              if printf '%s\n' "${conflicts[@]}" | grep -qx 'docs/config/loot/loot-pools.json'; then
                # Main now guarantees Harlyao artifact generator drops in all four dungeon tiers.
                # Preserve that entire current-main loot file, then append only this feature's Flasker pool.
                git checkout --ours -- docs/config/loot/loot-pools.json
                python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/config/loot/loot-pools.json')
          text = path.read_text(encoding='utf-8')
          if '"bandit_flasker"' not in text:
              suffix = '\n    }\n  }\n}'
              if not text.endswith(suffix):
                  raise SystemExit('Unexpected loot-pools.json ending; refusing broad rewrite')
              flasker = '''\n    },\n    "bandit_flasker": {\n      "label": "Bandit (Flasker)",\n      "note": "Base corpse valuables. The exact two combat flask loadout types are granted separately by bandit-camps.js so death loot always matches what this Flasker was throwing.",\n      "entries": [\n        { "id": "gold", "itemKey": "gold", "min": 4, "max": 12, "chance": 1, "conditions": {} },\n        { "id": "scrapMetal", "itemKey": "banditScrapMetal", "min": 0, "max": 2, "chance": 1, "conditions": {} }\n      ]\n    }\n  }\n}'''
              text = text[:-len(suffix)] + flasker
              path.write_text(text, encoding='utf-8')
          PY
                node -e "const p=require('./docs/config/loot/loot-pools.json'); if(!p.pools.bandit_flasker) process.exit(1); for(let t=1;t<=4;t++){const e=p.pools['dungeonChest_tier'+t].entries; if(!e.some(x=>x.generatorKey==='harlyaoArtifact'&&x.tier===t)) process.exit(2)}"
                git add docs/config/loot/loot-pools.json
              fi

            else
              echo '=== UNRESOLVED CONFLICT HUNKS ==='
              git diff --cc --no-ext-diff
              git rebase --abort
              exit 1
            fi

            set +e
            GIT_EDITOR=true git rebase --continue
            status=$?
            set -e
          done
          echo "REBASED_HEAD=$(git rev-parse HEAD)"
      - name: Validate rebased tree
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/js/alchemy-flasks.js
          node --check docs/js/alchemy-system.js
          node --check docs/js/bandit-camps.js
          node --check docs/js/combat/combat-bandit.js
          node --check docs/js/combat/combat-enemy-dodge.js
          node --check docs/js/hand-tool-grips.js
          node --check docs/js/held-action-animations.js
          node --check docs/js/sprite-recolor.js
          node scripts/run-tests.js bandit-flasker harlyao-liches trait-alchemy-refactor alchemy-flask-colors enemy-weapon-stances weapon-trust-bandit-loadouts attack-animation-editor-history-grips
          node scripts/check-cache-busts.js --fix origin/main
          node scripts/check-cache-busts.js origin/main
          node scripts/run-tests.js
      - name: Remove helper and publish rebased branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/temporary-rebase-pr999.yml
          git add -A
          git commit -m "Finish rebase onto current main"
          git push --force-with-lease=benjam/afflict-flask-dual-colors:${GITHUB_SHA} origin HEAD:benjam/afflict-flask-dual-colors
