name: Branch planar VFX integration fix

on:
  push:
    branches:
      - feature/enchantment-planar-metal-vfx

permissions:
  contents: write

jobs:
  fix-entry-point:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore attack event bus and wire direct VFX load
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- docs/js/combat/combat-attack-events.js
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('docs/index.html')
          text = path.read_text()
          tag = '  <script src="js/combat/weapon-enchantment-vfx.js?v=20261006planar1"></script>'
          if tag not in text:
              pattern = r'(  <script src="js/combat/combat-enchantments\.js\?v=[^"]+"></script>)'
              text, count = re.subn(pattern, r'\1\n' + tag, text, count=1)
              if count != 1:
                  raise SystemExit('Could not locate combat-enchantments.js entry in docs/index.html')
              path.write_text(text)
          PY
          node scripts/test-weapon-enchantment-vfx.js
          git diff --check
      - name: Commit branch-only integration fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/js/combat/combat-attack-events.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Load planar enchantment VFX directly"
          git push origin HEAD:feature/enchantment-planar-metal-vfx
