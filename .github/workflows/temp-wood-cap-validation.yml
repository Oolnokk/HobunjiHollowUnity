name: Temporary wood cap validation
on:
  push:
    branches:
      - feature/log-cabin-wall-generator
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/log-cabin-wall-generator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve naturalized bark tint metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/js/wood-cut-surfaces.js')
          text = path.read_text()
          old = """  function sourceColorHex(material, fallback = '#6d472d') {
    const source = Array.isArray(material) ? material[0] : material; // First source wood material carries the procedural per-tree bark tint.
    if (!source?.color?.isColor) return fallback;
    return `#${source.color.getHexString()}`;
  }"""
          new = """  function sourceColorHex(material, fallback = '#6d472d') {
    const source = Array.isArray(material) ? material[0] : material; // First source wood material or naturalized bark material carries the source tint metadata.
    const mappedTint = String(source?.map?.userData?.naturalSurfaceBodySpriteTintTarget || ''); // NaturalSurfaceMaterials stores the pre-white-material bark tint on its body-tinted PNG texture.
    if (/^#[0-9a-f]{6}$/i.test(mappedTint)) return mappedTint.toLowerCase();
    if (!source?.color?.isColor) return fallback;
    return `#${source.color.getHexString()}`;
  }"""
          if old in text:
            path.write_text(text.replace(old, new, 1))
          elif new not in text:
            raise SystemExit('sourceColorHex block changed unexpectedly')
          PY
          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Preserve bark tint for shared wood cut surfaces"
            git push origin HEAD:feature/log-cabin-wall-generator
          fi
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('scripts/runtime-frame-ownership-exceptions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/config/loot/loot-pools.json', 'utf8'))"
      - name: Validate cache busts
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/check-cache-busts.js FETCH_HEAD
      - name: Regression tests
        run: node scripts/run-tests.js
