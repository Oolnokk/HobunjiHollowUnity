name: Locale terrain regression

on:
  pull_request:
    paths:
      - 'docs/config/locales/**'
      - 'docs/config/furniture-authored/nest*.json'
      - 'docs/js/combat/combat-config-loader.js'
      - 'docs/js/locale-terrain-placement.js'
      - 'docs/js/locale-cave-runtime.js'
      - 'docs/js/banubu-cave-clouds.js'
      - 'docs/js/interior-scene-builder.js'
      - 'docs/js/house-pieces.js'
      - 'docs/js/HousePieceGen.js'
      - 'docs/js/portrait-utils.js'
      - 'docs/js/surface-stretch-uv-furniture.js'
      - 'docs/js/natural-surface-stretch-post-jigsaw.js'
      - 'docs/js/natural-surface-stretch-runtime.js'
      - 'docs/js/natural-surface-jigsaw-exclusion.js'
      - 'docs/js/natural-surface-cliff-ridge-isolation.js'
      - 'docs/js/wilderness-cliff-surface-parity.js'
      - 'docs/js/zone-den-totem-features.js'
      - 'docs/js/den-locale-runtime.js'
      - 'docs/js/den-nest-system.js'
      - 'docs/js/dev-arena-nest-spawner.js'
      - 'docs/js/panel-ui.js'
      - 'docs/js/puktuk-den-nest-registration.js'
      - 'docs/js/wilderness-map-generator.js'
      - 'docs/js/cavern-generator.js'
      - 'docs/js/color-pools-system.js'
      - 'docs/js/creature-genetics-render.js'
      - 'docs/js/clothing-weaving-system.js'
      - 'docs/js/stable-animal-progression.js'
      - 'docs/js/procedural-furniture.js'
      - 'docs/config/furniture-authored/stonePedestal.json'
      - 'docs/js/cavern-sculptor.js'
      - 'docs/js/banubu-quest-content.js'
      - 'docs/js/banubu-questline.js'
      - 'docs/js/tea-grinder.js'
      - 'docs/js/key-item-system.js'
      - 'docs/js/cooking-system.js'
      - 'docs/js/dialogue-content.js'
      - 'docs/js/local-db-overrides.js'
      - 'docs/js/procedural-furniture.js'
      - 'docs/game.js'
      - 'docs/onboarding-core.js'
      - 'docs/index.html'
      - 'docs/config/npcs/schedule-overrides.json'
      - 'docs/config/npcs/hobunji-starter-npc-database.json'
      - 'docs/tools/dialogue-editor/**'
      - 'docs/tools/wilderness-generation-lab/**'
      - 'docs/tools/locale-editor/**'
      - 'scripts/test-locale-terrain-placement.js'
      - 'scripts/test-natural-surface-loader-cache.js'
      - 'scripts/test-natural-surface-post-jigsaw-order.js'
      - 'scripts/test-surface-stretch-uv.js'
      - 'scripts/test-natural-surface-stretch-runtime.js'
      - 'scripts/test-natural-surface-jigsaw-exclusion.js'
      - 'scripts/test-natural-surface-cliff-ridge-isolation.js'
      - 'scripts/test-wilderness-cliff-surface-parity.js'
      - 'scripts/test-boundary-current-vs-jigsaw.js'
      - 'scripts/test-farm-border-road-loader-order.js'
      - 'scripts/test-banubu-cave-locale.js'
      - 'scripts/test-banubu-cave-materials.js'
      - 'scripts/test-locale-cavern-interiors.js'
      - 'scripts/test-color-pools.js'
      - 'scripts/test-banubu-wilderness-lab-generation.js'
      - 'scripts/test-banubu-questline.js'
      - 'scripts/test-den-nest-individual-content.js'
      - 'scripts/test-den-locale-runtime.js'
      - 'scripts/test-den-locale-authoring.js'
      - 'scripts/test-den-entrance-locale-authoring.js'
      - 'scripts/test-startup-asset-path-regressions.js'
      - 'scripts/test-puktuk-den-nest-registration.js'
      - 'scripts/test-dev-arena-nest-spawner-hook-chain.js'
      - '.github/workflows/locale-terrain-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Banubu Wilderness Lab renderer
        run: node --check docs/tools/wilderness-generation-lab/lab-banubu-cave.js
      - name: Syntax check Locale Editor terrain, den encounter, and 3D preview
        run: |
          node --check docs/tools/locale-editor/terrain-placement.js
          node --check docs/tools/locale-editor/den-encounter-authoring.js
          node --check docs/tools/locale-editor/locale-preview3d.js
          node --check docs/js/den-locale-runtime.js
          node --check docs/js/zone-den-totem-features.js
          node --check docs/js/grid-tile-accessors.js
          node --check docs/js/locale-terrain-placement.js
          node --check docs/js/wilderness-map-generator.js
          node --check docs/js/HousePieceGen.js
          node --check docs/js/portrait-utils.js
          node --check docs/js/puktuk-den-nest-registration.js
          node --check docs/js/dev-arena-nest-spawner.js
          node -e "const fs=require('fs');const s=fs.readFileSync('docs/tools/locale-editor/locale-preview3d.js','utf8');for(const needle of ['Host above Δ≥+1','setRelativeHeight(1, null)','THREE.OrbitControls','cave_small.glb','embeddedTiles','previewRoot.remove(child)','parent !== previewRoot'])if(!s.includes(needle))throw new Error('missing '+needle);"
      - name: Syntax check Banubu quest runtime and editor integration
        run: |
          node --check docs/js/banubu-quest-content.js
          node --check docs/js/banubu-questline.js
          node --check docs/js/tea-grinder.js
          node --check docs/js/key-item-system.js
          node --check docs/js/cooking-system.js
          node --check docs/js/dialogue-content.js
          node --check docs/js/cavern-generator.js
          node --check docs/js/color-pools-system.js
          node --check docs/js/creature-genetics-render.js
          node --check docs/js/clothing-weaving-system.js
          node --check docs/js/stable-animal-progression.js
          node --check docs/js/procedural-furniture.js
          node --check docs/js/cavern-sculptor.js
          node --check docs/js/local-db-overrides.js
          node --check docs/js/procedural-furniture.js
          node --check docs/game.js
          node --check docs/tools/dialogue-editor/dialogue-editor-state.js
          node --check docs/tools/dialogue-editor/dialogue-editor-inspector.js
      - name: Test natural-surface UV loader cache coherence
        run: node scripts/test-natural-surface-loader-cache.js
      - name: Test natural-surface edge-preservation stack
        run: |
          node scripts/test-surface-stretch-uv.js
          node scripts/test-natural-surface-stretch-runtime.js
          node scripts/test-natural-surface-jigsaw-exclusion.js
          node scripts/test-natural-surface-post-jigsaw-order.js
          node scripts/test-natural-surface-cliff-ridge-isolation.js
          node scripts/test-wilderness-cliff-surface-parity.js
          node scripts/test-boundary-current-vs-jigsaw.js
          node scripts/test-farm-border-road-loader-order.js
      - name: Test startup face tags and portrait asset roots
        run: node scripts/test-startup-asset-path-regressions.js
      - name: Test terrain-aware locale placement
        run: node scripts/test-locale-terrain-placement.js
      - name: Test Banubu authored cave rules and runtime parity
        run: node scripts/test-banubu-cave-locale.js
      - name: Test Banubu cave material and cloud masking parity
        run: node scripts/test-banubu-cave-materials.js
      - name: Test locale-authored cavern interiors
        run: node scripts/test-locale-cavern-interiors.js
      - name: Test Color Pools animal painting
        run: node scripts/test-color-pools.js
      - name: Test Banubu in real Wilderness Lab Northern Cliffs generation
        run: node scripts/test-banubu-wilderness-lab-generation.js
      - name: Test Banubu cavern, dialogue, questline, and key-item scopes
        run: node scripts/test-banubu-questline.js
      - name: Test individual den nest content and bootstrap isolation
        run: node scripts/test-den-nest-individual-content.js
      - name: Test den locale runtime behavior
        run: node scripts/test-den-locale-runtime.js
      - name: Test den locale editor export persistence
        run: node scripts/test-den-locale-authoring.js
      - name: Test editable den entrance template and Locale Editor object authoring
        run: node scripts/test-den-entrance-locale-authoring.js
      - name: Test Puktuk den registration in isolation
        run: node scripts/test-puktuk-den-nest-registration.js
      - name: Test DevSpawner hook chain survives nest spawner
        run: node scripts/test-dev-arena-nest-spawner-hook-chain.js
      - name: Test held-hand ownership remains intact
        run: node scripts/test-procedural-hand-fallback.js
