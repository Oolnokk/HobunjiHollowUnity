name: Patch woven quality visibility

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: node scripts/patch-woven-quality-visibility-temp.js
      - name: Refresh cache-bust tokens
        run: node scripts/check-cache-busts.js --fix origin/main
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Run regression suite
        run: node scripts/run-tests.js
      - name: Commit result
        run: |
          set -e
          rm -f .github/workflows/patch-woven-quality-visibility.yml
          rm -f scripts/patch-woven-quality-visibility-temp.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep woven quality visible only in pack"
          git push
