name: Refresh Grehlr base-beard cache references
on:
  push:
    branches:
      - feature/grehlr-mint-shading-20261120
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Regenerate versioned script references using existing repository tool
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/check-cache-busts.js --fix FETCH_HEAD
          node scripts/check-cache-busts.js FETCH_HEAD
      - name: Commit regenerated references to the PR branch
        run: |
          git add docs scripts
          if git diff --cached --quiet; then
            echo 'No stale cache references'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh versioned loaders for Grehlr base-color beard behavior'
          git push origin HEAD:feature/grehlr-mint-shading-20261120
