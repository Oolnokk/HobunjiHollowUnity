name: Resolve PR 1002 conflicts

on:
  push:
    branches:
      - claude/trusting-thompson-211uaz

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main and validate both feature sets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # The previous dry run proved this three-way merge is clean. Do not
          # choose either side wholesale: let Git retain both independent edits.
          git merge --no-commit --no-ff origin/main

          # The temporary resolver must not remain in the PR diff.
          git rm .github/workflows/resolve-pr-1002-conflicts.yml

          # Guard newer main runtime work and PR #1002's ceiling integration.
          grep -q 'runAnimalAvatarBuildCompat' docs/game.js
          grep -q 'InteriorCeilings.buildCeilingGeometryData' docs/game.js
          grep -q 'authoredWallHeight' docs/game.js
          grep -q 'interior-ceilings.js' docs/index.html
          grep -q 'function gableAction' docs/tools/building-interior-author/index.html
          grep -q 'function writeCeiling' docs/tools/building-interior-author/index.html
          grep -q 'windowSilhouette' docs/js/building-interior-wall-ornament-editor.js

          node - <<'NODE'
          const fs = require('fs');
          const temple = JSON.parse(fs.readFileSync('docs/config/maps/map_i_temple.json', 'utf8'));
          if (temple.wallHeight !== 3.5) throw new Error('Temple wallHeight lost');
          if (temple.ceiling?.material !== 'carved') throw new Error('Temple carved ceiling lost');
          if (!Array.isArray(temple.ceiling?.gables) || temple.ceiling.gables.length !== 2) {
            throw new Error('Temple gables lost');
          }
          NODE

          git diff --check
          node scripts/test-interior-ceilings.js

          git add -A
          git commit -m "Merge current main into interior ceilings"
          git push origin HEAD:claude/trusting-thompson-211uaz
