name: Resolve PR 1002 conflicts

on:
  push:
    branches:
      - claude/trusting-thompson-211uaz

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main and validate ceiling integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # Preserve every non-conflicting main change. For the few overlapping
          # hunks, PR #1002's ceiling edit wins; unrelated files are handled
          # explicitly below.
          git merge --no-commit --no-ff -X ours origin/main

          # PR #1002 does not own the cutscene director. Keep current main
          # byte-for-byte for this ancestry-only conflict.
          git checkout origin/main -- docs/tools/cutscene-director/index.html

          # One-shot resolver scaffolding must disappear from the resulting PR.
          git rm .github/workflows/resolve-pr-1002-conflicts.yml

          if git grep -nF '<<<<<<<' -- . ':!docs/assets'; then
            echo 'Conflict marker remains after merge' >&2
            exit 1
          fi
          if git grep -nF '>>>>>>>' -- . ':!docs/assets'; then
            echo 'Conflict marker remains after merge' >&2
            exit 1
          fi

          check_contains() {
            local path="$1" needle="$2" label="$3"
            if ! grep -qF "$needle" "$path"; then
              echo "Missing required integration: $label ($path :: $needle)" >&2
              exit 1
            fi
            echo "ok: $label"
          }

          check_contains docs/game.js 'InteriorCeilings.buildCeilingGeometryData' 'runtime ceiling geometry hook'
          check_contains docs/game.js 'authoredWallHeight' 'authored wall-height integration'
          check_contains docs/index.html 'interior-ceilings.js' 'game ceiling module loader'
          check_contains docs/tools/building-interior-author/index.html 'function gableAction' 'editor gable authoring action'
          check_contains docs/tools/building-interior-author/index.html 'function writeCeiling' 'editor ceiling serializer'
          check_contains docs/js/building-interior-wall-ornament-editor.js 'windowSilhouette' 'window/gable wall ornament bridge'

          git diff --quiet origin/main -- docs/tools/cutscene-director/index.html || {
            echo 'Cutscene director is not identical to current main' >&2
            exit 1
          }

          node - <<'NODE'
          const fs = require('fs');
          const temple = JSON.parse(fs.readFileSync('docs/config/maps/map_i_temple.json', 'utf8'));
          if (temple.wallHeight !== 3.5) throw new Error('Temple wallHeight lost');
          if (temple.ceiling?.material !== 'carved') throw new Error('Temple carved ceiling lost');
          if (!Array.isArray(temple.ceiling?.gables) || temple.ceiling.gables.length !== 2) {
            throw new Error('Temple gables lost');
          }
          console.log('ok: temple authored carved ceiling + 2 gables');
          NODE

          git diff --check
          node scripts/test-interior-ceilings.js

          git add -A
          git commit -m "Merge current main into interior ceilings"
          git push origin HEAD:claude/trusting-thompson-211uaz
