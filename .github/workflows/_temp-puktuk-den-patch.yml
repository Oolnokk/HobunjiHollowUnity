name: Temporary Puktuk den source patch

on:
  push:
    branches:
      - chatgpt/puktuk-western-den-predator
    paths:
      - 'scripts/_temp_patch_puktuk_den.py'
      - '.github/workflows/_temp-puktuk-den-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/puktuk-western-den-predator
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/_temp_patch_puktuk_den.py
      - name: Validate patched source
        run: |
          node --check docs/js/creature-genetics.js
          node scripts/test-puktuk-species.js
          node scripts/test-voorg-ass-species.js
      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/js/creature-genetics.js scripts/test-puktuk-species.js
          git commit -m 'Make Western Slope dens Puktuk-only'
          git push origin HEAD:chatgpt/puktuk-western-den-predator
