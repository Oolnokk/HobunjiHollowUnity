name: Temp Character Voice Priority

on:
  push:
    branches:
      - feat/combat-vocalizations
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-vocalizations
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Confirm main ancestry
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Repair NPC attack patch matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/temp_patch_character_voice_priority.py')
          text = p.read_text()
          old = '''# Quick and charged both used identical data text; replace in order.
          quick_old = "data: { isBandit: true, attacker: c }, // see fireBanditComboStep's matching comment"
          quick_new = "data: { isBandit: true, attacker: c, voiceCategory: 'quickAttack', voiceAbilityId: loadout.tap2 }, // Shared vocal owner gives NPC quick attacks the same release grunt as the player."
          bandit = replace_once(bandit, quick_old, quick_new, 'bandit quick vocal metadata')
          charged_old = '      data: { isBandit: true, attacker: c },\\n      onStrike: () => {'
          charged_new = "      data: { isBandit: true, attacker: c, voiceCategory: 'offensiveHold', voiceAbilityId: 'chargedBreaker' },\\n      onStrike: () => {"
          bandit = replace_once(bandit, charged_old, charged_new, 'bandit charged vocal metadata')
          '''
          new = '''# Quick, charged, and counter-riposte attacks all run through the shared staged-action vocal path.
          quick_old = """      windupS: qa.WINDUP_S, strikeS: qa.STRIKE_S, recoverS: 0,
                data: { isBandit: true, attacker: c }, // see fireBanditComboStep's matching comment
                onStrike: () => {"""
          quick_new = """      windupS: qa.WINDUP_S, strikeS: qa.STRIKE_S, recoverS: 0,
                data: { isBandit: true, attacker: c, voiceCategory: 'quickAttack', voiceAbilityId: loadout.tap2 }, // Shared vocal owner gives NPC quick attacks the same release grunt as the player.
                onStrike: () => {"""
          bandit = replace_once(bandit, quick_old, quick_new, 'bandit quick vocal metadata')
          charged_old = '      data: { isBandit: true, attacker: c },\\n      onStrike: () => {'
          charged_new = "      data: { isBandit: true, attacker: c, voiceCategory: 'offensiveHold', voiceAbilityId: 'chargedBreaker' },\\n      onStrike: () => {"
          bandit = replace_once(bandit, charged_old, charged_new, 'bandit charged vocal metadata')
          counter_old = """      windupS: 0.05, strikeS: 0.15, recoverS: 0,
                data: { isBandit: true, attacker: c }, // see fireBanditComboStep's matching comment
                onStrike: () => {"""
          counter_new = """      windupS: 0.05, strikeS: 0.15, recoverS: 0,
                data: { isBandit: true, attacker: c, voiceCategory: 'quickAttack', voiceAbilityId: 'counterShield' }, // Counter ripostes are active NPC voice events too.
                onStrike: () => {"""
          bandit = replace_once(bandit, counter_old, counter_new, 'bandit counter vocal metadata')
          '''
          if old not in text:
              raise SystemExit('expected matcher block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply patch
        run: python3 scripts/temp_patch_character_voice_priority.py
      - name: Refresh cache tokens
        run: node scripts/check-cache-busts.js --fix origin/main
      - name: Syntax checks
        run: |
          node --check docs/js/character-voice-owner.js
          node --check docs/js/animal-voice-independent-playback.js
          node --check docs/js/dialogue-content.js
          node --check docs/js/combat/combat-vocalizations.js
          node --check docs/js/combat/combat-bandit.js
          node --check docs/js/combat/combat-config-loader.js
      - name: Focused voice tests
        run: |
          node scripts/test-character-voice-owner.js
          node scripts/test-combat-vocalizations.js
          node scripts/test-dialogue-syllable-cadence.js
          node scripts/test-dialogue-rich-text.js
          node scripts/test-animal-vocalizations.js
          node scripts/test-animal-authored-voice-routing.js
          node scripts/test-environmental-reverb.js
          node scripts/test-minion-enemies.js
      - name: Cache validation
        run: node scripts/check-cache-busts.js origin/main
      - name: Full suite
        run: node scripts/run-tests.js
      - name: Remove temporary patch machinery
        run: |
          git rm -f scripts/temp_patch_character_voice_priority.py
          git rm -f .github/workflows/temp-character-voice-priority.yml
      - name: Commit validated patch
        run: |
          git add -A
          git status --short
          git commit -m "Share prioritized combat voices across player and NPCs"
          git push origin HEAD:feat/combat-vocalizations
