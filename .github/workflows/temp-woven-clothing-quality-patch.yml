name: Temporary woven clothing quality patch

on:
  push:
    branches:
      - feature/woven-clothing-quality-gifts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply implementation patch
        run: node scripts/patch-woven-clothing-quality-temp.js
      - name: Fix cache-bust tokens
        run: node scripts/check-cache-busts.js --fix origin/main
      - name: Syntax check shipped scripts
        run: |
          set -e
          for f in docs/game.js docs/js/*.js; do node --check "$f"; done
      - name: Run regression tests
        run: node scripts/run-tests.js
      - name: Remove temporary patch machinery
        run: rm -f scripts/patch-woven-clothing-quality-temp.js .github/workflows/temp-woven-clothing-quality-patch.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Carry woven cloth quality into gifted clothing"
          git push
