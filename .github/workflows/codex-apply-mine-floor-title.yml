name: Apply mine floor generation title

on:
  push:
    branches:
      - codex/mine-floor-generation-title-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mine-floor-generation-title-20260902
          fetch-depth: 0
      - name: Apply focused source edits
        run: python3 scripts/codex-apply-mine-floor-title.py
      - name: Validate JavaScript and focused regression test
        run: |
          node --check docs/js/cavern-generator.js
          node --check docs/js/town-mine.js
          node --check scripts/test-mine-floor-generation-title.js
          node scripts/test-mine-floor-generation-title.js
      - name: Remove temporary patch machinery
        run: |
          rm scripts/codex-apply-mine-floor-title.py
          rm .github/workflows/codex-apply-mine-floor-title.yml
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show mine floor number during cave generation"
          git push origin HEAD:codex/mine-floor-generation-title-20260902
