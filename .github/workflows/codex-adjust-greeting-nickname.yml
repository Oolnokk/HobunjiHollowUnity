name: Adjust low-favor greeting nickname handling

on:
  push:
    branches:
      - codex/relationship-heart-greeting-thresholds

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/relationship-heart-greeting-thresholds
      - name: Patch greeting policy and regression
        run: python scripts/codex-patch-low-favor-greetings.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/js/ambient-dialogue.js scripts/test-relationship-heart-greetings.js
          git diff --cached --check
          git commit -m "Preserve low-favor nicknames without scan overhead"
          git push origin HEAD:codex/relationship-heart-greeting-thresholds
