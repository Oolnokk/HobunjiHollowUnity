name: RAF ownership Stage 12i regression (mashtzarr female runtime guard)

on:
  pull_request:
    paths:
      - 'docs/js/onboarding-character-creation-mashtzarr-female.js'
      - 'scripts/test-mashtzarr-female-runtime-guard-timer.js'
      - '.github/workflows/raf-ownership-stage12i-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/onboarding-character-creation-mashtzarr-female.js'
      - 'scripts/test-mashtzarr-female-runtime-guard-timer.js'
      - '.github/workflows/raf-ownership-stage12i-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/onboarding-character-creation-mashtzarr-female.js
      - name: Mashtzarr female runtime guard timer conversion
        run: node scripts/test-mashtzarr-female-runtime-guard-timer.js
