name: Temporary sync log wall branch
on:
  push:
    branches:
      - feature/log-cabin-wall-generator
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/log-cabin-wall-generator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current main and resolve index cache token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicted files:"
            printf '%s\n' "$conflicts"
            if [ "$conflicts" != "docs/index.html" ]; then
              exit 1
            fi
            git checkout --theirs docs/index.html
            git add docs/index.html
            node scripts/check-cache-busts.js --fix origin/main
            git add docs/index.html docs/js/format-utils.js docs/js/panel-ui.js docs/js/log-wall-materials.js docs/js/wall-builder-log-tool.js docs/js/wood-cut-surfaces.js
            git commit --no-edit
          fi
          git push origin HEAD:feature/log-cabin-wall-generator
