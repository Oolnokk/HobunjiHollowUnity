name: Controller modern-flow regression

on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/game.js'
      - 'docs/js/alchemy-flasks.js'
      - 'docs/js/mobile-potion-category-drag.js'
      - 'docs/js/bandage-system.js'
      - 'docs/onboarding-core.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'docs/js/controller-input.js'
      - 'docs/js/controller-ui-nav.js'
      - 'docs/js/controller-modern-flow-bridge.js'
      - 'docs/js/combat/melee-hud-reticle.js'
      - 'docs/js/combat/ranged-hud-reticle.js'
      - 'docs/js/calendar-system.js'
      - 'docs/js/day-progress-review.js'
      - 'docs/js/farm-troughs.js'
      - 'docs/js/npc-wardrobe.js'
      - 'docs/js/npc-furniture-wardrobe-bridge-v4.js'
      - 'docs/js/clothing-weaving-system.js'
      - 'docs/js/shipping-box-config.js'
      - 'docs/js/shipping-panel.js'
      - 'docs/js/farm-crates.js'
      - 'docs/js/combat/combat-config-loader.js'
      - 'scripts/test-runtime-frame-scheduler.js'
      - 'scripts/test-controller-modern-flow-bridge.js'
      - 'scripts/test-controller-shipping-box.js'
      - 'scripts/test-controller-input-authority.js'
      - 'scripts/test-controller-experience.js'
      - 'scripts/test-contextual-potion-selector.js'
      - 'scripts/test-bandage-system.js'
      - '.github/workflows/controller-modern-flow-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/game.js'
      - 'docs/js/alchemy-flasks.js'
      - 'docs/js/mobile-potion-category-drag.js'
      - 'docs/js/bandage-system.js'
      - 'docs/onboarding-core.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'docs/js/controller-input.js'
      - 'docs/js/controller-ui-nav.js'
      - 'docs/js/controller-modern-flow-bridge.js'
      - 'docs/js/combat/melee-hud-reticle.js'
      - 'docs/js/combat/ranged-hud-reticle.js'
      - 'docs/js/calendar-system.js'
      - 'docs/js/day-progress-review.js'
      - 'docs/js/farm-troughs.js'
      - 'docs/js/npc-wardrobe.js'
      - 'docs/js/npc-furniture-wardrobe-bridge-v4.js'
      - 'docs/js/clothing-weaving-system.js'
      - 'docs/js/shipping-box-config.js'
      - 'docs/js/shipping-panel.js'
      - 'docs/js/farm-crates.js'
      - 'docs/js/combat/combat-config-loader.js'
      - 'scripts/test-runtime-frame-scheduler.js'
      - 'scripts/test-controller-modern-flow-bridge.js'
      - 'scripts/test-controller-shipping-box.js'
      - 'scripts/test-controller-input-authority.js'
      - 'scripts/test-controller-experience.js'
      - 'scripts/test-contextual-potion-selector.js'
      - 'scripts/test-bandage-system.js'
      - '.github/workflows/controller-modern-flow-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-runtime-frame-scheduler.js
      - run: node scripts/test-controller-modern-flow-bridge.js
      - run: node scripts/test-controller-shipping-box.js
      - run: node scripts/test-controller-experience.js
      - run: node scripts/test-contextual-potion-selector.js
      - run: node scripts/test-bandage-system.js
      - run: node scripts/test-controller-input-authority.js
