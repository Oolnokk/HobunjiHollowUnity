name: One-shot bake of Tletingan fur-hood PNGs

on:
  push:
    branches: [feature/bake-tletingan-furhood-pngs]
    paths:
      - '.github/workflows/bake-tletingan-furhood-pngs.yml'

permissions:
  contents: write

jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bake-tletingan-furhood-pngs
          fetch-depth: 0
      - name: Install pixel-art processing support
        run: python3 -m pip install --break-system-packages 'Pillow==11.3.0'
      - name: Bake all source PNGs with the exact fitting-tool transform
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image

          folder=Path('docs/assets/cosmetics/clothes/hood')
          record=Path('scripts/records/tletingan-furhood-bake-2026-11-03.json')
          assert not record.exists(), 'Already baked; refusing a second destructive resample'
          expected={
              'furhood-base_tl_m.png':'c461f492faf651364f173e4c41c6e4495a431f50',
              'furhood-trim_tl_m.png':'c9014501ed44bedaa1cad68429152422641872f7',
              'furhood-behind_tl_m.png':'7c48d5cc9dcf238b8024c8eb984abb24c8eae649',
              'furhood_gar-wolf-front_tl_m.png':'d9ccd1219b8adf4dd463d87a8da691732ffee4f0',
              'furhood_gar-wolf-back_tl_m.png':'a1e2b0e081bff40098bdcea85341086c1eaee04e',
              'furhood_grehlr-front_tl_m.png':'86ce910ffa550d3071af93b930b4619ce6985cdd',
              'furhood_grehlr-back_tl_m.png':'8d091436310e3b3c353aeac19b0ab3440a54f6a2',
              'furhood_drenkirra-front_tl_m.png':'7f6001408d4586df7baed332b35f7efd77870856',
              'furhood_puktuk-front_tl_m.png':'6747950f5f22f2c3bd0de8e56d398bf2723de4e7',
              'furhood_voorg-ass-front_tl_m.png':'8498db956ecf40a3279766c0f7aadae07db06051',
              'furhood_voorg-ass-back_tl_m.png':'7809e165994bca438b712d97aef68d705a750082',
              'furhood_nelk-front_tl_m.png':'99d73123c824161816105179bfe6ac7d89d02a46',
          }
          def blob_sha(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()

          found={p.name for p in folder.glob('furhood*_tl_m.png')}
          assert found==set(expected), f'Unexpected Tletingan assets: {found ^ set(expected)}'
          assert not (folder/'furhood_nelk-back_tl_m.png').exists(), 'Previously pending Nelk back needs a separate audit'

          originals={}
          for name,sha in expected.items():
              data=(folder/name).read_bytes()
              assert blob_sha(data)==sha, f'{name}: source changed or previously baked'
              with Image.open(folder/name) as im:
                  assert im.size==(234,173) and im.mode=='RGBA', f'{name}: canvas changed'
              originals[name]=data

          entries=[]
          for name in sorted(expected):
              with Image.open(folder/name) as original:
                  src=original.convert('RGBA')
              w,h=src.size
              dst=Image.new('RGBA',(w,h),(0,0,0,0))
              source,target=src.load(),dst.load()
              # Inverse-map destination pixel centers; same affine as fitting tool.
              xs=[int((x+.5-w/2+3.5)/.835+w/2) for x in range(w)]
              ys=[int((y+.5-h/2+11.25)/.835+h/2) for y in range(h)]
              for y,sy in enumerate(ys):
                  if not (0<=sy<h):continue
                  for x,sx in enumerate(xs):
                      if 0<=sx<w:target[x,y]=source[sx,sy]
              dst.save(folder/name,format='PNG',optimize=True)
              with Image.open(folder/name) as check:
                  assert check.size==(234,173) and check.mode=='RGBA'
                  assert check.tobytes()==dst.tobytes(), f'{name}: output differs after PNG encode'
              entries.append({'file':name,'beforeGitBlob':expected[name],
                              'afterGitBlob':blob_sha((folder/name).read_bytes())})
              print('Baked',name)
          record.parent.mkdir(parents=True,exist_ok=True)
          record.write_text(json.dumps({
              'sourceFitKey':'from::tletingan_male::headwear::tletingan_male',
              'scaleX':.835,'scaleY':.835,'translateX':-3.5,'translateY':-11.25,
              'gridSize':6,'localOffsetCountNonzero':0,'canvas':[234,173],
              'interpolation':'nearest-neighbor via inverse pixel-center lookup',
              'missingUnchanged':['furhood_nelk-back_tl_m.png'],
              'files':entries
          },indent=2)+'\n')
          assert len(entries)==12
          PY
      - name: Commit baked PNGs to feature branch (never main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/assets/cosmetics/clothes/hood/ scripts/records/tletingan-furhood-bake-2026-11-03.json
          git diff --cached --stat
          git diff --cached --quiet && { echo 'ERROR: PNGs were not updated'; exit 1; }
          git commit -m "Bake the Tletingan fur hood fit into 12 source PNGs"
          git push origin HEAD:feature/bake-tletingan-furhood-pngs
