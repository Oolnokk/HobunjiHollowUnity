name: Apply head turn fix

on:
  push:
    branches:
      - fix/head-turn-65-camera-facing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/head-turn-65-camera-facing
          fetch-depth: 0

      - name: Patch shared player head aim
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/game.js')
          text = path.read_text(encoding='utf-8')
          start_marker = '      // Keep the head\'s WORLD yaw on the player\'s actual look/aim direction,\n'
          end_marker = '      // Interactable used by both getInteriorInteractableAt (interior scene)\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Head-aim start marker not found; refusing to patch.')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Head-aim end marker not found; refusing to patch.')
          if text.find(start_marker, start + 1) >= 0:
              raise SystemExit('Multiple head-aim blocks found; refusing ambiguous patch.')

          replacement = '''      const PLAYER_HEAD_TURN_MAX_DEG = 65; // Shared body-relative neck yaw cap used by animated/aiming and seated head turns.
      const PLAYER_HEAD_TURN_MAX_RAD = THREE.MathUtils.degToRad(PLAYER_HEAD_TURN_MAX_DEG); // Used by updatePlayerHeadAim for range tests and the final hard clamp.

      function clampPlayerHeadYaw(targetWorldYaw, bodyWorldYaw) {
        return THREE.MathUtils.clamp(
          angleDiff(targetWorldYaw, bodyWorldYaw),
          -PLAYER_HEAD_TURN_MAX_RAD,
          PLAYER_HEAD_TURN_MAX_RAD
        );
      }

      // Keep the head's WORLD yaw on the player's actual look/aim direction,
      // independently of the body/avatar plane. The plane can lag behind aim
      // because of its camera-facing dead zone, and combat poses can add their
      // own bodyYaw flourish; this local neck residual counters both. Every
      // path ends at the same 65-degree body-relative neck cap. While seated,
      // the head looks AT the camera only while that camera lies inside the
      // neck range; once it moves outside the range, the head instead follows
      // the camera's facing direction so it can never twist around toward the
      // camera through the back of the body.
      function updatePlayerHeadAim() {
        if (!playerNeckJoint || cutscenePreviewActive) return;
        // playerMesh.rotation.y is this function's base body-yaw signal, but
        // channels like weapon-idle-stance-body-yaw (see
        // weapon-idle-body-yaw-runtime.js) never touch it directly — they
        // reach playerMesh through PlayerBodyTransformComposer's render-time
        // world delta. Include that delta before both the seated range test
        // and final clamp so animations cannot silently expand neck range.
        const composerYawDelta = window.PlayerBodyTransformComposer?.resolvedYawDeltaRad?.() || 0;
        const bodyWorldYaw = playerMesh.rotation.y + composerYawDelta; // Used below as the actual rendered-body reference for every head target.

        let targetWorldYaw;
        if (activeCameraMode === SHOULDER_SURF_MODE) {
          // Shoulder-surf: use the shared reticle/ground aim point rather than
          // raw camera azimuth, keeping head aim aligned with gameplay aim.
          targetWorldYaw = -mouseLookAngle + Math.PI / 2;
        } else if (sitInteraction?.phase === 'active') {
          const yawTowardCamera = activeCameraAzimuthRad(); // Used here to decide whether the seated player can physically look back at the camera.
          const cameraLookResidual = angleDiff(yawTowardCamera, bodyWorldYaw); // Used only for the seated in-neck-range test below.
          targetWorldYaw = Math.abs(cameraLookResidual) <= PLAYER_HEAD_TURN_MAX_RAD
            ? yawTowardCamera
            : yawTowardCamera + Math.PI;
        } else {
          targetWorldYaw = -player.angle + Math.PI / 2;
        }

        playerNeckJoint.rotation.y = clampPlayerHeadYaw(targetWorldYaw, bodyWorldYaw);
        // Purely cosmetic head nod matching the camera's own up/down tilt
        // (cameraAngleOffsetDeg — how far the player has pitched the camera
        // off the mode's neutral framing) — this rig has no other pitch
        // consumer, so a plain local X rotation on the neck bone (not a
        // world-yaw-style correction like above) is enough. Scaled down from
        // the camera's own pitch range since a flat cutout head tilting a
        // full ±45° reads as exaggerated compared to the same swing on an
        // actual 3D head.
        playerNeckJoint.rotation.x = activeCameraMode === SHOULDER_SURF_MODE
          ? THREE.MathUtils.degToRad(cameraAngleOffsetDeg) * 0.6
          : 0;
      }

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Validate patched runtime
        shell: bash
        run: |
          node --check docs/game.js
          git diff --check
          grep -n "PLAYER_HEAD_TURN_MAX_DEG = 65" docs/game.js
          test "$(grep -c "playerNeckJoint.rotation.y =" docs/game.js)" -eq 1

      - name: Commit patched game and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-head-turn-fix.yml
          git add docs/game.js
          git commit -m "Clamp player head turn and fix seated camera look"
          git push origin HEAD:fix/head-turn-65-camera-facing
