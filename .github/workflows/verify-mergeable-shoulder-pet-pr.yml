name: Verify mergeable shoulder pet PR

on:
  push:
    branches:
      - fix/shoulder-pet-follow-authored-pixel

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check docs/game.js
      - run: node --check docs/js/png-plane-avatar.js
      - run: node scripts/test-shoulder-pet-attack-rotation.js
