name: Temporary cache-bust fix

on:
  push:
    branches:
      - benjam/metal-armor-gift-preferences

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benjam/metal-armor-gift-preferences
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix cache-bust chain
        run: |
          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html docs/js/combat/combat-config-loader.js
            git commit -m "Fix cache-bust chain"
            git push origin HEAD:benjam/metal-armor-gift-preferences
          fi
