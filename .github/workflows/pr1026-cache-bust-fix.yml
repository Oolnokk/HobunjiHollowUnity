name: PR1026 Cache Bust Fix

on:
  push:
    branches:
      - fix/ruin-door-seal-projectile-cover-20261015

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[cache-bust-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/ruin-door-seal-projectile-cover-20261015
      - name: Rewrite stale cache-bust tokens
        run: node scripts/check-cache-busts.js --fix origin/main
      - name: Commit fixed loader tokens
        run: |
          if git diff --quiet; then
            echo "No cache-bust changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git commit -m "Fix cache-bust loader chain [cache-bust-fixed]"
          git push origin HEAD:fix/ruin-door-seal-projectile-cover-20261015
