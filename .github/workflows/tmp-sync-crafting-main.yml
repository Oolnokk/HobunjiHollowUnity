name: Temporary crafting branch sync

on:
  push:
    branches:
      - codex/npc-crafting-commissions-v2
    paths:
      - .github/workflows/tmp-sync-crafting-main.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure branch committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge latest main and resolve generated loader tokens
        run: |
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "docs/index.html" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs docs/index.html
            git add docs/index.html
            git commit --no-edit
          fi
          node scripts/check-cache-busts.js --fix origin/main
      - name: Run feature integration checks
        run: |
          node scripts/test-advanced-loom-cooking-yield.js
          node scripts/test-clothing-weaving-system.js
          node scripts/test-npc-crafting-commissions.js
          node scripts/test-interior-furniture-grid.js
          node scripts/test-review-runtime-regressions.js
      - name: Remove temporary workflow and push sync
        run: |
          rm .github/workflows/tmp-sync-crafting-main.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refresh crafting branch after latest main"
          fi
          git push origin HEAD:codex/npc-crafting-commissions-v2
