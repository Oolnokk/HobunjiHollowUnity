name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate save entrypoints
        run: |
          node --check docs/js/browser-drive-folder.js
          node --check docs/js/netlify-cloud-save.js
          node --check docs/js/save-startup-gate.js
          node --check docs/onboarding-core.js
          node scripts/test-netlify-cloud-save-static-preview.js
          test -f docs/index.html
          test "$(du -sb docs | cut -f1)" -lt 1073741824
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
