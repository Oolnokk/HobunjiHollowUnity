name: Analyze texture visibility
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/wavy-limbs-medium-gray-stone]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Measure PNG contrast and minification
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path

          roots = [Path('docs/assets'), Path('assets')]
          def find_one(name):
              for root in roots:
                  if root.exists():
                      hits = list(root.rglob(name))
                      if hits: return hits[0]
              return None

          targets = [
              ('wavy_surface', find_one('wavy_surface.png')),
              ('carved_smooth', find_one('carved_smooth.png')),
              ('body_torso', find_one('torso_mao-ao_m.png')),
          ]

          def lum_stats(img):
              rgba = img.convert('RGBA')
              px = list(rgba.getdata())
              vals=[]; alphas=[]
              for r,g,b,a in px:
                  alphas.append(a)
                  if a > 8:
                      vals.append((0.2126*r + 0.7152*g + 0.0722*b)/255.0)
              if not vals: return None
              mean=sum(vals)/len(vals)
              std=(sum((v-mean)**2 for v in vals)/len(vals))**0.5
              vals_sorted=sorted(vals)
              def p(q): return vals_sorted[min(len(vals_sorted)-1, round((len(vals_sorted)-1)*q))]
              return dict(n=len(vals), alpha_nonzero=sum(a>8 for a in alphas)/len(alphas), min=min(vals), p05=p(.05), p25=p(.25), mean=mean, p75=p(.75), p95=p(.95), max=max(vals), std=std)

          def shade_fill(img, rgb=(128,128,128), shadow=.18, hi=1.18, neutral=.55, gamma=1.0, outline=.08):
              rgba=img.convert('RGBA')
              out=Image.new('RGBA', rgba.size)
              op=[]
              for r,g,b,a in rgba.getdata():
                  if a == 0:
                      op.append((r,g,b,a)); continue
                  lum=(0.2126*r+0.7152*g+0.0722*b)/255.0
                  if lum <= outline:
                      op.append((r,g,b,a)); continue
                  shade=max(shadow,min(hi,(max(0,lum)/neutral)**gamma))
                  op.append(tuple(max(0,min(255,round(c*shade))) for c in rgb)+(a,))
              out.putdata(op)
              return out

          for label,path in targets:
              print('\n###',label, path)
              if not path:
                  print('MISSING'); continue
              img=Image.open(path)
              print('size=',img.size,'mode=',img.mode,'stats=',lum_stats(img))
              tinted=shade_fill(img)
              print('shadeFill#808080=',lum_stats(tinted))
              for size in [64,32,16,8,4]:
                  small=tinted.resize((size,size), Image.Resampling.BILINEAR)
                  print(f'bilinear_{size}=',lum_stats(small))
                  nearest=tinted.resize((size,size), Image.Resampling.NEAREST)
                  print(f'nearest_{size}=',lum_stats(nearest))
