name: Stamina Recovery Regression

on:
  pull_request:
    paths:
      - 'docs/js/combat/resource-system.js'
      - 'docs/js/combat/combat-quickattacks.js'
      - 'docs/js/alchemy-system.js'
      - 'docs/js/alcohol-gameplay-bridge.js'
      - 'docs/js/inventory-held-override.js'
      - 'docs/js/calendar-system.js'
      - 'docs/js/day-progress-review.js'
      - 'scripts/test-resource-rings.js'
      - 'scripts/test-quick-attack-conditional-refund.js'
      - 'scripts/test-trait-alchemy-refactor.js'
      - '.github/workflows/stamina-recovery-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check stamina runtime
        run: |
          node --check docs/js/combat/resource-system.js
          node --check docs/js/combat/combat-quickattacks.js
          node --check docs/js/alchemy-system.js
      - name: Resource and affliction recovery regression
        run: node scripts/test-resource-rings.js
      - name: Quick Attack refund handoff regression
        run: node scripts/test-quick-attack-conditional-refund.js
      - name: Alchemy stamina restoration regression
        run: node scripts/test-trait-alchemy-refactor.js
