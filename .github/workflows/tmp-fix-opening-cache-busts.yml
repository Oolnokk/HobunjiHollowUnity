name: Temporary opening cache-bust fix

on:
  push:
    branches:
      - codex/fix-opening-rescue-mobile-startup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix cache-bust loader chain
        run: |
          git fetch --no-tags origin main
          node scripts/check-cache-busts.js --fix origin/main
      - name: Commit generated cache tokens
        run: |
          if git diff --quiet; then
            echo "No cache-bust updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git commit -m "Refresh opening cache-bust tokens"
          git push origin HEAD:codex/fix-opening-rescue-mobile-startup
