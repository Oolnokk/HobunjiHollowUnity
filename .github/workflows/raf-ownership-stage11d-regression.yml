name: RAF ownership Stage 11d regression (onboarding weapon polish)

on:
  pull_request:
    paths:
      - 'docs/js/onboarding-character-creation-weapon-polish.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-onboarding-character-creation-weapon-polish-scheduler.js'
      - '.github/workflows/raf-ownership-stage11d-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/js/onboarding-character-creation-weapon-polish.js'
      - 'docs/js/runtime-frame-scheduler.js'
      - 'scripts/test-onboarding-character-creation-weapon-polish-scheduler.js'
      - '.github/workflows/raf-ownership-stage11d-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check docs/js/onboarding-character-creation-weapon-polish.js
      - name: Onboarding character creation weapon polish scheduler migration
        run: node scripts/test-onboarding-character-creation-weapon-polish-scheduler.js
