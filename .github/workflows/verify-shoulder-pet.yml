name: Verify shoulder pet surface transform

on:
  push:
    branches:
      - fix/shoulder-pet-follow-authored-pixel

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and regression checks
        run: |
          node --check docs/game.js
          node --check docs/js/png-plane-avatar.js
          node scripts/test-shoulder-pet-attack-rotation.js
