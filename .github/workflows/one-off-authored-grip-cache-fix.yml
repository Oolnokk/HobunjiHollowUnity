name: One-off authored grip cache fix

on:
  push:
    branches:
      - feat/authored-spear-bshuakauitl-grips

permissions:
  contents: write

jobs:
  fix-cache-busts:
    if: ${{ !contains(github.event.head_commit.message, 'Auto-fix authored grip cache busts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authored-spear-bshuakauitl-grips
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repository cache-bust fixer
        run: |
          git fetch origin main
          node scripts/check-cache-busts.js --fix origin/main
      - name: Commit cache-bust updates
        run: |
          if git diff --quiet; then
            echo "No cache-bust changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git commit -m "Auto-fix authored grip cache busts"
          git push origin HEAD:feat/authored-spear-bshuakauitl-grips
