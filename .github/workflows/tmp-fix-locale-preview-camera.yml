name: Fix locale preview camera target

on:
  push:
    branches:
      - chatgpt/locale-terrain-anchors
    paths:
      - '.github/workflows/tmp-fix-locale-preview-camera.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/locale-terrain-anchors
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch locale preview orbit target
        run: |
          python - <<'PY'
          from pathlib import Path

          preview_path = Path('docs/tools/locale-editor/locale-preview3d.js')
          s = preview_path.read_text()

          old_var = "  let currentCandidate = null;\n  let currentWorkspace = null;"
          new_var = "  let currentCandidate = null;\n  let currentInstance = null; // Exact locale instance currently rendered; camera orbiting follows this rather than assuming world origin.\n  let currentWorkspace = null;"
          if old_var in s:
              s = s.replace(old_var, new_var, 1)
          elif 'let currentInstance = null;' not in s:
              raise SystemExit('currentInstance insertion target missing')

          old_clear = "    terrainMaterials.clear();\n    currentMerged = null;\n"
          new_clear = "    terrainMaterials.clear();\n    currentMerged = null;\n    currentInstance = null; // Do not leave the orbit target attached to a locale from the previous generated scenario.\n"
          if old_clear in s:
              s = s.replace(old_clear, new_clear, 1)
          elif 'Do not leave the orbit target attached' not in s:
              raise SystemExit('clearWorld camera reset target missing')

          old_fit = '''  function fitCamera() {
    if (!camera || !controls || !currentCandidate || !currentLocale) return;
    const scale = currentCandidate.scale || window.LocaleTerrainPlacement.inferGenerationScale(currentWorkspace);
    const placed = currentWorkspace?.localeInstances?.find(item => item.localeId === currentLocale.id);
    const anchorC = Number.isFinite(Number(currentCandidate.anchorC)) ? Number(currentCandidate.anchorC) : Number(placed?.x) || 0;
    const anchorR = Number.isFinite(Number(currentCandidate.anchorR)) ? Number(currentCandidate.anchorR) : Number(placed?.y) || 0;
    const centerX = anchorC + (currentLocale.cols * scale) / 2;
    const centerZ = anchorR + (currentLocale.rows * scale) / 2;
    const centerY = currentMerged ? surfaceY(currentMerged, centerX, centerZ) : 0;
    const span = Math.max(12, Math.max(currentLocale.cols, currentLocale.rows) * scale * 1.35);
    controls.target.set(centerX, centerY + 1.2, centerZ);
    camera.position.set(centerX + span * 0.72, centerY + span * 0.56, centerZ + span * 0.78);
    camera.near = 0.05;
    camera.far = 3000;
    camera.updateProjectionMatrix();
    controls.update();
  }
'''
          new_fit = '''  function finiteCoordinate(value) {
    if (value == null || value === '') return null; // Number(null) is 0, which previously made an absent anchor silently focus tile 0,0.
    const numeric = Number(value);
    return Number.isFinite(numeric) ? numeric : null;
  }
  function fitCamera() {
    if (!camera || !controls || !currentLocale) return;
    const scale = currentCandidate?.scale || window.LocaleTerrainPlacement.inferGenerationScale(currentWorkspace) || 1;
    const placed = currentInstance || currentWorkspace?.localeInstances?.find(item => item.localeId === currentLocale.id) || null;
    const anchorC = finiteCoordinate(placed?.x) ?? finiteCoordinate(placed?.col) ?? finiteCoordinate(currentCandidate?.anchorC);
    const anchorR = finiteCoordinate(placed?.y) ?? finiteCoordinate(placed?.row) ?? finiteCoordinate(currentCandidate?.anchorR);
    const compiled = window.LocaleTerrainPlacement.compileLocale(currentLocale, scale);
    const bounds = compiled?.footprint || compiled?.bounds;
    let centerX, centerZ, spanX, spanZ;
    if (anchorC != null && anchorR != null) {
      const minC = finiteCoordinate(bounds?.minC) ?? 0;
      const minR = finiteCoordinate(bounds?.minR) ?? 0;
      const maxC = finiteCoordinate(bounds?.maxC);
      const maxR = finiteCoordinate(bounds?.maxR);
      const localWidth = maxC == null ? Math.max(1, Number(currentLocale.cols) || 1) * scale : Math.max(1, maxC - minC + 1);
      const localDepth = maxR == null ? Math.max(1, Number(currentLocale.rows) || 1) * scale : Math.max(1, maxR - minR + 1);
      centerX = anchorC + minC + localWidth * 0.5;
      centerZ = anchorR + minR + localDepth * 0.5;
      spanX = localWidth;
      spanZ = localDepth;
    } else if (currentMerged) {
      // A no-match preview has no locale instance. Keep it centered on the generated map instead of falling back to the world origin corner.
      centerX = currentMerged.cols * 0.5;
      centerZ = currentMerged.rows * 0.5;
      spanX = Math.max(1, currentMerged.cols * 0.18);
      spanZ = Math.max(1, currentMerged.rows * 0.18);
    } else return;
    const centerY = currentMerged ? surfaceY(currentMerged, centerX, centerZ) : 0;
    const span = Math.max(12, Math.max(spanX, spanZ) * 1.35);
    controls.target.set(centerX, centerY + 1.2, centerZ);
    camera.position.set(centerX + span * 0.72, centerY + span * 0.56, centerZ + span * 0.78);
    camera.near = 0.05;
    camera.far = 3000;
    camera.updateProjectionMatrix();
    controls.update();
  }
'''
          if old_fit in s:
              s = s.replace(old_fit, new_fit, 1)
          elif 'Number(null) is 0' not in s:
              raise SystemExit('fitCamera replacement target missing')

          old_assign = "    currentCandidate = candidate;\n    await renderLocaleObjects"
          new_assign = "    currentCandidate = candidate;\n    currentInstance = instance; // Camera focus must follow the exact instance being drawn, including ghost failure previews.\n    await renderLocaleObjects"
          if old_assign in s:
              s = s.replace(old_assign, new_assign, 1)
          elif 'Camera focus must follow the exact instance' not in s:
              raise SystemExit('renderScenario currentInstance target missing')

          preview_path.write_text(s)

          test_path = Path('scripts/test-banubu-cave-locale.js')
          t = test_path.read_text()
          old_read = "const labPreview = fs.readFileSync(path.join(repoRoot, 'docs/tools/wilderness-generation-lab/lab-banubu-cave.js'), 'utf8');\n"
          new_read = old_read + "const localeEditorPreview = fs.readFileSync(path.join(repoRoot, 'docs/tools/locale-editor/locale-preview3d.js'), 'utf8');\n"
          if old_read in t and 'const localeEditorPreview =' not in t:
              t = t.replace(old_read, new_read, 1)
          old_assert = "assert(labPreview.includes('ZoneFeatures.buildAnimalDenMeshes(scene, mergedZGrid(merged), [], LAB_CAVE_MAP_ID)'), 'Wilderness Lab must invoke the exact game cave renderer for Banubu Cave');\n"
          new_assert = old_assert + "assert(localeEditorPreview.includes('const placed = currentInstance || currentWorkspace?.localeInstances'), 'Locale Editor preview camera must focus the actual rendered locale instance before consulting candidate coordinates');\nassert(localeEditorPreview.includes(\"if (value == null || value === '') return null\"), 'Locale Editor preview camera must not coerce a missing anchor to world tile 0,0');\nassert(localeEditorPreview.includes('const bounds = compiled?.footprint || compiled?.bounds'), 'Locale Editor preview camera must orbit the painted locale footprint rather than the editor canvas origin');\n"
          if old_assert in t and 'actual rendered locale instance before consulting candidate coordinates' not in t:
              t = t.replace(old_assert, new_assert, 1)
          test_path.write_text(t)
          PY
      - name: Validate preview camera fix
        run: |
          node --check docs/tools/locale-editor/locale-preview3d.js
          node scripts/test-banubu-cave-locale.js
          node scripts/test-locale-terrain-placement.js
          node scripts/test-banubu-wilderness-lab-generation.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tools/locale-editor/locale-preview3d.js scripts/test-banubu-cave-locale.js
          git commit -m 'Center locale preview camera on placed locale'
          git push origin HEAD:chatgpt/locale-terrain-anchors

# Triggered after workflow creation so the branch-local workflow is active.
