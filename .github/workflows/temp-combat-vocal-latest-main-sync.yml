name: Temp Combat Vocal Latest Main Sync

on:
  push:
    branches:
      - feat/combat-vocalizations

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-vocalizations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Git and fetch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Oolnokk@users.noreply.github.com"
          git fetch origin main
      - name: Merge latest main and resolve expected cache-parent conflict
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ "$unresolved" != "docs/index.html" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$unresolved"
              exit 1
            fi
            # Both sides only differ here because combat-config-loader's cache token changed.
            # Keep the branch parent temporarily; check-cache-busts --fix below regenerates it
            # from the successfully merged loader, preserving both latest-main and vocal changes.
            git checkout --ours -- docs/index.html
            git add docs/index.html
          fi
      - name: Refresh and validate cache busts
        run: |
          node scripts/check-cache-busts.js --fix
          git rm .github/workflows/temp-combat-vocal-latest-main-sync.yml
          node scripts/check-cache-busts.js origin/main
      - name: Focused combat and animal voice regressions
        run: |
          node scripts/test-combat-vocalizations.js
          node scripts/test-animal-vocalizations.js
          node scripts/test-animal-authored-voice-routing.js
      - name: Full regression suite
        run: node scripts/run-tests.js
      - name: Commit validated latest-main sync
        run: |
          git add -A
          git commit -m "Sync combat vocalizations with latest main"
          git push origin HEAD:feat/combat-vocalizations
