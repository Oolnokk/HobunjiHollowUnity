name: Temp Combat Vocal Acoustics Polish

on:
  push:
    branches:
      - feat/combat-vocalizations

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/combat-vocalizations

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync current main
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ "$unresolved" != "docs/index.html" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unresolved"
              exit 1
            fi
            git checkout --theirs docs/index.html
            git add docs/index.html
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/temp-combat-vocal-acoustics-polish.py')
          text = p.read_text()
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))
          PY
          python scripts/temp-combat-vocal-acoustics-polish.py
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/js/dialogue-content.js')
          text = p.read_text()
          pattern = r"(  function stopNpcDialogueTypewriter\(showFullText = false\) \{\n)\s*const currentSpeech = _npcSpeechBySpeaker\.get\(_npcSpeechOwnerKey\(\)\);\n\s*if \(currentSpeech\) _fadeNpcSpeechHandle\(currentSpeech\);\n"
          replacement = r"\1    if (typeof _npcSpeechBySpeaker !== 'undefined' && typeof _npcSpeechOwnerKey === 'function') {\n      const currentSpeech = _npcSpeechBySpeaker.get(_npcSpeechOwnerKey());\n      if (currentSpeech) _fadeNpcSpeechHandle(currentSpeech);\n    }\n"
          text, count = re.subn(pattern, replacement, text, count=1)
          assert count == 1, 'expected generated dialogue stop cleanup block'
          p.write_text(text)
          PY

      - name: Refresh cache tokens
        run: |
          node scripts/check-cache-busts.js --fix
          node scripts/check-cache-busts.js origin/main

      - name: Validate focused audio behavior
        run: |
          node --check docs/js/animal-voice-independent-playback.js
          node --check docs/js/combat/combat-vocalizations.js
          node --check docs/js/dialogue-content.js
          node scripts/test-combat-vocalizations.js
          node scripts/test-animal-vocalizations.js
          node scripts/test-animal-authored-voice-routing.js
          node scripts/test-dialogue-syllable-cadence.js
          node scripts/test-dialogue-rich-text.js
          if [ -f scripts/test-environmental-reverb.js ]; then node scripts/test-environmental-reverb.js; fi
          node scripts/test-no-cache-token-pins.js
          node scripts/run-tests.js

      - name: Commit validated polish and remove temporary helpers
        run: |
          git rm .github/workflows/temp-combat-vocal-acoustics-polish.yml
          git rm scripts/temp-combat-vocal-acoustics-polish.py
          git add -A
          git commit -m "Polish combat vocal acoustics and NPC utterances"
          git push origin HEAD:feat/combat-vocalizations
