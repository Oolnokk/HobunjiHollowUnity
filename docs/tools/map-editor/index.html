<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hobunji Hollow — Map Editor</title>
<style>
:root{--bg:#07101a;--panel:#111b28;--panel2:#0c141e;--border:rgba(255,255,255,.12);--acc:#6aa7ff;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--text:#edf5ff;--muted:#9fb4cf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:13px}
button,input,select,textarea{font:inherit}
button{border:1px solid rgba(106,167,255,.38);background:rgba(106,167,255,.16);color:var(--text);border-radius:9px;padding:7px 11px;font-weight:700;cursor:pointer}
button:hover{background:rgba(106,167,255,.26)}
button:active{transform:translateY(1px)}
button.sec{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)}
button.ok{border-color:rgba(52,211,153,.42);background:rgba(52,211,153,.14)}
button.warn{border-color:rgba(251,191,36,.42);background:rgba(251,191,36,.12)}
button.bad{border-color:rgba(251,113,133,.42);background:rgba(251,113,133,.12)}
button.act{outline:2px solid var(--acc);outline-offset:1px}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:var(--text);padding:7px 9px;outline:none}
textarea{min-height:60px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.35}
label{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:11px;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:11px;white-space:nowrap}
.item{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);border-radius:8px;padding:6px 9px;cursor:pointer;margin-bottom:4px}
.item:hover{background:rgba(255,255,255,.07)}
.item.sel{outline:2px solid var(--acc);outline-offset:1px}
.item-name{font-weight:700;font-size:12px}
.item-meta{color:var(--muted);font-size:11px;margin-top:2px}
#shell{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#topbar h1{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-right:4px}
#topbar-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#main{display:flex;flex:1;min-height:0}
#sidebar{width:340px;min-width:250px;max-width:50vw;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);flex-shrink:0}
#sidebar-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 16px;-webkit-overflow-scrolling:touch}
.section{border-left:4px solid var(--sec,var(--acc));background:linear-gradient(180deg,var(--secBg,rgba(106,167,255,.08)),transparent);margin:8px;border-radius:0 8px 8px 0;padding:8px}
.sect-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.sect-head b{font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.sect-tag{font-size:10px;color:var(--muted);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:2px 7px}
#modeBar{display:flex;gap:4px;padding:6px 8px;background:var(--panel2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#view{flex:1;position:relative;min-width:0;min-height:0}
#canvas2d{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 16px)}
.palBtn{display:flex;align-items:center;gap:6px;width:100%;text-align:left;margin-bottom:4px;padding:6px 9px}
.palSw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.4);flex:0 0 auto}
.itemlist{max-height:200px;overflow-y:auto;padding-right:2px}
</style>
</head>
<body>
<div id="shell">
  <div id="topbar">
    <h1>MAP EDITOR</h1>
    <span class="pill" id="activeMapPill">no map</span>
    <div id="topbar-right">
      <button class="ok" id="playBtn">🎮 Send to Game &amp; Play</button>
      <button class="sec" id="undoBtn">↶ Undo</button>
      <button class="sec" id="redoBtn">↷ Redo</button>
      <button class="sec" id="exportMapBtn">⬇ Map JSON</button>
      <button class="sec" id="exportDiffBtn">📋 Export Diff</button>
      <button class="sec" id="exportLayoutBtn">⬇ Farm Layout</button>
      <button class="sec" id="loadTownBtn">🏘 Load Town</button>
      <button class="sec" id="importBtn">Import</button>
      <input id="importFile" type="file" hidden accept=".json,application/json">
    </div>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div id="modeBar">
        <button class="sec act" data-mode="pan">✋ Pan</button>
        <button class="sec" data-mode="tile">🖌 Tile</button>
        <button class="sec" data-mode="fill">🪣 Fill</button>
        <button class="sec" data-mode="crop">🌱 Crop</button>
        <button class="sec" data-mode="object">📦 Object</button>
        <button class="sec" data-mode="furniture">⚙️ Processor</button>
        <button class="sec" data-mode="decor">🪑 Decor</button>
        <button class="sec" data-mode="path">🛤 Route</button>
        <button class="sec" data-mode="river">🌊 River</button>
        <button class="sec" data-mode="spot">🔁 Spot</button>
        <button class="sec" data-mode="station">🧍 Station</button>
        <button class="sec" data-mode="erase">⌫ Erase</button>
        <button class="sec" id="fitBtn" style="margin-left:auto">Fit</button>
      </div>
      <div id="sidebar-scroll">

        <!-- MAPS -->
        <div class="section" style="--sec:#94a3b8;--secBg:rgba(148,163,184,.08)">
          <div class="sect-head"><b>Maps</b><span class="sect-tag" id="mapCountTag">0</span></div>
          <div class="itemlist" id="mapList"></div>
          <div class="row" style="margin-top:6px">
            <button class="ok" id="newMapBtn">+ New</button>
            <button class="sec" id="fromLayoutBtn">From Layout…</button>
            <button class="sec" id="dupMapBtn">Duplicate</button>
            <button class="bad" id="delMapBtn">Delete</button>
          </div>
        </div>

        <!-- MAP SETTINGS -->
        <div class="section" style="--sec:#6aa7ff;--secBg:rgba(106,167,255,.08)">
          <div class="sect-head"><b>Map Settings</b><span class="sect-tag" id="catTag">—</span></div>
          <div class="g2">
            <div><label>Name</label><input id="mapName"></div>
            <div><label>Category</label><select id="mapCategory"><option value="exterior">exterior</option><option value="interior">interior</option><option value="building_interior">building_interior</option></select></div>
          </div>
          <div class="g3" style="margin-top:6px">
            <div><label>Columns</label><input id="mapCols" type="number" min="2" max="400"></div>
            <div><label>Rows</label><input id="mapRows" type="number" min="2" max="400"></div>
            <div style="display:flex;align-items:flex-end"><button class="sec" id="applyMapBtn" style="width:100%">Apply</button></div>
          </div>
          <div style="margin-top:6px"><label>Audio cue index</label><select id="mapAudioIndex"><option value="">— none —</option></select></div>
          <div class="row" style="margin-top:6px">
            <button class="sec" id="floorTemplateBtn" title="Interior only">Farmhouse floor template</button>
          </div>
        </div>

        <!-- PALETTE -->
        <div class="section" style="--sec:#34d399;--secBg:rgba(52,211,153,.08)">
          <div class="sect-head"><b>Palette</b><span class="sect-tag" id="paletteTag">tile</span></div>
          <div id="paletteBox"></div>
        </div>

        <!-- GAME LINK -->
        <div class="section" style="--sec:#fbbf24;--secBg:rgba(251,191,36,.08)">
          <div class="sect-head"><b>Game Link</b><span class="sect-tag">hobunji_farm_layout_v3</span></div>
          <div><label>Farm map (exterior, sent as tile layout)</label><select id="linkExterior"></select></div>
          <div style="margin-top:6px"><label>Farmhouse map (interior, sent as decor)</label><select id="linkInterior"></select></div>
          <div style="margin-top:6px"><label>Town map (exterior, sent as <code>hobunji_town_v1</code>)</label><select id="linkTown"></select></div>
          <div class="row" style="margin-top:6px">
            <button class="sec" id="loadFromGameBtn">⟲ Load current game farm</button>
          </div>
          <div class="row" style="margin-top:4px">
            <label style="display:flex;align-items:center;gap:6px;margin:0;cursor:pointer">
              <input type="checkbox" id="showBaseChk" checked style="width:auto"> Show game base farm under edits
            </label>
          </div>
          <p class="muted" style="margin-top:5px">The game farm is <b id="farmDimsNote">36×26</b>. Tiles outside that range are clipped when sending. Unpainted tiles keep the game's day-one terrain.</p>
        </div>

        <!-- BUILDINGS (town maps only) -->
        <div class="section" id="buildingsSection" style="--sec:#f59e0b;--secBg:rgba(245,158,11,.08);display:none">
          <div class="sect-head"><b>Buildings</b><span class="sect-tag" id="buildingCountTag">0</span></div>
          <div id="addBuildingPicker"></div>
          <div class="itemlist" id="buildingList" style="margin-top:6px"></div>
          <div id="selectedBuildingPanel" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)">
            <div class="g2" style="margin-bottom:5px">
              <div><label>Label</label><input id="bldgLabel" placeholder="Inn"></div>
              <div><label>Piece file</label><input id="bldgPieceFile" placeholder="config/pieces/inn.json" readonly style="cursor:default"></div>
            </div>
            <div class="g2" style="margin-bottom:8px">
              <div><label>Grid X</label><input id="bldgGridX" type="number" step="1" value="0"></div>
              <div><label>Grid Z</label><input id="bldgGridZ" type="number" step="1" value="0"></div>
            </div>
            <div class="row" style="gap:4px">
              <button class="ok" id="saveBldgBtn" style="flex:1">Save</button>
              <button class="bad" id="delBldgBtn">Remove</button>
            </div>
          </div>
        </div>

        <!-- STATUS / JSON -->
        <div class="section" style="--sec:#a78bfa;--secBg:rgba(167,139,250,.06)">
          <div class="sect-head"><b>Active Map JSON</b><span class="sect-tag" id="statusPill">Ready</span></div>
          <textarea id="jsonPreview" rows="8" readonly></textarea>
        </div>

      </div>
    </aside>

    <div id="view">
      <canvas id="canvas2d"></canvas>
      <div id="hud">
        <span class="pill" id="modePill">Mode: pan</span>
        <span class="pill" id="cursorPill">—</span>
        <span class="pill" id="brushPill">—</span>
      </div>
    </div>
  </div>
</div>

<div id="diffModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);overflow:auto;padding:20px">
  <div style="max-width:760px;margin:0 auto;background:#111b28;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:20px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <b style="flex:1;font-size:13px">Export Diff — <span id="diffTitle" style="color:#6aa7ff"></span></b>
      <button id="diffCopyBtn" class="ok" style="padding:5px 12px">📋 Copy</button>
      <button id="diffDownloadBtn" class="sec" style="padding:5px 12px">⬇ Download</button>
      <button id="diffCloseBtn" class="bad" style="padding:5px 10px">✕</button>
    </div>
    <p id="diffSubtitle" style="font-size:11px;color:#9fb4cf;margin-bottom:8px"></p>
    <textarea id="diffTextarea" readonly style="width:100%;height:65vh;font:12px/1.5 monospace;background:#07101a;border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#edf5ff;padding:10px;resize:vertical;box-sizing:border-box"></textarea>
  </div>
</div>

<script src="../../js/repo-picker.js"></script>
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = p => `${p}_${Math.random().toString(36).slice(2,7)}`;

// ── Game contracts (single source of truth: docs/game.js) ────────────────────
const GAME = {
  layoutKey: 'hobunji_farm_layout_v3',
  townKey:   'hobunji_town_v1',
  farm: { cols: 36, rows: 26 },
  house: { col: 26, row: 2, w: 5, d: 4, doorCol: 28, doorRow: 6 },
  interior: { cols: 6, rows: 6, entry: [2,4], exit: [2,5] },
  gamePath: '../../index.html'
};

const TILE_INFO = {
  grass:  { label:'Grass',  color:'#4a7c43' },
  weeds:  { label:'Weeds',  color:'#6b8c3a' },
  tilled: { label:'Tilled', color:'#7a5230' },
  trench: { label:'Trench', color:'#3d2c1e' },
  raised: { label:'Raised', color:'#a8835a' },
  paddy:  { label:'Paddy',  color:'#3f7fae' },
  rock:   { label:'Rock',   color:'#8a8f98' },
  shrub:  { label:'Shrub',  color:'#2f6f3f' },
  path:   { label:'Path',   color:'#b8956a' },
  river:  { label:'River',  color:'#2f6fb8' },
  stream: { label:'Stream', color:'#4f9bd9' }
};
const TILE_SETS = {
  exterior: ['grass','weeds','tilled','trench','raised','paddy','rock','shrub','path','river','stream'],
  // Interior grid in game.js uses grass = walkable floor, rock = blocked.
  interior: ['grass','rock'],
  building_interior: ['grass','rock']
};
const INTERIOR_TILE_LABELS = { grass: 'Floor (walkable)', rock: 'Blocked' };

const CROPS = {
  needlegrain:'🌾', heftroot:'🟡', garlink:'🧄', ongyums:'🧅',
  redberries:'🍓', blueberries:'🫐', yellowberries:'🟡',
  whiteberries:'⚪', blackberries:'⚫', blackMustard:'⚫', greenMustard:'🥬'
};

const OBJECTS = {
  sellCrate: { icon:'📤', label:'Sell Crate',  color:'#d97706' },
  supplyBox: { icon:'📥', label:'Supply Box',  color:'#2563eb' }
};

const PROCESSORS = {
  pestle:     { icon:'🥣', label:'Pestle Station' },
  squeezer:   { icon:'🧃', label:'Hand Squeezer' },
  handMill:   { icon:'⚙️', label:'Hand Mill' },
  dryingRack: { icon:'☀️', label:'Drying Rack' },
  smoker:     { icon:'💨', label:'Smoking Hut' },
  agingBarrel:{ icon:'🛢️', label:'Aging Barrel' },
  agingVase:  { icon:'🏺', label:'Aging Vase' }
};

const DECOR = {
  basicBed:{icon:'🛏️',label:'Single Bed',fw:1,fd:2,area:'interior'}, doubleBed:{icon:'🛏️',label:'Double Bed',fw:2,fd:2,area:'interior'},
  bedroll:{icon:'🛌',label:'Bedroll',fw:1,fd:1,area:'interior'}, bench:{icon:'🪑',label:'Short Bench',fw:2,fd:1,area:'interior'},
  bookshelf:{icon:'📚',label:'Bookshelf',fw:2,fd:1,area:'interior'}, bucket:{icon:'🪣',label:'Tin Bucket',fw:1,fd:1,area:'any'},
  candleTable:{icon:'🕯️',label:'Candle Table',fw:1,fd:1,area:'interior'}, chairSimple:{icon:'🪑',label:'Simple Chair',fw:1,fd:1,area:'interior'},
  chairCushion:{icon:'🪑',label:'Cushioned Chair',fw:1,fd:1,area:'interior'}, chest:{icon:'📦',label:'Storage Chest',fw:1,fd:1,area:'interior'},
  crateStack:{icon:'📦',label:'Crate Stack',fw:1,fd:1,area:'any'}, copperBarrel:{icon:'🛢️',label:'Copper Barrel',fw:1,fd:1,area:'any'},
  desk:{icon:'✍️',label:'Writing Desk',fw:2,fd:1,area:'interior'}, dresser:{icon:'🗄️',label:'Low Dresser',fw:2,fd:1,area:'interior'},
  hearth:{icon:'🔥',label:'Hearth Fireplace',fw:2,fd:1,area:'interior'}, loom:{icon:'🧶',label:'Small Loom',fw:1,fd:2,area:'interior'},
  nightstand:{icon:'🕯️',label:'Nightstand',fw:1,fd:1,area:'interior'}, rug:{icon:'🧶',label:'Woven Rug',fw:2,fd:2,area:'interior'},
  standingLamp:{icon:'💡',label:'Standing Lamp',fw:1,fd:1,area:'interior'}, stool:{icon:'🪑',label:'Round Stool',fw:1,fd:1,area:'any'},
  tableLong:{icon:'🍽️',label:'Long Table',fw:4,fd:1,area:'interior'}, tableRound:{icon:'🍽️',label:'Round Table',fw:2,fd:2,area:'interior'},
  tableSmall:{icon:'🍽️',label:'Small Table',fw:1,fd:1,area:'interior'}, wardrobe:{icon:'🚪',label:'Tall Wardrobe',fw:2,fd:1,area:'interior'},
  washTub:{icon:'🛁',label:'Copper Wash Tub',fw:1,fd:1,area:'any'},
  counter:{icon:'🏪',label:'Shop Counter',fw:3,fd:1,area:'interior'}
};

// Shared routes and transition spots are supported on BOTH map categories.
// They are persisted in hobunji_map.v1 JSON and sent to the game inside
// hobunji_farm_layout_v3 (routes / legacy npcPaths / transitions). NPC schedules
// choose target positions; NPCs beeline first, then use shared routes around blockers.
// Transition spots warp the player to the linked farm, town, or farmhouse map.

// Day-one farm generation — mirrors createInitialGrid()/createDayOneTile() in game.js.
const DAYONE_ROCKS  = [[1,1],[10,1],[15,2],[3,7],[13,9],[16,11],[20,2],[28,4],[33,1],[22,8],[30,10],[25,14],[7,18],[18,20],[31,22],[5,24],[14,16],[26,6],[32,18],[8,12]];
const DAYONE_SHRUBS = [[6,1],[7,2],[2,4],[14,4],[4,10],[9,11],[19,3],[24,2],[29,7],[21,12],[27,15],[11,19],[23,21],[34,16],[3,22],[16,24],[12,6],[35,9],[17,13],[28,23]];
const DAYONE_CLEAR  = [[8,9],[9,9],[8,10],[9,10],[10,10]];
const _dayOneCache = new Map();
function dayOneType(c, r) {
  const key = c + ',' + r;
  if (_dayOneCache.has(key)) return _dayOneCache.get(key);
  let t;
  if (DAYONE_CLEAR.some(([x,y]) => x===c && y===r)) t = 'grass';
  else if (DAYONE_ROCKS.some(([x,y]) => x===c && y===r)) t = 'rock';
  else if (DAYONE_SHRUBS.some(([x,y]) => x===c && y===r)) t = 'shrub';
  else t = ((c*17 + r*31 + c*r*7) % 10) < 7 ? 'weeds' : 'grass';
  _dayOneCache.set(key, t);
  return t;
}

// ── Workspace ─────────────────────────────────────────────────────────────────
const WS_KEY = 'hobunji_map_editor_workspace_v1';
let audioCueIndexEntries = [];

function makeMap(name, category, cols, rows) {
  return {
    schema: 'hobunji_map.v1',
    id: uid('map'), name, category, cols, rows,
    tiles: {},        // "c,r" -> { type, crop }
    objects: {},      // objectKey -> [c, r]
    furniture: [],    // { key, col, row }
    decor: [],        // { key, col, row }
    routes: [],       // { id, label, nodes: [[c,r],...] }
    rivers: [],       // { id, label, kind:'river'|'stream', nodes: [[c,r],...], width, seed, paintTiles }
    npcPaths: [],     // legacy compatibility only: { id, label, npcId, nodes: [[c,r],...] }
    transitions: [],  // { id, label, col, row, targetMapId, targetSpotId }
    npcStations: [], // { id, label, col, row, rotY, pose, toolKey, toolIntervalSec, toolAnimStyle }
    buildings: [],    // { id, label, pieceFile, gridX, gridZ, footprintW, footprintD, wbOpts, wbGableOpts }
    audioIndex: '',    // cues index id/file selected for this map
  };
}


function buildingInteriorToWorkspaceMap(mapData, entry = {}) {
  const cols = clamp(Math.round(mapData.cols || 20), 2, 400);
  const rows = clamp(Math.round(mapData.rows || 20), 2, 400);
  const tiles = {};
  const floorSet = new Set((mapData.floor || []).map(([c,r]) => `${c},${r}`));
  const colliderSet = new Set((mapData.colliders || []).map(([c,r]) => `${c},${r}`));
  for (const key of floorSet) tiles[key] = { type: colliderSet.has(key) ? 'rock' : 'grass' };
  for (const key of colliderSet) if (!tiles[key]) tiles[key] = { type: 'rock' };
  const transitions = (mapData.exits || []).flatMap(exit =>
    (exit.tiles || []).map(([c,r]) => ({
      id: `${exit.id}_${c}_${r}`,
      exitId: exit.id,
      col: c, row: r,
      label: exit.label || exit.id,
      targetMapId: exit.targetMap || '',
      spawnCol: Number.isFinite(exit.spawnCol) ? exit.spawnCol : 0,
      spawnRow: Number.isFinite(exit.spawnRow) ? exit.spawnRow : 0
    }))
  );
  return {
    schema: 'hobunji_map.v1',
    id: entry.id || mapData.id || uid('map'),
    name: entry.name || mapData.name || entry.id || 'Building Interior',
    category: 'building_interior',
    cols, rows, tiles,
    routes: Array.isArray(mapData.routes) ? mapData.routes : [],
    rivers: [],
    npcPaths: Array.isArray(mapData.npcPaths) ? mapData.npcPaths : [],
    transitions,
    objects: {}, furniture: [], decor: [], buildings: [], npcStations: Array.isArray(mapData.npcStations) ? mapData.npcStations : [],
    buildingInteriorBase: JSON.parse(JSON.stringify(mapData))
  };
}

function buildBuildingInteriorMapV1(m) {
  const base = m.buildingInteriorBase && m.buildingInteriorBase.schema === 'hobunji_building_interior.v1'
    ? JSON.parse(JSON.stringify(m.buildingInteriorBase))
    : { schema: 'hobunji_building_interior.v1', furniture: [], id: m.id, name: m.name, cols: m.cols, rows: m.rows, exits: [], colliders: [], vendorZones: [], floor: [] };
  base.schema = 'hobunji_building_interior.v1';
  base.id = m.id;
  base.name = m.name || base.name || 'Building Interior';
  base.cols = m.cols;
  base.rows = m.rows;
  const floor = [];

const _baselines = new Map();

function computeMapDiff(m) {

  if (!base) { diff._note = 'No baseline — map was created in this session.'; return diff; }

  // Tiles: group changes by "wasType→nowType"

  const tileGroups = {};

      const [c, r] = k.split(',').map(Number);
      let label = `${bT ?? 'null'}→${cT ?? 'null'}`;
      if (cC !== bC) label += ` crop:${bC || 'null'}→${cC || 'null'}`;
      (tileGroups[label] = tileGroups[label] || []).push([c, r]);

    const curr = m[key] || [], prev = base[key] || [];

    const currMap = new Map(curr.map(x => [x.id, x]));
    const added   = curr.filter(x => !prevMap.has(x.id));
    const removed = prev.filter(x => !currMap.has(x.id)).map(x => x.id);
    const modified = curr.filter(x => {
      const b = prevMap.get(x.id); return b && JSON.stringify(x) !== JSON.stringify(b);
    }).map(x => {
      const b = prevMap.get(x.id), delta = { id: x.id };

      }
      return delta;
    });
    const d = {};
    if (added.length)    d.added    = added;
    if (removed.length)  d.removed  = removed;
    if (modified.length) d.modified = modified;
    if (Object.keys(d).length) diff[key] = d;
  }

}

function loadWorkspace() {

      const w = JSON.parse(raw);
      if (Array.isArray(w.maps) && w.maps.length) {
        w.maps.forEach(m => {
          m.routes = Array.isArray(m.routes) ? m.routes : (Array.isArray(m.npcPaths) ? m.npcPaths.map(p => ({ id:p.id, label:p.label, nodes:p.nodes||[] })) : []);

          m.npcStations = Array.isArray(m.npcStations) ? m.npcStations : [];

          if (!Array.isArray(m.buildings)) {

// ── Building door auto-derivation ───────────────────────────────────────────

// matches where the live game actually puts its entrance ring. footprint.
// entrances is NOT used — the game never reads it. We cache the piece's

// building as doorEntrance so the door's world position can be recomputed
// from gridX/gridZ/rotationDeg alone, without re-fetching the piece file.
function rotateBuildingCollisionCell(localX, localY, width, depth, rotationDeg) {

    .concat(pieceData?.footprint?.cells || [])

    .concat(pieceData?.footprint?.extensions?.porches || [])
    .concat(pieceData?.footprint?.extensions?.porchStairs || [])
    .concat(pieceData?.footprint?.extensions?.railings || []);
  if (!allBldgCells.length) return null;

    .concat(pieceData?.footprint?.extensions?.porches || [])
    .concat(pieceData?.footprint?.extensions?.porchStairs || []);

  const minY = Math.min(...allBldgCells.map(c => c.y));
  const maxX = Math.max(...allBldgCells.map(c => c.x));
  const maxY = Math.max(...allBldgCells.map(c => c.y));

    bboxW: maxX - minX + 1,
    bboxD: maxY - minY + 1,
    cells: allBldgCells.map(c => ({ x: c.x - minX, y: c.y - minY })),
    psCells: psCells.map(c => ({ x: c.x - minX, y: c.y - minY })),

// Resolve the cached local door geometry through the building's placement
// (gridX/gridZ/rotationDeg) into a town-map world tile, using the exact
// porch-first / world-south-fallback rule the game itself uses. `m` (if

  for (let i = 0; i < nodes.length - 1; i++) {
    for (const [bc, br] of bresenham(nodes[i][0], nodes[i][1], nodes[i+1][0], nodes[i+1][1])) {
      for (let dc = -rad; dc <= rad; dc++) {
        for (let dr = -rad; dr <= rad; dr++) {
          const nc = bc+dc, nr = br+dr;
          if (nc < 0 || nc >= m.cols || nr < 0 || nr >= m.rows) continue;
          keys.push(`${nc},${nr}`);
        }
      }
    }
  }
  applyPaintDiff(route.id, keys, 'path', m);
}
function floodFill(m, startC, startR, newType) {
  const k0 = `${startC},${startR}`;
  const oldType = m.tiles[k0]?.type ?? null;
  if (oldType === newType) return false;
  const queue = [[startC, startR]];
  const visited = new Set([k0]);
  while (queue.length) {
    const [c, r] = queue.shift();
    const k = `${c},${r}`;
    m.tiles[k] = { type: newType, crop: m.tiles[k]?.crop || '' };
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nc = c+dc, nr = r+dr;
      if (nc < 0 || nc >= m.cols || nr < 0 || nr >= m.rows) continue;
      const nk = `${nc},${nr}`;
      if (visited.has(nk)) continue;
      if ((m.tiles[nk]?.type ?? null) === oldType) { visited.add(nk); queue.push([nc, nr]); }

}

}

// ── River/stream procedural meander generation ───────────────────────────────
// Deterministic hash noise (same style as dayOneType's terrain hash above) so a
// given seed always reproduces the same winding path instead of a straight line.
function _riverHash01(seed) {
  const s = Math.sin(seed) * 43758.5453;
  return s - Math.floor(s);
}
function meanderSegment(x0, y0, x1, y1, seed, amplitude) {
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy);
  if (len < 0.001) return [[x0, y0]];
  const ux = dx / len, uy = dy / len;   // direction
  const px = -uy, py = ux;              // perpendicular
  const steps = Math.max(2, Math.round(len));
  const phase = _riverHash01(seed) * Math.PI * 2;
  const freq = 1.6 + _riverHash01(seed * 3.7) * 1.2;
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const taper = Math.sin(t * Math.PI); // 0 at both endpoints, so the river still hits each control node
    const wobble = Math.sin(t * freq * Math.PI * 2 + phase) + (_riverHash01(seed + t * 97.13) - 0.5) * 0.6;
    const off = amplitude * taper * wobble;
    pts.push([x0 + dx * t + px * off, y0 + dy * t + py * off]);
  }
  return pts;
}
function buildRiverPath(river) {
  const nodes = river.nodes || [];
  if (nodes.length < 2) return nodes.map(([c, r]) => [c, r]);
  const amplitude = river.kind === 'stream' ? 1.1 : 2.2;
  const seedBase = river.seed || 1;
  const out = [nodes[0]];
  for (let i = 0; i < nodes.length - 1; i++) {
    const [x0, y0] = nodes[i], [x1, y1] = nodes[i+1];
    const pts = meanderSegment(x0, y0, x1, y1, seedBase + i * 13.37, amplitude);
    for (let j = 1; j < pts.length; j++) out.push(pts[j]);
  }
  return out;
}
function paintRiverTiles(river, m) {
  const path = buildRiverPath(river).map(([x, y]) => [Math.round(x), Math.round(y)]);
  const rad = Math.floor(((river.width || (river.kind === 'stream' ? 1 : 3)) - 1) / 2);
  const tileType = river.kind === 'stream' ? 'stream' : 'river';
  const keys = [];
  for (let i = 0; i < path.length - 1; i++) {
    for (const [bc, br] of bresenham(path[i][0], path[i][1], path[i+1][0], path[i+1][1])) {
      for (let dc = -rad; dc <= rad; dc++) {
        for (let dr = -rad; dr <= rad; dr++) {
          const nc = bc+dc, nr = br+dr;
          if (nc < 0 || nc >= m.cols || nr < 0 || nr >= m.rows) continue;
          keys.push(`${nc},${nr}`);
        }
      }
    }
  }
  applyPaintDiff(river.id, keys, tileType, m, { preserveCrop: false });
}
function maybePaintRiver(m) {
  const river = (m.rivers || []).find(r => r.id === activeRiverId);
  if (river && river.paintTiles !== false) { paintRiverTiles(river, m); draw(); refreshPreview(); saveWorkspace(); }
}

    p.width = Math.max(1, parseInt(rw.value) || 1);
    if (p.paintTiles !== false) { pushUndo(); paintRiverTiles(p, m); draw(); refreshPreview(); }

  });
  const rs = box.querySelector('#riverSeedIn');
  if (rs) rs.addEventListener('change', () => {
    const p = (m.rivers || []).find(x => x.id === activeRiverId); if (!p) return;
    p.seed = Number(rs.value) || 1;
    if (p.paintTiles !== false) { pushUndo(); paintRiverTiles(p, m); draw(); refreshPreview(); }
    saveWorkspace();
  });
  const rrb = box.querySelector('#riverRerollBtn');
  if (rrb) rrb.addEventListener('click', () => {
    const p = (m.rivers || []).find(x => x.id === activeRiverId); if (!p) return;
    pushUndo();
    p.seed = Math.floor(Math.random()*1000000)+1;
    if (p.paintTiles !== false) paintRiverTiles(p, m);
    renderPalette(); draw(); refreshPreview(); saveWorkspace();
  });
  const riverPaintChk = box.querySelector('#riverPaintTilesChk');
  if (riverPaintChk) riverPaintChk.addEventListener('change', () => {
    const p = (m.rivers || []).find(x => x.id === activeRiverId); if (!p) return;
    p.paintTiles = riverPaintChk.checked;
    pushUndo();
    if (p.paintTiles) { paintRiverTiles(p, m); } else { clearPaintedTiles(p.id, m); }
    draw(); refreshPreview();
    saveWorkspace();
  });
  box.querySelectorAll('[data-rivernodesel]').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('[data-rivernodedel]')) return;
    activeRiverNodeIndex = Number(el.dataset.rivernodesel); renderPalette(); updateBrushPill(); draw();
  }));
  box.querySelectorAll('[data-rivernodedel]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation(); pushUndo();
    const p = (m.rivers || []).find(x => x.id === activeRiverId); if (!p) return;
    p.nodes.splice(Number(el.dataset.rivernodedel), 1); activeRiverNodeIndex = null;
    maybePaintRiver(m);
    renderPalette(); draw(); refreshPreview(); saveWorkspace(); updateBrushPill();
  }));
  // Station palette wiring
  box.querySelectorAll('[data-stationsel]').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('button,input,select')) return;
    activeStationId = el.dataset.stationsel; renderPalette(); draw(); updateBrushPill();
  }));
  box.querySelectorAll('[data-stationdel]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation(); pushUndo();
    m.npcStations = (m.npcStations || []).filter(st => st.id !== el.dataset.stationdel);
    if (activeStationId === el.dataset.stationdel) activeStationId = null;
    renderPalette(); draw(); refreshPreview(); saveWorkspace(); updateBrushPill();
  }));
  const updateStation = (id, patch) => { const st = (m.npcStations || []).find(x => x.id === id); if (!st) return; Object.assign(st, patch); draw(); refreshPreview(); saveWorkspace(); updateBrushPill(); };
  box.querySelectorAll('[data-stationlabel]').forEach(el => el.addEventListener('change', () => updateStation(el.dataset.stationlabel, { label: el.value.trim() || el.dataset.stationlabel })));
  box.querySelectorAll('[data-stationrot]').forEach(el => el.addEventListener('change', () => updateStation(el.dataset.stationrot, { rotY: Number(el.value) || 0 })));
  box.querySelectorAll('[data-stationpose]').forEach(el => el.addEventListener('change', () => updateStation(el.dataset.stationpose, { pose: el.value })));
  box.querySelectorAll('[data-stationtool]').forEach(el => el.addEventListener('change', () => updateStation(el.dataset.stationtool, { toolKey: el.value.trim() })));
  box.querySelectorAll('[data-stationinterval]').forEach(el => el.addEventListener('change', () => updateStation(el.dataset.stationinterval, { toolIntervalSec: Math.max(0, Number(el.value) || 0) })));
  box.querySelectorAll('[data-stationanim]').forEach(el => el.addEventListener('change', () => updateStation(el.dataset.stationanim, { toolAnimStyle: el.value.trim() })));
  // Spot palette wiring
  box.querySelectorAll('[data-spotsel]').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('button,select,input')) return;
    activeSpotId = el.dataset.spotsel; renderPalette(); draw();
  }));
  box.querySelectorAll('[data-spotdel]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation(); pushUndo();
    m.transitions = m.transitions.filter(t => t.id !== el.dataset.spotdel);
    if (activeSpotId === el.dataset.spotdel) activeSpotId = null;
    renderPalette(); draw(); refreshPreview(); saveWorkspace();
  }));
  box.querySelectorAll('[data-spotlabel]').forEach(el => el.addEventListener('change', () => {
    const t = m.transitions.find(x => x.id === el.dataset.spotlabel);
    if (t) { t.label = el.value.trim() || t.label; renderPalette(); draw(); refreshPreview(); saveWorkspace(); }
  }));
  box.querySelectorAll('[data-spottarget]').forEach(el => el.addEventListener('change', () => {
    const t = m.transitions.find(x => x.id === el.dataset.spottarget);
    if (t) { t.targetMapId = el.value; t.targetSpotId = ''; renderPalette(); refreshPreview(); saveWorkspace(); }
  }));
  box.querySelectorAll('[data-spotspot]').forEach(el => el.addEventListener('change', () => {
    const t = m.transitions.find(x => x.id === el.dataset.spotspot);

  }));
}

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = $('canvas2d');
const ctx = canvas.getContext('2d');
let cam = { x: 0, y: 0, zoom: 24 };
let drag = false, dragStart = null, painting = false;
const ptrs = new Map();
let pinchStart = null;

const w2s = (x,y) => ({ x: x*cam.zoom + cam.x, y: y*cam.zoom + cam.y });
const s2w = (x,y) => ({ x: (x-cam.x)/cam.zoom, y: (y-cam.y)/cam.zoom });
const canvasPt = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX-r.left, y: e.clientY-r.top }; };

function fitView() {
  const m = activeMap(); const r = canvas.getBoundingClientRect();
  cam.zoom = Math.max(6, Math.min((r.width-48)/m.cols, (r.height-48)/m.rows));
  cam.x = (r.width - m.cols*cam.zoom)/2;
  cam.y = (r.height - m.rows*cam.zoom)/2;
  draw();
}
function resizeCanvas() {
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio||1));
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.round(r.width*dpr); canvas.height = Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function draw() {
  const m = activeMap();
  const r = canvas.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  ctx.fillStyle = '#07101a'; ctx.fillRect(0,0,r.width,r.height);
  const z = cam.zoom;

  const isFarmLinked = m.category === 'exterior' && ws.gameLink.exteriorId === m.id;
  const showBase = isFarmLinked && $('showBaseChk').checked;

  // Base day-one farm underlay (real game terrain)
  if (showBase) {
    const maxC = Math.min(m.cols, GAME.farm.cols), maxR = Math.min(m.rows, GAME.farm.rows);
    for (let rr = 0; rr < maxR; rr++) for (let cc = 0; cc < maxC; cc++) {
      const p = w2s(cc, rr);
      ctx.fillStyle = TILE_INFO[dayOneType(cc, rr)].color;
      ctx.globalAlpha = 0.42;
      ctx.fillRect(p.x, p.y, z, z);
    }
    ctx.globalAlpha = 1;
  }

  // Painted tiles
  Object.keys(m.tiles).forEach(key => {
    const [c, rr] = key.split(',').map(Number);
    const t = m.tiles[key];
    const p = w2s(c, rr);
    ctx.fillStyle = (TILE_INFO[t.type] || { color:'#888' }).color;
    ctx.fillRect(p.x, p.y, z, z);
    if (t.crop && z > 10) {
      ctx.font = `${Math.floor(z*0.55)}px system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(CROPS[t.crop] || '🌱', p.x + z/2, p.y + z/2);
    }
  });
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  // Building overlays (placed buildings from map.buildings)
  _gizmos = [];
  if (m.id === ws.gameLink.townId) {
    (m.buildings || []).forEach(b => {
      const isSel = b.id === _selectedBuildingId;
      const rot = b.rotationDeg || 0;
      const raw_w = b.footprintW || 7, raw_d = b.footprintD || 5;
      // Swap displayed dims for 90°/270° rotations
      const bw = (rot === 90 || rot === 270) ? raw_d : raw_w;
      const bh = (rot === 90 || rot === 270) ? raw_w : raw_d;
      const p  = w2s(b.gridX, b.gridZ);
      const pw = bw * z, ph = bh * z;
      ctx.fillStyle   = isSel ? 'rgba(251,191,36,.22)' : 'rgba(245,158,11,.10)';
      ctx.fillRect(p.x, p.y, pw, ph);
      ctx.strokeStyle = isSel ? 'rgba(251,191,36,.9)' : 'rgba(245,158,11,.5)';
      ctx.lineWidth   = isSel ? 2 : 1.5; ctx.setLineDash([]);
      ctx.strokeRect(p.x, p.y, pw, ph);
      if (z > 6) {
        ctx.fillStyle = isSel ? '#fef08a' : 'rgba(251,191,36,.7)';
        ctx.font = `${clamp(z*.3,8,11)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        const rotLabel = rot ? ` ${rot}°` : '';
        ctx.fillText((b.label || b.id) + rotLabel, p.x + pw/2, p.y + 3);
      }
      // Gizmos on selected building (only when zoomed in enough)
      if (isSel && z >= 7) {
        const G = 13, GAP = G + 5;
        const cx = p.x + pw / 2, cy = p.y + ph / 2;
        const btns = [
          { type:'N',   sx: cx,            sy: p.y - GAP        },
          { type:'S',   sx: cx,            sy: p.y + ph + GAP   },
          { type:'W',   sx: p.x - GAP,     sy: cy               },
          { type:'E',   sx: p.x + pw + GAP, sy: cy              },
          { type:'rot', sx: p.x + pw + GAP, sy: p.y - GAP       },
        ];
        for (const btn of btns) {
          _gizmos.push({ ...btn, r: G });
          _drawGizmoBtn(btn.type, btn.sx, btn.sy, G);
        }
      }
    });
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
  for (let x = 0; x <= m.cols; x++) { const p = w2s(x,0); ctx.beginPath(); ctx.moveTo(p.x, cam.y); ctx.lineTo(p.x, cam.y + m.rows*z); ctx.stroke(); }
  for (let y = 0; y <= m.rows; y++) { const p = w2s(0,y); ctx.beginPath(); ctx.moveTo(cam.x, p.y); ctx.lineTo(cam.x + m.cols*z, p.y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
  ctx.strokeRect(cam.x, cam.y, m.cols*z, m.rows*z);

  // Game farm bounds + house footprint when linked
  if (isFarmLinked) {
    const fb = w2s(0,0);
    ctx.strokeStyle = 'rgba(52,211,153,.55)'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
    ctx.strokeRect(fb.x, fb.y, GAME.farm.cols*z, GAME.farm.rows*z);
    ctx.setLineDash([]);
    const h = GAME.house, hp = w2s(h.col, h.row);
    ctx.fillStyle = 'rgba(139,92,246,.30)';
    ctx.fillRect(hp.x, hp.y, h.w*z, h.d*z);
    ctx.strokeStyle = 'rgba(139,92,246,.8)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(hp.x, hp.y, h.w*z, h.d*z);
    const dp = w2s(h.doorCol, h.doorRow);
    ctx.fillStyle = '#fef08a'; ctx.fillRect(dp.x + z*.25, dp.y + z*.25, z*.5, z*.5);
    if (z > 9) {
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `${clamp(z*.32,9,12)}px system-ui`;
      ctx.fillText('HOUSE', hp.x + 3, hp.y + 12);
      ctx.fillStyle = 'rgba(52,211,153,.8)';
      ctx.fillText(`FARM ${GAME.farm.cols}×${GAME.farm.rows}`, fb.x + 4, fb.y - 4);
    }
  }

  // Objects
  ctx.font = `${Math.floor(z*0.62)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  Object.keys(m.objects || {}).forEach(k => {
    const [c, rr] = m.objects[k]; const info = OBJECTS[k]; if (!info) return;
    const p = w2s(c, rr);
    ctx.fillStyle = info.color; ctx.globalAlpha = .45; ctx.fillRect(p.x+1, p.y+1, z-2, z-2); ctx.globalAlpha = 1;
    if (z > 9) ctx.fillText(info.icon, p.x + z/2, p.y + z/2);
  });
  // Processing furniture
  (m.furniture || []).forEach(f => {
    const info = PROCESSORS[f.key]; if (!info) return;
    const p = w2s(f.col, f.row);
    ctx.fillStyle = 'rgba(202,164,94,.4)'; ctx.fillRect(p.x+1, p.y+1, z-2, z-2);
    if (z > 9) ctx.fillText(info.icon, p.x + z/2, p.y + z/2);
  });
  // Decor (with footprints)
  (m.decor || []).forEach(d => {
    const info = DECOR[d.key]; if (!info) return;
    const p = w2s(d.col, d.row);
    ctx.fillStyle = 'rgba(167,139,250,.35)'; ctx.fillRect(p.x+1, p.y+1, info.fw*z-2, info.fd*z-2);
    ctx.strokeStyle = 'rgba(167,139,250,.7)'; ctx.lineWidth = 1;
    ctx.strokeRect(p.x+1, p.y+1, info.fw*z-2, info.fd*z-2);
    if (z > 9) ctx.fillText(info.icon, p.x + info.fw*z/2, p.y + info.fd*z/2);
  });
  // Shared routes
  (m.routes || []).forEach(pa => {
    const isActive = pa.id === activePathId;
    if (pa.nodes.length > 1) {
      ctx.strokeStyle = isActive ? '#7dd3fc' : 'rgba(56,189,248,.55)';
      ctx.lineWidth = isActive ? 3 : 2;
      ctx.beginPath();
      pa.nodes.forEach(([c, rr], i) => { const s = w2s(c+.5, rr+.5); i === 0 ? ctx.moveTo(s.x, s.y) : ctx.lineTo(s.x, s.y); });
      ctx.stroke();
    }
    pa.nodes.forEach(([c, rr], i) => {
      const s = w2s(c+.5, rr+.5);
      ctx.fillStyle = isActive && i === activeRouteNodeIndex ? '#fef08a' : (isActive ? '#fff' : '#38bdf8');
      ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(3.5, z*.18), 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#082f49'; ctx.lineWidth = 1.5; ctx.stroke();
      if (z > 13) { ctx.fillStyle = '#e0f2fe'; ctx.font = `${clamp(z*.28,9,12)}px system-ui`; ctx.fillText(String(i+1), s.x + z*.22, s.y - z*.18); }
    });
    ctx.lineWidth = 1;
  });
  // Procedurally-generated rivers/streams
  (m.rivers || []).forEach(riv => {
    const isActive = riv.id === activeRiverId;
    const isStream = riv.kind === 'stream';
    const path = buildRiverPath(riv);
    if (path.length > 1) {
      ctx.strokeStyle = isActive ? '#7dd3fc' : (isStream ? 'rgba(79,155,217,.6)' : 'rgba(47,111,184,.65)');
      ctx.lineWidth = isActive ? (isStream?3:5) : (isStream?2:4);
      ctx.beginPath();
      path.forEach(([c, rr], i) => { const s = w2s(c+.5, rr+.5); i === 0 ? ctx.moveTo(s.x, s.y) : ctx.lineTo(s.x, s.y); });
      ctx.stroke();
    }
    (riv.nodes || []).forEach(([c, rr], i) => {
      const s = w2s(c+.5, rr+.5);
      ctx.fillStyle = isActive && i === activeRiverNodeIndex ? '#fef08a' : (isActive ? '#fff' : '#2f6fb8');
      ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(3.5, z*.18), 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#06283d'; ctx.lineWidth = 1.5; ctx.stroke();
      if (z > 13) { ctx.fillStyle = '#dbeefe'; ctx.font = `${clamp(z*.28,9,12)}px system-ui`; ctx.fillText(String(i+1), s.x + z*.22, s.y - z*.18); }
    });
    ctx.lineWidth = 1;
  });
  // Transition spots (gold diamonds)
  ctx.font = `${Math.floor(z*0.5)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  (m.transitions || []).forEach(t => {
    const p = w2s(t.col + .5, t.row + .5);
    const s = z * .42;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x + s, p.y); ctx.lineTo(p.x, p.y + s); ctx.lineTo(p.x - s, p.y); ctx.closePath();
    ctx.fillStyle = t.id === activeSpotId ? 'rgba(251,191,36,.7)' : 'rgba(251,191,36,.4)';
    ctx.fill();
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = t.id === activeSpotId ? 2.5 : 1.5; ctx.stroke();
    if (z > 11) {
      ctx.fillStyle = '#fef3c7';
      ctx.fillText('🔁', p.x, p.y);
      const target = mapById(t.targetMapId);
      ctx.font = `${clamp(z*.26,8,11)}px system-ui`;
      ctx.fillText(t.label + (target ? ` → ${target.name}` : ''), p.x, p.y + s + clamp(z*.3,7,10));
      ctx.font = `${Math.floor(z*0.5)}px system-ui`;
    }
  });
  // NPC Stations (cyan squares)
  (m.npcStations || []).forEach(st => {
    const p = w2s(st.col + .5, st.row + .5);
    const s = z * .36;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((st.rotY || 0) * Math.PI / 180);
    ctx.fillStyle = st.id === activeStationId ? 'rgba(34,211,238,.75)' : 'rgba(34,211,238,.42)';
    ctx.fillRect(-s, -s, s * 2, s * 2);
    ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = st.id === activeStationId ? 2.5 : 1.5; ctx.strokeRect(-s, -s, s * 2, s * 2);
    ctx.fillStyle = '#ecfeff'; ctx.fillText(st.pose === 'sit' ? '🪑' : st.pose === 'lie' ? '🛏️' : '🧍', 0, 0);
    ctx.restore();
    if (z > 12) { ctx.fillStyle = '#cffafe'; ctx.font = `${clamp(z*.25,8,11)}px system-ui`; ctx.fillText(st.label || st.id, p.x, p.y + s + clamp(z*.3,7,10)); ctx.font = `${Math.floor(z*0.5)}px system-ui`; }
  });
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

// ── Edit application ──────────────────────────────────────────────────────────
function applyAt(tile) {
  const m = activeMap();
  const { x: c, y: r } = tile;
  if (c < 0 || r < 0 || c >= m.cols || r >= m.rows) return;
  const key = `${c},${r}`;

  if (mode === 'tile') {
    const set = TILE_SETS[m.category] || TILE_SETS.exterior;
    const t = set.includes(brush.tile) ? brush.tile : set[0];
    const existing = m.tiles[key];
    if (!existing || existing.type !== t) m.tiles[key] = { type: t, crop: existing?.crop || '' };
  } else if (mode === 'crop' && m.category === 'exterior') {
    if (!m.tiles[key]) m.tiles[key] = { type: 'tilled', crop: '' };
    m.tiles[key].crop = brush.crop;
  } else if (mode === 'object' && m.category === 'exterior') {
    m.objects[brush.object] = [c, r];
  } else if (mode === 'furniture' && m.category === 'exterior') {
    if (!m.furniture.some(f => f.col === c && f.row === r)) m.furniture.push({ key: brush.furniture, col: c, row: r });
  } else if (mode === 'decor') {
    const info = DECOR[brush.decor];
    if (info && c + info.fw <= m.cols && r + info.fd <= m.rows
        && !m.decor.some(d => overlaps(d, c, r, info.fw, info.fd))) {
      m.decor.push({ key: brush.decor, col: c, row: r });
    }
  } else if (mode === 'path') {
    m.routes = m.routes || [];
    let p = m.routes.find(x => x.id === activePathId);
    if (!p) { p = { id: uid('route'), label: `Route ${m.routes.length+1}`, nodes: [] }; m.routes.push(p); activePathId = p.id; }
    if (activeRouteNodeIndex !== null && activeRouteNodeIndex >= 0 && activeRouteNodeIndex < p.nodes.length) {
      p.nodes.splice(activeRouteNodeIndex + 1, 0, [c, r]);
      activeRouteNodeIndex += 1;
    } else {
      p.nodes.push([c, r]);
      activeRouteNodeIndex = p.nodes.length - 1;
    }
    maybePaintRoute(m);
    renderPalette(); updateBrushPill();
  } else if (mode === 'river' && m.category === 'exterior') {
    m.rivers = m.rivers || [];
    let p = m.rivers.find(x => x.id === activeRiverId);
    if (!p) { p = { id: uid('river'), label: `River ${m.rivers.length+1}`, kind: 'river', width: 3, seed: Math.floor(Math.random()*1000000)+1, paintTiles: true, nodes: [] }; m.rivers.push(p); activeRiverId = p.id; }
    if (activeRiverNodeIndex !== null && activeRiverNodeIndex >= 0 && activeRiverNodeIndex < p.nodes.length) {
      p.nodes.splice(activeRiverNodeIndex + 1, 0, [c, r]);
      activeRiverNodeIndex += 1;
    } else {
      p.nodes.push([c, r]);
      activeRiverNodeIndex = p.nodes.length - 1;
    }
    maybePaintRiver(m);
    renderPalette(); updateBrushPill();
  } else if (mode === 'station') {
    m.npcStations = m.npcStations || [];
    const existing = m.npcStations.find(st => st.col === c && st.row === r);
    if (existing) activeStationId = existing.id;
    else {
      const st = { id: uid('station'), label: `Station ${m.npcStations.length+1}`, col: c, row: r, rotY: 0, pose: 'stand', toolKey: '', toolIntervalSec: 0, toolAnimStyle: '' };
      m.npcStations.push(st); activeStationId = st.id;
    }
    renderPalette(); updateBrushPill();
  } else if (mode === 'spot') {
    const existing = m.transitions.find(t => t.col === c && t.row === r);
    if (existing) { activeSpotId = existing.id; }
    else {
      const t = { id: uid('spot'), label: `spot_${m.transitions.length+1}`, col: c, row: r, targetMapId: '', targetSpotId: '' };
      m.transitions.push(t); activeSpotId = t.id;
    }
    renderPalette();
  } else if (mode === 'fill') {
    const set = TILE_SETS[m.category] || TILE_SETS.exterior;
    const t = set.includes(brush.tile) ? brush.tile : set[0];
    if (!floodFill(m, c, r, t)) return;
  } else if (mode === 'erase') {
    let did = false;
    if (m.tiles[key]) { delete m.tiles[key]; did = true; }
    Object.keys(m.objects).forEach(k => { const [oc,or] = m.objects[k]; if (oc===c && or===r) { delete m.objects[k]; did = true; } });
    const fi = m.furniture.findIndex(f => f.col===c && f.row===r); if (fi >= 0) { m.furniture.splice(fi,1); did = true; }
    const di = m.decor.findIndex(d => { const inf = DECOR[d.key]; return inf && c >= d.col && c < d.col+inf.fw && r >= d.row && r < d.row+inf.fd; });
    if (di >= 0) { m.decor.splice(di,1); did = true; }
    ((m.routes || []).concat(m.npcPaths || [])).forEach(p => {
      for (let i = p.nodes.length-1; i >= 0; i--) if (p.nodes[i][0] === c && p.nodes[i][1] === r) { p.nodes.splice(i,1); did = true; }
    });
    (m.rivers || []).forEach(p => {
      for (let i = p.nodes.length-1; i >= 0; i--) if (p.nodes[i][0] === c && p.nodes[i][1] === r) { p.nodes.splice(i,1); did = true; }
    });
    const ti = (m.transitions || []).findIndex(t => t.col === c && t.row === r);
    if (ti >= 0) { if (m.transitions[ti].id === activeSpotId) activeSpotId = null; m.transitions.splice(ti,1); did = true; }
    const si = (m.npcStations || []).findIndex(st => st.col === c && st.row === r);
    if (si >= 0) { if (m.npcStations[si].id === activeStationId) activeStationId = null; m.npcStations.splice(si,1); did = true; }
    if (!did) return;
    if (mode === 'erase') renderPalette();
  } else return;

  draw(); refreshPreview(); saveWorkspace();
}
function overlaps(d, c, r, fw, fd) {
  const inf = DECOR[d.key]; if (!inf) return false;
  return d.col < c+fw && d.col+inf.fw > c && d.row < r+fd && d.row+inf.fd > r;
}

const PAINT_MODES = ['tile','crop','erase'];   // drag-paintable
const TAP_MODES = ['object','furniture','decor','path','river','spot','station','fill'];

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture?.(e.pointerId); ptrs.set(e.pointerId, canvasPt(e));
  if (ptrs.size === 2) {
    const a = [...ptrs.values()];
    pinchStart = { dist: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y), zoom: cam.zoom, x: cam.x, y: cam.y, mid:{x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2} };
    painting = false; drag = false;
    return;
  }
  const p = canvasPt(e);
  if (mode === 'pan') {
    // ── Gizmo button priority ─────────────────────────────────────────────
    const gHit = _gizmos.find(g => Math.hypot(p.x - g.sx, p.y - g.sy) <= g.r + 4);
    if (gHit && _selectedBuildingId) {
      const selB = (activeMap().buildings || []).find(b => b.id === _selectedBuildingId);
      if (selB) {
        pushUndo();
        if      (gHit.type === 'N')   selB.gridZ--;
        else if (gHit.type === 'S')   selB.gridZ++;
        else if (gHit.type === 'W')   selB.gridX--;
        else if (gHit.type === 'E')   selB.gridX++;
        else if (gHit.type === 'rot') selB.rotationDeg = ((selB.rotationDeg || 0) + 90) % 360;
        syncBuildingSpot(selB, activeMap());
        saveWorkspace(); renderBuildingPanel(); draw();
      }
      return; // consume — no camera pan
    }
    // ── Building drag / select ────────────────────────────────────────────
    const w = s2w(p.x, p.y);
    const bldgs = activeMap().buildings || [];
    const effW = b => { const r = b.rotationDeg||0; return (r===90||r===270) ? (b.footprintD||5) : (b.footprintW||7); };
    const effD = b => { const r = b.rotationDeg||0; return (r===90||r===270) ? (b.footprintW||7) : (b.footprintD||5); };
    const inside = (b, wx, wz) => wx >= b.gridX && wx < b.gridX + effW(b) && wz >= b.gridZ && wz < b.gridZ + effD(b);
    // Drag already-selected building
    if (_selectedBuildingId) {
      const selB = bldgs.find(b => b.id === _selectedBuildingId);
      if (selB && inside(selB, w.x, w.y)) {
        pushUndo();
        _bldgDrag = { bid: selB.id, ox: selB.gridX, oz: selB.gridZ, px0: p.x, py0: p.y };
        return; // don't pan
      }
    }
    // Select a building (or deselect)
    const hit = bldgs.find(b => inside(b, w.x, w.y));
    if (hit) { _selectedBuildingId = hit.id; renderBuildingPanel(); draw(); }
    else if (_selectedBuildingId) { _selectedBuildingId = null; renderBuildingPanel(); draw(); }
    drag = true; dragStart = { p, cx: cam.x, cy: cam.y }; return;
  }
  const w = s2w(p.x, p.y);
  if (mode === 'path') {
    const m = activeMap();
    const routes = activePathId ? (m.routes || []).filter(r => r.id === activePathId) : (m.routes || []);
    for (const route of routes) {
      for (let i = 0; i < (route.nodes || []).length; i++) {
        const n = route.nodes[i];
        if (Math.hypot(w.x - (n[0] + 0.5), w.y - (n[1] + 0.5)) <= 0.45) {
          pushUndo(); activePathId = route.id; activeRouteNodeIndex = i; _routeNodeDrag = { routeId: route.id, index: i };
          renderPalette(); updateBrushPill(); draw(); return;
        }
      }
    }
  }
  if (mode === 'river') {
    const m = activeMap();
    const rivers = activeRiverId ? (m.rivers || []).filter(r => r.id === activeRiverId) : (m.rivers || []);
    for (const riv of rivers) {
      for (let i = 0; i < (riv.nodes || []).length; i++) {
        const n = riv.nodes[i];
        if (Math.hypot(w.x - (n[0] + 0.5), w.y - (n[1] + 0.5)) <= 0.45) {
          pushUndo(); activeRiverId = riv.id; activeRiverNodeIndex = i; _riverNodeDrag = { riverId: riv.id, index: i };
          renderPalette(); updateBrushPill(); draw(); return;
        }
      }
    }
  }
  if (mode === 'spot') {
    const m = activeMap();
    for (const t of (m.transitions || [])) {
      if (Math.hypot(w.x - (t.col + 0.5), w.y - (t.row + 0.5)) <= 0.45) {
        pushUndo(); activeSpotId = t.id; _spotDrag = { spotId: t.id };
        renderPalette(); draw(); return;
      }
    }
  }
  if (mode === 'station') {
    const m = activeMap();
    for (const st of (m.npcStations || [])) {
      if (Math.hypot(w.x - (st.col + 0.5), w.y - (st.row + 0.5)) <= 0.45) {
        pushUndo(); activeStationId = st.id; _stationDrag = { stationId: st.id };
        renderPalette(); updateBrushPill(); draw(); return;
      }
    }
  }
  pushUndo();
  if (PAINT_MODES.includes(mode)) { painting = true; applyAt({ x: Math.floor(w.x), y: Math.floor(w.y) }); }
  else if (TAP_MODES.includes(mode)) applyAt({ x: Math.floor(w.x), y: Math.floor(w.y) });
});
canvas.addEventListener('pointermove', e => {
  const p = canvasPt(e); ptrs.set(e.pointerId, p);
  const w = s2w(p.x, p.y);
  $('cursorPill').textContent = `${Math.floor(w.x)}, ${Math.floor(w.y)}`;
  if (ptrs.size === 2 && pinchStart) {
    const a = [...ptrs.values()]; const dist = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    const nz = clamp(pinchStart.zoom * (dist/Math.max(1,pinchStart.dist)), 4, 90);
    const wx = (pinchStart.mid.x-pinchStart.x)/pinchStart.zoom, wy = (pinchStart.mid.y-pinchStart.y)/pinchStart.zoom;
    cam.zoom = nz; cam.x = pinchStart.mid.x - wx*nz; cam.y = pinchStart.mid.y - wy*nz;
    draw(); return;
  }
  if (_routeNodeDrag) {
    const m = activeMap(); const route = (m.routes || []).find(r => r.id === _routeNodeDrag.routeId);
    if (route?.nodes?.[_routeNodeDrag.index]) {
      route.nodes[_routeNodeDrag.index] = [clamp(Math.floor(w.x), 0, m.cols - 1), clamp(Math.floor(w.y), 0, m.rows - 1)];
      renderPalette(); draw();
    }
    return;
  }
  if (_riverNodeDrag) {
    const m = activeMap(); const riv = (m.rivers || []).find(r => r.id === _riverNodeDrag.riverId);
    if (riv?.nodes?.[_riverNodeDrag.index]) {
      riv.nodes[_riverNodeDrag.index] = [clamp(Math.floor(w.x), 0, m.cols - 1), clamp(Math.floor(w.y), 0, m.rows - 1)];
      renderPalette(); draw();
    }
    return;
  }
  if (_spotDrag) {
    const m = activeMap(); const t = (m.transitions || []).find(t => t.id === _spotDrag.spotId);
    if (t) { t.col = clamp(Math.floor(w.x), 0, m.cols - 1); t.row = clamp(Math.floor(w.y), 0, m.rows - 1); renderPalette(); draw(); }
    return;
  }
  if (_stationDrag) {
    const m = activeMap(); const st = (m.npcStations || []).find(st => st.id === _stationDrag.stationId);
    if (st) { st.col = clamp(Math.floor(w.x), 0, m.cols - 1); st.row = clamp(Math.floor(w.y), 0, m.rows - 1); renderPalette(); draw(); }
    return;
  }
  if (_bldgDrag) {
    const selB = (activeMap().buildings || []).find(b => b.id === _bldgDrag.bid);
    if (selB) {
      selB.gridX = _bldgDrag.ox + Math.round((p.x - _bldgDrag.px0) / cam.zoom);
      selB.gridZ = _bldgDrag.oz + Math.round((p.y - _bldgDrag.py0) / cam.zoom);
      $('bldgGridX').value = selB.gridX; $('bldgGridZ').value = selB.gridZ;
      syncBuildingSpot(selB, activeMap());
      draw();
    }
    return;
  }
  if (drag && dragStart) { cam.x = dragStart.cx + (p.x-dragStart.p.x); cam.y = dragStart.cy + (p.y-dragStart.p.y); draw(); return; }
  if (painting) applyAt({ x: Math.floor(w.x), y: Math.floor(w.y) });
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (_routeNodeDrag) { maybePaintRoute(activeMap()); saveWorkspace(); refreshPreview(); _routeNodeDrag = null; }
  if (_riverNodeDrag) { maybePaintRiver(activeMap()); saveWorkspace(); refreshPreview(); _riverNodeDrag = null; }
  if (_spotDrag)      { saveWorkspace(); refreshPreview(); _spotDrag = null; }
  if (_stationDrag)   { saveWorkspace(); refreshPreview(); _stationDrag = null; }
  if (_bldgDrag) { saveWorkspace(); renderBuildingPanel(); _bldgDrag = null; }
  drag = false; painting = false; pinchStart = null;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault(); const p = canvasPt(e); const old = cam.zoom;
  const nz = clamp(cam.zoom * (e.deltaY < 0 ? 1.12 : .89), 4, 90);
  const wx = (p.x-cam.x)/old, wy = (p.y-cam.y)/old;
  cam.zoom = nz; cam.x = p.x - wx*nz; cam.y = p.y - wy*nz; draw();
}, { passive:false });

window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyY' || (e.shiftKey && e.code === 'KeyZ'))) { e.preventDefault(); redo(); }
});
