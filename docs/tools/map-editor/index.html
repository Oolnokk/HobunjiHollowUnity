// ── Game bridge: hobunji_farm_layout_v3 ──────────────────────────────────────
function buildFarmLayoutV3() {
  const ext = mapById(ws.gameLink.exteriorId);
  const layout = { version: 3, tiles: [], objects: {}, furniture: [], decor: [], routes: [], npcPaths: [], transitions: [], npcStations: [], mapAudio: [] };
  const areaOf = id => id === ws.gameLink.interiorId ? 'interior' : id === ws.gameLink.exteriorId ? 'farm' : id === ws.gameLink.townId ? 'town' : '';
  const pushTravel = (m, area) => {
    (m.routes || []).forEach(p => {
      if (!p.nodes.length) return;
      layout.routes.push({ id: p.id, label: p.label, area, nodes: p.nodes.map(n => [n[0], n[1]]) });
    });
    (m.npcPaths || []).forEach(p => {
      if (!p.nodes.length) return;
      layout.npcPaths.push({ id: p.id, label: p.label, npcId: p.npcId || '', area, nodes: p.nodes.map(n => [n[0], n[1]]) });
    });
    (m.npcStations || []).forEach(st => layout.npcStations.push({ ...st, area }));
    if (m.audioIndex) layout.mapAudio.push({ mapId: m.id, area, audioIndex: m.audioIndex });
    (m.transitions || []).forEach(t => {
      const target = areaOf(t.targetMapId);
      const spot = mapById(t.targetMapId)?.transitions.find(s => s.id === t.targetSpotId) || null;
      layout.transitions.push({
        id: t.id, label: t.label, area, col: t.col, row: t.row,
        target, targetCol: spot ? spot.col : null, targetRow: spot ? spot.row : null
      });
    });
  };
  if (ext) {
    Object.keys(ext.tiles).forEach(key => {
      const [c, r] = key.split(',').map(Number);
      if (c < 0 || r < 0 || c >= GAME.farm.cols || r >= GAME.farm.rows) return;
      const t = ext.tiles[key];
      // Match game's own save behavior: store only diffs from day-one terrain, or any tile with a crop.
      if (t.type !== dayOneType(c, r) || t.crop) layout.tiles.push({ c, r, type: t.type, crop: t.crop || '' });
    });
    Object.keys(ext.objects || {}).forEach(k => {
      const [c, r] = ext.objects[k];
      if (c >= 0 && r >= 0 && c < GAME.farm.cols && r < GAME.farm.rows) layout.objects[k] = [c, r];
    });
    (ext.furniture || []).forEach(f => {
      if (f.col < GAME.farm.cols && f.row < GAME.farm.rows) layout.furniture.push({ key: f.key, col: f.col, row: f.row });
    });
    (ext.decor || []).forEach(d => layout.decor.push({ key: d.key, col: d.col, row: d.row, area: 'farm' }));
    pushTravel(ext, 'farm');
  }
  const intM = mapById(ws.gameLink.interiorId);
  if (intM) {
    (intM.decor || []).forEach(d => layout.decor.push({ key: d.key, col: d.col, row: d.row, area: 'interior' }));
    pushTravel(intM, 'interior');
  }
  return layout;
}

// ── Game bridge: hobunji_town_v1 ─────────────────────────────────────────────
function buildTownLayout() {
  const townM = mapById(ws.gameLink.townId);
  if (!townM) return null;
  const layout = { version: 1, cols: townM.cols, rows: townM.rows, tiles: [], routes: [], npcPaths: [], transitions: [], npcStations: [],
                   buildings: townM.buildings || [], mapAudio: [] };
  // Tiles
  for (let r = 0; r < townM.rows; r++) for (let c = 0; c < townM.cols; c++) {
    const t = townM.tiles[`${c},${r}`];
    if (t) layout.tiles.push({ c, r, type: t.type || 'grass' });
  }
  // Shared routes (legacy NPC paths are preserved below for compatibility)
  (townM.routes || []).forEach(p => {
    if (!p.nodes.length) return;
    layout.routes.push({ id: p.id, label: p.label, area: 'town', nodes: p.nodes.map(n => [n[0], n[1]]) });
  });
  (townM.npcPaths || []).forEach(p => {
    if (!p.nodes.length) return;
    if (!(townM.routes || []).length) layout.routes.push({ id: p.id, label: p.label, area: 'town', nodes: p.nodes.map(n => [n[0], n[1]]) });
    layout.npcPaths.push({ id: p.id, label: p.label, npcId: p.npcId || '', area: 'town', nodes: p.nodes.map(n => [n[0], n[1]]) });
  });
  (townM.npcStations || []).forEach(st => layout.npcStations.push({ ...st, area: 'town' }));
  if (townM.audioIndex) layout.mapAudio.push({ mapId: townM.id, area: 'town', audioIndex: townM.audioIndex });
  // Transitions — resolve farm side: target 'farm', targetCol/Row from the farm-side spot
  const farmM = mapById(ws.gameLink.exteriorId);
  (townM.transitions || []).forEach(t => {
    const isFarmTarget = !t.targetMapId || t.targetMapId === ws.gameLink.exteriorId;
    let targetArea = '';
    let targetCol = null, targetRow = null;
    if (isFarmTarget) {
      targetArea = 'farm';
      // Find matching spot on farm map
      if (farmM) {
        const fspot = (farmM.transitions || []).find(s => s.targetMapId === townM.id && s.targetSpotId === t.id)
          || (farmM.transitions || []).find(s => s.targetMapId === townM.id);
        if (fspot) { targetCol = fspot.col; targetRow = fspot.row; }
      }
      if (targetCol === null) { targetCol = 17; targetRow = 0; } // default farm spawn
    } else if (t.targetMapId && t.targetMapId.startsWith('map_i_')) {
      layout.transitions.push({ id: t.id, label: t.label, area: 'town', col: t.col, row: t.row, target: 'building', targetMapId: t.targetMapId });
      return; // handled — skip the generic push below
    } else {
      const target = mapById(t.targetMapId);
      targetArea = t.targetMapId === ws.gameLink.interiorId ? 'interior' : '';
      if (target) {
        const sp = (target.transitions || []).find(s => s.id === t.targetSpotId);
        if (sp) { targetCol = sp.col; targetRow = sp.row; }
      }
    }
    if (targetArea && targetCol !== null) {
      layout.transitions.push({ id: t.id, label: t.label, area: 'town', col: t.col, row: t.row, target: targetArea, targetCol, targetRow });
    }
  });
  return layout;
}

function loadFromGame() {
  let layout = null;
  try { layout = JSON.parse(localStorage.getItem(GAME.layoutKey) || 'null'); } catch(_) {}
  if (!layout || layout.version !== 3) { setStatus('No saved game farm found.'); return; }
  let ext = mapById(ws.gameLink.exteriorId);
  if (!ext) { ext = makeMap('Farm', 'exterior', GAME.farm.cols, GAME.farm.rows); ws.maps.push(ext); ws.gameLink.exteriorId = ext.id; }
  ext.tiles = {}; ext.objects = {}; ext.furniture = []; ext.decor = []; ext.npcStations = [];
  (layout.tiles || []).forEach(t => { ext.tiles[`${t.c},${t.r}`] = { type: t.type, crop: t.crop || '' }; });
  Object.keys(layout.objects || {}).forEach(k => { ext.objects[k] = [...layout.objects[k]]; });
  (layout.furniture || []).forEach(f => ext.furniture.push({ key: f.key, col: f.col, row: f.row }));
  let intM = mapById(ws.gameLink.interiorId);
  const layoutMapAudio = Array.isArray(layout.mapAudio) ? layout.mapAudio : [];
  const needInterior = (layout.decor || []).some(d => d.area === 'interior')
    || (layout.routes || []).some(p => p.area === 'interior')
    || (layout.npcPaths || []).some(p => p.area === 'interior')
    || (layout.npcStations || []).some(st => st.area === 'interior')
    || (layout.transitions || []).some(t => t.area === 'interior')
    || layoutMapAudio.some(a => a.area === 'interior');
  if (!intM && needInterior) {
    intM = makeMap('Farmhouse', 'interior', GAME.interior.cols, GAME.interior.rows);
    applyFarmhouseFloor(intM); ws.maps.push(intM); ws.gameLink.interiorId = intM.id;
  }
  ext.audioIndex = layoutMapAudio.find(a => (a.area || 'farm') === 'farm')?.audioIndex || '';
  if (intM) intM.audioIndex = layoutMapAudio.find(a => a.area === 'interior')?.audioIndex || '';
  (layout.decor || []).forEach(d => {
    if (d.area === 'interior') intM.decor.push({ key: d.key, col: d.col, row: d.row });
    else ext.decor.push({ key: d.key, col: d.col, row: d.row });
  });
  // Restore shared routes, legacy NPC paths, and transition spots authored for the game
  ext.routes = []; ext.npcPaths = []; ext.transitions = [];
  if (intM) { intM.routes = []; intM.npcPaths = []; intM.transitions = []; intM.npcStations = []; }
  (layout.npcStations || []).forEach(st => {
    const m = st.area === 'interior' ? intM : ext;
    if (!m || !Number.isFinite(st.col) || !Number.isFinite(st.row)) return;
    m.npcStations.push({ ...st });
  });
  (layout.routes || []).forEach(p => {
    const m = p.area === 'interior' ? intM : ext;
    if (!m || !Array.isArray(p.nodes) || !p.nodes.length) return;
    m.routes.push({ id: p.id || uid('route'), label: p.label || 'Route', nodes: p.nodes.map(n => [n[0], n[1]]) });
  });
  (layout.npcPaths || []).forEach(p => {
    const m = p.area === 'interior' ? intM : ext;
    if (!m || !Array.isArray(p.nodes) || !p.nodes.length) return;
    m.npcPaths.push({ id: p.id || uid('path'), label: p.label || 'Legacy path', npcId: p.npcId || '', nodes: p.nodes.map(n => [n[0], n[1]]) });
    if (!(layout.routes || []).length) m.routes.push({ id: p.id || uid('route'), label: p.label || 'Legacy route', nodes: p.nodes.map(n => [n[0], n[1]]) });
  });
  const pendingTargets = [];
  (layout.transitions || []).forEach(t => {
    const m = t.area === 'interior' ? intM : ext;
    if (!m || !Number.isFinite(t.col) || !Number.isFinite(t.row)) return;
    const targetMapId = t.target === 'interior' ? ws.gameLink.interiorId : (t.target === 'farm' ? ws.gameLink.exteriorId : '');
    const spot = { id: t.id || uid('spot'), label: t.label || 'spot', col: t.col, row: t.row, targetMapId, targetSpotId: '' };
    m.transitions.push(spot);
    if (targetMapId && Number.isFinite(t.targetCol)) pendingTargets.push({ spot, targetMapId, c: t.targetCol, r: t.targetRow });
  });
  // Second pass: link arrival spots by position once all spots exist
  pendingTargets.forEach(({ spot, targetMapId, c, r }) => {
    const tm = mapById(targetMapId);
    const arrive = tm?.transitions.find(s => s.col === c && s.row === r);
    if (arrive) spot.targetSpotId = arrive.id;
  });
  ws.activeId = ext.id; undoStack.length = 0; redoStack.length = 0;
  updateAll(); fitView(); setStatus('Loaded game farm.');
}

// ── Export / import ───────────────────────────────────────────────────────────
function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importAny(obj) {
  if (obj && obj.version === 3 && Array.isArray(obj.tiles)) {
    // farm layout v3 → load into linked maps
    localStorage.setItem(GAME.layoutKey, JSON.stringify(obj));
    loadFromGame();
    setStatus('Imported farm layout.');
    return;
  }
  if (obj && obj.schema === 'hobunji_building_interior.v1') {
    const m = buildingInteriorToWorkspaceMap(obj, { id: obj.id, name: obj.name });
    ws.maps.push(m); ws.activeId = m.id;
    captureBaseline(m);
    updateAll(); fitView(); setStatus('Imported building interior: ' + m.name);
    return;
  }
  if (obj && obj.schema === 'hobunji_map.v1') {
    const m = makeMap(obj.name || 'Imported', obj.category === 'interior' ? 'interior' : 'exterior',
      clamp(Math.round(obj.cols||36),2,400), clamp(Math.round(obj.rows||26),2,400));
    if (Array.isArray(obj.tiles)) obj.tiles.forEach(t => { if (t && Number.isFinite(t.c) && Number.isFinite(t.r)) m.tiles[`${t.c},${t.r}`] = { type: t.type || 'grass', crop: t.crop || '' }; });
    else if (obj.tiles && typeof obj.tiles === 'object') m.tiles = obj.tiles;
    m.objects = obj.objects || {}; m.furniture = obj.furniture || []; m.decor = obj.decor || [];
    m.routes = Array.isArray(obj.routes) ? obj.routes : (Array.isArray(obj.npcPaths) ? obj.npcPaths.map(p => ({ id:p.id, label:p.label, nodes:p.nodes||[] })) : []);
      m.npcPaths = Array.isArray(obj.npcPaths) ? obj.npcPaths : [];
    m.transitions = Array.isArray(obj.transitions) ? obj.transitions : [];
    m.buildings = Array.isArray(obj.buildings) ? obj.buildings : [];
    m.npcStations = Array.isArray(obj.npcStations) ? obj.npcStations : [];
    m.audioIndex = obj.audioIndex || '';
    ws.maps.push(m); ws.activeId = m.id;
    captureBaseline(m);
    updateAll(); fitView(); setStatus('Imported map: ' + m.name);
    return;
  }
  // Workspace format {maps:[...], activeId, gameLink}
  if (obj && Array.isArray(obj.maps) && obj.maps.length) {
    const merge = ws.maps.length > 1 || Object.keys(ws.maps[0]?.tiles||{}).length > 0;
    const doMerge = merge && confirm(
      `Merge ${obj.maps.length} maps into your current workspace?\n\nOK = merge (keep your maps)\nCancel = replace workspace`);
    // Sanitise incoming maps
    const incoming = obj.maps.map(src => {
      const m = makeMap(src.name || 'Imported', src.category === 'building_interior' ? 'building_interior' : (src.category === 'interior' ? 'interior' : 'exterior'),
        clamp(Math.round(src.cols||36),2,400), clamp(Math.round(src.rows||26),2,400));
      m.id = src.id || m.id;  // keep authored IDs so transitions link correctly
      if (Array.isArray(src.tiles))
        src.tiles.forEach(t => { if (t && Number.isFinite(t.c) && Number.isFinite(t.r)) m.tiles[`${t.c},${t.r}`] = { type: t.type||'grass', crop: t.crop||'' }; });
      else if (src.tiles && typeof src.tiles === 'object') m.tiles = src.tiles;
      m.objects = src.objects || {}; m.furniture = src.furniture || []; m.decor = src.decor || [];
      m.routes = Array.isArray(src.routes) ? src.routes : (Array.isArray(src.npcPaths) ? src.npcPaths.map(p => ({ id:p.id, label:p.label, nodes:p.nodes||[] })) : []);
      m.npcPaths = Array.isArray(src.npcPaths) ? src.npcPaths : [];
      m.transitions = Array.isArray(src.transitions) ? src.transitions : [];
      m.buildings = Array.isArray(src.buildings) ? src.buildings : [];
      m.npcStations = Array.isArray(src.npcStations) ? src.npcStations : [];
      m.audioIndex = src.audioIndex || '';
      if (src.buildingInteriorBase) m.buildingInteriorBase = src.buildingInteriorBase;
      return m;
    });
    if (doMerge) {
      // Add only maps whose IDs aren't already present
      const existing = new Set(ws.maps.map(m => m.id));
      incoming.forEach(m => { if (!existing.has(m.id)) ws.maps.push(m); });
      setStatus(`Merged ${incoming.filter(m => !existing.has(m.id)).length} new maps.`);
    } else {
      ws.maps = incoming;
      ws.activeId = obj.activeId || incoming[0].id;
      ws.gameLink = obj.gameLink || { exteriorId:'', interiorId:'' };
      setStatus(`Loaded workspace: ${incoming.length} maps.`);
    }
    undoStack.length = 0; redoStack.length = 0;
    ws.maps.forEach(captureBaseline);
    updateAll(); fitView();
    return;
  }
  throw new Error('Unrecognized JSON (expected hobunji_map.v1, farm layout v3, or workspace).');
}

// ── Wire up ───────────────────────────────────────────────────────────────────
document.querySelectorAll('#modeBar button[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('fitBtn').addEventListener('click', fitView);
$('undoBtn').addEventListener('click', undo);
$('redoBtn').addEventListener('click', redo);

$('newMapBtn').addEventListener('click', () => {
  const cat = confirm('OK = exterior map, Cancel = interior map') ? 'exterior' : 'interior';
  const m = cat === 'exterior' ? makeMap('New exterior', 'exterior', GAME.farm.cols, GAME.farm.rows)
                               : makeMap('New interior', 'interior', GAME.interior.cols, GAME.interior.rows);
  ws.maps.push(m); ws.activeId = m.id; undoStack.length = 0; redoStack.length = 0;
  updateAll(); fitView(); setStatus('Created ' + m.name);
});
$('fromLayoutBtn').addEventListener('click', async () => {
  let index;
  try {
    const res = await fetch('../../config/maps/index.json');
    index = await res.json();
  } catch(e) { setStatus('Could not fetch layout index: ' + e.message); return; }
  const layouts = (index.maps || []).filter(e => e.category === 'building_interior');
  if (!layouts.length) { setStatus('No server layouts found.'); return; }
  const list = layouts.map((e, i) => `${i + 1}. ${e.name}  [${e.id}]`).join('\n');
  const input = prompt(`Inherit a Server Layout as a new building interior map.\n\n${list}\n\nEnter number (or Cancel):`);
  if (!input) return;
  const idx = parseInt(input, 10) - 1;
  if (!Number.isFinite(idx) || idx < 0 || idx >= layouts.length) { setStatus('Invalid selection.'); return; }
  const entry = layouts[idx];
  let mapData;
  try {
    const r = await fetch('../../' + entry.file);
    mapData = await r.json();
  } catch(e) { setStatus('Could not load layout: ' + e.message); return; }
  const m = buildingInteriorToWorkspaceMap(mapData, entry);
  m.id = uid('map'); // new unique ID so it doesn't shadow the layout source
  m.name = entry.name + ' (copy)';
  ws.maps.push(m); ws.activeId = m.id;
  captureBaseline(m);
  undoStack.length = 0; redoStack.length = 0;
  updateAll(); fitView(); setStatus('Created building interior from layout: ' + entry.name);
});
$('dupMapBtn').addEventListener('click', () => {
  const src = activeMap(); const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid('map'); copy.name = src.name + ' copy';
  ws.maps.push(copy); ws.activeId = copy.id; undoStack.length = 0; redoStack.length = 0;
  updateAll(); setStatus('Duplicated.');
});
$('delMapBtn').addEventListener('click', () => {
  if (ws.maps.length <= 1) { setStatus('Cannot delete the last map.'); return; }
  const m = activeMap();
  if (!confirm(`Delete map "${m.name}"?`)) return;
  ws.maps = ws.maps.filter(x => x.id !== m.id);
  if (ws.gameLink.exteriorId === m.id) ws.gameLink.exteriorId = '';
  if (ws.gameLink.interiorId === m.id) ws.gameLink.interiorId = '';
  if (ws.gameLink.townId     === m.id) ws.gameLink.townId     = '';
  ws.activeId = ws.maps[0].id; undoStack.length = 0; redoStack.length = 0;
  updateAll(); fitView(); setStatus('Deleted.');
});

$('applyMapBtn').addEventListener('click', () => {
  const m = activeMap();
  pushUndo();
  m.name = $('mapName').value.trim() || m.name;
  m.audioIndex = $('mapAudioIndex').value || '';
  const newCat = $('mapCategory').value;
  if (newCat !== m.category) {
    m.category = newCat;
    // Drop palette items not valid in the new category (routes and spots are valid in both)
    if (newCat === 'interior' || newCat === 'building_interior') { m.objects = {}; m.furniture = []; Object.keys(m.tiles).forEach(k => { if (m.tiles[k].crop) m.tiles[k].crop = ''; }); }
    if (ws.gameLink.exteriorId === m.id && newCat !== 'exterior') ws.gameLink.exteriorId = '';
    if (ws.gameLink.interiorId === m.id && newCat !== 'interior') ws.gameLink.interiorId = '';
    if (ws.gameLink.townId     === m.id && newCat !== 'exterior') ws.gameLink.townId     = '';
  }
  const nc = clamp(Math.round(Number($('mapCols').value)||m.cols), 2, 400);
  const nr = clamp(Math.round(Number($('mapRows').value)||m.rows), 2, 400);
  if (nc !== m.cols || nr !== m.rows) {
    m.cols = nc; m.rows = nr;
    Object.keys(m.tiles).forEach(k => { const [c,r] = k.split(',').map(Number); if (c >= nc || r >= nr) delete m.tiles[k]; });
    Object.keys(m.objects).forEach(k => { const [c,r] = m.objects[k]; if (c >= nc || r >= nr) delete m.objects[k]; });
    m.furniture = m.furniture.filter(f => f.col < nc && f.row < nr);
    m.decor = m.decor.filter(d => { const inf = DECOR[d.key]; return inf && d.col + inf.fw <= nc && d.row + inf.fd <= nr; });
    ((m.routes || []).concat(m.npcPaths || [])).forEach(p => { p.nodes = p.nodes.filter(([c,r]) => c < nc && r < nr); });
    m.transitions = (m.transitions || []).filter(t => t.col < nc && t.row < nr);
    m.npcStations = (m.npcStations || []).filter(st => st.col < nc && st.row < nr);
  }
  updateAll(); fitView(); setStatus('Applied.');
});

$('floorTemplateBtn').addEventListener('click', () => {
  const m = activeMap();
  if (m.category !== 'interior' && m.category !== 'building_interior') return;
  pushUndo(); applyFarmhouseFloor(m); updateAll(); setStatus('Farmhouse floor template applied.');
});

$('linkExterior').addEventListener('change', e => { ws.gameLink.exteriorId = e.target.value; updateAll(); });
$('linkInterior').addEventListener('change', e => { ws.gameLink.interiorId = e.target.value; updateAll(); });
$('linkTown').addEventListener('change', e => { ws.gameLink.townId = e.target.value; updateAll(); });
$('showBaseChk').addEventListener('change', draw);
$('loadFromGameBtn').addEventListener('click', loadFromGame);

$('playBtn').addEventListener('click', () => {
  if (!ws.gameLink.exteriorId) { setStatus('Pick a Farm map in Game Link first.'); return; }
  const layout = buildFarmLayoutV3();
  try {
    localStorage.setItem(GAME.layoutKey, JSON.stringify(layout));
    let townMsg = '';
    if (ws.gameLink.townId) {
      const tl = buildTownLayout();
      if (tl) { localStorage.setItem(GAME.townKey, JSON.stringify(tl)); townMsg = ` + town (${tl.tiles.length} tiles)`; }
    }
    setStatus(`Sent ${layout.tiles.length} tiles, ${layout.furniture.length} processors, ${layout.decor.length} decor, ${layout.routes.length} routes, ${layout.transitions.length} spots${townMsg} → game`);
    window.open(GAME.gamePath, '_blank');
  } catch(e) { setStatus('Failed: ' + e.message); }
});

$('exportMapBtn').addEventListener('click', () => {
  const m = activeMap();
  const out = m.category === 'building_interior'
    ? buildBuildingInteriorMapV1(m)
    : { ...m, tiles: Object.keys(m.tiles).map(k => { const [c,r] = k.split(',').map(Number); return { c, r, ...m.tiles[k] }; }) };
  const suffix = m.category === 'building_interior' ? '.json' : '.map.json';
  download(`${m.name.toLowerCase().replace(/[^a-z0-9]+/g,'_')}${suffix}`, out);
  setStatus(m.category === 'building_interior' ? 'Building interior JSON downloaded.' : 'Map JSON downloaded.');
});
$('exportLayoutBtn').addEventListener('click', () => {
  if (!ws.gameLink.exteriorId) { setStatus('Pick a Farm map in Game Link first.'); return; }
  download('farm_layout_v3.json', buildFarmLayoutV3());
  setStatus('Farm layout downloaded.');
});
$('exportDiffBtn').addEventListener('click', () => {
  const m = activeMap();
  const diff = computeMapDiff(m);
  const json = JSON.stringify(diff, null, 2);
  $('diffTitle').textContent = m.name;
  const tileCount = diff.tiles ? Object.values(diff.tiles).reduce((s,a)=>s+a.length,0) : 0;
  const hasBase = _baselines.has(m.id);
  $('diffSubtitle').textContent = hasBase
    ? `${tileCount} tile change${tileCount!==1?'s':''} vs baseline · ${json.length.toLocaleString()} chars (full JSON: ~${Math.round(JSON.stringify(m).length/1024)}KB)`
    : 'No baseline — import or load a map file to establish one.';
  $('diffTextarea').value = json;
  $('diffModal').style.display = 'block';
});
$('diffCopyBtn').addEventListener('click', () => {
  navigator.clipboard?.writeText($('diffTextarea').value)
    .then(() => setStatus('Diff copied to clipboard.'))
    .catch(() => { $('diffTextarea').select(); document.execCommand('copy'); setStatus('Diff copied.'); });
});
$('diffDownloadBtn').addEventListener('click', () => {
  const m = activeMap();
  download(`${m.name.toLowerCase().replace(/[^a-z0-9]+/g,'_')}.diff.json`, JSON.parse($('diffTextarea').value));
  setStatus('Diff downloaded.');
});
$('diffCloseBtn').addEventListener('click', () => { $('diffModal').style.display = 'none'; });
$('diffModal').addEventListener('click', e => { if (e.target === $('diffModal')) $('diffModal').style.display = 'none'; });
$('importBtn').addEventListener('click', () => $('importFile').click());
$('loadTownBtn').addEventListener('click', async () => {
  try {
    setStatus('Fetching town workspace…');
    const res = await fetch('../../config/town-workspace-v1.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    importAny(await res.json());
    // Auto-link: find the town map and set gameLink.townId
    const townM = ws.maps.find(m => m.id === 'map_hobunji_town');
    if (townM && !ws.gameLink.townId) {
      ws.gameLink.townId = townM.id;
      // Wire farm ↔ town transition spots
      const farmM = mapById(ws.gameLink.exteriorId);
      const townSpot = (townM.transitions || []).find(t => t.id === 'sp_town_farm')
        || (townM.transitions || []).find(t => !t.targetMapId);
      if (farmM && townSpot) {
        // Add farm-side spot pointing back to town if not already present
        const existing = (farmM.transitions || []).find(t => t.targetMapId === townM.id);
        if (!existing) {
          farmM.transitions = farmM.transitions || [];
          const farmSpotId = 'sp_farm_to_town';
          farmM.transitions.push({
            id: farmSpotId, label: 'To Town',
            col: 17, row: 0,
            targetMapId: townM.id, targetSpotId: townSpot.id,
          });
          // Link the town spot back to the farm spot
          townSpot.targetMapId  = farmM.id;
          townSpot.targetSpotId = farmSpotId;
        }
      }
      updateAll();
      setStatus('Town workspace loaded and linked to farm.');
    }
  } catch(e) { setStatus('Load Town failed: ' + e.message); }
});
$('importFile').addEventListener('change', async e => {
  const f = e.target.files?.[0]; if (!f) return;
  try { importAny(JSON.parse(await f.text())); }
  catch(err) { setStatus('Import failed: ' + err.message); }
  finally { e.target.value = ''; }
});

// ── Building panel handlers ───────────────────────────────────────────────────
$('saveBldgBtn').addEventListener('click', () => {
  const m = activeMap();
  const b = (m.buildings || []).find(b => b.id === _selectedBuildingId);
  if (!b) return;
  b.label  = $('bldgLabel').value.trim() || b.label;
  b.gridX  = parseInt($('bldgGridX').value) || 0;
  b.gridZ  = parseInt($('bldgGridZ').value) || 0;
  syncBuildingSpot(b, m);
  renderBuildingPanel(); draw(); saveWorkspace(); setStatus('Building saved.');
});

$('delBldgBtn').addEventListener('click', () => {
  const m = activeMap();
  if (!_selectedBuildingId) return;
  m.buildings = (m.buildings || []).filter(b => b.id !== _selectedBuildingId);
  m.transitions = (m.transitions || []).filter(t => t.buildingId !== _selectedBuildingId);
  _selectedBuildingId = null;
  $('buildingCountTag').textContent = m.buildings.length;
  renderBuildingPanel(); draw(); saveWorkspace(); setStatus('Building removed.');
});

window.addEventListener('resize', resizeCanvas);
window.addEventListener('error', e => setStatus('Error: ' + e.message));

$('farmDimsNote').textContent = `${GAME.farm.cols}×${GAME.farm.rows}`;

async function loadAudioCueIndexes() {
  try {
    const res = await fetch('../../assets/audio/music/cues/index.json');
    if (!res.ok) return;
    const idx = await res.json();
    audioCueIndexEntries = Array.isArray(idx.indexes) ? idx.indexes : [];
    fillSettings();
  } catch(e) { setStatus('Could not load audio cue index list: ' + e.message); }
}

// ── Building interior map mirror ──────────────────────────────────────────────
async function loadBuildingInteriorMaps() {
  let index;
  try {
    const res = await fetch('../../config/maps/index.json');
    index = await res.json();
  } catch(e) { setStatus('Could not load map index: ' + e.message); return; }

  const entries = (index.maps || []).filter(e => e.category === 'building_interior');
  let added = 0;

  for (const entry of entries) {
    if (ws.maps.find(m => m.id === entry.id)) continue;
    let mapData;
    try {
      const r2 = await fetch('../../' + entry.file);
      mapData = await r2.json();
    } catch(e) { continue; }

    ws.maps.push(buildingInteriorToWorkspaceMap(mapData, entry));
    added++;
  }

  if (added > 0) { saveWorkspace(); renderMapList(); setStatus(`Synced ${added} building interior map${added>1?'s':''}.`); }
}

// ── Init ──────────────────────────────────────────────────────────────────────
resizeCanvas(); updateAll(); fitView();
loadAudioCueIndexes();
loadBuildingInteriorMaps();
})();
