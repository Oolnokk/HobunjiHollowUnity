<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Body & Dye Color Editor</title>
<script src="../../config/colors/config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#07101a;color:#edf5ff;font:13px system-ui}header{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;padding:12px 16px;background:#101b29;border-bottom:1px solid #304157}h1{font-size:16px;margin:0 auto 0 0}button,select,input{background:#142438;color:#edf5ff;border:1px solid #405777;border-radius:6px;padding:6px}button{cursor:pointer;font-weight:700}.tabs{display:flex;gap:8px;padding:12px 16px}.tabs button.active{outline:2px solid #6aa7ff}.panel{display:none;padding:0 16px 30px}.panel.active{display:block}.filters{display:flex;gap:8px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}.card{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:9px;background:#101b29;border:1px solid #263950;border-radius:8px}.swatch{width:42px;height:42px;border-radius:7px;border:1px solid #789}.name{font-weight:700;margin-bottom:6px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.fields label{font-size:10px;color:#a9bdd4}.fields input{width:100%;margin-top:2px}.note{color:#a9bdd4;margin-bottom:12px}.status{color:#7ee2a8;min-width:120px;text-align:right}
</style></head><body><header><h1>🎨 Body & Dye Color Editor</h1><button id="save">Save config.js</button><button id="download">Download</button><span class="status" id="status"></span></header>
<div class="tabs"><button class="active" data-tab="body">Body palettes</button><button data-tab="dye">Exact dye HSL</button></div>
<section class="panel active" id="body"><p class="note">Body colors use the portrait pipeline's authored hue rotation (degrees), saturation delta, and value delta. Swatch numbers match character creation.</p><div class="filters"><select id="species"></select><select id="gender"></select></div><div class="grid" id="bodyGrid"></div></section>
<section class="panel" id="dye"><p class="note">Each clothing dye is stored as an exact CSS HSL triplet. Runtime derives its exact hex color from these values.</p><div class="filters"><input id="search" type="search" placeholder="Search dyes…"></div><div class="grid" id="dyeGrid"></div></section>
<script>
const config=structuredClone(window.HOBUNJI_COLOR_CONFIG);const $=s=>document.querySelector(s);const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function hslCss(x){return `hsl(${x.h} ${clamp(x.s,0,100)}% ${clamp(x.l,0,100)}%)`}function bodyCss(x){return `hsl(${((140+x.h)%360+360)%360} ${clamp((1+x.s)*55,0,100)}% ${clamp((1+x.v)*45,5,95)}%)`}
function field(label,value,min,max,step,oninput){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.type='number';i.value=value;i.min=min;i.max=max;i.step=step;i.addEventListener('input',()=>oninput(Number(i.value)));l.append(i);return l}
function card(item,index,mode){const el=document.createElement('div');el.className='card';const sw=document.createElement('div');sw.className='swatch';const box=document.createElement('div'),name=document.createElement('div'),fields=document.createElement('div');name.className='name';fields.className='fields';name.textContent=mode==='body'?`${index+1}. ${item.label}`:item.label;const paint=()=>sw.style.background=mode==='body'?bodyCss(item):hslCss(item.hsl);paint();if(mode==='body'){fields.append(field('Hue',item.h,-360,360,.1,v=>{item.h=v;paint()}),field('Sat Δ',item.s,-1,10,.01,v=>{item.s=v;paint()}),field('Value Δ',item.v,-1,1,.01,v=>{item.v=v;paint()}))}else{fields.append(field('Hue °',item.hsl.h,0,360,.01,v=>{item.hsl.h=v;paint()}),field('Saturation %',item.hsl.s,0,100,.01,v=>{item.hsl.s=v;paint()}),field('Lightness %',item.hsl.l,0,100,.01,v=>{item.hsl.l=v;paint()}))}box.append(name,fields);el.append(sw,box);return el}
function genders(){const sid=$('#species').value,keys=Object.keys(config.bodyPalettes[sid]);$('#gender').innerHTML=keys.map(g=>`<option>${g}</option>`).join('');renderBody()}function renderBody(){const a=config.bodyPalettes[$('#species').value]?.[$('#gender').value]||[];$('#bodyGrid').replaceChildren(...a.map((x,i)=>card(x,i,'body')))}
$('#species').innerHTML=Object.keys(config.bodyPalettes).map(x=>`<option value="${x}">${x}</option>`).join('');$('#species').onchange=genders;$('#gender').onchange=renderBody;genders();
function renderDyes(){const q=$('#search').value.toLowerCase();const a=config.dyeHsl.filter(x=>x.label.toLowerCase().includes(q)||x.id.includes(q));$('#dyeGrid').replaceChildren(...a.map((x,i)=>card(x,i,'dye')))}$('#search').oninput=renderDyes;renderDyes();
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
function source(){return `// Authoritative, tool-editable body palettes and exact clothing dye HSL values.\n// Edit with docs/tools/color-editor/; runtime derives dye hex values from these HSLs.\n(function () {\n  'use strict';\n  const bodyPalettes = ${JSON.stringify(config.bodyPalettes,null,2)};\n  const dyeHsl = ${JSON.stringify(config.dyeHsl,null,2)};\n  window.HOBUNJI_COLOR_CONFIG = { bodyPalettes, dyeHsl };\n})();\n`}
function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([source()],{type:'text/javascript'}));a.download='config.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('#status').textContent='Downloaded config.js'}$('#download').onclick=download;
$('#save').onclick=async()=>{if(!window.showSaveFilePicker){download();$('#status').textContent='Direct save unavailable; downloaded';return}try{const h=await showSaveFilePicker({suggestedName:'config.js',types:[{description:'JavaScript config',accept:{'text/javascript':['.js']}}]});const w=await h.createWritable();await w.write(source());await w.close();$('#status').textContent='Saved config.js'}catch(e){if(e.name!=='AbortError')$('#status').textContent='Save failed: '+e.message}};
</script></body></html>
