<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ambient Dialogue Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101a;color:#edf5ff;font:13px system-ui,Segoe UI,sans-serif;height:100vh;overflow:hidden}:root{--panel:#111b28;--line:rgba(255,255,255,.13);--acc:#6aa7ff;--muted:#9fb4cf;--ok:#34d399}button,input,textarea,select{font:inherit;color:inherit;background:#0b1521;border:1px solid var(--line);border-radius:7px;padding:7px}button{cursor:pointer;font-weight:700}button.good{background:#166534}header{height:52px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}header h1{font-size:15px;margin:0}header .spacer{flex:1}.shell{height:calc(100vh - 52px);display:grid;grid-template-columns:250px minmax(0,1fr)}aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px}.tabs button.active{outline:2px solid var(--acc)}#search{margin:0 8px 8px}.list{overflow:auto;padding:6px;flex:1}.item{padding:8px;margin-bottom:5px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:7px;cursor:pointer}.item.active{border-color:var(--acc);background:rgba(106,167,255,.16)}main{overflow:auto;padding:14px}.card{max-width:900px;margin:0 auto 12px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.card h2,.card h3{margin:0 0 9px}.muted{color:var(--muted)}textarea{width:100%;min-height:130px;resize:vertical;line-height:1.45}.friendGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px;max-height:220px;overflow:auto}.friend{display:flex;gap:7px;align-items:center;padding:7px;background:rgba(255,255,255,.035);border-radius:7px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.preview{min-height:110px;display:grid;place-items:center;background:radial-gradient(circle,rgba(106,167,255,.14),transparent 65%);font:900 24px 'DM Mono',monospace;text-shadow:-2px 0 #080604,0 2px #080604,2px 0 #080604,0 -2px #080604}.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px}@media(max-width:720px){.shell{grid-template-columns:1fr;grid-template-rows:210px minmax(0,1fr)}aside{border-right:0;border-bottom:1px solid var(--line)}header h1{font-size:12px}.optional{display:none}}
</style></head><body>
<header><h1>Ambient Dialogue Editor</h1><span id="status" class="pill">Loading…</span><span class="spacer"></span><button id="importBtn">Import</button><button id="exportBtn" class="good">Export JSON</button><input id="file" type="file" accept=".json" hidden></header>
<div class="shell"><aside><div class="tabs"><button data-mode="npc" class="active">NPCs</button><button data-mode="animal">Animals</button><button data-mode="crowd">Crowd</button></div><input id="search" type="search" placeholder="Search…"><div id="list" class="list"></div></aside><main id="editor"><div class="card muted">Loading configuration and databases…</div></main></div>
<script>
const CONFIG_URL='../../config/dialogue/ambient-dialogue.json',NPC_URL='../../config/npcs/hobunji-starter-npc-database.json',CREATURE_URL='../../config/creatures/hobunji-creature-bestiary.json';
const state={config:null,npcs:[],animals:[],mode:'npc',selected:null};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines=s=>String(s||'').split(/\r?\n/).map(v=>v.trim()).filter(Boolean),lineText=a=>(a||[]).join('\n');
function ensureNpc(id){return state.config.npcGreetings[id]||(state.config.npcGreetings[id]={player:[],friends:{}})}
function materializeFriendGroups(){state.config.npcGreetings||={};for(const group of state.config.friendGroups||[])for(const speaker of group){const cfg=ensureNpc(speaker);cfg.friends||={};for(const target of group)if(target!==speaker)cfg.friends[target]??=[]}state.config.friendGroups=[]}
function npcName(id){return state.npcs.find(n=>n.id===id)?.name||id}
function selectedRecord(){return state.mode==='npc'?state.npcs.find(n=>n.id===state.selected):state.animals.find(a=>a.id===state.selected)}
function mark(){ $('status').textContent='Edited · export to save'; }
function listItems(){const q=$('search').value.toLowerCase();let items=state.mode==='npc'?state.npcs:state.mode==='animal'?state.animals:[{id:'crowd',name:'Cheers & jeers'}];$('list').innerHTML=items.filter(x=>(x.name||x.label||x.id).toLowerCase().includes(q)).map(x=>`<div class="item${x.id===state.selected?' active':''}" data-id="${esc(x.id)}"><b>${esc(x.name||x.label||x.id)}</b><div class="muted">${esc(x.id)}</div></div>`).join('');$('list').querySelectorAll('.item').forEach(el=>el.onclick=()=>{state.selected=el.dataset.id;listItems();render()})}
function previewText(text,mode){return `<div class="card"><div class="row"><h3>Preview</h3><span class="pill">${mode==='npc'?'chathead + text':'text only'}</span></div><div class="preview">${esc(text||'Choose or enter a line')}</div></div>`}
function renderNpc(){const npc=selectedRecord();if(!npc)return;const cfg=ensureNpc(npc.id);const friendIds=new Set(Object.keys(cfg.friends||{}));for(const g of state.config.friendGroups||[])if(g.includes(npc.id))g.forEach(id=>{if(id!==npc.id)friendIds.add(id)});const targetOptions=['player',...friendIds].map(id=>`<option value="${esc(id)}">${id==='player'?'Player':esc(npcName(id))}</option>`).join('');$('editor').innerHTML=`<div class="card"><h2>${esc(npc.name)}</h2><div class="muted">Player greetings and each friend's greetings are separate pools. Placeholders: {targetName}, {weekDay}, {dayPart}.</div></div><div class="card"><h3>Friends this NPC may greet</h3><div class="friendGrid">${state.npcs.filter(n=>n.id!==npc.id).map(n=>`<label class="friend"><input type="checkbox" data-friend="${esc(n.id)}"${friendIds.has(n.id)?' checked':''}> ${esc(n.name)}</label>`).join('')}</div></div><div class="card"><div class="row"><h3>Greeting pool</h3><select id="target">${targetOptions}</select></div><textarea id="lines" placeholder="One line per row"></textarea><div class="muted">One line is selected deterministically per day. NPCs do not respond to player chat messages.</div></div>${previewText('', 'npc')}`;function syncTarget(){const t=$('target').value;$('lines').value=t==='player'?lineText(cfg.player):lineText(cfg.friends?.[t]);$('lines').oninput=()=>{if(t==='player')cfg.player=lines($('lines').value);else{cfg.friends=cfg.friends||{};cfg.friends[t]=lines($('lines').value)}mark();renderPreviewOnly($('lines').value,'npc')}}$('target').onchange=syncTarget;syncTarget();$('editor').querySelectorAll('[data-friend]').forEach(cb=>cb.onchange=()=>{cfg.friends=cfg.friends||{};if(cb.checked)cfg.friends[cb.dataset.friend]??=[];else delete cfg.friends[cb.dataset.friend];mark();renderNpc()})}
function renderPreviewOnly(value,mode){const card=$('editor').lastElementChild;const first=lines(value)[0]||'Choose or enter a line';card.querySelector('.preview').textContent=first.replaceAll('{targetName}','Target Name').replaceAll('{weekDay}','Anan').replaceAll('{dayPart}','morning')}
function renderAnimal(){const a=selectedRecord();if(!a)return;const pool=state.config.companionTreasureLines[a.id]||[];$('editor').innerHTML=`<div class="card"><h2>${esc(a.label||a.id)}</h2><div class="muted">Non-chathead onomatopoeia used when this companion detects nearby buried treasure.</div></div><div class="card"><h3>Treasure announcements</h3><textarea id="lines">${esc(lineText(pool))}</textarea></div>${previewText(pool[0],'animal')}`;$('lines').oninput=()=>{state.config.companionTreasureLines[a.id]=lines($('lines').value);mark();renderPreviewOnly($('lines').value,'animal')}}
function renderCrowd(){const cheer=state.config.crowdLines.cheer||[],jeer=state.config.crowdLines.jeer||[];$('editor').innerHTML=`<div class="card"><h2>Audience reactions</h2><div class="muted">Reusable non-chathead pools for music, dancing, and later performances.</div></div><div class="card"><h3>Cheers</h3><textarea id="cheers">${esc(lineText(cheer))}</textarea><h3>Jeers</h3><textarea id="jeers">${esc(lineText(jeer))}</textarea></div>${previewText(cheer[0],'crowd')}`;for(const [id,key] of [['cheers','cheer'],['jeers','jeer']])$(id).oninput=()=>{state.config.crowdLines[key]=lines($(id).value);mark();renderPreviewOnly($(id).value,'crowd')}}
function render(){if(state.mode==='npc')renderNpc();else if(state.mode==='animal')renderAnimal();else renderCrowd()}
async function load(){const [c,n,a]=await Promise.all([fetch(CONFIG_URL).then(r=>r.json()),fetch(NPC_URL).then(r=>r.json()),fetch(CREATURE_URL).then(r=>r.json())]);state.config=c;state.config.npcGreetings||={};state.config.friendGroups||=[];state.config.companionTreasureLines||={};state.config.crowdLines||={cheer:[],jeer:[]};state.npcs=n.npcs||[];state.animals=(a.creatures||[]).filter(x=>!/-mother$|-alpha$/.test(x.id));materializeFriendGroups();state.selected=state.npcs[0]?.id;$('status').textContent='Repository data loaded';listItems();render()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));state.selected=state.mode==='npc'?state.npcs[0]?.id:state.mode==='animal'?state.animals[0]?.id:'crowd';listItems();render()});$('search').oninput=listItems;
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state.config,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ambient-dialogue.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='Exported ambient-dialogue.json'};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async()=>{try{state.config=JSON.parse(await $('file').files[0].text());state.config.npcGreetings||={};state.config.friendGroups||=[];state.config.companionTreasureLines||={};state.config.crowdLines||={cheer:[],jeer:[]};materializeFriendGroups();listItems();render();$('status').textContent='Imported JSON'}catch(e){$('status').textContent='Import failed: '+e.message}};load().catch(e=>$('editor').innerHTML=`<div class="card">Load failed: ${esc(e.message)}</div>`);
</script></body></html>
