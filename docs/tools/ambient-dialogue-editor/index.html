<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ambient Dialogue Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101a;color:#edf5ff;font:13px system-ui,Segoe UI,sans-serif;height:100vh;overflow:hidden}:root{--panel:#111b28;--line:rgba(255,255,255,.13);--acc:#6aa7ff;--muted:#9fb4cf;--ok:#34d399;--warn:#fbbf24}button,input,textarea,select{font:inherit;color:inherit;background:#0b1521;border:1px solid var(--line);border-radius:7px;padding:7px}button{cursor:pointer;font-weight:700}button.good{background:#166534}button.subtle{background:rgba(255,255,255,.05)}button:disabled{opacity:.4;cursor:not-allowed}header{height:52px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}header h1{font-size:15px;margin:0}header .spacer{flex:1}.shell{height:calc(100vh - 52px);display:grid;grid-template-columns:250px minmax(0,1fr)}aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px}.tabs button.active{outline:2px solid var(--acc)}#search{margin:0 8px 8px}.list{overflow:auto;padding:6px;flex:1}.item{padding:8px;margin-bottom:5px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:7px;cursor:pointer}.item.active{border-color:var(--acc);background:rgba(106,167,255,.16)}main{overflow:auto;padding:14px}.card{max-width:980px;margin:0 auto 12px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.card h2,.card h3{margin:0 0 9px}.muted{color:var(--muted)}.warn{color:var(--warn)}textarea{width:100%;min-height:130px;resize:vertical;line-height:1.45}.compactText{min-height:92px}.friendGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px;max-height:220px;overflow:auto}.friend{display:flex;gap:7px;align-items:center;padding:7px;background:rgba(255,255,255,.035);border-radius:7px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field input{width:100%}.preview{min-height:110px;display:grid;place-items:center;background:radial-gradient(circle,rgba(106,167,255,.14),transparent 65%);font:900 24px 'DM Mono',monospace;text-shadow:-2px 0 #080604,0 2px #080604,2px 0 #080604,0 -2px #080604;text-align:center;padding:10px}.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px}.soundCard{border-left:3px solid rgba(106,167,255,.6)}.soundCard .sectionHead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.soundCard .sectionHead h3{margin:0}.soundSummary{margin-left:auto}.switch{display:flex;gap:7px;align-items:center}.clipList{font-family:'DM Mono',monospace;font-size:11px;overflow-wrap:anywhere}#nicknameRow input{min-width:180px}@media(max-width:720px){.shell{grid-template-columns:1fr;grid-template-rows:210px minmax(0,1fr)}aside{border-right:0;border-bottom:1px solid var(--line)}header h1{font-size:12px}.optional{display:none}.soundSummary{width:100%;margin-left:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>Ambient Dialogue Editor</h1><span id="status" class="pill">Loading…</span><span class="spacer"></span><button id="importBtn">Import</button><button id="exportBtn" class="good">Export JSON</button><input id="file" type="file" accept=".json" hidden></header>
<div class="shell"><aside><div class="tabs"><button data-mode="npc" class="active">NPCs</button><button data-mode="animal">Animals</button><button data-mode="crowd">Crowd</button></div><input id="search" type="search" placeholder="Search…"><div id="list" class="list"></div></aside><main id="editor"><div class="card muted">Loading configuration and databases…</div></main></div>
<script>
const CONFIG_URL='../../config/dialogue/ambient-dialogue.json';
const NPC_URL='../../config/npcs/hobunji-starter-npc-database.json';
const CREATURE_URL='../../config/creatures/hobunji-creature-bestiary.json';
const DEFAULT_VOCAL_PROFILE={
  chatter:{repeatsMin:2,repeatsMax:5,intervalMinMs:120,intervalMaxMs:480,volumeMin:.16,volumeMax:.26,rateMin:1.18,rateMax:1.56,earshotTiles:8,tailMs:350,initialDelayMinS:4,initialDelayMaxS:12,cooldownMinS:5,cooldownMaxS:14,textEachUtterance:false,textLines:[]},
  warning:{repeats:3,intervalMs:520,volumeMin:.94,volumeMax:.94,rateMin:.96,rateMax:1.06,earshotTiles:12,tailMs:500,textEachUtterance:false,textLines:[]},
  growl:{repeats:1,intervalMs:0,volumeMin:.76,volumeMax:.76,rateMin:.56,rateMax:.68,rateContour:[1,1.22,.92],earshotTiles:10,tailMs:1200,textEachUtterance:false,textLines:[]},
  discoveryText:{'animal-den':[],'bandit-camp':[]},
};
const VOICE_CLIPS={
  'dabinggi-hound':['../../assets/audio/sfx/sfx_dabinggi-hound1.ogg','../../assets/audio/sfx/sfx_dabinggi-hound2.ogg'],
  drenkirra:['../../assets/audio/sfx/sfx_drenkirra1.ogg','../../assets/audio/sfx/sfx_drenkirra2.ogg'],
  'gar-wolf':['../../assets/audio/sfx/sfx_gar-wolf1.ogg','../../assets/audio/sfx/sfx_gar-wolf2.ogg'],
  grehlr:['../../assets/audio/sfx/sfx_grehlr1.ogg','../../assets/audio/sfx/sfx_grehlr2.ogg'],
  nelk:['../../assets/audio/sfx/sfx_nelk1.ogg'],
  uumkaoii:["../../assets/audio/sfx/sfx_uumkao'ii1.ogg","../../assets/audio/sfx/sfx_uumkao'ii2.ogg"],
};
const state={config:null,npcs:[],animals:[],mode:'npc',selected:null,previewAudio:[],previewTimers:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const lines=s=>String(s||'').split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
const lineText=a=>(a||[]).join('\n');
const clone=v=>JSON.parse(JSON.stringify(v));
const number=(value,fallback=0)=>Number.isFinite(Number(value))?Number(value):fallback;
function normalizeConfig(config){
  config.npcGreetings||={};config.npcNicknames||={};config.npcAlcoholOffers||={default:{acceptMode:'always',acceptConditions:{},acceptLines:['Gladly.'],refuseLines:['No, thank you.']}};config.friendGroups||=[];config.companionTreasureLines||={};config.animalVocalizations||={};config.crowdLines||={cheer:[],jeer:[]};return config;
}
function ensureNpc(id){return state.config.npcGreetings[id]||(state.config.npcGreetings[id]={player:[],friends:{}})}
function ensureNicknameMap(id){return state.config.npcNicknames[id]||(state.config.npcNicknames[id]={})}
function ensureAlcoholOffer(id){const base=state.config.npcAlcoholOffers.default||{acceptMode:'always',acceptConditions:{},acceptLines:['Gladly.'],refuseLines:['No, thank you.']};return state.config.npcAlcoholOffers[id]||(state.config.npcAlcoholOffers[id]={acceptMode:base.acceptMode||'always',acceptConditions:{...(base.acceptConditions||{})},acceptLines:[...(base.acceptLines||[])],refuseLines:[...(base.refuseLines||[])]})}
function ensureAnimalOverride(id){return state.config.animalVocalizations[id]||(state.config.animalVocalizations[id]={})}
function materializeFriendGroups(){for(const group of state.config.friendGroups||[])for(const speaker of group){const cfg=ensureNpc(speaker);cfg.friends||={};for(const target of group)if(target!==speaker)cfg.friends[target]??=[]}state.config.friendGroups=[]}
function npcName(id){return state.npcs.find(n=>n.id===id)?.name||id}
function firstName(id){return String(npcName(id)).trim().split(/\s+/)[0]||'friend'}
function selectedRecord(){return state.mode==='npc'?state.npcs.find(n=>n.id===state.selected):state.animals.find(a=>a.id===state.selected)}
function mark(){ $('status').textContent='Edited · export to save'; }
function listItems(){const q=$('search').value.toLowerCase();let items=state.mode==='npc'?state.npcs:state.mode==='animal'?state.animals:[{id:'crowd',name:'Cheers & jeers'}];$('list').innerHTML=items.filter(x=>(x.name||x.label||x.id).toLowerCase().includes(q)).map(x=>`<div class="item${x.id===state.selected?' active':''}" data-id="${esc(x.id)}"><b>${esc(x.name||x.label||x.id)}</b><div class="muted">${esc(x.id)}</div></div>`).join('');$('list').querySelectorAll('.item').forEach(el=>el.onclick=()=>{stopPreview();state.selected=el.dataset.id;listItems();render()})}
function previewText(text,mode){return `<div class="card"><div class="row"><h3>Preview</h3><span class="pill">${mode==='npc'?'chathead + text':'text only'}</span></div><div class="preview">${esc(text||'Choose or enter a line')}</div></div>`}
function renderNpc(){
  const npc=selectedRecord();if(!npc)return;
  const cfg=ensureNpc(npc.id),offer=ensureAlcoholOffer(npc.id);
  const friendIds=new Set(Object.keys(cfg.friends||{}));
  for(const g of state.config.friendGroups||[])if(g.includes(npc.id))g.forEach(id=>{if(id!==npc.id)friendIds.add(id)});
  const targetOptions=['player',...friendIds].map(id=>`<option value="${esc(id)}">${id==='player'?'Player':esc(npcName(id))}</option>`).join('');
  $('editor').innerHTML=`<div class="card"><h2>${esc(npc.name)}</h2><div class="muted">Player greetings and each friend's greetings are separate pools. Placeholders: {targetName}, {weekDay}, {dayPart}. For NPC targets, {targetName} defaults to the first word of their name unless you set a directional nickname below.</div></div><div class="card"><h3>Friends this NPC may greet</h3><div class="friendGrid">${state.npcs.filter(n=>n.id!==npc.id).map(n=>`<label class="friend"><input type="checkbox" data-friend="${esc(n.id)}"${friendIds.has(n.id)?' checked':''}> ${esc(n.name)}</label>`).join('')}</div></div><div class="card"><div class="row"><h3>Greeting pool</h3><select id="target">${targetOptions}</select></div><div id="nicknameRow" class="row"><label>Nickname this NPC uses: <input id="nickname" type="text" placeholder="Optional"></label><span id="nicknameDefault" class="muted"></span></div><textarea id="lines" placeholder="One line per row"></textarea><div class="muted">One line is selected deterministically per day. NPCs do not respond to player chat messages.</div></div><div class="card"><div class="row"><h3>Offered alcohol</h3><select id="acceptMode"><option value="always">Always accept</option><option value="conditional">Accept when conditions match</option><option value="never">Always refuse</option></select></div><div class="muted">Every NPC currently defaults to Always accept. Conditional rules use the shared dialogue condition bag.</div><label>Acceptance conditions (JSON)<textarea id="acceptConditions" spellcheck="false"></textarea></label><div class="row"><label style="flex:1;min-width:220px">Accept dialogue<textarea id="acceptLines" placeholder="One line per row"></textarea></label><label style="flex:1;min-width:220px">Refuse dialogue<textarea id="refuseLines" placeholder="One line per row"></textarea></label></div><div id="conditionStatus" class="muted"></div></div>${previewText((offer.acceptLines||[])[0], 'npc')}`;
  function syncTarget(){const t=$('target').value;const isPlayer=t==='player';$('lines').value=isPlayer?lineText(cfg.player):lineText(cfg.friends?.[t]);$('nicknameRow').style.display=isPlayer?'none':'flex';if(!isPlayer){const map=ensureNicknameMap(npc.id);$('nickname').value=map[t]||'';$('nicknameDefault').textContent=`Blank = ${firstName(t)}`;$('nickname').oninput=()=>{const value=$('nickname').value.trim();if(value)map[t]=value;else delete map[t];mark();renderPreviewOnly($('lines').value,'npc',value||firstName(t))}}$('lines').oninput=()=>{if(isPlayer)cfg.player=lines($('lines').value);else{cfg.friends=cfg.friends||{};cfg.friends[t]=lines($('lines').value)}mark();renderPreviewOnly($('lines').value,'npc',isPlayer?'Player nickname':($('nickname').value.trim()||firstName(t)))};renderPreviewOnly($('lines').value,'npc',isPlayer?'Player nickname':($('nickname').value.trim()||firstName(t)))}
  $('target').onchange=syncTarget;syncTarget();$('acceptMode').value=offer.acceptMode||'always';$('acceptConditions').value=JSON.stringify(offer.acceptConditions||{},null,2);$('acceptLines').value=lineText(offer.acceptLines);$('refuseLines').value=lineText(offer.refuseLines);$('acceptMode').onchange=()=>{offer.acceptMode=$('acceptMode').value;mark()};$('acceptLines').oninput=()=>{offer.acceptLines=lines($('acceptLines').value);mark();renderPreviewOnly($('acceptLines').value,'npc')};$('refuseLines').oninput=()=>{offer.refuseLines=lines($('refuseLines').value);mark()};$('acceptConditions').oninput=()=>{try{const parsed=JSON.parse($('acceptConditions').value||'{}');if(!parsed||Array.isArray(parsed)||typeof parsed!=='object')throw new Error('Conditions must be an object');offer.acceptConditions=parsed;$('conditionStatus').textContent='Conditions valid';mark()}catch(error){$('conditionStatus').textContent='Not saved: '+error.message}};$('editor').querySelectorAll('[data-friend]').forEach(cb=>cb.onchange=()=>{cfg.friends=cfg.friends||{};if(cb.checked)cfg.friends[cb.dataset.friend]??=[];else{delete cfg.friends[cb.dataset.friend];delete ensureNicknameMap(npc.id)[cb.dataset.friend]}mark();renderNpc()});
}
function renderPreviewOnly(value,mode,targetName='Target Name'){const card=$('editor').lastElementChild;const first=lines(value)[0]||'Choose or enter a line';card.querySelector('.preview').textContent=first.replaceAll('{targetName}',targetName).replaceAll('{weekDay}','Anan').replaceAll('{dayPart}','morning')}
function mergeAnimalProfile(id){const common=state.config.animalVocalizations.default||{},own=state.config.animalVocalizations[id]||{};return{chatter:{...DEFAULT_VOCAL_PROFILE.chatter,...(common.chatter||{}),...(own.chatter||{})},warning:{...DEFAULT_VOCAL_PROFILE.warning,...(common.warning||{}),...(own.warning||{})},growl:{...DEFAULT_VOCAL_PROFILE.growl,...(common.growl||{}),...(own.growl||{})},discoveryText:{...DEFAULT_VOCAL_PROFILE.discoveryText,...(common.discoveryText||{}),...(own.discoveryText||{})}}}
function voiceKey(id){const raw=String(id||'').toLowerCase();if(raw.includes('dabinggi'))return'dabinggi-hound';if(raw.includes('drenkirra'))return'drenkirra';if(raw.includes('gar-wolf'))return'gar-wolf';if(raw.includes('grehlr'))return'grehlr';if(raw.includes('nelk'))return'nelk';if(raw.includes('uumkao'))return'uumkaoii';return raw}
function soundSummary(kind,cfg){if(kind==='chatter')return`${cfg.repeatsMin}–${cfg.repeatsMax} calls · ${cfg.intervalMinMs}–${cfg.intervalMaxMs} ms gaps · rate ${cfg.rateMin}–${cfg.rateMax}`;return`${cfg.repeats} call${cfg.repeats===1?'':'s'} · ${cfg.intervalMs} ms gaps · rate ${cfg.rateMin}–${cfg.rateMax}`}
function numField(kind,field,label,value,step='0.01',min='0'){return`<label class="field">${esc(label)}<input type="number" data-kind="${kind}" data-field="${field}" value="${esc(value)}" step="${step}" min="${min}"></label>`}
function textToggle(kind,checked){return`<label class="switch"><input type="checkbox" data-kind="${kind}" data-bool="textEachUtterance"${checked?' checked':''}> Text on every repeated utterance</label>`}
function soundCard(kind,label,cfg){
  let fields='';
  if(kind==='chatter')fields=[numField(kind,'repeatsMin','Repeats min',cfg.repeatsMin,'1','1'),numField(kind,'repeatsMax','Repeats max',cfg.repeatsMax,'1','1'),numField(kind,'intervalMinMs','Gap min (ms)',cfg.intervalMinMs,'10','0'),numField(kind,'intervalMaxMs','Gap max (ms)',cfg.intervalMaxMs,'10','0'),numField(kind,'volumeMin','Volume min',cfg.volumeMin),numField(kind,'volumeMax','Volume max',cfg.volumeMax),numField(kind,'rateMin','Pitch / tempo min',cfg.rateMin),numField(kind,'rateMax','Pitch / tempo max',cfg.rateMax),numField(kind,'earshotTiles','Earshot (tiles)',cfg.earshotTiles,'.5','1'),numField(kind,'initialDelayMinS','Initial delay min (s)',cfg.initialDelayMinS,'.5','0'),numField(kind,'initialDelayMaxS','Initial delay max (s)',cfg.initialDelayMaxS,'.5','0'),numField(kind,'cooldownMinS','Cooldown min (s)',cfg.cooldownMinS,'.5','0'),numField(kind,'cooldownMaxS','Cooldown max (s)',cfg.cooldownMaxS,'.5','0'),numField(kind,'tailMs','Sequence tail (ms)',cfg.tailMs,'10','0')].join('');
  else fields=[numField(kind,'repeats','Repeats',cfg.repeats,'1','1'),numField(kind,'intervalMs','Gap (ms)',cfg.intervalMs,'10','0'),numField(kind,'volumeMin','Volume min',cfg.volumeMin),numField(kind,'volumeMax','Volume max',cfg.volumeMax),numField(kind,'rateMin','Pitch / tempo min',cfg.rateMin),numField(kind,'rateMax','Pitch / tempo max',cfg.rateMax),numField(kind,'earshotTiles','Earshot (tiles)',cfg.earshotTiles,'.5','1'),numField(kind,'tailMs','Sequence tail (ms)',cfg.tailMs,'10','0')].join('');
  const contour=kind==='growl'?`<div class="grid"><label class="field">Contour start ×<input type="number" data-contour="0" value="${esc(cfg.rateContour?.[0]??1)}" step=".01"></label><label class="field">Contour middle ×<input type="number" data-contour="1" value="${esc(cfg.rateContour?.[1]??1.22)}" step=".01"></label><label class="field">Contour end ×<input type="number" data-contour="2" value="${esc(cfg.rateContour?.[2]??.92)}" step=".01"></label></div>`:'';
  return`<div class="card soundCard"><div class="sectionHead"><h3>${label}</h3><button class="subtle" data-preview-sound="${kind}">▶ Preview sound</button><span class="pill soundSummary" data-summary="${kind}">${esc(soundSummary(kind,cfg))}</span></div><div class="grid">${fields}</div>${contour}<div class="row" style="margin-top:9px">${textToggle(kind,cfg.textEachUtterance===true)}${numField(kind,'textDurationMs','Text duration (ms)',cfg.textDurationMs??1600,'100','500')}</div><label class="field" style="margin-top:9px">Overhead text for ${label.toLowerCase()}<textarea class="compactText" data-text-kind="${kind}" placeholder="Optional · one line per row">${esc(lineText(cfg.textLines))}</textarea></label></div>`;
}
function renderAnimal(){
  const a=selectedRecord();if(!a)return;const cfg=mergeAnimalProfile(a.id),treasure=state.config.companionTreasureLines[a.id]||[],clips=VOICE_CLIPS[voiceKey(a.id)]||[];
  $('editor').innerHTML=`<div class="card"><div class="row"><h2>${esc(a.label||a.id)}</h2><span class="pill">${esc(a.id)}</span><button id="copyDefaults" class="subtle">Copy global defaults into species</button><button id="clearOverrides" class="subtle">Clear species overrides</button></div><div class="muted">This expands the existing animal treasure-text editor into the per-species vocalization author. These values drive the same chatter / warning / growl scheduler used in-game: rhythm, loudness, pitch/tempo, earshot, and optional overhead text. Empty fields inherit the runtime defaults.</div><div class="clipList" style="margin-top:8px">Recorded voice pool: ${clips.length?clips.map(x=>esc(x.split('/').pop())).join(' · '):'<span class="warn">No recorded dynamic voice pool for this species yet.</span>'}</div></div><div class="card"><h3>Discovery announcements</h3><div class="muted">Treasure uses the existing <code>companionTreasureLines</code> variable and keeps its current one-popup behavior. Animal-den and bandit-camp lines are new reason-specific warning text, synchronized to the warning sound starting.</div><div class="grid" style="margin-top:9px"><label class="field">Buried treasure<textarea class="compactText" id="treasureLines" placeholder="One line per row">${esc(lineText(treasure))}</textarea></label><label class="field">Animal den<textarea class="compactText" data-discovery="animal-den" placeholder="Optional · one line per row">${esc(lineText(cfg.discoveryText['animal-den']))}</textarea></label><label class="field">Bandit camp<textarea class="compactText" data-discovery="bandit-camp" placeholder="Optional · one line per row">${esc(lineText(cfg.discoveryText['bandit-camp']))}</textarea></label></div></div>${soundCard('chatter','Passive chatter',cfg.chatter)}${soundCard('warning','Warning / discovery call',cfg.warning)}${soundCard('growl','Threat growl',cfg.growl)}${previewText(treasure[0],'animal')}`;
  $('treasureLines').oninput=()=>{state.config.companionTreasureLines[a.id]=lines($('treasureLines').value);mark();renderPreviewOnly($('treasureLines').value,'animal')};
  $('copyDefaults').onclick=()=>{state.config.animalVocalizations[a.id]=clone(DEFAULT_VOCAL_PROFILE);mark();renderAnimal()};
  $('clearOverrides').onclick=()=>{delete state.config.animalVocalizations[a.id];mark();renderAnimal()};
  $('editor').querySelectorAll('[data-kind][data-field]').forEach(input=>input.oninput=()=>{const own=ensureAnimalOverride(a.id);own[input.dataset.kind]||={};own[input.dataset.kind][input.dataset.field]=number(input.value,0);mark();refreshSoundSummary(a.id,input.dataset.kind)});
  $('editor').querySelectorAll('[data-kind][data-bool]').forEach(input=>input.onchange=()=>{const own=ensureAnimalOverride(a.id);own[input.dataset.kind]||={};own[input.dataset.kind][input.dataset.bool]=input.checked;mark()});
  $('editor').querySelectorAll('[data-text-kind]').forEach(input=>input.oninput=()=>{const own=ensureAnimalOverride(a.id);own[input.dataset.textKind]||={};own[input.dataset.textKind].textLines=lines(input.value);mark()});
  $('editor').querySelectorAll('[data-discovery]').forEach(input=>input.oninput=()=>{const own=ensureAnimalOverride(a.id);own.discoveryText||={};own.discoveryText[input.dataset.discovery]=lines(input.value);mark()});
  $('editor').querySelectorAll('[data-contour]').forEach(input=>input.oninput=()=>{const own=ensureAnimalOverride(a.id);own.growl||={};const effective=mergeAnimalProfile(a.id).growl;const contour=Array.isArray(own.growl.rateContour)?[...own.growl.rateContour]:[...(effective.rateContour||[1,1.22,.92])];contour[Number(input.dataset.contour)]=number(input.value,1);own.growl.rateContour=contour;mark()});
  $('editor').querySelectorAll('[data-preview-sound]').forEach(button=>{button.disabled=!clips.length;button.onclick=()=>previewAnimalSound(a.id,button.dataset.previewSound)});
}
function refreshSoundSummary(id,kind){const el=$('editor').querySelector(`[data-summary="${kind}"]`);if(el)el.textContent=soundSummary(kind,mergeAnimalProfile(id)[kind])}
function stopPreview(){for(const timer of state.previewTimers)clearTimeout(timer);for(const audio of state.previewAudio){try{audio.pause();audio.currentTime=0}catch(_){}}state.previewTimers=[];state.previewAudio=[]}
function rand(min,max){const lo=Math.min(number(min),number(max)),hi=Math.max(number(min),number(max));return lo+Math.random()*(hi-lo)}
function previewAnimalSound(id,kind){stopPreview();const pool=VOICE_CLIPS[voiceKey(id)]||[];if(!pool.length){$('status').textContent='No recorded voice pool for this species';return}const cfg=mergeAnimalProfile(id)[kind];const repeats=kind==='chatter'?Math.max(1,Math.round(rand(cfg.repeatsMin,cfg.repeatsMax))):Math.max(1,Math.round(cfg.repeats));let elapsed=0;for(let i=0;i<repeats;i++){if(i){elapsed+=kind==='chatter'?rand(cfg.intervalMinMs,cfg.intervalMaxMs):number(cfg.intervalMs)}const timer=setTimeout(()=>{const url=pool[Math.floor(Math.random()*pool.length)],audio=new Audio(url);state.previewAudio.push(audio);try{audio.preservesPitch=false}catch(_){}audio.volume=Math.max(0,Math.min(1,rand(cfg.volumeMin,cfg.volumeMax)));const baseRate=Math.max(.1,rand(cfg.rateMin,cfg.rateMax));audio.playbackRate=baseRate;if(kind==='growl'&&Array.isArray(cfg.rateContour)&&cfg.rateContour.length){const contour=cfg.rateContour.map(x=>baseRate*number(x,1)),segment=Math.max(55,650/contour.length);audio.playbackRate=contour[0];contour.slice(1).forEach((rate,index)=>state.previewTimers.push(setTimeout(()=>{if(!audio.ended&&!audio.paused)audio.playbackRate=Math.max(.1,rate)},segment*(index+1))))}audio.play().catch(()=>{$('status').textContent='Tap Preview again if browser audio was locked'})},elapsed);state.previewTimers.push(timer)}$('status').textContent=`Previewing ${kind} for ${id}`}
function renderCrowd(){const cheer=state.config.crowdLines.cheer||[],jeer=state.config.crowdLines.jeer||[];$('editor').innerHTML=`<div class="card"><h2>Audience reactions</h2><div class="muted">Reusable non-chathead pools for music, dancing, and later performances.</div></div><div class="card"><h3>Cheers</h3><textarea id="cheers">${esc(lineText(cheer))}</textarea><h3>Jeers</h3><textarea id="jeers">${esc(lineText(jeer))}</textarea></div>${previewText(cheer[0],'crowd')}`;for(const [id,key] of [['cheers','cheer'],['jeers','jeer']])$(id).oninput=()=>{state.config.crowdLines[key]=lines($(id).value);mark();renderPreviewOnly($(id).value,'crowd')}}
function render(){stopPreview();if(state.mode==='npc')renderNpc();else if(state.mode==='animal')renderAnimal();else renderCrowd()}
async function load(){const[c,n,a]=await Promise.all([fetch(CONFIG_URL).then(r=>r.json()),fetch(NPC_URL).then(r=>r.json()),fetch(CREATURE_URL).then(r=>r.json())]);state.config=normalizeConfig(c);state.npcs=n.npcs||[];state.animals=(a.creatures||[]).filter(x=>!/-mother$|-alpha$/.test(x.id));materializeFriendGroups();state.selected=state.npcs[0]?.id;$('status').textContent='Repository data loaded';listItems();render()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));state.selected=state.mode==='npc'?state.npcs[0]?.id:state.mode==='animal'?state.animals[0]?.id:'crowd';listItems();render()});$('search').oninput=listItems;
$('exportBtn').onclick=()=>{stopPreview();const blob=new Blob([JSON.stringify(state.config,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ambient-dialogue.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='Exported ambient-dialogue.json'};
$('importBtn').onclick=()=>$('file').click();$('file').onchange=async()=>{try{state.config=normalizeConfig(JSON.parse(await $('file').files[0].text()));materializeFriendGroups();listItems();render();$('status').textContent='Imported JSON'}catch(e){$('status').textContent='Import failed: '+e.message}};
load().catch(e=>$('editor').innerHTML=`<div class="card">Load failed: ${esc(e.message)}</div>`);
</script>
