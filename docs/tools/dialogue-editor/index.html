<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobunji Dialogue Editor</title>
<style>
:root{
  --bg:#07101a;--panel:#111b28;--panel2:#0c141e;--text:#edf4ff;--muted:#9fb2cc;
  --line:#26384f;--acc:#6aa7ff;--good:#34d399;--warn:#fbbf24;--bad:#fb7185;--seq:#2dd4bf;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}
button{border:1px solid rgba(106,167,255,.38);background:rgba(106,167,255,.16);color:var(--text);
  border-radius:11px;padding:7px 11px;font-weight:750;cursor:pointer}
button.secondary{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)}
button.good{border-color:rgba(52,211,153,.42);background:rgba(52,211,153,.14)}
button.warn{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.14);color:var(--warn)}
button.danger{border-color:rgba(251,113,133,.42);background:rgba(251,113,133,.14);color:var(--bad)}
button:disabled{opacity:.35;cursor:not-allowed}
input,select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:9px;color:var(--text);padding:6px 9px;outline:none;width:100%}
textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:9px;color:var(--text);padding:7px 10px;outline:none;width:100%;
  resize:vertical;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
label{display:block;color:var(--muted);font-size:11px;margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.3px}

#app{height:100%;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-shrink:0;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),var(--panel2))}
#topbar h1{margin:0;font-size:14px;color:var(--acc);letter-spacing:.5px;white-space:nowrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.045);border-radius:999px;padding:3px 9px;
  color:var(--muted);font-size:11px}
#workspace{flex:1;min-height:0;display:flex}

#npcSidebar{width:240px;min-width:190px;display:flex;flex-direction:column;flex-shrink:0;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),var(--panel2))}
.paneHead{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;
  font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.6px}
#condFilters{padding:8px 9px 6px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;
  display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto}

/* Condition picker: appendable chip list + add popover (sidebar filters,
   tree require/no-fly conditions all reuse this) */
.condChipList{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.condChip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:3px 5px 3px 8px;
  border-radius:999px;border:1px solid rgba(106,167,255,.4);background:rgba(106,167,255,.14);
  color:var(--text);white-space:nowrap}
.condChip.exclude{border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.12)}
.condChipX{width:14px;height:14px;padding:0;border:none;background:transparent;color:var(--muted);
  font-size:11px;line-height:1;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}
.condChipX:hover{background:rgba(255,255,255,.12);color:var(--text)}
.condAddBtn{font-size:10px;padding:3px 8px}
.condPopover{margin-top:6px;padding:8px;border-radius:9px;border:1px solid rgba(255,255,255,.13);
  background:rgba(0,0,0,.22);display:flex;flex-direction:column;gap:6px}
.condPopover.hidden{display:none}
.condPopover select{font-size:11px;padding:5px 7px}
.condPopVal.hidden{display:none}
.condPopRel{display:flex;align-items:center;gap:5px}
.condPopRel.hidden{display:none}
.condPopRel input{font-size:11px;padding:5px 7px}
.condPopRel span{font-size:10px;color:var(--muted);flex-shrink:0}
.condPopBtns{display:flex;gap:5px}
.condPopBtns button{flex:1;font-size:10px;padding:5px 0}
#npcSearch{padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
#npcSearch input{font-size:12px;padding:5px 8px}
#npcListEl{flex:1;overflow-y:auto;padding:5px}
.npcItem{padding:6px 8px;border-radius:8px;cursor:pointer;margin-bottom:3px;
  border:1px solid transparent}
.npcItem:hover{background:rgba(255,255,255,.05)}
.npcItem.sel{border-color:var(--acc);background:rgba(106,167,255,.1)}
.npcRow{display:flex;align-items:center;gap:7px}
.npcAvatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#07101a;
  transition:filter .15s,opacity .15s}
.npcNameWrap{flex:1;min-width:0}
.npcName{font-size:12px;font-weight:750;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npcMeta{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npcBadge{font-size:9px;background:rgba(106,167,255,.2);
  border:1px solid rgba(106,167,255,.3);border-radius:999px;padding:2px 6px;
  color:var(--acc);flex-shrink:0}
.npcItem.covPartial .npcAvatar{filter:grayscale(.5);opacity:.6}
.npcItem.covPartial .npcName{color:var(--muted)}
.npcItem.covPartial .npcBadge{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.3);color:var(--warn)}
.npcItem.covNone .npcAvatar{filter:grayscale(1);opacity:.28}
.npcItem.covNone .npcName{color:var(--muted);opacity:.55}
.npcItem.covNone .npcMeta{opacity:.55}
.npcItem.covNone .npcBadge{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);color:var(--muted)}

#centerPanel{flex:1;min-width:0;display:flex;flex-direction:column}
#treeBar{display:flex;align-items:flex-start;gap:6px;padding:6px 8px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.015);min-height:44px}
#treeTabsCol{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.treeTabs{display:flex;gap:5px;flex:1;overflow-x:auto;min-width:0}
.treeTab{padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;
  border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);
  white-space:nowrap;flex-shrink:0}
.treeTab.sel{border-color:var(--warn);background:rgba(251,191,36,.12);color:var(--warn)}
.treeTab:hover:not(.sel){background:rgba(255,255,255,.08)}
.treeTab.extra{border-style:dashed;opacity:.88}
.treeTab .tabCond{display:block;font-size:8px;font-weight:600;color:var(--muted);
  margin-top:1px;text-transform:none;letter-spacing:0}
#extraTabsWrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#extraTabsWrap.hidden{display:none}
.extraTabsLabel{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);flex-shrink:0}
.extraTabs{display:flex;gap:5px;flex-wrap:wrap;min-width:0}

#canvasOuter{flex:1;min-height:0;position:relative;overflow:hidden;background-color:#07101a;touch-action:none}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#svgLayer{position:absolute;top:0;left:0;width:9000px;height:9000px;
  pointer-events:none;overflow:visible}
#emptyState{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:var(--muted);
  pointer-events:none;user-select:none}
#emptyState.hidden{display:none}
#emptyIcon{font-size:36px;opacity:.2;line-height:1}
#emptyMsg{font-size:13px;margin:0;text-align:center;max-width:240px;line-height:1.4}
#canvasBar{display:flex;align-items:center;gap:5px;padding:5px 8px;flex-shrink:0;
  border-top:1px solid var(--line);background:rgba(255,255,255,.015)}
#zoomLabel{font-size:10px;color:var(--muted);min-width:34px;text-align:right}
.barSep{width:1px;height:16px;background:var(--line);margin:0 2px;flex-shrink:0}

/* Nodes */
.node{position:absolute;min-width:220px;max-width:300px;border-radius:11px;
  border:1px solid rgba(255,255,255,.15);background:var(--panel);
  box-shadow:0 4px 16px rgba(0,0,0,.5);user-select:none;cursor:grab;overflow:visible}
.node:active{cursor:grabbing}
.node.sel{border-color:var(--acc);z-index:10;
  box-shadow:0 0 0 2px rgba(106,167,255,.22),0 4px 16px rgba(0,0,0,.5)}
.nodeHead{display:flex;align-items:center;gap:5px;padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,.07);border-radius:10px 10px 0 0}
.nodeBadge{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;flex-shrink:0}
.node-text     .nodeBadge{background:rgba(106,167,255,.2);color:var(--acc)}
.node-choice   .nodeBadge{background:rgba(251,191,36,.2);color:var(--warn)}
.node-end      .nodeBadge{background:rgba(251,113,133,.18);color:var(--bad)}
.node-sequence .nodeBadge{background:rgba(45,212,191,.2);color:var(--seq)}
.nodeEntryTag{font-size:9px;padding:2px 5px;border-radius:4px;
  background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.35);color:var(--good)}
.nodeId{font-size:9px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nodeX{width:18px;height:18px;padding:0;border-radius:5px;font-size:11px;
  border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.1);color:var(--bad);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.nodeBody{padding:6px 8px}
.nodeText{font-size:11px;color:var(--text);line-height:1.4;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nodeText.empty{color:var(--muted);font-style:italic}
.nodeEndLine{font-size:11px;color:var(--bad);font-style:italic}
.nodeMeta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.nodeMetaTag{font-size:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:3px;padding:1px 5px;color:var(--muted)}
.choiceRows{list-style:none;margin:0;padding:0}
.choiceRow{display:flex;align-items:center;gap:6px;padding:3px 0;
  border-bottom:1px solid rgba(255,255,255,.055);min-height:24px}
.choiceRow:last-child{border-bottom:none}
.choiceLabel{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.choiceLabel.empty{color:var(--muted);font-style:italic}
.choiceTarget{font-size:9px;color:var(--muted);background:rgba(255,255,255,.05);
  border-radius:3px;padding:1px 5px;white-space:nowrap;flex-shrink:0}
.seqSlotBadge{font-size:10px;color:var(--muted);margin-bottom:3px}
.seqSlotList{list-style:none;margin:0;padding:0}
.seqSlotItem{display:flex;align-items:center;gap:4px;padding:2px 0;
  border-bottom:1px solid rgba(255,255,255,.05)}
.seqSlotItem:last-child{border-bottom:none}
.seqSlotNum{font-size:9px;color:var(--muted);min-width:14px;flex-shrink:0}
.seqSlotRef{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);flex:1}
.seqSlotRef.empty{color:var(--muted);font-style:italic}
.seqSlotDepth{font-size:9px;color:var(--seq);background:rgba(45,212,191,.1);
  border:1px solid rgba(45,212,191,.2);border-radius:3px;padding:1px 4px;flex-shrink:0}
.seqPortHint{font-size:9px;color:var(--muted);margin-top:5px;display:flex;gap:8px}

/* Ports */
.port{width:11px;height:11px;border-radius:50%;border:2px solid;
  position:absolute;cursor:crosshair;z-index:10;transition:transform .12s,background .12s}
.port:hover{transform:scale(1.55)!important}
.port-in{left:-6px;border-color:rgba(159,178,204,.5);background:var(--panel2)}
.port-in:hover{background:var(--muted)}
.port-out{right:-6px;border-color:rgba(106,167,255,.65);background:var(--panel2)}
.port-out:hover{background:var(--acc)}
.port-out.choice-port{border-color:rgba(251,191,36,.65)}
.port-out.choice-port:hover{background:var(--warn)}
.port-out.exhaust-port{border-color:rgba(52,211,153,.65)}
.port-out.exhaust-port:hover{background:var(--good)}
/* text node ports: vertically centered */
.node-text .port-in{top:50%;transform:translateY(-50%)}
.node-text .port-in:hover{transform:translateY(-50%) scale(1.55)}
.node-text .port-out{top:50%;transform:translateY(-50%)}
.node-text .port-out:hover{transform:translateY(-50%) scale(1.55)}
/* choice/end input near header */
.node-choice .port-in,.node-end .port-in{top:16px;transform:none}
/* sequence: input centered, next at top-right, exhaust at bottom-right */
.node-sequence .port-in{top:50%;transform:translateY(-50%)}
.node-sequence .port-in:hover{transform:translateY(-50%) scale(1.55)}
.node-sequence .port-out[data-ci=""]{top:18px;transform:none}
.node-sequence .port-out[data-ci=""]:hover{transform:scale(1.55)}
.node-sequence .port-out[data-ci="exhaust"]{bottom:14px;top:auto;transform:none}
.node-sequence .port-out[data-ci="exhaust"]:hover{transform:scale(1.55)}

/* Inspector */
#inspToggle{width:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:rgba(255,255,255,.03);border-left:1px solid var(--line);
  color:var(--muted);font-size:11px;user-select:none;transition:background .12s,color .12s}
#inspToggle:hover{background:rgba(106,167,255,.14);color:var(--acc)}
#inspector{width:260px;min-width:210px;flex-shrink:0;display:flex;flex-direction:column;
  overflow:hidden;transition:width .16s ease,min-width .16s ease;
  background:linear-gradient(180deg,var(--panel),var(--panel2))}
#inspector.collapsed{width:0;min-width:0;border-left:none}
#inspBody{flex:1;overflow-y:auto;padding:8px}
.iGroup{margin-bottom:10px}
.iMuted{font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px}
.iMuted code{background:rgba(255,255,255,.09);border-radius:3px;padding:0 3px;
  font-family:ui-monospace,Menlo,monospace;font-size:10px}
.ceWrap{border:1px solid rgba(255,255,255,.09);border-radius:8px;overflow:hidden}
.ceItem{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07)}
.ceItem:last-child{border-bottom:none}
.ceRow{display:flex;align-items:center;gap:5px;margin-top:4px}
.ceRowLabel{font-size:10px;color:var(--muted);min-width:34px;flex-shrink:0}
.ceX{width:20px;height:20px;padding:0;border-radius:5px;font-size:12px;
  border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.1);color:var(--bad);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.tierDel{width:20px;height:20px;padding:0;border-radius:5px;font-size:12px;
  border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.1);color:var(--bad);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
hr.idiv{border:none;border-top:1px solid var(--line);margin:10px 0}
.tagRow{display:flex;align-items:center;gap:5px;padding:5px 8px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.tagRow:last-child{border-bottom:none}
.tagBadge{font-size:9px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;background:rgba(159,178,204,.12);color:var(--muted);flex-shrink:0}
.tagX{width:18px;height:18px;padding:0;border-radius:4px;font-size:11px;
  border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.1);color:var(--bad);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}

/* Action chips in choice inspector */
.actChip{display:flex;align-items:center;gap:3px;margin-bottom:3px}
.actLabel{font-size:9px;color:var(--seq);background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.25);
  border-radius:3px;padding:1px 5px;flex-shrink:0;white-space:nowrap}
.actDelBtn{width:14px;height:14px;padding:0;border-radius:3px;font-size:9px;line-height:1;
  border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.1);color:var(--bad);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Import modal */
#importModal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;
  display:flex;align-items:center;justify-content:center}
#importModal.hidden{display:none}
#importBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px;width:min(480px,93vw);max-height:90vh;
  display:flex;flex-direction:column;gap:10px;overflow:auto}
#importBox h2{margin:0;font-size:14px}
#importPaste{min-height:160px;max-height:36vh;resize:vertical}
.mrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>Hobunji Dialogue Editor</h1>
    <button class="secondary" id="loadBtn">Load DB</button>
    <button class="good" id="exportBtn" disabled>Export DB</button>
    <div class="spacer"></div>
    <span class="pill" id="statusPill">No database loaded</span>
  </div>
  <div id="workspace">
    <div id="npcSidebar">
      <div class="paneHead">Conditions</div>
      <div id="condFilters">
        <div id="filterPicker"></div>
        <button class="secondary" id="clearFiltersBtn" style="width:100%;font-size:10px">Clear filters</button>
      </div>
      <div class="paneHead">NPCs</div>
      <div id="npcSearch"><input id="npcQ" type="search" placeholder="Search…"></div>
      <div id="npcListEl"></div>
    </div>
    <div id="centerPanel">
      <div id="treeBar">
        <div id="treeTabsCol">
          <div class="treeTabs" id="treeTabs"></div>
          <div id="extraTabsWrap" class="hidden">
            <span class="extraTabsLabel">Also available:</span>
            <div class="extraTabs" id="extraTreeTabs"></div>
          </div>
        </div>
        <button id="addTreeBtn" disabled style="flex-shrink:0;font-size:11px">+ Tree</button>
      </div>
      <div id="canvasOuter">
        <div id="emptyState">
          <div id="emptyIcon">💬</div>
          <p id="emptyMsg">Select an NPC to begin</p>
        </div>
        <div id="canvas">
          <svg id="svgLayer" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="nodesLayer"></div>
        </div>
      </div>
      <div id="canvasBar">
        <button id="btnText"   disabled style="font-size:11px">+ Text</button>
        <button id="btnChoice" disabled style="font-size:11px">+ Choice</button>
        <button id="btnEnd"    disabled style="font-size:11px">+ End</button>
        <button id="btnSeq"    disabled style="font-size:11px;border-color:rgba(45,212,191,.4);background:rgba(45,212,191,.1);color:var(--seq)">+ Sequence</button>
        <div class="barSep"></div>
        <button class="danger" id="btnDel"   disabled style="font-size:11px">Delete Node</button>
        <button class="warn"   id="btnEntry" disabled style="font-size:11px">Set Entry</button>
        <div class="spacer"></div>
        <button class="secondary" id="btnOrg"   disabled style="font-size:11px">↻ Organize</button>
        <button class="secondary" id="btnReset" style="font-size:11px">↺ View</button>
        <span id="zoomLabel">100%</span>
      </div>
    </div>
    <div id="inspToggle" title="Collapse/expand inspector">◂</div>
    <div id="inspector">
      <div class="paneHead">Inspector</div>
      <div id="inspBody">
        <p style="color:var(--muted);font-size:12px;margin:0;padding:4px 0">Select a node to inspect it.</p>
      </div>
    </div>
  </div>
</div>

<div id="importModal" class="hidden">
  <div id="importBox">
    <h2>Load NPC Database</h2>
    <p style="margin:0;font-size:12px;color:var(--muted)">Open a <code>.json</code> database file, or paste JSON below.</p>
    <div class="mrow">
      <button class="good" id="fileBtn">Open file…</button>
      <input type="file" id="fileInput" accept=".json" style="display:none">
      <span style="color:var(--muted);font-size:11px">— or paste —</span>
    </div>
    <textarea id="importPaste" placeholder='{"schema":"hobunji_npc_database.v2","npcs":[...]}'></textarea>
    <div class="mrow">
      <button class="good" id="importOk">Load</button>
      <button class="secondary" id="importCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
'use strict';
let db        = null;
let sel       = { npcId: null, treeId: null, nodeId: null };
let cam       = { panX: 60, panY: 60, zoom: 1 };
let dragState = null;
let connState = null;
let panState  = null;
let _seq      = 1;

let filters = {
  weekdays: [], seasons: [], weather: [], timesOfDay: [], encounter: [],
  relationship: { min: null, max: null }
};

const GRID = 20;
const snap = v => Math.round(v / GRID) * GRID;

const $        = id => document.getElementById(id);
const getNpc   = ()  => db?.npcs?.find(n => n.id === sel.npcId) ?? null;
const getTree  = ()  => getNpc()?.dialogueTrees?.find(t => t.id === sel.treeId) ?? null;
const getNode  = (id = sel.nodeId) => getTree()?.nodes?.find(n => n.id === id) ?? null;
const genId    = p   => `${p}${Date.now().toString(36)}${(_seq++).toString(36)}`;
const esc      = s   => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const trunc    = (s,n) => s.length > n ? s.slice(0,n) + '…' : s;
const deepCopy = v   => JSON.parse(JSON.stringify(v));
const setDirty = ()  => { $('exportBtn').disabled = false; };

const EXPRESSIONS   = ['neutral','smile','frown','laugh','yap'];
const REVEAL_SPEEDS = ['normal','slow','fast','instant'];

const WEEKDAYS     = ['Anan','Hronu','Kruru','Muunu','Naru','Tothu','Uung'];
const SEASONS      = ['Stormtide','Deadgrass','Longpour','Coldmuck'];
const WEATHERS     = ['clear','rain','storm'];
const TIMES_OF_DAY = ['dawn','day','dusk','night'];
const ENCOUNTERS   = ['first','returning'];
const CONDITION_AXES = ['weekdays','seasons','weather','timesOfDay','encounter'];
const CONDITION_CATEGORIES = [
  { key: 'weekdays',     label: 'Weekday',      values: WEEKDAYS },
  { key: 'seasons',      label: 'Season',       values: SEASONS },
  { key: 'weather',      label: 'Weather',      values: WEATHERS },
  { key: 'timesOfDay',   label: 'Time of day',  values: TIMES_OF_DAY },
  { key: 'encounter',    label: 'Encounter',    values: ENCOUNTERS },
  { key: 'relationship', label: 'Relationship', values: null },
];
const emptyConditions = () => ({
  weekdays: [], seasons: [], weather: [], timesOfDay: [], encounter: [],
  relationship: { min: null, max: null }
});

/* ── Database I/O ─────────────────────────────────────────── */
function loadDatabase(json) {
  try {
    const parsed = typeof json === 'string' ? JSON.parse(json) : json;
    if (!Array.isArray(parsed.npcs)) throw new Error('Expected .npcs array');
    for (const npc of parsed.npcs) {
      if (!Array.isArray(npc.dialogueTrees)) npc.dialogueTrees = [];
      for (const tree of npc.dialogueTrees) {
        if (!Array.isArray(tree.nodes)) tree.nodes = [];
        tree.nodes.forEach((nd, i) => {
          nd.pos ??= { x: 60 + i * 260, y: 80 };
          nd.pos.x = snap(nd.pos.x); nd.pos.y = snap(nd.pos.y);
        });
        const normalizeConditions = (c) => ({
          weekdays:   Array.isArray(c.weekdays)   ? c.weekdays   : [],
          seasons:    Array.isArray(c.seasons)    ? c.seasons    : [],
          weather:    Array.isArray(c.weather)    ? c.weather    : [],
          timesOfDay: Array.isArray(c.timesOfDay) ? c.timesOfDay : [],
          encounter:  Array.isArray(c.encounter)  ? c.encounter  : [],
          relationship: {
            min: c.relationship?.min ?? null,
            max: c.relationship?.max ?? null
          }
        });
        tree.conditions        = normalizeConditions(tree.conditions || {});
        tree.excludeConditions = normalizeConditions(tree.excludeConditions || {});
      }
    }
    db  = parsed;
    sel = { npcId: null, treeId: null, nodeId: null };
    $('exportBtn').disabled = false;
    $('statusPill').textContent = `${db.npcs.length} NPC${db.npcs.length !== 1 ? 's' : ''} loaded`;
    renderAll();
    if (db.npcs.length) selectNpc(db.npcs[0].id);
    return true;
  } catch (e) {
    alert('Failed to load database: ' + e.message);
    return false;
  }
}

function exportDatabase() {
  const blob = new Blob([JSON.stringify(deepCopy(db), null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), { href: url, download: 'hobunji-starter-npc-database.json' }).click();
  URL.revokeObjectURL(url);
}

/* ── Selection ───────────────────────────────────────────── */
function selectNpc(id) {
  sel.npcId = id; sel.treeId = null; sel.nodeId = null;
  const npc = getNpc();
  if (npc?.dialogueTrees?.length) {
    const classified = npc.dialogueTrees.map(t => ({ id: t.id, level: classifyTree(t).level }));
    const best = classified.find(c => c.level === 'full') || classified.find(c => c.level === 'partial');
    sel.treeId = best ? best.id : null;
  }
  cam = { panX: 60, panY: 60, zoom: 1 };
  $('addTreeBtn').disabled = false;
  renderNpcList(); renderTreeBar(); renderCanvas(); renderInspector(); updateBar();
}

function selectTree(id) {
  sel.treeId = id; sel.nodeId = null;
  cam = { panX: 60, panY: 60, zoom: 1 };
  renderTreeBar(); renderCanvas(); renderInspector(); updateBar();
}

function selectNode(id) {
  sel.nodeId = id;
  document.querySelectorAll('.node').forEach(el => el.classList.toggle('sel', el.dataset.nid === id));
  renderInspector();
  $('btnDel').disabled   = !id;
  $('btnEntry').disabled = !id;
}

/* ── Tree actions ────────────────────────────────────────── */
function addTree() {
  const npc = getNpc(); if (!npc) return;
  const id  = genId('tree_');
  const conditions = emptyConditions();
  conditions.weekdays   = [...filters.weekdays];
  conditions.seasons    = [...filters.seasons];
  conditions.weather    = [...filters.weather];
  conditions.timesOfDay = [...filters.timesOfDay];
  conditions.encounter  = [...filters.encounter];
  conditions.relationship = { min: filters.relationship.min, max: filters.relationship.max };
  npc.dialogueTrees.push({ id, label: `Tree ${npc.dialogueTrees.length + 1}`,
    trigger: 'interact', priority: 0, entryNode: null, nodes: [],
    conditions, excludeConditions: emptyConditions() });
  sel.treeId = id; sel.nodeId = null;
  cam = { panX: 60, panY: 60, zoom: 1 };
  setDirty(); renderTreeBar(); renderCanvas(); renderInspector(); updateBar();
}

function deleteTree(id) {
  const npc = getNpc();
  if (!npc || !confirm('Delete this dialogue tree?')) return;
  npc.dialogueTrees = npc.dialogueTrees.filter(t => t.id !== id);
  if (sel.treeId === id) { sel.treeId = npc.dialogueTrees[0]?.id ?? null; sel.nodeId = null; }
  setDirty(); renderNpcList(); renderTreeBar(); renderCanvas(); renderInspector();
}

/* ── Node actions ────────────────────────────────────────── */
function addNode(type) {
  const tree = getTree(); if (!tree) return;
  const id   = genId('n_');
  const w = $('canvasOuter').clientWidth  || 800;
  const h = $('canvasOuter').clientHeight || 600;
  const idx = tree.nodes.length;
  const cx  = snap(Math.round((w/2 - cam.panX) / cam.zoom) - 320 + (idx % 3) * 260);
  const cy  = snap(Math.round((h/2 - cam.panY) / cam.zoom) - 40  + Math.floor(idx/3) * 200);
  const nd  = { id, type, pos: { x: cx, y: cy } };
  if (type === 'text')     { nd.text = ''; nd.next = null; nd.expression = 'neutral'; nd.expressionHold = 2; nd.revealSpeed = 'normal'; }
  if (type === 'choice')   { nd.choices = [{ label: '', next: null }]; }
  if (type === 'sequence') { nd.slots = []; nd.next = null; nd.exhaustedNext = null; }
  tree.nodes.push(nd);
  if (!tree.entryNode) tree.entryNode = id;
  setDirty(); renderCanvas(); selectNode(id);
}

function deleteNode(id) {
  const tree = getTree(); if (!tree) return;
  tree.nodes = tree.nodes.filter(n => n.id !== id);
  for (const n of tree.nodes) {
    if (n.next === id)          n.next = null;
    if (n.exhaustedNext === id) n.exhaustedNext = null;
    n.choices?.forEach(c => { if (c.next === id) c.next = null; });
    if (n.slots) n.slots = n.slots.filter(s => s.nodeId !== id);
    if (n.tags) n.tags = n.tags.filter(t => !(t.type === 'break_sequence' && t.sequenceNodeId === id));
  }
  if (tree.entryNode === id) tree.entryNode = tree.nodes[0]?.id ?? null;
  if (sel.nodeId === id) sel.nodeId = null;
  setDirty(); renderCanvas(); renderInspector();
  $('btnDel').disabled = true; $('btnEntry').disabled = true;
}

function setEntryNode(id) {
  const tree = getTree(); if (!tree) return;
  tree.entryNode = id; setDirty(); renderCanvas(); renderInspector();
}

function connectNodes(fromId, ci, toId) {
  const tree = getTree(); if (!tree) return;
  const nd   = tree.nodes.find(n => n.id === fromId); if (!nd) return;
  if      (ci === 'exhaust') { nd.exhaustedNext = toId; }
  else if (ci != null)       { if (nd.choices?.[ci]) nd.choices[ci].next = toId; }
  else                       { nd.next = toId; }
  setDirty(); renderSvg();
  if (sel.nodeId === fromId) renderInspector();
}

/* ── Condition filtering ─────────────────────────────────── */
function axisSelected(axis)       { return filters[axis].length > 0; }
function relationshipSelected()   { return filters.relationship.min != null || filters.relationship.max != null; }

function selectedAxesList() {
  const axes = CONDITION_AXES.filter(axisSelected);
  if (relationshipSelected()) axes.push('relationship');
  return axes;
}

function treeConditionedAxes(tree) {
  const c = tree.conditions || {};
  const axes = CONDITION_AXES.filter(a => (c[a]||[]).length > 0);
  const rel = c.relationship;
  if (rel && (rel.min != null || rel.max != null)) axes.push('relationship');
  return axes;
}

function axisCompatible(tree, axis) {
  const c = tree.conditions || {};
  if (axis === 'relationship') {
    const rel = c.relationship;
    const filt = filters.relationship;
    const relSet  = rel  && (rel.min  != null || rel.max  != null);
    const filtSet = filt && (filt.min != null || filt.max != null);
    if (!relSet || !filtSet) return true; // wildcard on either side => compatible
    const relMin = rel.min ?? -Infinity, relMax = rel.max ?? Infinity;
    const filtMin = filt.min ?? -Infinity, filtMax = filt.max ?? Infinity;
    return relMin <= filtMax && relMax >= filtMin; // ranges overlap
  }
  const vals = c[axis] || [];
  if (!vals.length) return true;
  return vals.some(v => filters[axis].includes(v));
}

// Classifies a tree against the active filter:
//  'full'    — matches every selected condition axis (or has no conditions at all)
//  'partial' — compatible with the filter, but only conditioned on some of the selected axes
//  'hidden'  — conflicts with at least one selected axis
function classifyTree(tree) {
  const selected = selectedAxesList();
  if (!selected.length) return { level: 'full', conditionedAxes: treeConditionedAxes(tree) };
  for (const axis of selected) {
    if (!axisCompatible(tree, axis)) return { level: 'hidden', conditionedAxes: [] };
  }
  const conditioned = treeConditionedAxes(tree);
  const isFull = conditioned.length === 0 || selected.every(a => conditioned.includes(a));
  return { level: isFull ? 'full' : 'partial', conditionedAxes: conditioned };
}

function npcCoverage(npc) {
  let full = 0, partial = 0;
  for (const tree of npc.dialogueTrees || []) {
    const { level } = classifyTree(tree);
    if (level === 'full') full++;
    else if (level === 'partial') partial++;
  }
  return { full, partial };
}

function conditionLabel(cond, axes) {
  const parts = [];
  if (axes.includes('weekdays')   && cond.weekdays?.length)   parts.push(cond.weekdays.join('/'));
  if (axes.includes('seasons')    && cond.seasons?.length)    parts.push(cond.seasons.join('/'));
  if (axes.includes('weather')    && cond.weather?.length)    parts.push(cond.weather.join('/'));
  if (axes.includes('timesOfDay') && cond.timesOfDay?.length) parts.push(cond.timesOfDay.join('/'));
  if (axes.includes('encounter')  && cond.encounter?.length)  parts.push(cond.encounter.join('/'));
  if (axes.includes('relationship') && cond.relationship) {
    const { min, max } = cond.relationship;
    if (min != null && max != null)      parts.push(`${min}–${max}♥`);
    else if (min != null)                parts.push(`${min}+♥`);
    else if (max != null)                parts.push(`≤${max}♥`);
  }
  return parts.join(' · ');
}

function conditionChipLabel(key, value) {
  if (key === 'relationship') {
    const { min, max } = value;
    if (min != null && max != null) return `Relationship ${min}–${max}♥`;
    if (min != null)                return `Relationship ${min}+♥`;
    if (max != null)                return `Relationship ≤${max}♥`;
    return '';
  }
  const cat = CONDITION_CATEGORIES.find(c => c.key === key);
  return `${cat ? cat.label : key}: ${value}`;
}

// Renders an appendable chip list + "+ Add" popover into containerEl for a
// condition bag (filters, tree.conditions, or tree.excludeConditions) of the
// shape { weekdays:[], seasons:[], weather:[], timesOfDay:[], encounter:[],
// relationship:{min,max} }. onChange fires after every mutation so the
// caller can update anything that depends on it (NPC sort, tree tabs, etc);
// the picker then re-renders itself, preserving popover open/category state
// so several conditions can be added back-to-back without reopening it.
function renderConditionPicker(containerEl, bag, onChange, variant, state = {}) {
  const popOpen = !!state.popOpen;
  const curCat  = state.cat || CONDITION_CATEGORIES[0].key;

  const chips = [];
  for (const cat of CONDITION_CATEGORIES) {
    if (cat.key === 'relationship') {
      const rel = bag.relationship;
      if (rel && (rel.min != null || rel.max != null)) chips.push({ key: 'relationship', value: rel });
    } else {
      (bag[cat.key] || []).forEach(v => chips.push({ key: cat.key, value: v }));
    }
  }

  containerEl.innerHTML = `
    <div class="condChipList">
      ${chips.map((c, i) => `<span class="condChip${variant==='exclude'?' exclude':''}" data-i="${i}">${esc(conditionChipLabel(c.key, c.value))}<button class="condChipX" data-i="${i}" type="button">×</button></span>`).join('')}
      <button class="condAddBtn secondary" type="button">+ Add</button>
    </div>
    <div class="condPopover${popOpen?'':' hidden'}">
      <select class="condPopCat">${CONDITION_CATEGORIES.map(c => `<option value="${c.key}"${c.key===curCat?' selected':''}>${esc(c.label)}</option>`).join('')}</select>
      <select class="condPopVal"></select>
      <div class="condPopRel">
        <input type="number" class="condPopRelMin" placeholder="min">
        <span>to</span>
        <input type="number" class="condPopRelMax" placeholder="max">
      </div>
      <div class="condPopBtns">
        <button class="condPopAdd" type="button">Add</button>
        <button class="condPopClose secondary" type="button">Done</button>
      </div>
    </div>`;

  const rerender = next => renderConditionPicker(containerEl, bag, onChange, variant, next);

  containerEl.querySelectorAll('.condChipX').forEach(btn => btn.addEventListener('click', () => {
    const c = chips[+btn.dataset.i];
    if (c.key === 'relationship') bag.relationship = { min: null, max: null };
    else { const arr = bag[c.key]; const idx = arr.indexOf(c.value); if (idx !== -1) arr.splice(idx, 1); }
    onChange(); rerender({ popOpen, cat: curCat });
  }));

  const catSel  = containerEl.querySelector('.condPopCat');
  const valSel  = containerEl.querySelector('.condPopVal');
  const relRow  = containerEl.querySelector('.condPopRel');
  const relMin  = containerEl.querySelector('.condPopRelMin');
  const relMax  = containerEl.querySelector('.condPopRelMax');

  function syncValueControls() {
    const cat = CONDITION_CATEGORIES.find(c => c.key === catSel.value);
    const isRel = cat.key === 'relationship';
    valSel.classList.toggle('hidden', isRel);
    relRow.classList.toggle('hidden', !isRel);
    if (isRel) {
      relMin.value = bag.relationship?.min ?? '';
      relMax.value = bag.relationship?.max ?? '';
    } else {
      const active = bag[cat.key] || [];
      const remaining = cat.values.filter(v => !active.includes(v));
      valSel.innerHTML = remaining.length
        ? remaining.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('')
        : `<option disabled selected>— all added —</option>`;
    }
  }
  syncValueControls();
  catSel.addEventListener('change', syncValueControls);

  containerEl.querySelector('.condAddBtn').addEventListener('click', () => rerender({ popOpen: !popOpen, cat: catSel.value }));
  containerEl.querySelector('.condPopClose').addEventListener('click', () => rerender({ popOpen: false, cat: catSel.value }));
  containerEl.querySelector('.condPopAdd').addEventListener('click', () => {
    const cat = CONDITION_CATEGORIES.find(c => c.key === catSel.value);
    if (cat.key === 'relationship') {
      const min = relMin.value === '' ? null : parseInt(relMin.value);
      const max = relMax.value === '' ? null : parseInt(relMax.value);
      if (min == null && max == null) return;
      bag.relationship = { min, max };
    } else {
      const v = valSel.value;
      if (!v || (bag[cat.key]||[]).includes(v)) return;
      bag[cat.key].push(v);
    }
    onChange(); rerender({ popOpen: true, cat: catSel.value });
  });
}

function renderCondFilters() {
  renderConditionPicker($('filterPicker'), filters, onFiltersChanged, 'require');
}

function onFiltersChanged() {
  renderCondFilters(); renderNpcList();
  const npc = getNpc();
  const curTree = npc?.dialogueTrees?.find(t => t.id === sel.treeId);
  if (npc && (!curTree || classifyTree(curTree).level === 'hidden')) {
    selectNpc(npc.id); // current tree no longer valid — reselect best match (resets view)
    return;
  }
  renderTreeBar(); renderCanvas(); renderInspector();
}

/* ── NPC list ────────────────────────────────────────────── */
function renderNpcList() {
  const el = $('npcListEl');
  if (!db) { el.innerHTML = '<p style="padding:12px;color:var(--muted);font-size:12px">Load a database to begin.</p>'; return; }
  const q = ($('npcQ').value || '').toLowerCase();
  const list = db.npcs.filter(n => !q ||
    (n.name||'').toLowerCase().includes(q) ||
    (n.role||'').toLowerCase().includes(q) ||
    (n.species||'').toLowerCase().includes(q));
  const withCov = list.map(n => ({ n, cov: npcCoverage(n) }));
  withCov.sort((a, b) =>
    b.cov.full - a.cov.full ||
    b.cov.partial - a.cov.partial ||
    (a.n.name || a.n.id).localeCompare(b.n.name || b.n.id));
  el.innerHTML = withCov.map(({ n, cov }) => {
    const covClass = cov.full > 0 ? 'covFull' : (cov.partial > 0 ? 'covPartial' : 'covNone');
    const chat  = n.appearance?.chatColor;
    const swatch = chat ? `hsl(${chat.h},${chat.s}%,${chat.l}%)` : 'rgba(255,255,255,.15)';
    const initial = esc((n.name || n.id || '?').trim().charAt(0).toUpperCase());
    const badge = cov.partial ? `${cov.full}+${cov.partial}` : `${cov.full}`;
    return `
    <div class="npcItem ${covClass}${n.id === sel.npcId ? ' sel' : ''}" data-id="${esc(n.id)}">
      <div class="npcRow">
        <span class="npcAvatar" style="background:${swatch}">${initial}</span>
        <div class="npcNameWrap">
          <div class="npcName">${esc(n.name || n.id)}</div>
          <div class="npcMeta">${esc(n.role || '—')} · ${esc(n.species || '—')}</div>
        </div>
        <span class="npcBadge" title="${cov.full} matching, ${cov.partial} related to selected conditions">${badge}</span>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('.npcItem').forEach(el => el.addEventListener('click', () => selectNpc(el.dataset.id)));
}

/* ── Tree bar ────────────────────────────────────────────── */
function renderTreeBar() {
  const npc = getNpc();
  const mainEl = $('treeTabs'), extraEl = $('extraTreeTabs'), extraWrap = $('extraTabsWrap');
  if (!npc) { mainEl.innerHTML = ''; extraEl.innerHTML = ''; extraWrap.classList.add('hidden'); return; }

  const main = [], extra = [];
  for (const t of npc.dialogueTrees) {
    const { level, conditionedAxes } = classifyTree(t);
    if (level === 'hidden') continue;
    (level === 'full' ? main : extra).push({ t, conditionedAxes });
  }

  mainEl.innerHTML = main.length ? main.map(({ t }) => `
    <div class="treeTab${t.id === sel.treeId ? ' sel' : ''}" data-id="${esc(t.id)}">${esc(t.label || t.id)}</div>`).join('')
    : (npc.dialogueTrees.length ? '<span class="iMuted" style="padding:4px 2px">No dialogue matches the selected conditions.</span>' : '');

  extraEl.innerHTML = extra.map(({ t, conditionedAxes }) => {
    const badge = conditionLabel(t.conditions || {}, conditionedAxes);
    return `<div class="treeTab extra${t.id === sel.treeId ? ' sel' : ''}" data-id="${esc(t.id)}">${esc(t.label || t.id)}${badge ? `<span class="tabCond">${esc(badge)}</span>` : ''}</div>`;
  }).join('');
  extraWrap.classList.toggle('hidden', extra.length === 0);

  [mainEl, extraEl].forEach(container =>
    container.querySelectorAll('.treeTab').forEach(el => el.addEventListener('click', () => selectTree(el.dataset.id))));
}

function updateBar() {
  const ok = !!getTree();
  ['btnText','btnChoice','btnEnd','btnSeq','btnOrg'].forEach(id => $(id).disabled = !ok);
  $('btnDel').disabled   = !sel.nodeId;
  $('btnEntry').disabled = !sel.nodeId;
}

/* ── Canvas ──────────────────────────────────────────────── */
function applyTransform() {
  $('canvas').style.transform = `matrix(${cam.zoom},0,0,${cam.zoom},${cam.panX},${cam.panY})`;
  $('zoomLabel').textContent  = Math.round(cam.zoom * 100) + '%';
  const gs  = GRID * cam.zoom;       // minor grid (20px canvas units)
  const gsl = GRID * 5 * cam.zoom;   // major grid (100px canvas units)
  const outer = $('canvasOuter');
  const px = cam.panX, py = cam.panY;
  outer.style.backgroundSize  = `${gsl}px ${gsl}px, ${gs}px ${gs}px`;
  outer.style.backgroundImage =
    `radial-gradient(circle,rgba(106,167,255,.45) 1.5px,transparent 1.5px),` +
    `radial-gradient(circle,rgba(38,56,79,.65) 1px,transparent 1px)`;
  outer.style.backgroundPosition =
    `${px % gsl}px ${py % gsl}px, ${px % gs}px ${py % gs}px`;
}

function renderCanvas() {
  applyTransform();
  const tree   = getTree();
  const nlayer = $('nodesLayer');
  const empty  = $('emptyState');
  const emsg   = $('emptyMsg');

  if (!getNpc()) {
    nlayer.innerHTML = ''; $('svgLayer').innerHTML = '';
    empty.classList.remove('hidden'); emsg.textContent = 'Select an NPC to begin'; return;
  }
  if (!tree) {
    nlayer.innerHTML = ''; $('svgLayer').innerHTML = '';
    empty.classList.remove('hidden');
    emsg.textContent = !getNpc()?.dialogueTrees?.length
      ? 'Click "+ Tree" to create a dialogue tree'
      : (selectedAxesList().length
          ? 'No dialogue yet for the selected conditions — click "+ Tree" to fill the gap.'
          : 'Select a tree above to edit it');
    return;
  }
  empty.classList.add('hidden');
  nlayer.innerHTML = (tree.nodes || []).map(n => buildNodeHtml(n, tree)).join('');

  nlayer.querySelectorAll('.node').forEach(el => {
    el.addEventListener('mousedown', e => onNodeDown(e, el.dataset.nid));
    el.querySelector('.nodeX')?.addEventListener('click', e => { e.stopPropagation(); deleteNode(el.dataset.nid); });
  });
  nlayer.querySelectorAll('.port-out[data-nid]').forEach(p =>
    p.addEventListener('mousedown', e => { e.stopPropagation(); onPortDown(e, p); }));

  requestAnimationFrame(() => { placeChoicePorts(); renderSvg(); });
}

function buildNodeHtml(nd, tree) {
  const isSel   = nd.id === sel.nodeId;
  const isEntry = tree.entryNode === nd.id;
  let body = '', outPort = '';

  if (nd.type === 'text') {
    const meta = [];
    if (nd.expression && nd.expression !== 'neutral') meta.push(`<span class="nodeMetaTag">${esc(nd.expression)}</span>`);
    if (nd.revealSpeed && nd.revealSpeed !== 'normal') meta.push(`<span class="nodeMetaTag">${esc(nd.revealSpeed)}</span>`);
    if ((nd.tags||[]).length) meta.push(`<span class="nodeMetaTag">${nd.tags.length} tag${nd.tags.length!==1?'s':''}</span>`);
    body = `<div class="nodeText${!nd.text?' empty':''}">${nd.text?esc(trunc(nd.text,140)):'No text — click to edit'}</div>
      ${meta.length?`<div class="nodeMeta">${meta.join('')}</div>`:''}`;
    outPort = `<div class="port port-out" data-nid="${nd.id}" data-ci="" title="Connect to next node"></div>`;
  } else if (nd.type === 'choice') {
    const rows = (nd.choices||[]).map((c,i) => `
      <li class="choiceRow">
        <span class="choiceLabel${!c.label?' empty':''}">${c.label?esc(trunc(c.label,48)):'Empty choice'}</span>
        <span class="choiceTarget">${c.next?'→ '+esc(c.next):'→ END'}</span>
      </li>`).join('');
    body = `<ul class="choiceRows">${rows||'<li class="choiceRow" style="color:var(--muted);font-size:11px">No choices</li>'}</ul>`;
  } else if (nd.type === 'end') {
    body = `<div class="nodeEndLine">— end of conversation —</div>`;
  } else if (nd.type === 'sequence') {
    const slots = nd.slots || [];
    const rows = slots.slice(0,4).map((s,i) => `
      <li class="seqSlotItem">
        <span class="seqSlotNum">${i+1}.</span>
        <span class="seqSlotRef${!s.nodeId?' empty':''}">${s.nodeId?esc(s.nodeId):'— unset —'}</span>
        <span class="seqSlotDepth">d:${s.depth??0}</span>
      </li>`).join('');
    body = `<div class="seqSlotBadge">${slots.length} slot${slots.length!==1?'s':''}${slots.length>4?' (showing 4)':''}</div>
      <ul class="seqSlotList">${rows||'<li class="seqSlotItem"><span style="color:var(--muted);font-size:11px">No slots — add in inspector</span></li>'}</ul>
      <div class="seqPortHint"><span style="color:var(--acc)">● next</span><span style="color:var(--good)">● exhausted</span></div>`;
    outPort = `<div class="port port-out" data-nid="${nd.id}" data-ci="" title="Next (slots remain)"></div>
               <div class="port port-out exhaust-port" data-nid="${nd.id}" data-ci="exhaust" title="Exhausted (all slots visited)"></div>`;
  }

  return `<div class="node node-${nd.type}${isSel?' sel':''}" data-nid="${nd.id}"
       style="left:${nd.pos.x}px;top:${nd.pos.y}px">
    <div class="port port-in" data-nid="${nd.id}" title="Input"></div>
    <div class="nodeHead">
      <span class="nodeBadge">${nd.type}</span>
      ${isEntry?'<span class="nodeEntryTag">entry</span>':''}
      <span class="nodeId">${esc(nd.id)}</span>
      <button class="nodeX" title="Delete node">×</button>
    </div>
    <div class="nodeBody">${body}</div>
    ${outPort}
  </div>`;
}

function placeChoicePorts() {
  const tree = getTree(); if (!tree) return;
  document.querySelectorAll('.node-choice').forEach(nodeEl => {
    const nid = nodeEl.dataset.nid;
    const nd  = tree.nodes.find(n => n.id === nid); if (!nd) return;
    const nr  = nodeEl.getBoundingClientRect();
    nodeEl.querySelectorAll('.choiceRow').forEach((row, ci) => {
      const rr  = row.getBoundingClientRect();
      const top = (rr.top + rr.height / 2) - nr.top;
      let port  = nodeEl.querySelector(`.port-out[data-ci="${ci}"]`);
      if (!port) {
        port = document.createElement('div');
        port.className   = 'port port-out choice-port';
        port.dataset.nid = nid;
        port.dataset.ci  = String(ci);
        port.title       = `Connect choice ${ci + 1}`;
        port.addEventListener('mousedown', e => { e.stopPropagation(); onPortDown(e, port); });
        nodeEl.appendChild(port);
      }
      port.style.cssText = `top:${top}px;right:-6px;position:absolute;transform:translateY(-50%)`;
    });
  });
}

/* ── SVG connections ─────────────────────────────────────── */
function portCanvasPos(portEl) {
  const or = $('canvasOuter').getBoundingClientRect();
  const pr = portEl.getBoundingClientRect();
  return {
    x: (pr.left + pr.width  / 2 - or.left - cam.panX) / cam.zoom,
    y: (pr.top  + pr.height / 2 - or.top  - cam.panY) / cam.zoom
  };
}

function orthoPath(x1, y1, x2, y2) {
  x1 = Math.round(x1); y1 = Math.round(y1);
  x2 = Math.round(x2); y2 = Math.round(y2);
  const STUB = 28;
  if (x2 >= x1 + STUB * 2) {
    if (y1 === y2) return `M${x1},${y1} H${x2}`;
    const mx = Math.round((x1 + x2) / 2);
    return `M${x1},${y1} H${mx} V${y2} H${x2}`;
  }
  // Backward / tight — step out from both ports, meet at mid-Y
  const ex = x1 + STUB, nx = x2 - STUB;
  const my = y1 === y2 ? y1 + 52 : Math.round((y1 + y2) / 2);
  return `M${x1},${y1} H${ex} V${my} H${nx} V${y2} H${x2}`;
}

function renderSvg() {
  const tree = getTree();
  const svg  = $('svgLayer');
  if (!tree) { svg.innerHTML = ''; return; }
  requestAnimationFrame(() => {
    const paths = [];
    const curve = (op, ip, color, dash='') => {
      if (!op || !ip) return;
      const p1 = portCanvasPos(op), p2 = portCanvasPos(ip);
      paths.push(`<path d="${orthoPath(p1.x,p1.y,p2.x,p2.y)}"
        stroke="${color}" stroke-width="2" fill="none" stroke-linejoin="miter"
        stroke-linecap="square"${dash?` stroke-dasharray="${dash}"`:''}/>`);
    };
    for (const nd of (tree.nodes || [])) {
      if (nd.type === 'text' && nd.next) {
        curve(
          document.querySelector(`.port-out[data-nid="${nd.id}"][data-ci=""]`),
          document.querySelector(`.port-in[data-nid="${nd.next}"]`),
          'rgba(106,167,255,.75)');
      }
      if (nd.type === 'choice') {
        (nd.choices||[]).forEach((c,ci) => { if (!c.next) return;
          curve(
            document.querySelector(`.port-out[data-nid="${nd.id}"][data-ci="${ci}"]`),
            document.querySelector(`.port-in[data-nid="${c.next}"]`),
            'rgba(251,191,36,.75)');
        });
      }
      if (nd.type === 'sequence') {
        // Slot dispatch lines (dotted teal, from sequence body center)
        const seqEl = document.querySelector(`.node[data-nid="${nd.id}"]`);
        if (seqEl) {
          const sr = seqEl.getBoundingClientRect();
          const or = $('canvasOuter').getBoundingClientRect();
          const sx = (sr.right - or.left - cam.panX) / cam.zoom;
          const sy = (sr.top + sr.height/2 - or.top - cam.panY) / cam.zoom;
          (nd.slots||[]).forEach((s,si) => {
            if (!s.nodeId) return;
            const ip = document.querySelector(`.port-in[data-nid="${s.nodeId}"]`);
            if (!ip) return;
            const p2 = portCanvasPos(ip);
            paths.push(`<path d="${orthoPath(sx, sy, p2.x, p2.y)}"
              stroke="rgba(45,212,191,.38)" stroke-width="1.5" fill="none"
              stroke-dasharray="5 4" stroke-linejoin="miter" stroke-linecap="square"/>`);
          });
        }
        // Flow ports
        if (nd.next)
          curve(
            document.querySelector(`.port-out[data-nid="${nd.id}"][data-ci=""]`),
            document.querySelector(`.port-in[data-nid="${nd.next}"]`),
            'rgba(106,167,255,.75)');
        if (nd.exhaustedNext)
          curve(
            document.querySelector(`.port-out[data-nid="${nd.id}"][data-ci="exhaust"]`),
            document.querySelector(`.port-in[data-nid="${nd.exhaustedNext}"]`),
            'rgba(52,211,153,.75)');
      }
    }
    if (connState?.preview) paths.push(connState.preview);
    svg.innerHTML = paths.join('\n');
  });
}

/* ── Inspector helpers ───────────────────────────────────── */
function buildTagsHtml(nd, tree) {
  const tags     = nd.tags || [];
  const seqNodes = (tree.nodes||[]).filter(n => n.type === 'sequence' && n.id !== nd.id);
  const rows = tags.map((tag, ti) => {
    let detail = '';
    if (tag.type === 'break_sequence') {
      detail = `<select class="tagSeqSel" data-ti="${ti}" style="font-size:11px;flex:1">
        <option value="">— none —</option>
        ${seqNodes.map(sn => `<option value="${esc(sn.id)}"${sn.id===tag.sequenceNodeId?' selected':''}>${esc(sn.id)}</option>`).join('')}
      </select>`;
    }
    return `<div class="tagRow">
      <span class="tagBadge">${esc(tag.type)}</span>
      ${detail}
      <button class="tagX" data-ti="${ti}" style="margin-left:auto">×</button>
    </div>`;
  }).join('');
  return `<hr class="idiv">
    <div class="iGroup">
      <label>Tags</label>
      ${tags.length ? `<div class="ceWrap">${rows}</div>` : '<div class="iMuted" style="margin-bottom:5px">No tags on this node.</div>'}
      <div style="display:flex;gap:5px;margin-top:5px">
        <select id="iTagType" style="flex:1;font-size:11px">
          <option value="break_sequence">break_sequence</option>
        </select>
        <button id="iAddTag" style="font-size:11px;flex-shrink:0">+ Add</button>
      </div>
    </div>`;
}

function wireTagEvents(nd) {
  if (!nd.tags) nd.tags = [];
  $('iAddTag')?.addEventListener('click', () => {
    const type = $('iTagType').value;
    if (type === 'break_sequence') nd.tags.push({ type: 'break_sequence', sequenceNodeId: '' });
    setDirty(); renderInspector();
  });
  document.querySelectorAll('.tagX').forEach(el => el.addEventListener('click', () => {
    nd.tags.splice(+el.dataset.ti, 1); setDirty(); renderInspector();
  }));
  document.querySelectorAll('.tagSeqSel').forEach(el => el.addEventListener('change', () => {
    nd.tags[+el.dataset.ti].sequenceNodeId = el.value; setDirty();
  }));
}

/* ── Inspector ───────────────────────────────────────────── */
function renderInspector() {
  const body = $('inspBody');
  const tree = getTree();
  const nd   = getNode();

  if (!tree) {
    body.innerHTML = '<p style="color:var(--muted);font-size:12px;margin:0;padding:4px 0">Select a node to inspect it.</p>';
    return;
  }

  if (!nd) {
    const nodes = tree.nodes || [];
    body.innerHTML = `
      <div class="iGroup"><label>Label</label>
        <input id="iLabel" value="${esc(tree.label||'')}" placeholder="Tree name"></div>
      <div class="iGroup"><label>Trigger</label>
        <select id="iTrigger">
          ${['interact','gift','quest','relationship','date','custom'].map(v =>
            `<option${tree.trigger===v?' selected':''}>${esc(v)}</option>`).join('')}
        </select>
        <div class="iMuted">When this tree activates.</div></div>
      <div class="iGroup"><label>Priority</label>
        <input id="iPrio" type="number" value="${tree.priority??0}" min="0" max="99">
        <div class="iMuted">Higher = checked first.</div></div>
      <div class="iGroup"><label>Entry node</label>
        <select id="iEntry">
          <option value="">— none —</option>
          ${nodes.map(n => `<option value="${esc(n.id)}"${tree.entryNode===n.id?' selected':''}>${esc(n.id)} (${n.type})</option>`).join('')}
        </select></div>
      <hr class="idiv">
      <div class="iGroup"><label>Conditions</label>
        <div class="iMuted" style="margin-bottom:5px">This tree only counts as a full match when every added condition is satisfied.</div>
        <div id="iReqConditions"></div>
      </div>
      <div class="iGroup"><label>No-fly conditions</label>
        <div class="iMuted" style="margin-bottom:5px">This tree is skipped entirely whenever any of these are true — even if the required conditions above are met.</div>
        <div id="iExclConditions"></div>
      </div>
      <hr class="idiv">
      <div class="iGroup">
        <button class="danger" id="iDelTree" style="width:100%;font-size:12px">Delete Tree</button></div>`;
    $('iLabel').oninput    = e => { tree.label    = e.target.value; setDirty(); renderTreeBar(); };
    $('iTrigger').onchange = e => { tree.trigger  = e.target.value; setDirty(); };
    $('iPrio').oninput     = e => { tree.priority = parseInt(e.target.value)||0; setDirty(); };
    $('iEntry').onchange   = e => { tree.entryNode = e.target.value||null; setDirty(); renderCanvas(); };
    const onTreeConditionChange = () => { setDirty(); renderNpcList(); renderTreeBar(); };
    renderConditionPicker($('iReqConditions'),  tree.conditions,        onTreeConditionChange, 'require');
    renderConditionPicker($('iExclConditions'), tree.excludeConditions, onTreeConditionChange, 'exclude');
    $('iDelTree').onclick  = () => deleteTree(sel.treeId);
    return;
  }

  const others   = (tree.nodes||[]).filter(n => n.id !== nd.id);
  const nextOpts = id => `<option value="">— END —</option>` +
    others.map(n => `<option value="${esc(n.id)}"${n.id===id?' selected':''}>${esc(n.id)} (${n.type})</option>`).join('');

  let specific = '';

  if (nd.type === 'text') {
    specific = `
      <div class="iGroup"><label>Dialogue text</label>
        <textarea id="iText" rows="5">${esc(nd.text||'')}</textarea>
        <div class="iMuted">
          <code>{{npcName}}</code> <code>{{playerName}}</code>
          <code>{{npcSpecies}}</code> <code>{{playerSpecies}}</code> <code>{{role}}</code><br>
          <code>{{playerPronoun1}}</code> he/she/they &nbsp;
          <code>{{playerPronoun2}}</code> him/her/them &nbsp;
          <code>{{playerPronoun3}}</code> his/her/their &nbsp;
          <code>{{playerPronounSelf}}</code> himself/…<br>
          <code>{{playerNickname}}</code> player-set nickname &nbsp;
          <code>{{playerLocalNickname}}</code> NPC-specific nickname (set via choice action)<br>
          <code>{{playerFirstL2V1}}</code> leading consonants + first vowel of player name (e.g. "Bra" from "Brandon")
        </div></div>
      <div class="iGroup"><label>Next node</label>
        <select id="iNext">${nextOpts(nd.next)}</select></div>
      <div class="iGroup"><label>Expression</label>
        <select id="iExpr">
          ${EXPRESSIONS.map(v=>`<option${(nd.expression||'neutral')===v?' selected':''}>${v}</option>`).join('')}
        </select></div>
      <div class="iGroup"><label>Expression hold after END (sec)</label>
        <input id="iExprHold" type="number" value="${nd.expressionHold??2}" min="0" max="30" step="0.5">
        <div class="iMuted">In-game seconds before fading to neutral after conversation ends.</div></div>
      <div class="iGroup"><label>Reveal speed</label>
        <select id="iReveal">
          ${REVEAL_SPEEDS.map(v=>`<option${(nd.revealSpeed||'normal')===v?' selected':''}>${v}</option>`).join('')}
        </select>
        <div class="iMuted">Punctuation (. … !) always pauses at non-instant speeds.</div></div>
      ${buildTagsHtml(nd, tree)}`;
  } else if (nd.type === 'choice') {
    const ceRows = (nd.choices||[]).map((c,i) => {
      const acts = (c.actions||[]).map((a,ai) => `
        <div class="actChip">
          <span class="actLabel">${esc(a.type)}</span>
          <input class="actVal" data-ci="${i}" data-ai="${ai}" value="${esc(a.value||'')}"
            placeholder="{{playerName}}" style="font-size:11px;flex:1;min-width:0">
          <button class="actDelBtn" data-ci="${i}" data-ai="${ai}">×</button>
        </div>`).join('');
      return `
      <div class="ceItem" data-ci="${i}">
        <div style="display:flex;align-items:center;gap:5px">
          <span style="font-size:10px;color:var(--muted);min-width:18px">${i+1}.</span>
          <input class="ceLabel" data-ci="${i}" value="${esc(c.label||'')}" placeholder="Choice text…" style="font-size:12px;flex:1">
          <button class="ceX" data-ci="${i}">×</button>
        </div>
        <div class="ceRow">
          <span class="ceRowLabel">→ next</span>
          <select class="ceNext" data-ci="${i}" style="font-size:11px">${nextOpts(c.next)}</select>
        </div>
        <div class="ceRow" style="align-items:flex-start;margin-top:3px">
          <span class="ceRowLabel" style="padding-top:2px">acts</span>
          <div style="flex:1">${acts}
            <button class="addAct" data-ci="${i}" style="font-size:10px;padding:2px 6px;
              border-radius:5px;border:1px solid rgba(45,212,191,.3);background:rgba(45,212,191,.08);
              color:var(--seq);margin-top:${acts?'3':'0'}px">+ setNickname</button>
          </div>
        </div>
      </div>`;
    }).join('');
    specific = `
      <div class="iGroup"><label>Choices</label>
        <div class="ceWrap">${ceRows||'<div style="padding:8px;color:var(--muted);font-size:11px">No choices yet</div>'}</div>
        <button id="iAddChoice" style="width:100%;margin-top:6px;font-size:11px">+ Add choice</button></div>
      ${buildTagsHtml(nd, tree)}`;
  } else if (nd.type === 'end') {
    specific = `<div class="iGroup">
      <div class="iMuted">This node ends the conversation. No outputs.</div></div>
      ${buildTagsHtml(nd, tree)}`;
  } else if (nd.type === 'sequence') {
    const slots = nd.slots || [];
    const depthHint = d => d === 0 ? 'trigger only' : `${d} node${d!==1?'s':''} (trigger + ${d-1} hop${d>2?'s':''})`;
    const slotItems = slots.map((s,si) => `
      <div class="ceItem">
        <div style="display:flex;align-items:center;gap:5px">
          <span style="font-size:10px;color:var(--muted);min-width:18px">${si+1}.</span>
          <select class="slotNode" data-si="${si}" style="font-size:11px;flex:1">
            <option value="">— unset —</option>
            ${others.map(n=>`<option value="${esc(n.id)}"${n.id===s.nodeId?' selected':''}>${esc(n.id)} (${n.type})</option>`).join('')}
          </select>
          <button class="slotDel" data-si="${si}" style="width:20px;height:20px;padding:0;border-radius:5px;font-size:12px;border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.1);color:var(--bad);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">×</button>
        </div>
        <div class="ceRow" style="margin-top:4px">
          <span class="ceRowLabel" style="min-width:46px">depth</span>
          <input class="slotDepth" data-si="${si}" type="number" value="${s.depth??0}" min="0" max="99"
            style="width:58px;flex-shrink:0;font-size:11px">
          <span style="font-size:10px;color:var(--muted);margin-left:6px">${depthHint(s.depth??0)}</span>
        </div>
      </div>`).join('');
    specific = `
      <div class="iGroup"><label>Slots</label>
        <div class="iMuted" style="margin-bottom:5px">Each slot dispatches to a node. Depth 0 = trigger only; depth N = follow N nodes total including trigger. Cycles through all slots before taking exhausted path.</div>
        <div class="ceWrap">${slotItems||'<div style="padding:8px;color:var(--muted);font-size:11px">No slots yet</div>'}</div>
        <button id="iAddSlot" style="width:100%;margin-top:6px;font-size:11px">+ Add slot</button></div>
      <div class="iGroup"><label style="color:var(--acc)">● Next node (slots remain)</label>
        <select id="iSeqNext">${nextOpts(nd.next)}</select></div>
      <div class="iGroup"><label style="color:var(--good)">● Exhausted next (all slots visited)</label>
        <select id="iSeqExhaust">
          <option value="">— END —</option>
          ${others.map(n=>`<option value="${esc(n.id)}"${n.id===nd.exhaustedNext?' selected':''}>${esc(n.id)} (${n.type})</option>`).join('')}
        </select></div>
      ${buildTagsHtml(nd, tree)}`;
  }

  const isEntry = tree.entryNode === nd.id;
  body.innerHTML = `
    <div class="iGroup"><label>Type · <code style="font-size:10px;color:var(--muted)">${esc(nd.id)}</code></label>
      <select id="iType" style="font-size:12px">
        <option${nd.type==='text'    ?' selected':''}>text</option>
        <option${nd.type==='choice'  ?' selected':''}>choice</option>
        <option${nd.type==='end'    ?' selected':''}>end</option>
        <option${nd.type==='sequence'?' selected':''}>sequence</option>
      </select></div>
    ${specific}
    <div class="iGroup">
      <button id="iEntryBtn" class="${isEntry?'warn':'secondary'}" style="width:100%;font-size:11px">
        ${isEntry?'★ Entry node (this tree starts here)':'Set as entry node'}
      </button></div>`;

  $('iType')?.addEventListener('change', e => {
    const t = e.target.value, prevTags = nd.tags;
    nd.type = t;
    ['text','next','choices','exhaustedNext','slots','expression','expressionHold','revealSpeed']
      .forEach(k => delete nd[k]);
    if (t === 'text')     { nd.text = ''; nd.next = null; nd.expression = 'neutral'; nd.expressionHold = 2; nd.revealSpeed = 'normal'; }
    if (t === 'choice')   { nd.choices = [{ label: '', next: null }]; }
    if (t === 'sequence') { nd.slots = []; nd.next = null; nd.exhaustedNext = null; }
    nd.tags = prevTags || [];
    setDirty(); renderCanvas(); renderInspector();
  });

  $('iText')?.addEventListener('input', e => {
    nd.text = e.target.value; setDirty();
    const el = document.querySelector(`.node[data-nid="${nd.id}"] .nodeText`);
    if (el) { el.classList.toggle('empty', !nd.text); el.textContent = nd.text ? trunc(nd.text,140) : 'No text — click to edit'; }
  });
  $('iNext')?.addEventListener('change', e => { nd.next = e.target.value||null; setDirty(); renderCanvas(); });
  $('iExpr')?.addEventListener('change', e => { nd.expression = e.target.value; setDirty(); renderCanvas(); });
  $('iExprHold')?.addEventListener('input', e => { nd.expressionHold = parseFloat(e.target.value)||0; setDirty(); });
  $('iReveal')?.addEventListener('change', e => { nd.revealSpeed = e.target.value; setDirty(); renderCanvas(); });

  $('iAddChoice')?.addEventListener('click', () => {
    nd.choices.push({ label: '', next: null }); setDirty(); renderCanvas(); renderInspector();
  });
  document.querySelectorAll('.ceLabel').forEach(el => el.addEventListener('input', e => {
    nd.choices[+e.target.dataset.ci].label = e.target.value; setDirty(); renderCanvas();
  }));
  document.querySelectorAll('.ceNext').forEach(el => el.addEventListener('change', e => {
    nd.choices[+e.target.dataset.ci].next = e.target.value||null; setDirty(); renderCanvas();
  }));
  document.querySelectorAll('.ceX').forEach(el => el.addEventListener('click', e => {
    nd.choices.splice(+e.target.dataset.ci, 1); setDirty(); renderCanvas(); renderInspector();
  }));
  document.querySelectorAll('.addAct').forEach(el => el.addEventListener('click', e => {
    const ci = +e.target.dataset.ci;
    if (!nd.choices[ci].actions) nd.choices[ci].actions = [];
    nd.choices[ci].actions.push({ type: 'setLocalNickname', value: '' });
    setDirty(); renderInspector();
  }));
  document.querySelectorAll('.actVal').forEach(el => el.addEventListener('input', e => {
    const ci = +e.target.dataset.ci, ai = +e.target.dataset.ai;
    nd.choices[ci].actions[ai].value = e.target.value; setDirty();
  }));
  document.querySelectorAll('.actDelBtn').forEach(el => el.addEventListener('click', e => {
    const ci = +e.target.dataset.ci, ai = +e.target.dataset.ai;
    nd.choices[ci].actions.splice(ai, 1);
    if (!nd.choices[ci].actions.length) delete nd.choices[ci].actions;
    setDirty(); renderInspector();
  }));

  $('iSeqNext')?.addEventListener('change', e => { nd.next = e.target.value||null; setDirty(); renderCanvas(); });
  $('iSeqExhaust')?.addEventListener('change', e => { nd.exhaustedNext = e.target.value||null; setDirty(); renderCanvas(); });
  $('iAddSlot')?.addEventListener('click', () => {
    if (!nd.slots) nd.slots = [];
    nd.slots.push({ nodeId: '', depth: 0 }); setDirty(); renderCanvas(); renderInspector();
  });
  document.querySelectorAll('.slotNode').forEach(el => el.addEventListener('change', e => {
    nd.slots[+e.target.dataset.si].nodeId = e.target.value; setDirty(); renderCanvas();
  }));
  document.querySelectorAll('.slotDepth').forEach(el => el.addEventListener('input', e => {
    nd.slots[+e.target.dataset.si].depth = Math.max(0, parseInt(e.target.value)||0);
    setDirty(); renderInspector();
  }));
  document.querySelectorAll('.slotDel').forEach(el => el.addEventListener('click', e => {
    nd.slots.splice(+e.target.dataset.si, 1); setDirty(); renderCanvas(); renderInspector();
  }));

  $('iEntryBtn')?.addEventListener('click', () => setEntryNode(nd.id));
  wireTagEvents(nd);
}

/* ── Canvas interaction ──────────────────────────────────── */
function onNodeDown(e, nid) {
  if (e.button !== 0 || connState) return;
  e.stopPropagation(); e.preventDefault();
  selectNode(nid);
  const nd = getNode(nid); if (!nd) return;
  dragState = { nid, sx: e.clientX, sy: e.clientY, nx: nd.pos.x, ny: nd.pos.y };
  document.body.style.cursor = 'grabbing';
}

function onPortDown(e, portEl) {
  if (e.button !== 0) return;
  e.stopPropagation(); e.preventDefault();
  const or  = $('canvasOuter').getBoundingClientRect();
  const pr  = portEl.getBoundingClientRect();
  const sx  = (pr.left + pr.width  / 2 - or.left - cam.panX) / cam.zoom;
  const sy  = (pr.top  + pr.height / 2 - or.top  - cam.panY) / cam.zoom;
  const ciStr = portEl.dataset.ci;
  connState = {
    fromId: portEl.dataset.nid,
    ci: ciStr === '' ? null : (isNaN(+ciStr) ? ciStr : +ciStr),
    sx, sy, curX: sx, curY: sy, preview: ''
  };
}

function onCanvasDown(e) {
  if (e.button === 2 || (e.button === 0 && e.altKey)) {
    panState = { sx: e.clientX, sy: e.clientY, px: cam.panX, py: cam.panY };
    e.preventDefault(); return;
  }
  if (connState)      { connState = null; renderSvg(); return; }
  if (e.button === 0) { selectNode(null); renderInspector(); }
}

function onMouseMove(e) {
  if (dragState) {
    const nd = getNode(dragState.nid);
    if (nd) {
      nd.pos.x = snap(dragState.nx + (e.clientX - dragState.sx) / cam.zoom);
      nd.pos.y = snap(dragState.ny + (e.clientY - dragState.sy) / cam.zoom);
      const el = document.querySelector(`.node[data-nid="${dragState.nid}"]`);
      if (el) { el.style.left = nd.pos.x + 'px'; el.style.top = nd.pos.y + 'px'; }
      renderSvg();
    }
    return;
  }
  if (panState) {
    cam.panX = panState.px + (e.clientX - panState.sx);
    cam.panY = panState.py + (e.clientY - panState.sy);
    applyTransform(); renderSvg(); return;
  }
  if (connState) {
    const or = $('canvasOuter').getBoundingClientRect();
    connState.curX = (e.clientX - or.left - cam.panX) / cam.zoom;
    connState.curY = (e.clientY - or.top  - cam.panY) / cam.zoom;
    connState.preview = `<path d="${orthoPath(connState.sx,connState.sy,connState.curX,connState.curY)}"
      stroke="rgba(255,255,255,.35)" stroke-width="1.5" fill="none"
      stroke-dasharray="6 4" stroke-linejoin="miter" stroke-linecap="square"/>`;
    renderSvg();
  }
}

function onMouseUp(e) {
  if (dragState) { setDirty(); dragState = null; document.body.style.cursor = ''; return; }
  if (panState)  { panState = null; return; }
  if (connState) {
    const hit    = document.elementFromPoint(e.clientX, e.clientY);
    const portIn = hit?.closest('.port-in');
    if (portIn) {
      const toId = portIn.dataset.nid;
      if (toId && toId !== connState.fromId) connectNodes(connState.fromId, connState.ci, toId);
    }
    connState = null; renderSvg();
  }
}

function onWheel(e) {
  e.preventDefault();
  const or = $('canvasOuter').getBoundingClientRect();
  const mx = e.clientX - or.left, my = e.clientY - or.top;
  const nz = Math.max(0.15, Math.min(3, cam.zoom * (e.deltaY > 0 ? 0.9 : 1/0.9)));
  cam.panX = mx - (mx - cam.panX) * nz / cam.zoom;
  cam.panY = my - (my - cam.panY) * nz / cam.zoom;
  cam.zoom = nz;
  applyTransform(); renderSvg();
}

/* ── Touch pan/zoom (mobile) ─────────────────────────────── */
// Node dragging/port-connecting stay mouse-first; a touch starting on a node
// is left alone so its native tap-to-select still fires. A touch starting on
// the bare canvas backdrop pans; two fingers pinch-zoom around their midpoint.
let touchState = null;
const touchDist = (t0, t1) => Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);

function onTouchStart(e) {
  if (e.touches.length === 1) {
    if (e.touches[0].target.closest?.('.node')) { touchState = null; return; }
    const t = e.touches[0];
    touchState = { mode: 'pan', sx: t.clientX, sy: t.clientY, px: cam.panX, py: cam.panY };
  } else if (e.touches.length === 2) {
    const [t0, t1] = e.touches;
    touchState = {
      mode: 'pinch', startDist: touchDist(t0, t1), startZoom: cam.zoom,
      startPanX: cam.panX, startPanY: cam.panY,
      midX: (t0.clientX + t1.clientX) / 2, midY: (t0.clientY + t1.clientY) / 2
    };
  }
}

function onTouchMove(e) {
  if (!touchState) return;
  if (touchState.mode === 'pan' && e.touches.length === 1) {
    e.preventDefault();
    const t = e.touches[0];
    cam.panX = touchState.px + (t.clientX - touchState.sx);
    cam.panY = touchState.py + (t.clientY - touchState.sy);
    applyTransform(); renderSvg();
  } else if (touchState.mode === 'pinch' && e.touches.length === 2) {
    e.preventDefault();
    const [t0, t1] = e.touches;
    const dist = touchDist(t0, t1);
    const nz = Math.max(0.15, Math.min(3, touchState.startZoom * (dist / touchState.startDist)));
    const or = $('canvasOuter').getBoundingClientRect();
    const mx = touchState.midX - or.left, my = touchState.midY - or.top;
    cam.panX = mx - (mx - touchState.startPanX) * nz / touchState.startZoom;
    cam.panY = my - (my - touchState.startPanY) * nz / touchState.startZoom;
    cam.zoom = nz;
    applyTransform(); renderSvg();
  }
}

function onTouchEnd(e) {
  if (e.touches.length === 0) { touchState = null; return; }
  if (e.touches.length === 1) {
    // Dropped from two fingers to one — restart as a pan from here instead
    // of jumping/stopping abruptly.
    const t = e.touches[0];
    touchState = { mode: 'pan', sx: t.clientX, sy: t.clientY, px: cam.panX, py: cam.panY };
  }
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel.nodeId) { e.preventDefault(); deleteNode(sel.nodeId); }
  if (e.key === 'Escape') {
    if (connState) { connState = null; renderSvg(); }
    else           { selectNode(null); renderInspector(); }
  }
});

function autoOrganize() {
  const tree = getTree();
  if (!tree || !tree.nodes.length) return;
  const nodes = tree.nodes;

  // Build outgoing edge lists (dedup)
  const childrenOf = new Map(nodes.map(n => [n.id, []]));
  for (const n of nodes) {
    const add = id => {
      if (id && childrenOf.has(id) && !childrenOf.get(n.id).includes(id))
        childrenOf.get(n.id).push(id);
    };
    add(n.next);
    add(n.exhaustedNext);
    (n.choices || []).forEach(c => add(c.next));
    (n.slots   || []).forEach(s => add(s.nodeId));
  }

  // BFS from entry to assign column depths
  const depths = new Map();
  const bfsQ   = [];
  const entryId = tree.entryNode || nodes[0]?.id;
  if (entryId) { depths.set(entryId, 0); bfsQ.push(entryId); }
  for (let i = 0; i < bfsQ.length; i++) {
    const d = depths.get(bfsQ[i]);
    for (const child of childrenOf.get(bfsQ[i]) || []) {
      if (!depths.has(child)) { depths.set(child, d + 1); bfsQ.push(child); }
    }
  }
  // Unreachable nodes go in a column after the deepest
  const maxDepth = depths.size ? Math.max(...depths.values()) : 0;
  nodes.forEach(n => { if (!depths.has(n.id)) depths.set(n.id, maxDepth + 1); });

  // Group IDs by depth (preserve BFS order within each column)
  const byDepth = new Map();
  bfsQ.forEach(id => {
    const d = depths.get(id);
    if (!byDepth.has(d)) byDepth.set(d, []);
    byDepth.get(d).push(id);
  });
  nodes.forEach(n => {
    if (!bfsQ.includes(n.id)) {
      const d = depths.get(n.id);
      if (!byDepth.has(d)) byDepth.set(d, []);
      byDepth.get(d).push(n.id);
    }
  });

  // Assign positions (snapped to GRID)
  const COL_W = snap(340), ROW_H = snap(200);
  for (const [depth, ids] of byDepth) {
    ids.forEach((id, row) => {
      const nd = nodes.find(n => n.id === id);
      if (nd) { nd.pos.x = depth * COL_W; nd.pos.y = row * ROW_H; }
    });
  }

  cam = { panX: 60, panY: 60, zoom: 1 };
  setDirty(); renderCanvas();
}

let inspectorCollapsed = false;
function toggleInspector() {
  inspectorCollapsed = !inspectorCollapsed;
  $('inspector').classList.toggle('collapsed', inspectorCollapsed);
  $('inspToggle').textContent = inspectorCollapsed ? '▸' : '◂';
}

function renderAll() { renderCondFilters(); renderNpcList(); renderTreeBar(); renderCanvas(); renderInspector(); updateBar(); }

document.addEventListener('DOMContentLoaded', () => {
  $('loadBtn').onclick   = () => $('importModal').classList.remove('hidden');
  $('exportBtn').onclick = exportDatabase;
  $('importCancel').onclick = () => $('importModal').classList.add('hidden');
  $('fileBtn').onclick      = () => $('fileInput').click();
  $('fileInput').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => { if (loadDatabase(ev.target.result)) $('importModal').classList.add('hidden'); };
    r.readAsText(f); e.target.value = '';
  });
  $('importOk').onclick = () => {
    const j = $('importPaste').value.trim();
    if (j && loadDatabase(j)) { $('importModal').classList.add('hidden'); $('importPaste').value = ''; }
  };
  $('npcQ').oninput      = renderNpcList;
  $('clearFiltersBtn').onclick = () => {
    filters = { weekdays: [], seasons: [], weather: [], timesOfDay: [], encounter: [], relationship: { min: null, max: null } };
    onFiltersChanged();
  };
  $('inspToggle').onclick = toggleInspector;
  $('addTreeBtn').onclick = addTree;
  $('btnText').onclick   = () => addNode('text');
  $('btnChoice').onclick = () => addNode('choice');
  $('btnEnd').onclick    = () => addNode('end');
  $('btnSeq').onclick    = () => addNode('sequence');
  $('btnDel').onclick    = () => sel.nodeId && deleteNode(sel.nodeId);
  $('btnEntry').onclick  = () => sel.nodeId && setEntryNode(sel.nodeId);
  $('btnOrg').onclick    = autoOrganize;
  $('btnReset').onclick  = () => { cam = { panX:60, panY:60, zoom:1 }; applyTransform(); renderSvg(); };
  const outer = $('canvasOuter');
  outer.addEventListener('mousedown', onCanvasDown);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup',   onMouseUp);
  outer.addEventListener('wheel', onWheel, { passive: false });
  outer.addEventListener('contextmenu', e => e.preventDefault());
  outer.addEventListener('touchstart', onTouchStart, { passive: true });
  outer.addEventListener('touchmove',  onTouchMove,  { passive: false });
  outer.addEventListener('touchend',   onTouchEnd,   { passive: true });
  outer.addEventListener('touchcancel',onTouchEnd,   { passive: true });
  fetch('../../config/npcs/hobunji-starter-npc-database.json')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => loadDatabase(data))
    .catch(() => {});
  renderAll();
});
</script>
