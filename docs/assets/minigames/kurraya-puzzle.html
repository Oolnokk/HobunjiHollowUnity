<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>Kurraya · Melody Puzzle</title>
<style>
:root{color-scheme:dark;--line:#50617b;--surface:rgba(12,22,35,.91);--ink:#f0f6ff;--muted:#bac9dc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font:15px/1.4 system-ui,sans-serif;color:var(--ink);background:transparent}
body{display:grid;place-items:center;padding:8px}
main{width:min(100%,520px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 14px 50px #0008}
h1{font-size:19px;margin:0}
.sub{font-size:12px;color:var(--muted);margin:3px 0 12px}
.options{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}
label{font-size:11px;color:var(--muted);display:grid;gap:3px}
select{width:100%;font:inherit;min-height:38px;border-radius:9px;padding:5px;background:#1d3045;color:var(--ink);border:1px solid var(--line)}
.notes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:13px}
.note{min-width:0;min-height:76px;border:2px solid #64799d;border-radius:18px;color:#fff;background:linear-gradient(#335275,#1a2a41);font:700 19px system-ui;touch-action:manipulation;cursor:pointer}
.note:nth-child(2){border-color:#67b7ba}.note:nth-child(3){border-color:#acb37b}.note:nth-child(4){border-color:#ae92d0}.note:nth-child(5){border-color:#ddab74}
.note:active,.note.flash{filter:brightness(1.65);transform:translateY(2px)}
.note small{display:block;font-size:11px;opacity:.8}
.readout{margin-top:10px;display:flex;justify-content:space-between;gap:7px;font-size:12px;color:var(--muted);min-height:32px}
#sequence{font-size:17px;color:var(--ink);letter-spacing:.1em}
#result{font-weight:700;color:#9de9ba;min-height:21px}
details{margin-top:8px;font-size:12px;color:var(--muted)}
summary{cursor:pointer;min-height:26px}
#songList{max-height:100px;overflow:auto}
#songList div{padding:4px 0;border-bottom:1px solid #33465d}
#debug{font:11px monospace;white-space:pre-wrap;word-break:break-word;max-height:70px;overflow:auto}
@media(max-height:430px){main{padding:9px}.notes{margin-top:6px}.note{min-height:54px}.sub{margin-bottom:6px}details{margin-top:3px}}
@media(max-width:370px){main{padding:8px}.notes{gap:4px}.note{min-height:70px;border-radius:12px}.options{gap:5px}}
</style>
</head>
<body>
<main>
<h1>Melody Puzzle</h1>
<p class="sub">Play one note at a time. No beat, chords, banks, or root pad. Keyboard: A S D F G.</p>
<div class="options">
  <label>Scale<select id="scale" aria-label="Puzzle note scale"></select></label>
  <label>Root note<select id="tonic" aria-label="Puzzle root note"></select></label>
</div>
<div id="notes" class="notes" aria-label="Five single notes"></div>
<div class="readout"><span>Recent notes: <span id="sequence">—</span></span><span id="count">1 song</span></div>
<div id="result" role="status" aria-live="polite">Play any melody to begin.</div>
<details><summary>Songbook (hints)</summary><div id="songList"></div></details>
<details><summary>Diagnostics</summary><div id="debug"></div></details>
</main>
<script src="../../js/kurraya-puzzle.js?v=20261103puzzle1"></script>
<script>
(function () {
  'use strict';
  const music = window.KurrayaPuzzle;
  const scale = document.getElementById('scale');
  const tonic = document.getElementById('tonic');
  const notesEl = document.getElementById('notes');
  const sequenceEl = document.getElementById('sequence');
  const resultEl = document.getElementById('result');
  const countEl = document.getElementById('count');
  const songListEl = document.getElementById('songList');
  const debugEl = document.getElementById('debug');
  const sampler = music.createSampler('../audio/music/instruments/sfx_kurraya_pluck.m4a');
  let history = []; // Recent note indices used for sequence recognition without timing constraints.
  let lastMatched = ''; // Last recognized melody, visible in diagnostics for mobile testing.
  let playbackSerial = 0; // Drops audio for older pending presses if a newer press wins the load race.
  const post = payload => { try { parent.postMessage(Object.assign({source:'hobunji-music-minigame'},payload),'*'); } catch (_) {} };
  function refreshSongs() {
    const songs = music.listSongs(); // Read afresh so songs authored in the Tool Hub appear when this mode opens.
    countEl.textContent = songs.length + (songs.length === 1 ? ' song' : ' songs');
    songListEl.replaceChildren();
    songs.forEach(song => {
      const line = document.createElement('div');
      line.textContent = song.title + ': ' + song.notes.map(note => note + 1).join(' · ');
      songListEl.appendChild(line);
    });
  }
  function render() {
    const settings = music.settings(); // Reused to label each note with its actual chosen scale pitch.
    for (let i=0;i<5;i++) {
      const button = notesEl.children[i];
      if (button) button.querySelector('small').textContent = music.noteName(music.pitchFor(i,settings));
    }
    sequenceEl.textContent = history.length ? history.slice(-12).map(n => n+1).join(' ') : '—';
    debugEl.textContent = 'scale=' + settings.scale + ' tonic=' + settings.tonicMidi +
      '\nlastSong=' + (lastMatched || 'none') + '\nnotes=' + JSON.stringify(history) +
      '\nsampler=' + JSON.stringify(sampler.diagnostics);
  }
  function playNote(index) {
    if (!Number.isInteger(index) || index < 0 || index > 4) return false;
    const serial = ++playbackSerial;
    const button = notesEl.children[index];
    button?.classList.add('flash');
    setTimeout(() => button?.classList.remove('flash'),110);
    const midi = music.pitchFor(index);
    sampler.play(midi).then(played => {
      if (!played || serial !== playbackSerial) return; // A stale note never triggers a phantom instrument twitch.
      post({type:'sounded-note',performer:'lead',noteIndex:index,midi:midi});
    }).catch(error => {
      if (serial !== playbackSerial) return;
      resultEl.textContent = 'Audio unavailable: ' + error.message; render();
    });
    history.push(index);
    if (history.length > 32) history.shift();
    const song = music.matchSuffix(history);
    if (song) {
      lastMatched = song.title;
      resultEl.textContent = '♪ Recognized: ' + song.title;
      post({type:'puzzle-song-recognized',song:{id:song.id,title:song.title,notes:song.notes.slice()},scale:music.settings().scale,tonicMidi:music.settings().tonicMidi});
      history = []; // Clears only after a successful melody, allowing the next song to start immediately.
    } else {
      resultEl.textContent = 'Listening…';
    }
    render();
    return true;
  }
  Object.keys(music.SCALES).forEach(name => { const option=document.createElement('option');option.value=name;option.textContent=name;scale.appendChild(option); });
  for (let midi=36;midi<=84;midi++) {
    const option=document.createElement('option');option.value=String(midi);option.textContent=music.noteName(midi);tonic.appendChild(option);
  }
  for (let i=0;i<5;i++) {
    const button=document.createElement('button');
    button.type='button';button.className='note';
    button.setAttribute('aria-label','Note '+(i+1));
    button.innerHTML='<span>'+(i+1)+'</span><small>—</small>';
    button.addEventListener('pointerdown',event=>{event.preventDefault();playNote(i);});
    button.addEventListener('click',event=>{if(event.detail===0)playNote(i);});
    notesEl.appendChild(button);
  }
  const initial=music.settings();scale.value=initial.scale;tonic.value=String(initial.tonicMidi);
  scale.addEventListener('change',()=>{music.setSettings({scale:scale.value});history=[];resultEl.textContent='Scale changed. Ready for a new melody.';render();});
  tonic.addEventListener('change',()=>{music.setSettings({tonicMidi:Number(tonic.value)});history=[];resultEl.textContent='Root changed. Ready for a new melody.';render();});
  window.addEventListener('keydown',event=>{
    if (event.code === 'Escape') { event.preventDefault();post({type:'exit-requested'});return; }
    if (event.repeat || event.ctrlKey || event.altKey || event.metaKey || /SELECT|INPUT|TEXTAREA/.test(document.activeElement?.tagName || '')) return;
    const index=music.NOTE_CODES.indexOf(event.code);
    if (index<0) return;
    event.preventDefault();playNote(index);
  },true);
  window.addEventListener('hobunji-kurraya-puzzle-songs-changed',refreshSongs);
  window.addEventListener('error',event=>{resultEl.textContent='Puzzle error: '+event.message;render();});
  window.HobunjiPuzzleInstrument={playNote:playNote,getState:()=>({history:history.slice(),lastMatched:lastMatched,...music.settings()})};
  refreshSongs();render();
  post({type:'puzzle-ready'});
})();
</script>
</body>
</html>
