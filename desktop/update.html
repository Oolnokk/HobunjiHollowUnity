<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hobunji Hollow — Updates</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #151e23; color: #e7e8e0; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 30px 32px 24px; }
    .eyebrow { text-transform: uppercase; font-size: 11px; font-weight: 750; letter-spacing: 2px; color: #a5c7b1; }
    h1 { margin: 8px 0 14px; font-size: 27px; font-weight: 650; line-height: 1.15; }
    .versions { display: flex; flex-wrap: wrap; gap: 12px; color: #b8c9c4; font-size: 13px; }
    .versions strong { color: #fff; }
    .status { min-height: 46px; margin: 22px 0 12px; line-height: 1.45; }
    .error { font-size: 12px; color: #ffc4b7; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 54px; overflow-y: auto; }
    progress { width: 100%; height: 12px; accent-color: #b4d2a9; }
    .help { margin: 16px 0 20px; font-size: 12px; line-height: 1.4; color: #a6b8b4; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { cursor: pointer; background: #303f46; color: #f6f7f4; border: 1px solid #617377; border-radius: 6px; padding: 10px 15px; font: inherit; font-size: 13px; }
    button.primary { background: #b4d2a9; color: #11241a; border-color: #b4d2a9; font-weight: 700; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 2px solid #d9e5bd; outline-offset: 3px; }
    button[hidden], [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="eyebrow">Hobunji Hollow · Windows</div>
  <h1>Game updates</h1>
  <div class="versions">
    <span>Installed: <strong id="current">—</strong></span>
    <span>Available: <strong id="available">—</strong></span>
  </div>
  <p class="status" id="status" role="status" aria-live="polite">Loading update status…</p>
  <div id="progressPanel" hidden>
    <progress id="progress" max="100" value="0"></progress>
    <span id="percent">0%</span>
  </div>
  <div class="error" id="error" role="alert" hidden></div>
  <p class="help">Updates come from published builds of <strong>main</strong>, not unpublished commits. Before restarting, the game will attempt its normal final save to your connected folder.</p>
  <div class="actions">
    <button id="install" class="primary" hidden>Install &amp; Restart</button>
    <button id="check">Check Now</button>
    <button id="later">Later</button>
    <button id="releases">View Releases</button>
  </div>
  <script src="update-ui.js"></script>
</body>
</html>
